<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연산 포인트</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  /* 연산진단 포인트 — 학생: 내 포인트·뱃지·단계별 기록·🧾 풀이 기록(풀이기록.gs) / 선생님: 반 목록·선물 주기 (서버: 포인트.gs) */
  :root {
    --bg: #eef8fd; --panel: #fff; --line: #d9ecf6; --ink: #12324a; --sub: #5b7489; --muted: #93a9ba;
    --accent: #0b8fd8; --accent-2: #14b8a6; --accent-soft: #e3f4fd; --mint-soft: #e6f8f5;
    --gold: #f5b301; --gold-soft: #fff6d6;
    --reach: #0ca30c; --reach-soft: #e3f6e3; --effort-soft: #fff4d6; --support: #d03b3b;
    --shadow: 0 10px 30px rgba(11, 110, 160, .08), 0 2px 6px rgba(11, 110, 160, .05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; line-height: 1.5;
    background: linear-gradient(180deg, #dff3fc 0, #eef9fb 260px, #f6fbfd 100%) fixed; }
  .hidden { display: none !important; }
  header.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 24px;
    background: rgba(255, 255, 255, .85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(11, 143, 216, .14); }
  header.bar h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 20px; letter-spacing: -.3px; }
  header.bar h1 .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, #fcd34d, #f59e0b); box-shadow: 0 4px 12px rgba(245, 158, 11, .3); }
  header.bar h1 a { color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); text-decoration: none; }
  .who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); }
  select, button { font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid #cfe5f2; border-radius: 10px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #f3faff; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: linear-gradient(135deg, #0ea5e9, #14b8a6); border: none; color: #fff; font-weight: 700; box-shadow: 0 6px 16px rgba(14, 165, 233, .28); }
  main { max-width: 1040px; margin: 0 auto; padding: 22px 18px 70px; }
  .notice { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 34px 26px; text-align: center; color: var(--sub); line-height: 1.8; box-shadow: var(--shadow); }
  .notice b { color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card > h3 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card > h3 small { font-size: 13px; color: var(--sub); font-weight: 500; }

  /* 내 포인트 */
  .hero { display: grid; grid-template-columns: minmax(220px, 1.2fr) 2fr; gap: 18px; align-items: center; }
  .hero .who2 { color: var(--sub); font-weight: 600; }
  .hero .big { font-size: 64px; font-weight: 900; line-height: 1; color: var(--ink); letter-spacing: -2px; }
  .hero .big small { font-size: 20px; font-weight: 700; color: var(--sub); margin-left: 4px; letter-spacing: 0; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile.today { background: linear-gradient(160deg, #fff7d6, #ffefc2); }
  .tile.today .k { color: #a16207; }
  .tile.today .v { color: #b45309; }
  .tile { border-radius: 14px; padding: 12px 14px; background: linear-gradient(160deg, #f0f9ff, #effbf8); }
  .tile .k { font-size: 13px; color: #3c7fa6; font-weight: 600; }
  .tile .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .next { margin-top: 14px; font-size: 14px; color: var(--sub); }
  .next .track { height: 12px; border-radius: 6px; background: #e4f1f8; overflow: hidden; margin-top: 6px; }
  .next .fill { height: 100%; background: linear-gradient(90deg, #fcd34d, #f59e0b); border-radius: 6px; }

  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .badge { border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; background: #fbfeff; }
  .badge .i { font-size: 30px; line-height: 1.2; }
  .badge .n { font-weight: 700; font-size: 14px; }
  .badge .d { font-size: 12px; color: var(--sub); }
  .badge.off { opacity: .45; filter: grayscale(1); }
  .badge.on { background: var(--gold-soft); border-color: #f3d58a; }

  .op { margin-top: 14px; }
  .op:first-child { margin-top: 0; }
  .op > b { display: block; font-size: 15px; margin-bottom: 6px; color: #2f6f96; }
  .lvrow { display: grid; grid-template-columns: 130px 120px 1fr 70px; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid #e6f2f9; font-size: 14px; }
  .lvrow .nm b { white-space: nowrap; } .lvrow .nm small { display: block; color: var(--muted); font-size: 12px; }
  .lvrow .sc { color: var(--sub); font-variant-numeric: tabular-nums; }
  .lvrow .pt { text-align: right; font-weight: 800; color: #b07800; white-space: nowrap; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--reach-soft); color: #006300; }
  .chip.more { background: var(--accent-soft); color: #075e95; }
  .chip.try { background: var(--effort-soft); color: #7a5300; }

  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid #e6f2f9; font-size: 14px; }
  ul.plain li .p { font-weight: 800; color: #b07800; white-space: nowrap; }
  ul.plain li .p.minus { color: var(--support); }
  ul.plain li .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .gift { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid #e6f2f9; font-size: 14px; }
  .gift .p { font-weight: 800; white-space: nowrap; }
  .gift.can .p { color: #006300; }
  .muted { color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; }

  /* 🧾 내 풀이 기록 */
  .att-search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; padding: 10px 12px; background: #f4f9fc; border: 1px solid var(--line); border-radius: 14px; }
  .att-search input[type=date], .att-search select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .att-search select { max-width: 220px; }
  .att-quick { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .att-quick button { font-size: 13px; padding: 5px 10px; }
  .att-sum { margin: 0 0 8px; font-size: 13px; }
  .att-day { border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; background: #fbfeff; }
  .att-day > summary { cursor: pointer; padding: 11px 14px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .att-day > summary .muted { font-size: 13px; }
  .att-day[open] > summary { border-bottom: 1px solid var(--line); }
  .att-lv { padding: 10px 14px; border-bottom: 1px dashed #e0eef6; }
  .att-lv:last-child { border-bottom: none; }
  .att-lvname { margin-bottom: 6px; color: #2f6f96; font-size: 14px; }
  .att-lvname small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  /* 반 평균 줄과 내 기록 줄이 같은 칸(점수·시간)에 오도록 격자로 맞춤 */
  .att-row { display: grid; grid-template-columns: 112px 66px 66px 1fr; align-items: center; gap: 4px 10px; padding: 4px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .att-lbl { color: var(--sub); white-space: nowrap; }
  .att-lbl i { font-style: normal; color: var(--muted); font-size: 12px; display: inline-block; width: 28px; }
  .att-avg { background: #f1f5fb; border-radius: 10px; padding: 5px 0; margin-bottom: 2px; }
  .att-avg .att-lbl { padding-left: 8px; color: #4a5f78; font-size: 13px; font-weight: 700; }
  .att-avg .att-sec { color: #4a5f78; font-weight: 700; }
  .att-note { color: var(--muted); font-size: 12px; }
  .att-score { font-weight: 800; text-align: center; padding: 1px 6px; border-radius: 999px; }
  .att-score.avg { background: #dde6f2; color: #34495e; }
  .att-score.full { background: var(--reach-soft); color: #006300; }
  .att-score.ok { background: #eaf7ee; color: #1b7a3a; }
  .att-score.mid { background: var(--effort-soft); color: #7a5300; }
  .att-score.low { background: #fbe5e5; color: var(--support); }
  .att-sec { color: var(--sub); white-space: nowrap; }
  .att-qs { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .att-qs .q { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 28px; height: 34px; border-radius: 7px; font-weight: 800; font-size: 14px; line-height: 1; }
  .att-qs .q i { font-style: normal; font-size: 9px; font-weight: 600; opacity: .75; margin-bottom: 2px; }
  .att-qs .q.o { background: var(--reach-soft); color: #006300; }
  .att-qs .q.x { background: #fbe5e5; color: var(--support); }
  .att-qs .q.e { background: #eef2f6; color: var(--muted); }
  .att-method { font-size: 12px; color: var(--sub); margin-left: 6px; }
  @media (max-width: 560px) {
    .att-row { grid-template-columns: 96px 60px 1fr; }
    .att-row .att-qs, .att-avg .att-note { grid-column: 1 / -1; }
    .att-avg .att-note { padding-left: 8px; }
  }

  /* 선생님 */
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid #e6f2f9; text-align: left; }
  th { background: #f1f9fe; color: #2f6f96; font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; user-select: none; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: #f8fcff; } tbody tr.sel td { background: var(--mint-soft); }
  td .left { font-weight: 800; }
  .give { display: flex; flex-wrap: wrap; gap: 8px; }
  .give button { font-size: 14px; }
  .give button small { color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #12324a; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 15px; z-index: 20; box-shadow: var(--shadow); }

  @media (max-width: 720px) {
    .hero, .two { grid-template-columns: 1fr; }
    .hero .big { font-size: 52px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .lvrow { grid-template-columns: 1fr auto; }
    .lvrow .sc { grid-column: 1 / -1; order: 3; }
    header.bar { padding: 12px 16px; }
  }

  /* ===== 또렷하게 보기 (2026-11-19) — 글자색을 진하게, 작은 글자를 키우고, 선을 분명하게 ===== */
  :root { --ink: #0b1f33; --sub: #2f4558; --muted: #4f6578; --line: #b7d0e0; }
  body { font-size: 16px; background: #f2f6f9; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  header.bar { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 2px solid #cfe0eb; }
  header.bar h1 a { color: #0a5f94; background: #dcefff; font-weight: 700; }
  .who { font-size: 14px; color: var(--sub); }
  select, button { border: 1.5px solid #a9c6d8; color: var(--ink); font-weight: 600; }
  .card { border: 1.5px solid var(--line); box-shadow: 0 2px 8px rgba(12, 50, 80, .06); }
  .card > h3 { font-size: 20px; font-weight: 800; color: var(--ink); }
  .card > h3 small { font-size: 14px; color: var(--sub); font-weight: 600; }
  .muted { color: var(--sub); }
  .note { font-size: 14px; color: var(--sub); }
  .hero .who2 { color: var(--ink); font-size: 17px; font-weight: 700; }
  .hero .big small { color: var(--sub); }
  .tile { background: #eaf4fb; border: 1.5px solid #c5dceb; }
  .tile .k { font-size: 14px; color: #154e73; font-weight: 700; }
  .tile .v { font-size: 30px; font-weight: 900; color: var(--ink); }
  .tile.today { background: #fff1c7; border-color: #f0c860; }
  .tile.today .k { color: #7c4a03; }
  .tile.today .v { color: #9a4a00; }
  .next { font-size: 15px; color: var(--sub); }
  .badge { border: 1.5px solid var(--line); background: #fff; }
  .badge .n { font-size: 15px; font-weight: 800; color: var(--ink); }
  .badge .d { font-size: 13px; color: var(--sub); }
  .badge.off { opacity: .6; }
  .badge.on { background: #fff1c7; border-color: #e9c25a; }
  .op > b { font-size: 16px; color: #0b4a70; }
  .lvrow { font-size: 15px; border-bottom: 1px solid #d3e3ee; }
  .lvrow .nm small { color: var(--muted); font-size: 13px; }
  .lvrow .sc { color: var(--ink); }
  .lvrow .pt, ul.plain li .p { color: #8a5a00; }
  .chip { font-size: 13px; font-weight: 800; }
  .chip.ok { background: #cdeecd; color: #005200; }
  .chip.more { background: #d3eafc; color: #064a78; }
  .chip.try { background: #ffe7a8; color: #6a4500; }
  ul.plain li, .gift { font-size: 15px; border-bottom: 1px solid #d3e3ee; }
  ul.plain li .when { color: var(--muted); font-size: 13px; }
  /* 🧾 내 풀이 기록 */
  .att-search { background: #eaf3f9; border: 1.5px solid var(--line); }
  .att-search input[type=date], .att-search select { font-size: 15px; border: 1.5px solid #a9c6d8; font-weight: 600; }
  .att-quick button { font-size: 14px; }
  .att-sum { font-size: 14px; color: var(--sub); font-weight: 600; }
  .att-day { border: 1.5px solid var(--line); background: #fff; }
  .att-day > summary { font-size: 16px; background: #f4f8fb; border-radius: 13px; }
  .att-day[open] > summary { border-bottom: 1.5px solid var(--line); border-radius: 13px 13px 0 0; }
  .att-day > summary .muted { font-size: 14px; color: var(--sub); }
  .att-lv { border-bottom: 1.5px dashed #c9dbe7; }
  .att-lvname { font-size: 16px; color: #0b4a70; }
  .att-lvname b { font-weight: 800; }
  .att-lvname small { font-size: 14px; color: var(--sub); }
  .att-row { font-size: 15px; }
  .att-lbl { color: var(--ink); font-weight: 600; }
  .att-lbl i { font-size: 13px; color: var(--muted); font-weight: 700; }
  .att-avg { background: #e3ecf5; border: 1px solid #c3d4e4; }
  .att-avg .att-lbl, .att-avg .att-sec { color: #1d3550; }
  .att-score.avg { background: #c9d8ea; color: #142b45; }
  .att-score.full { background: #c4ebc4; color: #004d00; }
  .att-score.ok { background: #d6f0dc; color: #0d5e28; }
  .att-score.mid { background: #ffe39a; color: #5e3c00; }
  .att-score.low { background: #ffd0d0; color: #a50f0f; }
  .att-sec { color: var(--ink); font-weight: 600; }
  .att-note { font-size: 13px; color: var(--sub); }
  .att-qs .q { width: 30px; height: 36px; font-size: 16px; font-weight: 900; }
  .att-qs .q i { font-size: 10px; font-weight: 700; opacity: .9; }
  .att-qs .q.o { background: #c9edc9; color: #004d00; }
  .att-qs .q.x { background: #ffcdcd; color: #b00000; }
  .att-qs .q.e { background: #e3e9ef; color: var(--muted); }
  .att-method { font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<header class="bar">
  <h1><span class="logo">⭐</span>연산 포인트 <a href="./">← 진단시스템</a></h1>
  <div class="who">
    <span id="who"></span>
    <button id="loginBtn" class="primary hidden">🔑 구글 로그인</button>
    <button id="logoutBtn" class="hidden">로그아웃</button>
  </div>
</header>

<main>
  <div id="msg" class="notice">불러오는 중입니다…</div>

  <!-- 선생님: 반 목록 -->
  <section id="teacher" class="hidden">
    <div class="card">
      <h3>학생별 포인트 <small>줄을 누르면 아래에 자세히 보이고, 선물을 줄 수 있어요</small></h3>
      <div class="tools">
        <select id="cls"></select>
        <button id="reloadBtn">↻ 새로 고침</button>
        <button id="mineBtn" title="학생명부 0번(담임 테스트 계정)으로 보이는 학생 화면">🧒 0번(학생 화면)</button>
        <span class="muted" id="clsSum"></span>
      </div>
      <div class="tablewrap"><table>
        <thead><tr>
          <th data-k="num">번호</th><th data-k="name">이름</th><th class="n" data-k="left">남은</th><th class="n" data-k="earned">모은</th>
          <th class="n" data-k="spent">쓴</th><th class="n" data-k="month">이달</th><th class="n" data-k="reach">도달 단계</th><th class="n" data-k="streak">연속</th><th class="n" data-k="badges">뱃지</th>
        </tr></thead>
        <tbody id="clsBody"></tbody>
      </table></div>
      <div class="note">포인트는 진단 기록(종합평가결과)·100칸계산·구구단 탭으로 그때그때 계산합니다. '연속'은 오늘의 훈련 완료가 이어진 날 수(토·일 건너뜀)입니다. 규칙은 평가데이터 스프레드시트의 '수학포인트규칙' 탭, 선물은 '수학선물목록' 탭에서 고칩니다.</div>
    </div>
  </section>

  <!-- 학생 한 명 (학생 본인 화면, 선생님이 고른 학생) -->
  <section id="student" class="hidden"></section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('points_' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('points_' + k, v); } catch (e) {} }
};
function msg(html) { $('msg').innerHTML = html; $('msg').classList.remove('hidden'); }
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

let auth = null, am = null, cls = null, sortKey = store.get('sort', 'num'), sortDir = 1, picked = null;

/* ---------- 로그인 ---------- */
async function boot() {
  const cfg = window.APP_CONFIG && window.APP_CONFIG.FIREBASE;
  if (!cfg || !cfg.apiKey) { msg('<b>config.js의 FIREBASE 설정이 비어 있습니다.</b>'); return; }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [appm, authm] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]);
  am = authm;
  auth = am.getAuth(appm.initializeApp(cfg, 'points'));
  am.onAuthStateChanged(auth, (u) => {
    const user = (u && !u.isAnonymous) ? u : null;
    $('who').textContent = user ? user.email : '';
    $('loginBtn').classList.toggle('hidden', !!user);
    $('logoutBtn').classList.toggle('hidden', !user);
    $('teacher').classList.add('hidden'); $('student').classList.add('hidden');
    if (user) start();
    else msg('<b>학교 구글 계정으로 로그인해 주세요.</b><br>학생은 내 포인트·뱃지·단계별 기록·풀이 기록을, 선생님은 맡은 반의 포인트를 볼 수 있습니다.');
  });
  $('loginBtn').onclick = () => {
    const p = new am.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    am.signInWithPopup(auth, p).catch((e) => { if (e && e.code !== 'auth/popup-closed-by-user') msg('<b>로그인하지 못했습니다.</b><br>' + esc(e.message)); });
  };
  $('logoutBtn').onclick = () => am.signOut(auth);
}
async function call(action, ...args) {
  const u = auth && auth.currentUser;
  if (!u || u.isAnonymous) throw new Error('로그인이 필요합니다.');
  const res = await window.callApi(action, [{ idToken: await u.getIdToken() }, ...args]);
  if (res && res.status === 'error') throw new Error(res.message);
  return res;
}

async function start() {
  msg('포인트를 계산하는 중입니다…');
  // 1) '교사학급' 탭에 있는 선생님이면 담임 화면 (담임 계정이 학생명부 0번으로도 있어도 선생님이 먼저)
  // 2026-11-19: 두 물음을 동시에 보냄 (학생이 서버를 두 번 차례로 기다리지 않게)
  const scP = call('getReportScope').catch(() => null);   // 선생님이 아니면 오류 → 학생으로 진행
  const meP = call('getMyMathPoints').then((r) => ({ r }), (e) => ({ e }));
  const sc = await scP;
  if (sc && sc.classes && sc.classes.length) return startTeacher(sc);
  // 2) 학생
  showMine(false, meP);
}

/** 로그인한 계정의 학생 화면 (학생 본인, 또는 선생님의 0번 테스트 계정) */
async function showMine(fromTeacher, pending) {
  let me;
  if (pending) { const x = await pending; if (x.e) { msg('<b>' + esc(x.e.message) + '</b>'); return; } me = x.r; }
  else { try { me = await call('getMyMathPoints'); } catch (e) { msg('<b>' + esc(e.message) + '</b>'); return; } }
  if (me.role === 'teacher') { if (!fromTeacher) return startTeacher(); msg('<b>학생명부에 이 계정의 0번이 없습니다.</b>'); return; }
  $('msg').classList.add('hidden');
  $('teacher').classList.add('hidden');
  renderStudent(me, false);
  if (fromTeacher) {
    const back = document.createElement('div');
    back.className = 'card';
    back.innerHTML = '<button id="backTeacher" class="primary">← 학생별 포인트(담임 화면)로 돌아가기</button>';
    $('student').prepend(back);
    $('backTeacher').onclick = () => { $('student').classList.add('hidden'); picked = null; startTeacher(); };
  }
}

/* ---------- 선생님 ---------- */
async function startTeacher(sc) {
  if (!sc) { try { sc = await call('getReportScope'); } catch (e) { msg('<b>' + esc(e.message) + '</b>'); return; } }
  if (!sc.classes.length) { msg('<b>볼 수 있는 학급이 없습니다.</b><br>교사학급 탭의 학년·반을 확인해 주세요.'); return; }
  $('cls').innerHTML = sc.classes.map((c) => `<option value="${esc(c.grade + '|' + c.classNum)}">${esc(c.grade)}학년 ${esc(c.classNum)} (${c.count}명)</option>`).join('');
  const saved = store.get('cls', '');
  if ([...$('cls').options].some((o) => o.value === saved)) $('cls').value = saved;
  $('msg').classList.add('hidden');
  $('teacher').classList.remove('hidden');
  $('cls').onchange = () => { picked = null; loadClass(); };
  $('reloadBtn').onclick = () => loadClass();
  $('mineBtn').onclick = () => showMine(true);
  document.querySelectorAll('#teacher th[data-k]').forEach((th) => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === 'num' || k === 'name' ? 1 : -1); sortKey = k; store.set('sort', k); drawClass();
  });
  loadClass();
}

async function loadClass() {
  const [g, c] = $('cls').value.split('|');
  store.set('cls', $('cls').value);
  $('clsBody').innerHTML = '<tr><td colspan="9" class="muted">계산하는 중…</td></tr>';
  try { cls = await call('getClassMathPoints', g, c); }
  catch (e) { $('clsBody').innerHTML = `<tr><td colspan="9">${esc(e.message)}</td></tr>`; return; }
  drawClass();
  if (picked) openStudent(picked);
  else $('student').classList.add('hidden');
}

function drawClass() {
  if (!cls) return;
  const rows = cls.students.slice().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const d = (sortKey === 'name') ? String(x).localeCompare(String(y), 'ko') : (parseFloat(x) || 0) - (parseFloat(y) || 0);
    return d * sortDir || (parseInt(a.num, 10) - parseInt(b.num, 10));
  });
  const tot = cls.students.reduce((s, x) => s + x.earned, 0);
  $('clsSum').textContent = `반 전체 모은 포인트 ${tot} · 선물 ${cls.gifts.length}종`;
  $('clsBody').innerHTML = rows.map((s) => `<tr data-num="${esc(s.num)}" class="${picked === s.num ? 'sel' : ''}">
    <td>${esc(s.num)}</td><td><b>${esc(s.name)}</b></td><td class="n"><span class="left">${s.left}</span></td><td class="n">${s.earned}</td>
    <td class="n">${s.spent}</td><td class="n">${s.month}</td><td class="n">${s.reach}</td><td class="n">${s.streak ? '🔥' + s.streak : 0}</td><td class="n">${s.badges}/${cls.badgeTotal}</td></tr>`).join('');
  $('clsBody').querySelectorAll('tr[data-num]').forEach((tr) => tr.onclick = () => openStudent(tr.dataset.num));
}

async function openStudent(num) {
  picked = num; drawClass();
  const box = $('student');
  box.classList.remove('hidden');
  box.innerHTML = '<div class="notice">불러오는 중…</div>';
  const [g, c] = $('cls').value.split('|');
  try { renderStudent(await call('getStudentMathPoints', g, c, num), true); }
  catch (e) { box.innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function giveGift(d, gift) {
  if (!confirm(`${d.num}번 ${d.name} 학생에게\n'${gift.name}'을(를) 주고 ${gift.pts}포인트를 뺄까요?`)) return;
  try {
    const r = await call('giveMathGift', { grade: d.grade, classNum: d.classNum, num: d.num, gift: gift.name });
    toast(r.message); loadClass();
  } catch (e) { alert(e.message); }
}
async function cancelGift(d, log) {
  if (!confirm(`${log.day} '${log.gift}' 선물 주기를 취소하고 ${log.pts}포인트를 돌려줄까요?`)) return;
  try { const r = await call('cancelMathGift', { grade: d.grade, classNum: d.classNum, id: log.id }); toast(r.message); loadClass(); }
  catch (e) { alert(e.message); }
}

const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
function dayLabel(day) {
  const [y, m, dd] = day.split('-').map(Number);
  const w = WEEK[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
  return `${m}월 ${dd}일 (${w})` + (day === window.liveToday() ? ' · 오늘' : '');
}
const secText = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
const scoreCls = (s) => s >= 100 ? 'full' : s >= 80 ? 'ok' : s >= 60 ? 'mid' : 'low';

/* 기간을 바꾸면 서버에서 다시 받고, 영역·단계는 받은 기록 안에서 바로 거름 */
const att = { d: null, teacher: false, data: null, seq: 0 };
const shiftDay = (day, n) => { const t = new Date(day + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };

function loadAttempts(d, teacher) {
  att.d = d; att.teacher = teacher; att.data = null;
  const today = window.liveToday();
  $('attFrom').value = today; $('attTo').value = today; $('attFrom').max = today; $('attTo').max = today;
  $('attOp').innerHTML = '<option value="">영역 전체</option>'; $('attLv').innerHTML = '<option value="">단계 전체</option>';
  document.querySelectorAll('#attCard [data-range]').forEach((b) => b.onclick = () => {
    const n = Number(b.dataset.range), t = window.liveToday();
    $('attTo').value = n === -1 ? shiftDay(t, -1) : t;
    $('attFrom').value = n === -1 ? shiftDay(t, -1) : shiftDay(t, -(n - 1));
    fetchAttempts();
  });
  $('attGo').onclick = fetchAttempts;
  $('attOp').onchange = () => { fillLevels(); drawAttempts(); };
  $('attLv').onchange = drawAttempts;
  fetchAttempts();
}

async function fetchAttempts() {
  const box = $('attBox'), d = att.d, my = ++att.seq;
  const opt = { from: $('attFrom').value, to: $('attTo').value };
  box.innerHTML = '<p class="muted">찾는 중…</p>';
  $('attGo').disabled = true;
  let r;
  try {
    r = att.teacher ? await call('getStudentAttempts', d.grade, d.classNum, d.num, opt) : await call('getMyAttempts', opt);
  } catch (e) {
    if (my === att.seq) { box.innerHTML = `<p class="muted">${esc(e.message)}</p>`; $('attGo').disabled = false; }
    return;
  }
  if (my !== att.seq) return;   // 그사이 다시 찾았거나 다른 학생을 골랐으면 그리지 않음
  $('attGo').disabled = false;
  att.data = r;
  if (r.from) { $('attFrom').value = r.from; $('attTo').value = r.to; }
  // 영역 목록: 이 기간에 푼 영역 (고른 값이 그대로 있으면 유지)
  const keepOp = $('attOp').value;
  $('attOp').innerHTML = '<option value="">영역 전체</option>' +
    (r.options || []).map((o) => `<option value="${esc(o.op)}">${esc(o.op)}</option>`).join('');
  if ((r.options || []).some((o) => o.op === keepOp)) $('attOp').value = keepOp;
  fillLevels();
  drawAttempts();
}

function fillLevels() {
  const r = att.data || {}, op = $('attOp').value, keep = $('attLv').value;
  const list = (r.options || []).filter((o) => !op || o.op === op)
    .flatMap((o) => o.levels.map((l) => ({ v: o.op + '|' + l.level, t: (op ? '' : o.op + ' ') + (l.no ? l.no + '단계' : l.level) + (l.code ? ' (' + l.code + ')' : '') })));
  $('attLv').innerHTML = '<option value="">단계 전체</option>' + list.map((x) => `<option value="${esc(x.v)}">${esc(x.t)}</option>`).join('');
  if (list.some((x) => x.v === keep)) $('attLv').value = keep;
}

function drawAttempts() {
  const box = $('attBox'), r = att.data;
  if (!r) return;
  const op = $('attOp').value, lv = $('attLv').value;
  const range = r.from === r.to ? dayLabel(r.from) : `${dayLabel(r.from)} ~ ${dayLabel(r.to)}`;
  const days = (r.days || []).map((dy) => {
    const levels = dy.levels.filter((l) => (!op || l.op === op) && (!lv || l.op + '|' + l.level === lv));
    return { day: dy.day, levels, count: levels.reduce((s, l) => s + l.tries.length, 0) };
  }).filter((dy) => dy.levels.length);
  if (!days.length) {
    box.innerHTML = `<p class="muted">${esc(range)}에 ${op || lv ? '고른 영역·단계의 ' : ''}제출한 기록이 없어요.</p>` +
      (r.from === r.to ? '<p class="muted" style="font-size:13px">위의 <b>최근 7일</b>이나 <b>최근 30일</b>을 눌러 보세요.</p>' : '');
    return;
  }
  const total = days.reduce((s, x) => s + x.count, 0);
  box.innerHTML = `<p class="muted att-sum">${esc(range)} · ${total}번 제출 · ${days.length}일${r.clamped ? ' · 한 번에 31일까지만 찾아요' : ''}</p>` +
    days.map((dy, k) => `<details class="att-day" ${k < 3 ? 'open' : ''}>
      <summary><b>${esc(dayLabel(dy.day))}</b> <span class="muted">${dy.count}번 제출 · ${dy.levels.length}개 단계</span></summary>
      ${dy.levels.map((l) => `<div class="att-lv">
        <div class="att-lvname"><b>${esc(l.op)} ${l.no ? l.no + '단계' : esc(l.level)}${l.code ? ' (' + esc(l.code) + ')' : ''}</b>${l.name ? `<small>${esc(l.name)}</small>` : ''}</div>
        <div class="att-row att-avg">
          <span class="att-lbl">👥 반 평균</span>
          ${l.cls ? `<span class="att-score avg">${l.cls.score}점</span><span class="att-sec">⏱ ${secText(l.cls.sec)}</span><span class="att-note">그날 ${l.cls.n}명</span>`
            : '<span class="att-note" style="grid-column: 2 / -1">그날 이 단계를 푼 친구가 없어요</span>'}
        </div>
        ${l.tries.map((t, i) => `<div class="att-row">
          <span class="att-lbl"><i>${i + 1}회</i> ${esc(t.time)}</span>
          <span class="att-score ${scoreCls(t.score)}">${t.score}점</span>
          <span class="att-sec">⏱ ${esc(t.timeText || '—')}</span>
          <span class="att-qs">${t.qs.map((m, q) => `<span class="q ${m === 'O' ? 'o' : m === 'X' ? 'x' : 'e'}" title="${q + 1}번 ${m === 'O' ? '맞음' : m === 'X' ? '틀림' : '기록 없음'}"><i>${q + 1}</i>${m || '·'}</span>`).join('')}${t.method ? `<span class="att-method">${esc(t.method)}</span>` : ''}</span>
        </div>`).join('')}
      </div>`).join('')}
    </details>`).join('') +
    '<div class="note">문제와 내가 쓴 답은 저장되지 않아서, 문항마다 맞았는지(O)·틀렸는지(X)만 보여요. 반 평균은 그날 그 단계를 푼 친구마다 평균을 낸 뒤 다시 평균한 값이에요.</div>';
}

boot().catch((e) => msg('<b>화면을 준비하지 못했습니다.</b><br>' + esc(e.message)));
</script>
</body>
</html>
