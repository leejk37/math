<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 3학년 2학기 분수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m324-common.js"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>진분수와 가분수</title>
</head>
<body>

<div class="header-text">진분수와 가분수</div>
<div class="sub-text"><div class="rule-box"><div class="rule-title">🔎 분자와 분모의 크기를 비교해요!</div><div class="rule-line"><span class="rule-tag num">진분수</span> 분자가 분모보다 <b>작은</b> 분수 (예: 3/4)</div><div class="rule-line"><span class="rule-tag den">가분수</span> 분자가 분모와 <b>같거나</b> 분모보다 <b>큰</b> 분수 (예: 4/4, 5/4)</div><div class="rule-line"><span class="rule-tag etc">자연수</span> 분자와 분모가 같은 분수는 <b>1</b>과 같아요 (4/4 = 1)</div></div><br><span style="font-size:13px;color:#94a3b8">(분수를 보고 알맞은 말을 고르거나, 빈칸에 수를 입력하세요.)</span><br><span style="font-size:13px;color:#92400e">막히면 <b>💡 도움말</b>로 풀이 방법을 먼저 보고, 그래도 모르겠으면 <b>🤔 도움</b>으로 선생님을 부르세요.</span></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3244 — 진분수와 가분수
// 교과서 3-2-4 94~95쪽: 1/4이 5개 → 5/4, 진분수·가분수 분류, 4/4는 1(자연수), 수직선 0~2
function generate() {
  const hints = [];
  const cards = [];
  // 1번: 수직선 위 화살표가 가리키는 분수 (1보다 큰 곳 → 가분수)
  const d1 = M.rand(3, 5), at = M.rand(d1 + 1, 2 * d1 - 1);
  cards.push(M.card(0, M.numberLineSvg(2, d1, at) +
    `<div class="eq" style="font-size:18px">화살표가 가리키는 곳은 ${M.frac(1, d1, true)}이 ${M.box(at)}개이므로 <span class="tail">${M.frac(M.box(at), d1)} 입니다.</span></div>`));
  hints.push(`0과 1 사이가 똑같이 ${d1}칸으로 나뉘어 있어서 한 칸은 ${M.frac(1, d1, true)}이에요. 0부터 화살표까지 <b>칸 수</b>를 세어 보세요. 1을 넘어도 계속 세어요.`);
  // 2~4번: 분류 (진분수 1개, 분자=분모 1개, 분자>분모 1개를 섞어서)
  const kinds = M.shuffle(['진', '같음', '큼']), usedF = new Set();
  kinds.forEach((kind, j) => {
    let n, d, key;
    do {
      d = M.rand(3, 12);
      n = kind === '진' ? M.rand(1, d - 1) : kind === '같음' ? d : M.rand(d + 1, Math.min(2 * d + 3, 25));
      key = n + '/' + d;
    } while (usedF.has(key));
    usedF.add(key);
    cards.push(M.card(j + 1, `<div class="eq" style="font-size:24px">${M.frac(n, d)}</div>` +
      M.choices(kind === '진' ? '진' : '가', [['진', '진분수'], ['가', '가분수']])));
    hints.push('분자와 분모를 비교해 보세요. 분자가 분모보다 <b>작으면</b> 진분수, 분자가 분모와 <b>같거나 크면</b> 가분수예요.');
  });
  // 5번: 분자와 분모가 같은(또는 두 배인) 가분수는 자연수
  const d5 = M.rand(2, 9), w5 = M.pick([1, 1, 2]);
  cards.push(M.card(4, `<div class="q-text">자연수로 나타내어 보세요.</div>` +
    `<div class="eq" style="font-size:24px">${M.frac(d5 * w5, d5)} <span class="op">=</span> ${M.box(w5)}</div>`));
  hints.push(`${M.frac(d5, d5, true)}처럼 분자와 분모가 같으면 <b>1</b>이에요. 분자 ${d5 * w5} 안에 ${d5}이(가) 몇 번 들어 있는지 생각해 보세요.`.replace('이(가)', M.josa(d5, '이', '가')));
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
