<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 4학년 분수 도우미(m421) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m421-common.js?v=20261109-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>진분수의 뺄셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">진분수의 뺄셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모가 같은 분수의 뺄셈: 분모는 그대로, 분자끼리 빼요</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 5/7 − 2/7 = (5 − 2)/7 = <b>3/7</b> (1/7이 5개 − 2개 = 3개)</div>
  <div class="rule-line"><span class="rule-tag t2">그림</span> 5/7만큼 색칠하고 그중 2/7를 덜어 내면 3/7이 남아요.</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모끼리 빼면 안 돼요. 분모는 그대로 써요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4213 — 진분수의 뺄셈 (교과서 4-2-1 '분수의 덧셈과 뺄셈')
// 진단 포인트: 분모끼리도 뺌, 단위분수의 개수로 생각하지 못함, 빼는 수와 빼지는 수를 바꿈
M.inlineQuestion = true;
const sub = (dLo, test) => G.pair(dLo, 9, p => p.a > p.b && (!test || test(p)));
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 그림을 보고 단위분수의 개수로 빼기
  const p1 = sub(5, p => p.b >= 2 && p.a - p.b >= 2);
  const u1 = M.frac(1, p1.d, true);
  cards.push(M.card(0, `<div class="q-text">그림을 보고 계산해 보세요.</div>` +
    G.subBar(p1.d, p1.a, p1.b) +
    `<div class="eq" style="font-size:18px">${M.frac(p1.a, p1.d)} ${M.josa(p1.a, '은', '는')} ${u1} 이 ${M.box(p1.a)}개, &nbsp;${M.frac(p1.b, p1.d)} ${M.josa(p1.b, '은', '는')} ${u1} 이 <span class="tail">${M.box(p1.b)}개</span></div>` +
    `<div class="eq" style="font-size:18px">${M.frac(p1.a, p1.d)}${G.MINUS}${M.frac(p1.b, p1.d)} ${M.josa(p1.b, '은', '는')} ${u1} 이 ${M.box(p1.a - p1.b)}개이므로 ${G.EQ}${F.ff(p1.a - p1.b, p1.d)}</div>`, true));
  hints.push(`색칠한 칸에서 × 표시한 칸을 덜어 내면 몇 칸이 남는지 세어 보세요. 한 칸이 ${M.frac(1, p1.d, true)} 이에요.`);

  // 2번: 분자끼리 빼기
  const p2 = sub(4);
  cards.push(M.card(1, `<div class="q-text">분모는 그대로 두고 분자끼리 빼 보세요.</div>` +
    `<div class="eq">${M.frac(p2.a, p2.d)}${G.MINUS}${M.frac(p2.b, p2.d)}${G.EQ}${G.exfrac(M.box(p2.a) + G.MINUS + M.box(p2.b), p2.d)}${G.EQ}${F.fn(p2.a - p2.b, p2.d)}</div>`, true));
  hints.push(`분모 ${p2.d}는 그대로 쓰고, 분자 ${p2.a}에서 ${p2.b}를 빼요.`);

  // 3번: 계산 (2문제)
  const c3 = [sub(4), sub(4)];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c3.map(p => `<div class="qbox">${G.calc(M.frac(p.a, p.d) + G.MINUS + M.frac(p.b, p.d), p.a - p.b, p.d)}</div>`)), true));
  hints.push('분모는 그대로, 분자끼리 빼요.');

  // 4번: 문장제
  const p4 = sub(4);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">우유가 ${p4.a}/${p4.d} L 있었습니다. 그중에서 ${p4.b}/${p4.d} L를 마셨습니다. 남은 우유는 몇 L인가요?</div>` +
    `<div class="eq">${G.ans(p4.a - p4.b, p4.d)} <span class="unit">L</span></div>`, true));
  hints.push('"남은 양"은 처음 양에서 마신 양을 빼요.');

  // 5번: 계산 결과 비교
  const x5 = sub(4), y5 = F.gen(() => sub(4, p => p.d === x5.d), p => p.a !== x5.a || p.b !== x5.b);
  cards.push(M.card(4, `<div class="q-text">계산 결과를 비교하여 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    `<div class="cmp-row">${M.frac(x5.a, x5.d)}${G.MINUS}${M.frac(x5.b, x5.d)}${M.cmp(x5.a - x5.b, y5.a - y5.b)}${M.frac(y5.a, y5.d)}${G.MINUS}${M.frac(y5.b, y5.d)}</div>`, true));
  hints.push('양쪽을 각각 계산한 다음 분자의 크기를 비교해요. 분모가 같으면 분자가 클수록 큰 분수예요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
