<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (자연수) — 각 자리에서 나누어떨어지지 않는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (자연수)를 계산해요 — 몫이 1보다 크고 각 자리에서 나누어떨어지지 않는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나누고 남은 수는 다음 자리 수와 함께 나누어요!</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 4.23 ÷ 3 → 4 ÷ 3 = 1 남은 1 → 0.1이 12개 ÷ 3 = 4 → 0.01이 3개 ÷ 3 = 1 → <b>1.41</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 4.23 ÷ 3 = <sup>423</sup>⁄<sub>100</sub> ÷ 3 = <sup>423÷3</sup>⁄<sub>100</sub> = <sup>141</sup>⁄<sub>100</sub> = 1.41</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 몫의 소수점은 나누어지는 수의 소수점 바로 위에 찍어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6132 — (소수) ÷ (자연수), 몫이 1보다 크고 각 자리에서 나누어떨어지지 않는 경우 (교과서 6-1-3 60~61쪽, 수학 익힘 38~39쪽)
const f = M.fmt;
const STORY = [
  (a, n) => ({ unit: 'kg', text: `찹쌀밥 ${f(a, 2)} kg을 ${n}덩어리로 똑같이 나누었습니다. 찹쌀밥 한 덩어리의 무게는 몇 kg인가요?` }),
  (a, n) => ({ unit: 'm', text: `길이가 ${f(a, 2)} m인 철사를 ${n}도막으로 똑같이 나누었습니다. 한 도막의 길이는 몇 m인가요?` }),
  (a, n) => ({ unit: 'L', text: `주스 ${f(a, 2)} L를 컵 ${n}개에 똑같이 나누어 담았습니다. 컵 한 개에 담은 주스는 몇 L인가요?` })
];
// 각 자리 숫자가 모두 n으로 나누어떨어지면 이 차시가 아님
const eachDiv = (a, n) => String(a).split('').every(d => +d % n === 0);
// 몫 q(10^-pa 단위)를 먼저 뽑고 a = q × n
function mk(pa, qLo, qHi, aLo, aHi) {
  return F.gen(() => { const n = M.rand(3, 9), q = M.rand(qLo, qHi); return { n, q, a: q * n, pa }; },
    o => o.q % 10 !== 0 && o.a % 10 !== 0 && o.a >= aLo && o.a <= aHi && !eachDiv(o.a, o.n));
}
const ex = (o) => `${f(o.a, o.pa)} ÷ ${o.n}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (소수 두 자리 수 ÷ 한 자리 수)
  const p1 = mk(2, 101, 299, 300, 999);
  const s1 = M.pick(STORY)(p1.a, p1.n);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 2)} ÷ ${M.box(p1.n)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(p1.a, 2)}${M.josa(f(p1.a, 2), '을', '를')} 가까운 자연수로 어림하여 ${p1.n}(으)로 나누어 보세요.<br>식은 (전체 양) ÷ (나누는 수)예요.`);

  // 2번: 분수의 나눗셈으로 (소수 두 자리 수)
  const p2 = F.gen(() => mk(2, 101, 499, 300, 2999), o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">${ex(p2)}${M.josa(String(p2.n), '을', '를')} 분수의 나눗셈으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${ex(p2)} = ${F.fin(M.box(p2.a), 100)} ÷ ${p2.n} = ${F.fin(M.box(p2.a) + '<span style="margin:0 3px">÷</span>' + p2.n, 100)} = ${F.fin(M.box(p2.q), 100)} = ${M.dbox(p2.q, 2)}</div>`, true));
  hints.push(`소수 두 자리 수는 분모가 100인 분수예요. ${f(p2.a, 2)} = ${M.frac(p2.a, 100, true)}<br>분자 ${p2.a}${M.josa(String(p2.a), '을', '를')} ${p2.n}(으)로 나눈 다음 다시 소수로 나타내요.`);

  // 3번: 세로로 계산하기 (소수 한 자리 수, 소수 두 자리 수)
  const p3a = mk(1, 11, 33, 20, 99);
  const p3b = F.gen(() => mk(2, 101, 999, 1000, 9999), o => o.a !== p2.a);
  cards.push(M.card(2, `<div class="q-text">세로로 계산해 보세요.</div>` +
    M.line(D.vdiv({ a: p3a.a, pa: 1, n: p3a.n }), D.vdiv({ a: p3b.a, pa: 2, n: p3b.n })), true));
  hints.push(`나누고 남은 수는 바로 아랫자리 숫자를 내려 붙여서 다시 나누어요.<br>몫 → 빼는 수 → 남은 수 순서로 칸을 채워요.`);

  // 4번: 빈 곳에 알맞은 수 (÷ n 표)
  const n4 = M.rand(3, 9);
  const t4 = F.gen(() => [M.rand(11, 33), M.rand(11, 33)], v => v[0] !== v[1] && v.every(q => q % 10 && q * n4 % 10 && q * n4 < 300 && !eachDiv(q * n4, n4)));
  cards.push(M.card(3, `<div class="q-text">빈 곳에 알맞은 수를 써넣으세요.</div>` +
    `<table class="tbl"><tr><th>나누어지는 수</th><th>÷ ${n4}</th></tr>` +
    t4.map(q => `<tr><td>${f(q * n4, 1)}</td><td>${M.dbox(q, 1)}</td></tr>`).join('') + `</table>`));
  hints.push(`왼쪽 수를 ${n4}(으)로 나눈 몫을 오른쪽에 써요.<br>자연수 부분을 나누고 남은 수는 0.1이 몇 개인지로 바꾸어 이어서 나누어요.`);

  // 5번: 계산하기 + 몫의 크기 비교
  const p5a = mk(1, 11, 99, 20, 999), p5b = mk(2, 101, 999, 300, 9999);
  const c1 = mk(1, 11, 49, 20, 999), c2 = F.gen(() => mk(1, 11, 49, 20, 999), o => o.q !== c1.q);
  cards.push(M.card(4, `<div class="q-text">계산해 보고, 몫의 크기를 비교해 보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.dbox(p5a.q, 1)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.dbox(p5b.q, 2)}</div>`) +
    `<div class="cmp-row qbox">${ex(c1)} ${M.cmp(c1.q, c2.q)} ${ex(c2)}</div>`, true));
  hints.push(`몫의 소수점은 나누어지는 수의 소수점에 맞추어 찍어요.<br>몫의 크기를 비교할 때는 두 몫을 먼저 구해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
