<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 3학년 2학기 분수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m324-common.js"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수만큼은 얼마일까요 (길이와 시간)</title>
</head>
<body>

<div class="header-text">분수만큼은 얼마일까요 (길이와 시간)</div>
<div class="sub-text"><div class="rule-box"><div class="rule-title">🔎 1부분이 얼마인지 먼저 구해요!</div><div class="rule-line"><span class="rule-tag den">① 분모</span> 전체 길이·시간을 분모만큼 <b>똑같이 나누어요</b>.</div><div class="rule-line"><span class="rule-tag etc">② 1부분</span> <b>1부분</b>은 몇 cm(m, 시간)인가요?</div><div class="rule-line"><span class="rule-tag num">③ 분자</span> 1부분이 <b>분자만큼</b> 있으면 얼마인가요?</div></div><br><span style="font-size:13px;color:#94a3b8">(시계는 한 바퀴가 12시간입니다. 입력하면 자동으로 다음 칸으로 넘어갑니다.)</span><br><span style="font-size:13px;color:#92400e">막히면 <b>💡 도움말</b>로 풀이 방법을 먼저 보고, 그래도 모르겠으면 <b>🤔 도움</b>으로 선생님을 부르세요.</span></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3243 — 분수만큼은 얼마일까요 (길이와 시간)
// 교과서 3-2-4 92~93쪽: 8 m의 1/4, 12시간의 5/6, 7 cm의 3/7, 12시간의 1/4 (시계는 12시간)
const CLOCK_D = [2, 3, 4, 6, 12];   // 12시간을 똑같이 나눌 수 있는 분모
function lengthProblem(maxLen, usedKey) {
  let d, u, a, key, tries = 0;
  do {
    d = M.rand(2, 7); u = M.rand(1, 3); a = M.rand(1, d - 1);
    key = 'L' + d + '-' + u + '-' + a; tries++;
  } while ((usedKey.has(key) || d * u > maxLen || d * u < 4) && tries < 300);
  usedKey.add(key);
  return { d, u, a, L: d * u, ans: u * a };
}
function clockProblem(usedKey, needA2) {
  let d, a, key, tries = 0;
  do {
    d = M.pick(CLOCK_D); a = M.rand(1, d - 1);
    if (needA2 && d > 2 && a === 1) a = M.rand(2, d - 1);
    key = 'C' + d + '-' + a; tries++;
  } while (usedKey.has(key) && tries < 100);
  usedKey.add(key);
  return { d, a, u: 12 / d, ans: (12 / d) * a };
}
function generate() {
  const hints = [];
  const cards = [], used = new Set();
  // 1번: m 띠 + 자 (색칠한 그림, 1부분 먼저)
  let p = lengthProblem(12, used);
  cards.push(M.card(0, M.rulerTapeSvg(p.L, 'm', p.d, p.a) +
    `<div class="q-text">길이가 ${p.L} m인 천을 똑같이 ${p.d}부분으로 나누었습니다.</div>` +
    `<div class="eq" style="font-size:18px">1부분은 ${M.box(p.u)} m이고,</div>` +
    `<div class="eq" style="font-size:20px">${p.L} m의 ${M.frac(p.a, p.d)}${M.josa(p.a, '은', '는')} <span class="tail">${M.box(p.ans)} m입니다.</span></div>`));
  hints.push('색칠한 띠의 한 칸이 <b>1부분</b>이에요. 자의 눈금으로 한 칸이 몇 m인지 읽고, 색칠한 칸이 몇 개인지 세어 보세요.');
  // 2번: cm 띠 + 자 (나눈 선 없이)
  p = lengthProblem(12, used);
  cards.push(M.card(1, M.rulerTapeSvg(p.L, 'cm', 1, 0) +
    `<div class="eq" style="font-size:20px">${p.L} cm의 ${M.frac(p.a, p.d)}${M.josa(p.a, '은', '는')} <span class="tail">${M.box(p.ans)} cm입니다.</span></div>`));
  hints.push(`띠를 자의 눈금에 맞추어 똑같이 ${p.d}부분으로 나누어 보세요. <b>1부분</b>이 몇 cm인지 구한 뒤, 그것이 <b>${p.a}개</b>면 몇 cm인지 생각해요.`);
  // 3번: 12시간 시계 (나눈 선·색칠 있음)
  let c = clockProblem(used, true);
  cards.push(M.card(2, M.clockSvg(c.u * c.a, c.d) +
    `<div class="eq" style="font-size:18px">1부분은 ${M.box(c.u)} 시간이고,</div>` +
    `<div class="eq" style="font-size:20px">12시간의 ${M.frac(c.a, c.d)}${M.josa(c.a, '은', '는')} <span class="tail">${M.box(c.ans)} 시간입니다.</span></div>`));
  hints.push('빨간 선으로 나뉜 한 조각이 <b>1부분</b>이에요. 한 조각 안에 시계 숫자가 몇 칸(몇 시간) 들어 있는지 세어 보세요.');
  // 4번: 12시간 시계 (그림만)
  c = clockProblem(used, false);
  cards.push(M.card(3, M.clockSvg(0, 0) +
    `<div class="eq" style="font-size:20px">12시간의 ${M.frac(c.a, c.d)}${M.josa(c.a, '은', '는')} <span class="tail">${M.box(c.ans)} 시간입니다.</span></div>`));
  hints.push(`시계 한 바퀴는 12시간이에요. 시계 숫자를 따라 12시간을 똑같이 ${c.d}부분으로 묶어 보고, <b>1부분</b>이 몇 시간인지 구한 뒤 <b>${c.a}부분</b>이면 몇 시간인지 생각해요.`);
  // 5번: 글로만 (조금 큰 길이)
  p = lengthProblem(20, used);
  const unit = M.pick(['cm', 'm']);
  cards.push(M.card(4, `<div class="eq" style="font-size:22px;margin-top:10px">${p.L} ${unit}의 ${M.frac(p.a, p.d)}${M.josa(p.a, '은', '는')} <span class="tail">${M.box(p.ans)} ${unit}입니다.</span></div>`));
  hints.push(`${p.L} ${unit}를 똑같이 ${p.d}부분으로 나누면 <b>1부분</b>은 몇 ${unit}일까요? 그 1부분이 <b>${p.a}개</b> 있으면 얼마인가요?`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
