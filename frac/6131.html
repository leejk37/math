<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (자연수) — 각 자리에서 나누어떨어지는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (자연수)를 계산해요 — 몫이 1보다 크고 각 자리에서 나누어떨어지는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 자연수처럼 나누고, 소수점을 맞추어 찍어요!</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 6.2 ÷ 2 → 6 ÷ 2 = 3, 0.1이 2개 ÷ 2 = 0.1이 1개 → <b>3.1</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 6.2 ÷ 2 = <sup>62</sup>⁄<sub>10</sub> ÷ 2 = <sup>62÷2</sup>⁄<sub>10</sub> = <sup>31</sup>⁄<sub>10</sub> = 3.1</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 몫의 소수점은 나누어지는 수의 소수점 바로 위에 찍어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6131 — (소수) ÷ (자연수), 몫이 1보다 크고 각 자리에서 나누어떨어지는 경우 (교과서 6-1-3 58~59쪽, 수학 익힘 36~37쪽)
const f = M.fmt;
const STORY = [
  (a, n) => ({ unit: 'g', text: `좁쌀 ${f(a, 1)} g을 똑같이 나누어 공깃돌 ${n}개를 만들려고 합니다. 공깃돌 한 개에 넣을 수 있는 좁쌀은 몇 g인가요?` }),
  (a, n) => ({ unit: 'kg', text: `밀가루 ${f(a, 1)} kg을 ${n}통에 똑같이 나누어 담았습니다. 한 통에 담은 밀가루는 몇 kg인가요?` }),
  (a, n) => ({ unit: 'm', text: `길이가 ${f(a, 1)} m인 끈을 ${n}도막으로 똑같이 나누었습니다. 한 도막의 길이는 몇 m인가요?` })
];
// 각 자리에서 나누어떨어지는 (소수 한 자리 수) ÷ n : 자연수 부분 = Q × n, 소수 첫째 자리 = t × n
function pick(maxInt) {
  return F.gen(() => {
    const n = M.rand(2, 4), Q = M.rand(1, 9), t = M.rand(1, Math.floor(9 / n));
    return { n, a: Q * n * 10 + t * n, q: Q * 10 + t, Q, t };
  }, o => o.Q * o.n <= maxInt && o.Q * o.n >= 2);
}

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기
  const p1 = pick(9);
  const s1 = M.pick(STORY)(p1.a, p1.n);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 1, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 1)} ÷ ${M.box(p1.n)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 1)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(p1.a, 1)}${M.josa(f(p1.a, 1), '을', '를')} 가까운 자연수로 어림한 다음 ${p1.n}(으)로 나누어 보세요.<br>나누는 식은 (전체 양) ÷ (나누는 개수)예요.`);

  // 2번: 수 모형 — 1과 0.1을 똑같이 묶기
  const p2 = F.gen(() => pick(9), o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">수 모형으로 ${f(p2.a, 1)} ÷ ${p2.n}${M.josa(String(p2.n), '을', '를')} 알아보세요.</div>` +
    D.blocks(p2.Q * p2.n, p2.t * p2.n) +
    `<div class="eq" style="font-size:18px">${f(p2.a, 1)}${M.josa(f(p2.a, 1), '을', '를')} 똑같이 ${p2.n}묶음으로 나누면 한 묶음에 1이 <span class="tail">${M.box(p2.Q)}개,</span> 0.1이 <span class="tail">${M.box(p2.t)}개</span>입니다.</div>` +
    `<div class="eq">${f(p2.a, 1)} ÷ ${p2.n} = ${M.dbox(p2.q, 1)}</div>`, true));
  hints.push(`1 모형 ${p2.Q * p2.n}개를 ${p2.n}묶음으로, 0.1 모형 ${p2.t * p2.n}개를 ${p2.n}묶음으로 나누어 보세요.<br>한 묶음의 1의 개수와 0.1의 개수를 합하면 몫이에요.`);

  // 3번: 분수의 나눗셈으로
  const p3 = F.gen(() => pick(36), o => o.a !== p2.a && o.a !== p1.a);
  cards.push(M.card(2, `<div class="q-text">${f(p3.a, 1)} ÷ ${p3.n}${M.josa(String(p3.n), '을', '를')} 분수의 나눗셈으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${f(p3.a, 1)} ÷ ${p3.n} = ${F.fin(M.box(p3.a), 10)} ÷ ${p3.n} = ${F.fin(M.box(p3.a) + '<span style="margin:0 3px">÷</span>' + p3.n, 10)} = ${F.fin(M.box(p3.q), 10)} = ${M.dbox(p3.q, 1)}</div>`, true));
  hints.push(`소수 한 자리 수는 분모가 10인 분수로 나타낼 수 있어요. ${f(p3.a, 1)} = ${M.frac(p3.a, 10, true)}<br>분자를 ${p3.n}(으)로 나눈 다음, 분모가 10인 분수를 다시 소수로 나타내요.`);

  // 4번: 세로로 계산하기 (자연수 부분 한 자리, 두 자리)
  const p4a = F.gen(() => pick(9), o => o.a !== p1.a);
  const p4b = F.gen(() => pick(36), o => o.Q * o.n >= 10 && o.a !== p3.a);
  cards.push(M.card(3, `<div class="q-text">세로로 계산해 보세요.</div>` +
    M.line(D.vdiv({ a: p4a.a, pa: 1, n: p4a.n }), D.vdiv({ a: p4b.a, pa: 1, n: p4b.n })), true));
  hints.push(`자연수의 나눗셈처럼 앞자리부터 나누어요. 몫의 소수점은 나누어지는 수의 소수점 위에 이미 찍혀 있어요.<br>몫 → 빼는 수 → 남은 수 순서로 칸을 채워요.`);

  // 5번: 계산하기 + 몫의 크기 비교
  const p5a = pick(36), p5b = F.gen(() => pick(36), o => o.a !== p5a.a);
  const c1 = pick(9), c2 = F.gen(() => pick(9), o => o.a !== c1.a && o.n !== c1.n);
  cards.push(M.card(4, `<div class="q-text">계산해 보고, 몫의 크기를 비교해 보세요.</div>` +
    M.line(`<div class="eq qbox">${f(p5a.a, 1)} ÷ ${p5a.n} = ${M.dbox(p5a.q, 1)}</div>`, `<div class="eq qbox">${f(p5b.a, 1)} ÷ ${p5b.n} = ${M.dbox(p5b.q, 1)}</div>`) +
    `<div class="cmp-row qbox">${f(c1.a, 1)} ÷ ${c1.n} ${M.cmp(c1.q, c2.q)} ${f(c2.a, 1)} ÷ ${c2.n}</div>`, true));
  hints.push(`자연수 부분과 소수 부분을 각각 나누어 보세요.<br>몫의 크기를 비교할 때는 두 몫을 먼저 구해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
