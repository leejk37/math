<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (소수) — 자릿수가 다른 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (소수)를 계산해요 — 자릿수가 다른 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나누는 수가 자연수가 되도록 두 수의 소수점을 똑같이 옮겨요!</div>
  <div class="rule-line"><span class="rule-tag">방법1</span> 3.84 ÷ 1.6 → 두 수를 100배 → 384 ÷ 160 = 2.4</div>
  <div class="rule-line"><span class="rule-tag t3">방법2</span> 3.84 ÷ 1.6 → 두 수를 10배 → 38.4 ÷ 16 = 2.4</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 몫의 소수점은 옮긴 나누어지는 수의 소수점 위에 찍어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6223 — (소수) ÷ (소수), 자릿수가 다른 경우 (교과서 6-2-2 40~41쪽, 수학 익힘 28~29쪽)
const f = M.fmt, f0 = M.fmt0;
// 나누어지는 수 a(소수 두 자리) = b(소수 한 자리) × q(소수 한 자리)
function mk(test) {
  return F.gen(() => { const b = M.rand(12, 89), q = M.rand(11, 49); return { b, q, a: b * q }; },
    o => o.b % 10 !== 0 && o.q % 10 !== 0 && o.a % 10 !== 0 && o.a < 1000 && (!test || test(o)));
}
const ex = (o) => `${f(o.a, 2)} ÷ ${f(o.b, 1)}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 넓이와 세로로 가로 구하기
  const p1 = mk();
  cards.push(M.card(0, `<div class="q-text">넓이가 ${f(p1.a, 2)} m²인 직사각형 모양의 꽃밭이 있습니다. 세로가 ${f(p1.b, 1)} m일 때, 가로는 몇 m인가요?</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 1, 'm')}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 2)} ÷ ${M.dbox(p1.b, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 1)} m</span></div>`), true));
  hints.push(`(직사각형의 넓이) = (가로) × (세로)이므로 (가로) = (넓이) ÷ (세로)예요.<br>두 수를 10배 하면 ${f(p1.a * 10, 2)} ÷ ${p1.b}처럼 나누는 수가 자연수가 돼요.`);

  // 2번: 두 가지 방법으로 계산하기
  const p2 = mk(o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">${ex(p2)}${M.josa(f(p2.b, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    `<div class="mbox"><div class="mpanel"><span class="mtag">방법 ① 나누어지는 수를 자연수로</span>` +
    `<div class="eq" style="font-size:18px">두 수를 각각 <span class="tail">${M.box(100)}배</span> 하면</div>` +
    `<div class="eq" style="font-size:19px">${p2.a} ÷ ${M.box(p2.b * 10)} = ${M.dbox(p2.q, 1)}</div></div>` +
    `<div class="mpanel"><span class="mtag" style="background:#7c3aed">방법 ② 나누는 수를 자연수로</span>` +
    `<div class="eq" style="font-size:18px">두 수를 각각 <span class="tail">${M.box(10)}배</span> 하면</div>` +
    `<div class="eq" style="font-size:19px">${f(p2.a, 1)} ÷ ${M.box(p2.b)} = ${M.dbox(p2.q, 1)}</div></div></div>`, true));
  hints.push(`① 소수 두 자리 수 ${f(p2.a, 2)}${M.josa(f(p2.a, 2), '을', '를')} 자연수로 만들려면 100배, 나누는 수도 100배 해요.<br>② 나누는 수 ${f(p2.b, 1)}${M.josa(f(p2.b, 1), '을', '를')} 자연수로 만들려면 10배, 나누어지는 수도 10배 해요.`);

  // 3번: 나누는 수를 자연수로 바꾸어 세로로 계산하기
  const p3a = mk(o => o.a !== p2.a), p3b = mk(o => o.a !== p3a.a && o.a !== p2.a);
  cards.push(M.card(2, `<div class="q-text">나누는 수가 자연수가 되도록 두 수의 소수점을 옮겨 세로로 계산해 보세요.</div>` +
    M.line(D.vdiv({ a: p3a.a, pa: 1, n: p3a.b, label: `${ex(p3a)} → ${f(p3a.a, 1)} ÷ ${p3a.b}` }),
      D.vdiv({ a: p3b.a, pa: 1, n: p3b.b, label: `${ex(p3b)} → ${f(p3b.a, 1)} ÷ ${p3b.b}` })), true));
  hints.push(`두 수의 소수점을 오른쪽으로 한 자리씩 옮겼어요.<br>몫의 소수점은 옮긴 나누어지는 수의 소수점 위에 찍혀 있어요.`);

  // 4번: 잘못 계산한 사람 찾기
  const ok4 = mk(o => o.a !== p3a.a), bad4 = mk(o => o.a !== ok4.a && o.q < 30);
  const firstOk = Math.random() < 0.5;
  const sayOk = `${ex(ok4)} = ${f0(ok4.q, 1)}`, sayBad = `${ex(bad4)} = ${f0(bad4.q, 2)}`;
  const ppl = firstOk ? [['도현', sayOk], ['윤서', sayBad]] : [['도현', sayBad], ['윤서', sayOk]];
  const badName = firstOk ? '윤서' : '도현';
  cards.push(M.card(3, `<div class="q-text">잘못 계산한 사람을 고르고, 옳게 계산한 몫을 써 보세요.</div>` +
    `<div class="choice-group speech-pick" tabindex="-1" data-ans="${badName}">` + ppl.map(p => `<button type="button" class="choice-btn" data-v="${p[0]}"><span class="who">${p[0]}</span>${p[1]}</button>`).join('') + `</div>` +
    `<div class="eq">옳게 계산한 몫: ${ex(bad4)} = ${M.dbox(bad4.q, 1)}</div>`, true));
  hints.push(`몫을 어림해 보세요. 예) ${ex(bad4)} → ${Math.round(bad4.a / 100)} ÷ ${Math.round(bad4.b / 10)}${M.josa(String(Math.round(bad4.b / 10)), '은', '는')} 약 ${Math.max(1, Math.round(bad4.a / 100 / Math.round(bad4.b / 10)))}<br>나누는 수의 소수점을 옮긴 만큼만 나누어지는 수의 소수점을 옮겨야 해요.`);

  // 5번: 계산하기
  const p5a = mk(o => o.a !== bad4.a), p5b = mk(o => o.a !== p5a.a);
  cards.push(M.card(4, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.dbox(p5a.q, 1)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.dbox(p5b.q, 1)}</div>`), true));
  hints.push(`두 수를 10배 하여 (소수 한 자리 수) ÷ (자연수)로 계산하거나, 100배 하여 (자연수) ÷ (자연수)로 계산해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
