<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>자연수의 나눗셈을 이용한 (소수) ÷ (소수)</title>
</head>
<body>

<div class="header-text">자연수의 나눗셈을 이용하여 (소수) ÷ (소수)를 알아보아요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나누어지는 수와 나누는 수에 똑같이 10배 또는 100배 하면 몫은 변하지 않아요!</div>
  <div class="rule-line"><span class="rule-tag">단위</span> 13.5 cm ÷ 0.5 cm → 135 mm ÷ 5 mm = 27 → 27개</div>
  <div class="rule-line"><span class="rule-tag t3">10배</span> 18.4 ÷ 0.4 → 184 ÷ 4 = 46 → 18.4 ÷ 0.4 = <b>46</b></div>
  <div class="rule-line"><span class="rule-tag t2">100배</span> 1.84 ÷ 0.04 → 184 ÷ 4 = 46 → 1.84 ÷ 0.04 = <b>46</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6221 — 자연수의 나눗셈을 이용하여 (소수) ÷ (소수) 알아보기 (교과서 6-2-2 34~37쪽, 수학 익힘 24~25쪽)
const f = M.fmt;
// 몫 Q(자연수)와 나누는 수 b(10^-p 단위)를 먼저 뽑고 a = Q × b
function mk(p, bLo, bHi, qLo, qHi, test) {
  return F.gen(() => { const b = M.rand(bLo, bHi), Q = M.rand(qLo, qHi); return { p, b, Q, a: b * Q }; },
    o => o.a % 10 !== 0 && o.b % 10 !== 0 && (!test || test(o)));
}

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: cm를 mm로 바꾸어 계산하기 (13.5 cm ÷ 0.5 cm)
  const p1 = mk(1, 2, 9, 11, 49, o => o.a < 1000);
  cards.push(M.card(0, `<div class="q-text">색 테이프 ${f(p1.a, 1)} cm를 ${f(p1.b, 1)} cm씩 잘라 조각을 만들려고 합니다. 만들 수 있는 조각은 몇 개인지 mm로 바꾸어 알아보세요.</div>` +
    M.line(`<div class="eq" style="font-size:19px">${f(p1.a, 1)} cm = <span class="tail">${M.box(p1.a)} mm</span></div>`, `<div class="eq" style="font-size:19px">${f(p1.b, 1)} cm = <span class="tail">${M.box(p1.b)} mm</span></div>`) +
    `<div class="eq" style="font-size:19px">${M.box(p1.a)} ÷ ${M.box(p1.b)} = ${M.box(p1.Q)} 이므로 ${f(p1.a, 1)} ÷ ${f(p1.b, 1)} = ${M.box(p1.Q)}  →  <span class="tail">${M.box(p1.Q)}개</span></div>`, true));
  hints.push(`1 cm = 10 mm예요. 0.1 cm는 1 mm와 같아요.<br>mm로 바꾸면 (자연수) ÷ (자연수)가 돼요.`);

  // 2번: m를 cm로 바꾸어 계산하기 (1.26 m ÷ 0.06 m)
  const p2 = mk(2, 2, 9, 11, 39, o => o.a >= 100 && o.a < 1000);
  cards.push(M.card(1, `<div class="q-text">리본 ${f(p2.a, 2)} m를 ${f(p2.b, 2)} m씩 잘라 고리를 만들려고 합니다. 만들 수 있는 고리는 몇 개인지 cm로 바꾸어 알아보세요.</div>` +
    M.line(`<div class="eq" style="font-size:19px">${f(p2.a, 2)} m = <span class="tail">${M.box(p2.a)} cm</span></div>`, `<div class="eq" style="font-size:19px">${f(p2.b, 2)} m = <span class="tail">${M.box(p2.b)} cm</span></div>`) +
    `<div class="eq" style="font-size:19px">${M.box(p2.a)} ÷ ${M.box(p2.b)} = ${M.box(p2.Q)} 이므로 ${f(p2.a, 2)} ÷ ${f(p2.b, 2)} = ${M.box(p2.Q)}  →  <span class="tail">${M.box(p2.Q)}개</span></div>`, true));
  hints.push(`1 m = 100 cm예요. 0.01 m는 1 cm와 같아요.<br>cm로 바꾸면 (자연수) ÷ (자연수)가 돼요.`);

  // 3번: 184 ÷ 4 = 46을 이용하여 18.4 ÷ 0.4, 1.84 ÷ 0.04
  const p3 = F.gen(() => { const n = M.rand(2, 9), Q = M.rand(12, 99); return { n, Q, A: n * Q }; }, o => o.A % 10 !== 0 && o.A >= 100 && o.Q % 10 !== 0);
  cards.push(M.card(2, `<div class="q-text">${p3.A} ÷ ${p3.n} = ${p3.Q}${M.josa(String(p3.Q), '을', '를')} 이용하여 계산해 보세요.</div>` +
    `<div class="mbox"><div class="mpanel">${D.shiftArrows({ a: p3.A, pa: 1, b: p3.n, pb: 1, s: 1 })}</div>` +
    `<div class="mpanel">${D.shiftArrows({ a: p3.A, pa: 2, b: p3.n, pb: 2, s: 2 })}</div></div>`, true));
  hints.push(`소수 한 자리 수는 10배 하면 자연수가 되고, 소수 두 자리 수는 100배 하면 자연수가 돼요.<br>나누어지는 수와 나누는 수에 똑같이 곱하면 몫은 변하지 않아요.`);

  // 4번: 자연수의 나눗셈을 이용하여 계산하기 (48.6 ÷ 0.3, 0.84 ÷ 0.12)
  const p4a = mk(1, 2, 9, 101, 299, o => o.a < 10000 && o.a >= 100);
  const p4b = mk(2, 11, 49, 2, 9, o => o.a < 100);
  cards.push(M.card(3, `<div class="q-text">자연수의 나눗셈을 이용하여 계산해 보세요.</div>` +
    `<div class="mbox"><div class="mpanel">${D.shiftArrows({ a: p4a.a, pa: 1, b: p4a.b, pb: 1, s: 1, boxB: true })}</div>` +
    `<div class="mpanel">${D.shiftArrows({ a: p4b.a, pa: 2, b: p4b.b, pb: 2, s: 2, showA: false })}</div></div>`, true));
  hints.push(`나누는 수가 자연수가 되도록 몇 배 할지 정해요. (소수 한 자리 → 10배, 소수 두 자리 → 100배)<br>나누어지는 수에도 똑같이 곱해요.`);

  // 5번: 몫이 같은 나눗셈 모두 찾기
  const p5 = F.gen(() => { const n = M.rand(12, 49), Q = M.rand(12, 49); return { n, Q, A: n * Q }; }, o => o.A % 10 !== 0 && o.n % 10 !== 0 && o.A >= 100 && o.A < 1000);
  const opts5 = M.shuffle([
    ['y1', `${f(p5.A, 1)} ÷ ${f(p5.n, 1)}`], ['y2', `${f(p5.A, 2)} ÷ ${f(p5.n, 2)}`],
    ['n1', `${f(p5.A, 2)} ÷ ${p5.n}`], ['n2', `${f(p5.A, 1)} ÷ ${f(p5.n, 2)}`]]);
  cards.push(M.card(4, `<div class="q-text">${p5.A} ÷ ${p5.n}${M.josa(String(p5.n), '과', '와')} 몫이 같은 나눗셈을 모두 골라 보세요.</div>` + F.multi(opts5, ['y1', 'y2']), true));
  hints.push(`두 수에 똑같이 10배 또는 100배 해서 ${p5.A} ÷ ${p5.n}이 되는지 확인해 보세요.<br>한 수에만 곱하거나 서로 다른 수를 곱하면 몫이 달라져요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
