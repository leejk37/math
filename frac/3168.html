<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>소수 알기 종합 문제</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; background:#F7F6F2; margin:0; padding:24px; color:#2C2C2A; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight:600; margin-bottom: 24px; }
  .card { background:#fff; border:1px solid #E3E1D9; border-radius:14px; padding:22px 26px; margin-bottom:22px; }
  .card h2 { font-size:17px; font-weight:600; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
  .badge { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:#534AB7; color:#fff; font-size:14px; }
  .qrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0; font-size:15px; }
  .qrow label { flex-shrink:0; }
  input[type=text] { width:56px; height:32px; border:1px solid #C7C4B8; border-radius:6px; text-align:center; font-size:14px; padding:0 4px; }
  button { background:#fff; border:1px solid #999385; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; margin-top:8px; }
  button:hover { background:#F1EFE8; }
  button:active { transform: scale(0.98); }
  .result { margin-top:12px; padding:10px 14px; border-radius:8px; font-size:14px; display:none; }
  .result.ok { background:#EAF3DE; color:#27500A; display:block; }
  .result.bad { background:#FAEEDA; color:#633806; display:block; }
  .target-badge { background:#E6F1FB; color:#0C447C; font-weight:600; font-size:16px; padding:8px 14px; border-radius:8px; flex-shrink:0; }
  .rowline { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  svg { display:block; }
  .caption { text-align:center; font-size:13px; color:#5F5E5A; margin:4px 0 0; }
  .p3-title { font-size:15px; font-weight:600; margin:0 0 12px; }
</style>
</head>
<body>
<div class="wrap">
<h1>소수 알기 종합 문제</h1>

<div class="card">
  <h2><span class="badge">1</span>연필의 길이를 cm로 나타내는 방법을 알아봅시다.</h2>
  <svg id="p1svg" width="100%" viewBox="0 0 680 220"></svg>
  <p class="caption" id="p1cap"></p>
  <div id="p1quiz"></div>
  <button onclick="checkP1()">정답 확인</button>
  <div class="result" id="p1result"></div>
</div>

<div class="card">
  <h2><span class="badge">2</span>색칠한 부분을 소수로 나타내어 봅시다.</h2>
  <svg id="p2svg" width="100%" viewBox="0 0 680 140"></svg>
  <div id="p2quiz"></div>
  <button onclick="checkP2()">정답 확인</button>
  <div class="result" id="p2result"></div>
</div>

<div class="card">
  <h2><span class="badge">3</span>소수만큼 색칠해 봅시다.</h2>
  <div class="rowline" id="p3row0"></div>
  <div class="rowline" id="p3row1"></div>
  <button onclick="checkP3()">정답 확인</button>
  <div class="result" id="p3result"></div>
</div>

<div class="card">
  <h2><span class="badge">4</span>소수로 나타내기</h2>
  <div class="qrow" id="p4quiz"></div>
  <button onclick="checkP4()">정답 확인</button>
  <div class="result" id="p4result"></div>
</div>

<div class="card">
  <h2><span class="badge">5</span>단위를 변환해 봅시다.</h2>
  <div class="qrow" id="p5quiz"></div>
  <button onclick="checkP5()">정답 확인</button>
  <div class="result" id="p5result"></div>
</div>

</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(svgNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function showResult(id, ok, okMsg, badMsg){
  const box = document.getElementById(id);
  box.className = 'result ' + (ok ? 'ok' : 'bad');
  box.textContent = ok ? okMsg : badMsg;
}

/* ===== 문제 1: 연필 길이 측정 ===== */
(function(){
  const startX = 60, endX = 620, cmPx = (endX-startX)/10;
  const svg = document.getElementById('p1svg');
  const cm = 4 + Math.floor(Math.random()*6);
  const mm = 1 + Math.floor(Math.random()*9);
  const decimal = cm + mm/10;
  const lengthPx = decimal*cmPx;
  const rightX = startX + lengthPx;

  const tipW = 24;
  svg.appendChild(el('rect',{x:startX,y:78,width:lengthPx-tipW,height:24,fill:'#F2C14E',stroke:'#B98A1F','stroke-width':1.5}));
  svg.appendChild(el('polygon',{points:(startX+lengthPx-tipW)+',78 '+rightX+',90 '+(startX+lengthPx-tipW)+',102',fill:'#D9A441',stroke:'#B98A1F','stroke-width':1.5}));
  svg.appendChild(el('line',{x1:rightX,y1:120,x2:rightX,y2:230,stroke:'#D45A7A','stroke-width':1.5,'stroke-dasharray':'4 3'}));
  svg.appendChild(el('rect',{x:60,y:160,width:560,height:60,fill:'#BFE3EE',opacity:0.5,rx:4}));
  svg.appendChild(el('line',{x1:60,y1:192,x2:620,y2:192,stroke:'#2C2C2A','stroke-width':1.5}));
  for(let i=0;i<=100;i++){
    const x = startX + i*(cmPx/10);
    const isCm = i%10===0;
    const h = isCm ? 22 : (i%5===0 ? 14 : 8);
    svg.appendChild(el('line',{x1:x,x2:x,y1:192,y2:192-h,stroke:'#2C2C2A','stroke-width':isCm?1.5:0.7}));
    if(isCm){
      const t = el('text',{x:x,y:210,'text-anchor':'middle','font-size':12,fill:'#5F5E5A'});
      t.textContent = i/10;
      svg.appendChild(t);
    }
  }
  document.getElementById('p1cap').textContent = '연필의 길이를 재어 봅시다.';

  const questions = [
    {q:'연필의 길이는 ' + cm + ' cm보다 몇 mm 더 긴가요?', ans:mm, unit:'mm'},
    {q:'1 mm는 소수로 몇 cm인가요?', ans:0.1, unit:'cm'},
    {q:'3 mm는 소수로 몇 cm인가요?', ans:0.3, unit:'cm'},
    {q:cm + ' cm보다 ' + mm + ' mm 더 긴 길이를 cm로 어떻게 나타낼 수 있을까요?', ans:decimal, unit:'cm'}
  ];
  const box = document.getElementById('p1quiz');
  questions.forEach((item,idx)=>{
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML = (idx+1)+'. '+item.q+' <input type="text" id="p1a'+idx+'"> '+item.unit;
    box.appendChild(row);
  });
  window.checkP1 = function(){
    let ok = true;
    questions.forEach((item,idx)=>{
      const v = parseFloat(document.getElementById('p1a'+idx).value);
      if(isNaN(v) || Math.abs(v-item.ans) > 0.001) ok = false;
    });
    showResult('p1result', ok, '모두 정답입니다!', '틀린 답이 있어요. 다시 확인해 보세요.');
    return ok;
  };
})();

/* ===== 문제 2: 색칠한 부분을 소수로 ===== */
(function(){
  const svg = document.getElementById('p2svg');
  const startX = 60, endX = 620, totalCells = 20, cellW = (endX-startX)/totalCells;
  const shaded = 11 + Math.floor(Math.random()*9);

  for(let i=0;i<totalCells;i++){
    const x = startX + i*cellW;
    svg.appendChild(el('rect',{x:x,y:40,width:cellW,height:40,fill:i<shaded?'#9FE1CB':'none',stroke:'#2C2C2A','stroke-width':0.7}));
    const isMajor = (i%10===0);
    svg.appendChild(el('line',{x1:x,x2:x,y1:isMajor?40:48,y2:80,stroke:'#2C2C2A','stroke-width':isMajor?1.5:0.5,'stroke-dasharray':isMajor?'none':'2 2'}));
  }
  svg.appendChild(el('line',{x1:60,y1:40,x2:60,y2:80,stroke:'#2C2C2A','stroke-width':1.5}));
  svg.appendChild(el('line',{x1:340,y1:40,x2:340,y2:80,stroke:'#2C2C2A','stroke-width':1.5}));
  svg.appendChild(el('line',{x1:620,y1:40,x2:620,y2:80,stroke:'#2C2C2A','stroke-width':1.5}));
  [[60,'0'],[340,'1'],[620,'2']].forEach(([x,txt])=>{
    const t = el('text',{x:x,y:105,'text-anchor':'middle','font-size':14,fill:'#2C2C2A'});
    t.textContent = txt;
    svg.appendChild(t);
  });
  const fl = el('text',{x:74,y:60,'text-anchor':'middle','dominant-baseline':'central','font-size':12,fill:'#5F5E5A'});
  fl.textContent = '0.1';
  svg.appendChild(fl);

  const decimal = shaded/10;
  const overOne = shaded - 10;
  const questions = [
    {q:'한 칸의 크기는 얼마인가요?', ans:0.1, unit:''},
    {q:'색칠한 부분은 1에서 몇 칸 더 색칠한 것인가요?', ans:overOne, unit:'칸'},
    {q:'색칠한 부분을 소수로 나타내면 얼마인가요?', ans:decimal, unit:''},
    {q:'색칠한 부분은 0.1이 몇 개인가요?', ans:shaded, unit:'개'}
  ];
  const box = document.getElementById('p2quiz');
  questions.forEach((item,idx)=>{
    const row = document.createElement('div');
    row.className = 'qrow';
    row.innerHTML = (idx+1)+'. '+item.q+' <input type="text" id="p2a'+idx+'"> '+item.unit;
    box.appendChild(row);
  });
  window.checkP2 = function(){
    let ok = true;
    questions.forEach((item,idx)=>{
      const v = parseFloat(document.getElementById('p2a'+idx).value);
      if(isNaN(v) || Math.abs(v-item.ans) > 0.001) ok = false;
    });
    showResult('p2result', ok, '모두 정답입니다!', '틀린 답이 있어요. 다시 확인해 보세요.');
    return ok;
  };
})();

/* ===== 문제 3: 소수만큼 색칠하기 (드래그) ===== */
(function(){
  const totalCells = 30;
  const MARGIN = 16, rulerW = 600, viewW = rulerW + MARGIN*2;
  const cellW = rulerW/totalCells;
  const H = 90, RULER_H = 40, RULER_TOP = (H-RULER_H)/2;

  function randInRange(whole){ return whole + (1+Math.floor(Math.random()*9))/10; }
  const targets = [randInRange(1), randInRange(2)];
  const states = [new Array(totalCells).fill(false), new Array(totalCells).fill(false)];

  function buildRow(rowIdx){
    const container = document.getElementById('p3row'+rowIdx);
    const label = document.createElement('div');
    label.className = 'target-badge';
    label.textContent = targets[rowIdx].toFixed(1);
    container.appendChild(label);

    const svg = el('svg',{width:'100%',viewBox:'0 0 '+viewW+' '+H});
    svg.style.flex = '1';
    svg.style.touchAction = 'none';

    for(let i=0;i<totalCells;i++){
      const x = MARGIN + i*cellW;
      const rect = el('rect',{x:x,y:RULER_TOP,width:cellW,height:RULER_H,fill:'#ffffff','fill-opacity':0.01,stroke:'none'});
      rect.setAttribute('pointer-events','all');
      rect.style.cursor = 'pointer';
      rect.dataset.row = rowIdx; rect.dataset.idx = i;
      svg.appendChild(rect);
    }
    svg.appendChild(el('line',{x1:MARGIN,x2:MARGIN+rulerW,y1:RULER_TOP,y2:RULER_TOP,stroke:'#2C2C2A','stroke-width':1.5}));
    svg.appendChild(el('line',{x1:MARGIN,x2:MARGIN+rulerW,y1:RULER_TOP+RULER_H,y2:RULER_TOP+RULER_H,stroke:'#2C2C2A','stroke-width':1.5}));
    for(let i=0;i<=totalCells;i++){
      const x = MARGIN + i*cellW;
      const isMajor = (i%10===0);
      const tick = el('line',{x1:x,x2:x,y1:RULER_TOP,y2:RULER_TOP+RULER_H,stroke:'#2C2C2A','stroke-width':isMajor?1.5:0.7});
      if(!isMajor) tick.setAttribute('stroke-dasharray','3 3');
      svg.appendChild(tick);
    }
    const fl = el('text',{x:MARGIN+cellW-4,y:RULER_TOP+RULER_H/2,'text-anchor':'end','dominant-baseline':'central',fill:'#5F5E5A'});
    fl.style.fontSize = '11px'; fl.style.letterSpacing = '-0.8px';
    fl.textContent = '0.1';
    svg.appendChild(fl);
    [0,1,2,3].forEach(n=>{
      const t = el('text',{x:MARGIN+n*200,y:RULER_TOP+RULER_H+18,'text-anchor':'middle','font-size':14,fill:'#2C2C2A'});
      t.textContent = n;
      svg.appendChild(t);
    });
    container.appendChild(svg);
  }
  buildRow(0); buildRow(1);

  let dragging = false, paintValue = true;
  function paintCell(rect){
    const row = parseInt(rect.dataset.row), idx = parseInt(rect.dataset.idx);
    states[row][idx] = paintValue;
    if(paintValue){ rect.setAttribute('fill','#9FE1CB'); rect.setAttribute('fill-opacity','1'); }
    else { rect.setAttribute('fill','#ffffff'); rect.setAttribute('fill-opacity','0.01'); }
  }
  document.querySelectorAll('rect[data-row]').forEach(rect=>{
    rect.addEventListener('pointerdown', e=>{
      dragging = true;
      const row = parseInt(rect.dataset.row), idx = parseInt(rect.dataset.idx);
      paintValue = !states[row][idx];
      paintCell(rect);
      e.preventDefault();
    });
    rect.addEventListener('pointerover', ()=>{ if(dragging) paintCell(rect); });
  });
  document.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const elh = document.elementFromPoint(e.clientX, e.clientY);
    if(elh && elh.tagName === 'rect' && elh.dataset.row !== undefined) paintCell(elh);
  });
  window.addEventListener('pointerup', ()=>{ dragging = false; });
  window.addEventListener('pointercancel', ()=>{ dragging = false; });

  window.checkP3 = function(){
    let ok = true;
    for(let r=0;r<2;r++){
      const count = states[r].filter(v=>v).length;
      if(count !== Math.round(targets[r]*10)) ok = false;
    }
    showResult('p3result', ok, '모두 정답입니다!', '목표한 만큼 정확히 색칠되지 않았어요. 다시 확인해 보세요.');
    return ok;
  };
})();

/* ===== 문제 4: ○와 0.○만큼은 ___입니다 ===== */
(function(){
  const whole = 1 + Math.floor(Math.random()*9);
  const tenth = 1 + Math.floor(Math.random()*9);
  const ans = whole + tenth/10;
  const box = document.getElementById('p4quiz');
  box.innerHTML = whole + '와 0.' + tenth + '만큼은 <input type="text" id="p4a">입니다.';
  window.checkP4 = function(){
    const v = parseFloat(document.getElementById('p4a').value);
    const ok = !isNaN(v) && Math.abs(v-ans) < 0.001;
    showResult('p4result', ok, '정답입니다!', '정답은 ' + ans.toFixed(1) + '입니다.');
    return ok;
  };
})();

/* ===== 문제 5: cm mm 단위 변환 ===== */
(function(){
  const cm = 1 + Math.floor(Math.random()*9);
  const mm = 1 + Math.floor(Math.random()*9);
  const ans = cm + mm/10;
  const box = document.getElementById('p5quiz');
  box.innerHTML = cm + ' cm ' + mm + ' mm = <input type="text" id="p5a"> cm';
  window.checkP5 = function(){
    const v = parseFloat(document.getElementById('p5a').value);
    const ok = !isNaN(v) && Math.abs(v-ans) < 0.001;
    showResult('p5result', ok, '정답입니다!', '정답은 ' + ans.toFixed(1) + ' cm입니다.');
    return ok;
  };
})();
</script>
<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: 'create', hideInDiagnostic: ['.card > button'], grade: () => [checkP1(), checkP2(), checkP3(), checkP4(), checkP5()] });
</script>
</body>
</html>
