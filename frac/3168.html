<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수 알기 종합</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">소수 알기 종합</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 1보다 큰 소수와 길이를 소수로 나타내요</div>
  <div class="rule-line"><span class="rule-tag">소수</span> 2와 0.3만큼은 <b>2.3</b> (이 점 삼) — 0.1이 23개</div>
  <div class="rule-line"><span class="rule-tag t2">길이</span> 1 mm = <b>0.1 cm</b>, 6 cm 7 mm = <b>6.7 cm</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3168 — 소수 알기 종합 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 1보다 큰 소수를 0.1의 개수로 보지 못함, mm를 cm로 바꿀 때 0.1을 빠뜨림
M.inlineQuestion = true;
const n9 = () => M.rand(1, 9);
// 0.1 단위 수 (lo~hi), 자연수(끝자리 0)는 빼서 '2.0'처럼 쓰는 일이 없게
const tenth = (lo, hi) => { let v; do { v = M.rand(lo, hi); } while (v % 10 === 0); return v; };
const DIG = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 0~3 막대 → 0.1의 개수와 소수
  const v1 = tenth(11, 29); // 1.1 ~ 2.9 (0.1 단위)
  cards.push(M.card(0, `<div class="q-text">색칠한 부분은 얼마인지 알아보세요. (한 칸은 0.1)</div>` + S.longBar(3, 10, v1) +
    `<div class="eq" style="font-size:18px">색칠한 부분은 0.1이 ${M.box(v1)}개이므로 소수로 <span class="tail">${M.dbox(v1, 1, true)}입니다.</span></div>`, true));
  hints.push('굵은 선 사이가 1이에요. 1이 몇 개, 0.1이 몇 칸 더 있는지 세어 보세요.');

  // 2번: ■와 0.▲만큼
  const w2 = n9(), t2 = n9();
  cards.push(M.card(1, `<div class="q-text">빈칸에 알맞은 소수를 쓰고, 바르게 읽은 것을 골라 보세요.</div>` +
    `<div class="eq" style="font-size:18px">${w2}${M.josa(w2, '과', '와')} 0.${t2}만큼은 <span class="tail">${M.dbox(w2 * 10 + t2, 1, true)}입니다.</span></div>` +
    F.one(`${DIG[w2]} 점 ${DIG[t2]}`, [`${DIG[w2]}${DIG[t2]}`, `${DIG[w2]} ${DIG[t2]}`]), true));
  hints.push('자연수 부분을 쓰고 소수점을 찍은 다음 0.1의 개수를 써요. 읽을 때 소수점은 "점"이에요.');

  // 3번: ■ cm ▲ mm = □ cm
  const c3 = [[n9(), n9()], [n9(), n9()]];
  cards.push(M.card(2, `<div class="q-text">길이를 cm로 나타내 보세요.</div>` +
    M.line(...c3.map(([c, m]) => `<div class="qbox"><div class="eq">${c} cm ${m} mm${G0.EQ}<span class="tail">${M.dbox(c * 10 + m, 1, true)} cm</span></div></div>`)), true));
  hints.push('1 mm는 0.1 cm예요. ■ cm ▲ mm는 ■ cm보다 0.▲ cm 더 긴 길이예요.');

  // 4번: mm → cm
  const m4 = n9(), M4 = tenth(11, 89);
  cards.push(M.card(3, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">${m4} mm${G0.EQ}<span class="tail">${M.dbox(m4, 1, true)} cm</span></div></div>`,
      `<div class="qbox"><div class="eq">${M4} mm${G0.EQ}<span class="tail">${M.dbox(M4, 1, true)} cm</span></div></div>`), true));
  hints.push('10 mm가 1 cm예요. 23 mm = 20 mm + 3 mm = 2 cm 3 mm = 2.3 cm');

  // 5번: 수직선의 화살표가 가리키는 소수
  const v5 = tenth(1, 29);
  cards.push(M.card(4, `<div class="q-text">수직선에서 화살표가 가리키는 수를 소수로 써 보세요.</div>` +
    M.lineSvg({ start: 0, unit: 1, p: 1, ticks: 30, major: 10, mid: 5, trim: true, arrows: [{ at: v5 }] }) +
    `<div class="eq">${M.dbox(v5, 1, true)}</div>`, true));
  hints.push('큰 눈금 사이를 10칸으로 나누었으니 작은 눈금 한 칸은 0.1이에요.');
  M.render(cards, hints);
}
const G0 = { EQ: '<span class="op">=</span>' };
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
