<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 4학년 소수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수 두 자리 수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">소수 두 자리 수를 알아봐요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 1을 100칸으로 나눈 한 칸이 0.01이에요!</div>
  <div class="rule-line"><span class="rule-tag">쓰기</span> <b>1/100 = 0.01</b>, 0.01이 17개면 <b>0.17</b>이에요. 0.01이 7개면 <b>0.07</b> (소수 첫째 자리에 0을 꼭 써요)</div>
  <div class="rule-line"><span class="rule-tag t2">읽기</span> 소수점 아래는 숫자를 <b>하나씩</b> 읽어요. 0.17 → 영 점 <b>일칠</b> (십칠 ✕)</div>
  <div class="rule-line"><span class="rule-tag t3">자리</span> 1.76에서 1은 <b>일의 자리</b>(1), 7은 <b>소수 첫째 자리</b>(0.7), 6은 <b>소수 둘째 자리</b>(0.06)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4231 — 소수 두 자리 수 (교과서 4-2-3 54~57쪽, 성취기준 [4수01-13])
const P = 2;
const f = n => M.fmt(n, P);
function twoDigitsNoZero() { let n; do { n = M.rand(11, 99); } while (n % 10 === 0); return n; }

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 모눈 그림 → 소수로 쓰기, 0.01이 몇 개
  const n1 = twoDigitsNoZero();
  cards.push(M.card(0, M.gridSvg(n1, 180) +
    `<div class="q-text">전체 크기가 1인 모눈종이입니다. 색칠한 부분을 소수로 써 보세요.</div>` +
    `<div class="eq" style="font-size:18px">0.01이 <span class="tail">${M.box(n1)} 개,</span>&nbsp; 소수로 쓰면 <span class="tail">${M.dbox(n1, P, true)}</span></div>`));
  hints.push('모눈 한 칸이 <b>0.01</b>이에요. 분홍 세로줄 한 줄(10칸)은 <b>0.1</b>이에요.<br>색칠한 칸이 모두 몇 칸인지 세면, 0.01이 그만큼 있는 수예요.');

  // 2번: 분수 → 소수 (두 자리 하나, 한 자리 하나)
  const a2 = twoDigitsNoZero(), b2 = M.rand(1, 9);
  cards.push(M.card(1, `<div class="q-text">분수를 소수로 나타내어 보세요.</div>` +
    `<div class="row" style="gap:48px;align-items:center">` +
    `<div class="eq">${M.frac(a2, 100)} = ${M.dbox(a2, P, true)}</div>` +
    `<div class="eq">${M.frac(b2, 100)} = ${M.dbox(b2, P, true)}</div></div>`));
  hints.push(`${M.frac(1, 100, true)} 은 0.01이에요. ${M.frac(a2, 100, true)} 은 0.01이 <b>${a2}개</b>예요.<br>${M.frac(b2, 100, true)} 은 0.01이 ${b2}개 → 소수 첫째 자리는 <b>0</b>이에요.`);

  // 3번: 대분수 → 소수, 자릿값 분해
  const w3 = M.rand(1, 9), t3 = M.rand(1, 9), o3 = M.rand(1, 9), v3 = w3 * 100 + t3 * 10 + o3;
  cards.push(M.card(2, `<div class="q-text">대분수를 소수로 나타내어 보세요.</div>` +
    `<div class="row" style="gap:36px;align-items:center">` +
    `<div class="eq">${M.mixed(w3, t3 * 10 + o3, 100)} = ${M.dbox(v3, P, true)}</div>` +
    // 앞 칸의 정답(소수)을 문장에 미리 보여 주지 않도록 '이 소수는'으로
    `<div class="eq" style="font-size:17px">이 소수는 1이 ${M.box(w3)}개, 0.1이 ${M.box(t3)}개, 0.01이 <span class="tail">${M.box(o3)}개입니다.</span></div></div>`, true));
  hints.push(`자연수 부분 ${w3}은 그대로 일의 자리에 쓰고, ${M.frac(t3 * 10 + o3, 100, true)} 은 소수 두 자리 수로 바꾸어 소수점 뒤에 써요.`);

  // 4번: 읽기 (0.bc 하나, a.bc 하나) — 자연수처럼 읽는 오개념 보기 포함
  const readItem = (str, frac2) => {
    const [ip, fp] = str.split('.');
    const right = M.readDec(str);
    const wrong1 = M.readDec(ip) + ' 점 ' + M.readInt(+fp);                // 영 점 십칠
    const wrong2 = M.readDec(ip + '.' + fp[1] + fp[0]);                     // 영 점 칠일
    const opts = M.shuffle([['r', right], ['w1', wrong1], ['w2', wrong2]]);
    return `<div class="pick-v"><div class="eq" style="font-size:24px">${str}</div>` + M.choices('r', opts) + `</div>`;
  };
  let b4, c4; do { b4 = M.rand(1, 9); c4 = M.rand(1, 9); } while (b4 === c4);
  let w4 = M.rand(1, 9), d4, e4; do { d4 = M.rand(1, 9); e4 = M.rand(1, 9); } while (d4 === e4);
  cards.push(M.card(3, `<div class="q-text">소수를 바르게 읽은 것을 골라 보세요.</div>` +
    `<div class="row" style="gap:64px;align-items:center"><div>${readItem('0.' + b4 + c4)}</div><div>${readItem(w4 + '.' + d4 + e4)}</div></div>`, true));
  hints.push('소수점은 <b>점</b>으로 읽고, 소수점 아래 숫자는 <b>하나씩</b> 읽어요. 예) 3.45 → 삼 점 사오');

  // 5번: 자리 이름과 나타내는 값
  let d5; do { d5 = [M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)]; } while (new Set(d5).size < 3);
  const s5 = d5[0] + '.' + d5[1] + d5[2];
  // 한 줄: 'N은 [자리 이름 세로 선택지] 숫자이고, □을(를) 나타냅니다.'
  const placeLine = (dg, placeIdx, val) =>
    `<div class="pick-v" style="font-size:18px;font-weight:bold;color:#1e293b">${s5}에서 ${dg}${M.josa(dg, '은', '는')}` +
    M.places(placeIdx, 2) +
    `<span class="tail">숫자이고, ${M.dbox(val, P)}${M.josa(dg, '을', '를')} 나타냅니다.</span></div>`;
  cards.push(M.card(4, `<div class="q-text">네모 안의 소수가 나타내는 자리와 값을 알아보세요.</div>` +
    M.placeBlock(s5, [placeLine(d5[1], 1, d5[1] * 10), placeLine(d5[2], 2, d5[2])]), true));
  hints.push('소수점 바로 오른쪽이 <b>소수 첫째 자리</b>(0.■), 그다음이 <b>소수 둘째 자리</b>(0.0■)예요.<br>예) 1.76에서 7은 0.7, 6은 0.06을 나타내요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
