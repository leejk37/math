<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (자연수) — 몫이 1보다 작은 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (자연수)를 계산해요 — 몫이 1보다 작은 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나눌 수 없는 자리에는 몫에 0을 써요!</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 1.24 ÷ 2 → 1은 2로 나눌 수 없으니 몫에 <b>0</b> → 0.1이 12개 ÷ 2 = 6 → 0.01이 4개 ÷ 2 = 2 → <b>0.62</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 1.24 ÷ 2 = <sup>124</sup>⁄<sub>100</sub> ÷ 2 = <sup>62</sup>⁄<sub>100</sub> = 0.62</div>
  <div class="rule-line"><span class="rule-tag t4">비교</span> 나누어지는 수가 나누는 수보다 작으면 몫은 1보다 작아요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6133 — (소수) ÷ (자연수), 몫이 1보다 작은 경우 (교과서 6-1-3 62~63쪽, 수학 익힘 40~41쪽)
const f = M.fmt;
const STORY = [
  (a, n) => ({ unit: 'kg', text: `점토 ${f(a, 2)} kg을 ${n}덩어리로 똑같이 나누었습니다. 점토 한 덩어리의 무게는 몇 kg인가요?` }),
  (a, n) => ({ unit: 'L', text: `우유 ${f(a, 2)} L를 ${n}명이 똑같이 나누어 마셨습니다. 한 명이 마신 우유는 몇 L인가요?` }),
  (a, n) => ({ unit: 'm', text: `길이가 ${f(a, 2)} m인 리본을 ${n}도막으로 똑같이 나누었습니다. 한 도막의 길이는 몇 m인가요?` })
];
// 몫 q(10^-pa 단위, 1보다 작음)를 먼저 뽑고 a = q × n.  나누어지는 수는 1보다 크게(교과서와 같이)
function mk(pa, nLo, nHi) {
  return F.gen(() => { const n = M.rand(nLo, nHi), q = pa === 1 ? M.rand(2, 9) : M.rand(11, 99); return { n, q, a: q * n, pa }; },
    o => o.q % 10 !== 0 && o.a % 10 !== 0 && o.a >= M.pow(o.pa) && o.a < o.n * M.pow(o.pa));
}
const ex = (o) => `${f(o.a, o.pa)} ÷ ${o.n}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기
  const p1 = mk(2, 2, 9);
  const s1 = M.pick(STORY)(p1.a, p1.n);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 2)} ÷ ${M.box(p1.n)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`나누어지는 수 ${f(p1.a, 2)}${M.josa(f(p1.a, 2), '이', '가')} 나누는 수 ${p1.n}보다 작으니 몫은 1보다 작아요.<br>${f(p1.a, 2)}${M.josa(f(p1.a, 2), '을', '를')} 가까운 자연수로 어림하여 ${p1.n}(으)로 나누어 보세요.`);

  // 2번: 분수의 나눗셈으로
  const p2 = F.gen(() => mk(2, 3, 9), o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">${ex(p2)}${M.josa(String(p2.n), '을', '를')} 분수의 나눗셈으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${ex(p2)} = ${F.fin(M.box(p2.a), 100)} ÷ ${p2.n} = ${F.fin(M.box(p2.a) + '<span style="margin:0 3px">÷</span>' + p2.n, 100)} = ${F.fin(M.box(p2.q), 100)} = ${M.dbox(p2.q, 2)}</div>`, true));
  hints.push(`${f(p2.a, 2)} = ${M.frac(p2.a, 100, true)} 이에요. 분자를 ${p2.n}(으)로 나누어요.<br>분모가 100인 분수 ${M.frac('□', 100, true)}${M.josa('0', '은', '는')} 소수 두 자리 수 0.□□예요.`);

  // 3번: 세로로 계산하기 (소수 한 자리 수, 소수 두 자리 수)
  const p3a = mk(1, 2, 9), p3b = F.gen(() => mk(2, 3, 9), o => o.a !== p2.a);
  cards.push(M.card(2, `<div class="q-text">세로로 계산해 보세요.</div>` +
    M.line(D.vdiv({ a: p3a.a, pa: 1, n: p3a.n }), D.vdiv({ a: p3b.a, pa: 2, n: p3b.n })), true));
  hints.push(`자연수 부분을 나누는 수로 나눌 수 없으면 몫의 일의 자리에 0을 써요.<br>그다음 0.1이 몇 개인지로 생각하여 이어서 나누어요.`);

  // 4번: 몫이 1보다 작은 나눗셈 모두 고르기
  const small = [mk(1, 3, 9), mk(2, 3, 9)];
  const big = [0, 1].map(() => F.gen(() => { const n = M.rand(2, 6), q = M.rand(11, 49); return { n, q, a: q * n, pa: 1 }; }, o => o.q % 10 && o.a % 10));
  const opts4 = M.shuffle(small.map((o, i) => ['s' + i, ex(o)]).concat(big.map((o, i) => ['b' + i, ex(o)])));
  cards.push(M.card(3, `<div class="q-text">몫이 1보다 작은 나눗셈을 모두 골라 보세요.</div>` + F.multi(opts4, ['s0', 's1'])));
  hints.push(`몫을 다 구하지 않아도 돼요. 나누어지는 수와 나누는 수의 크기를 비교해 보세요.<br>(나누어지는 수) &lt; (나누는 수)이면 몫은 1보다 작아요.`);

  // 5번: 계산하기
  const p5a = mk(1, 2, 9), p5b = F.gen(() => mk(2, 2, 9), o => o.a !== p3b.a);
  cards.push(M.card(4, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.dbox(p5a.q, 1)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.dbox(p5b.q, 2)}</div>`), true));
  hints.push(`몫의 일의 자리에 0을 쓰고, 소수점을 찍은 다음 이어서 나누어요.<br>예) 3.6 ÷ 4 = 0.9,  5.67 ÷ 9 = 0.63`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
