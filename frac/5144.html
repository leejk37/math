<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분모가 같은 분수로 나타내기 (통분)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분모가 같은 분수로 나타내기 (통분)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 통분: 분모가 다른 분수의 분모를 같게 · 공통분모: 통분한 분모</div>
  <div class="rule-line"><span class="rule-tag">곱</span> 두 분모의 곱으로: (3/4, 5/6) → (18/24, 20/24)</div>
  <div class="rule-line"><span class="rule-tag t2">최소</span> 두 분모의 최소공배수로: (3/4, 5/6) → (<b>9/12</b>, <b>10/12</b>) — 수가 작아 계산이 쉬워요</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모에 곱한 수를 분자에도 꼭 곱해요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5144 — 분모가 같은 분수로 나타내기 (통분) (교과서 5-1-4 78~79쪽, 수학익힘 48~49쪽, 성취기준 [6수01-06])
// 진단 포인트: 분모만 바꾸고 분자는 그대로 둠, 공통분모로 두 분모의 공배수가 아닌 수를 고름
const R = M.rand;
M.inlineQuestion = true;
// 두 분모의 최소공배수가 곱보다 작은 두 진분수
function pair() {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && x.d % y.d && y.d % x.d && F.gcd(x.d, y.d) > 1 && F.lcm(x.d, y.d) <= 36);
}
const P2 = (x, y, L) => `<div class="eq">(${F.fr(x.n, x.d)}, ${F.fr(y.n, y.d)}) → (${F.ff(x.n * L / x.d, L)}, ${F.ff(y.n * L / y.d, L)})</div>`;
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 두 분모의 곱으로 통분
  const [x1, y1] = F.gen(pair, ([x, y]) => x.d * y.d <= 60);
  cards.push(M.card(0, `<div class="q-text">두 분모의 <b>곱</b>을 공통분모로 하여 통분해 보세요.</div>` + P2(x1, y1, x1.d * y1.d), true));
  hints.push(`공통분모는 ${x1.d} × ${y1.d}이에요. 각 분수의 분모와 분자에 다른 분수의 분모를 곱해요.`);

  // 2번: 최소공배수로 통분
  const [x2, y2] = pair();
  cards.push(M.card(1, `<div class="q-text">두 분모의 <b>최소공배수</b>를 공통분모로 하여 통분해 보세요.</div>` + P2(x2, y2, F.lcm(x2.d, y2.d)), true));
  hints.push(`${x2.d}과(와) ${y2.d}의 최소공배수를 먼저 구해요. 분모가 몇 배가 되었는지 보고 분자도 같은 만큼 몇 배 해요.`);

  // 3번: 공통분모가 될 수 있는 수 모두 고르기
  const [x3, y3] = pair(), L3 = F.lcm(x3.d, y3.d);
  const c3 = M.shuffle(Array.from(new Set([L3, L3 * 2, L3 * 3, x3.d * 2, y3.d * 2, x3.d + y3.d, L3 + x3.d].filter(v => v <= 120)))).slice(0, 6);
  if (!c3.includes(L3)) c3[0] = L3;
  cards.push(M.card(2, `<div class="q-text">${F.fr(x3.n, x3.d)}와(과) ${F.fr(y3.n, y3.d)}을(를) 통분할 때 공통분모가 될 수 있는 수를 모두 골라 보세요.</div>` +
    F.nums(c3, c3.filter(v => v % L3 === 0)), true));
  hints.push(`공통분모는 ${x3.d}과(와) ${y3.d}의 공배수예요. 두 분모로 모두 나누어떨어지는지 확인해요.`);

  // 4번: 분자 빈칸 (공통분모를 보여 줌)
  const [x4, y4] = pair(), L4 = F.lcm(x4.d, y4.d);
  cards.push(M.card(3, `<div class="q-text">${L4}을(를) 공통분모로 하여 통분해 보세요.</div>` +
    `<div class="eq">(${F.fr(x4.n, x4.d)}, ${F.fr(y4.n, y4.d)}) → (${F.fn(x4.n * L4 / x4.d, L4)}, ${F.fn(y4.n * L4 / y4.d, L4)})</div>`, true));
  hints.push(`${x4.d}에 몇을 곱하면 ${L4}이(가) 되나요? 분자에도 같은 수를 곱해요.`);

  // 5번: 문장제
  const [x5, y5] = pair(), L5 = F.lcm(x5.d, y5.d);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">타코를 만드는 데 토마토를 준서는 ${x5.n}/${x5.d}개, 하은이는 ${y5.n}/${y5.d}개 사용했습니다. 두 사람이 사용한 양을 분모가 가장 작은 같은 분수로 나타내 보세요.</div>` +
    `<div class="eq">준서 ${F.ff(x5.n * L5 / x5.d, L5)} &nbsp; 하은 ${F.ff(y5.n * L5 / y5.d, L5)}</div>`, true));
  hints.push('분모가 가장 작게 되려면 두 분모의 최소공배수로 통분해요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
