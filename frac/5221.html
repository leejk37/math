<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(진분수) × (자연수)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(진분수) × (자연수)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모는 그대로 쓰고, 분자에 자연수를 곱해요</div>
  <div class="rule-line"><span class="rule-tag">덧셈</span> 2/5 × 3 = 2/5 + 2/5 + 2/5 = <b>6/5</b> = 1 1/5</div>
  <div class="rule-line"><span class="rule-tag t2">곱셈</span> 3/8 × 6 = (3 × 6)/8 = 18/8 = <b>2 1/4</b> (약분하고 대분수로)</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모에는 곱하지 않아요. 답은 기약분수(1보다 크면 대분수)로 써요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5221 — (진분수) × (자연수) (교과서 5-2-2 36~37쪽, 수학익힘 26~27쪽, 성취기준 [6수01-10])
// 진단 포인트: 분모와 분자에 모두 자연수를 곱함, 분모에 곱함, 약분·대분수로 고치지 않음
const R = M.rand;
M.inlineQuestion = true;
const X = F.OP['x'], P = F.OP['+'], EQ = '<span class="op">=</span>';
const LP = '<span class="op">(</span>', RP = '<span class="op">)</span>';
const ft = F.ft;
// 조사: 분수는 분자를 마지막에 읽으므로(사분의 삼) 분자로, 자연수는 그 수로 받침을 판단
const J = (s, a, b) => { const t = String(s), k = t.includes('/') ? t.split('/')[0].split(' ').pop() : t; return t + M.josa(k, a, b); };
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 덧셈식으로
  const x1 = F.proper(3, 9), k1 = R(3, 4);
  cards.push(M.card(0, `<div class="q-text">곱셈을 덧셈식으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${F.fr(x1.n, x1.d)}${X}${k1}${EQ}${Array(k1).fill(F.fr(x1.n, x1.d)).join(P)}${EQ}${F.tailN(x1.n * k1, x1.d)}</div>`, true));
  hints.push(`${ft(x1)} × ${J(k1, '은', '는')} ${J(ft(x1), '을', '를')} ${k1}번 더한 것이에요. 분모는 그대로 두고 분자끼리 더해요.`);

  // 2번: 분자에 자연수를 곱하기 (약분이 필요한 수)
  const [x2, k2] = F.gen(() => [F.proper(4, 12), R(2, 9)], ([x, k]) => F.gcd(x.d, k) > 1 && x.n * k <= 60);
  cards.push(M.card(1, `<div class="q-text">분모는 그대로 쓰고 분자에 자연수를 곱하여 계산해 보세요.</div>` +
    `<div class="eq">${F.fr(x2.n, x2.d)}${X}${k2}${EQ}${F.ex(x2.n + ' × ' + k2, x2.d)}${EQ}${F.tailN(x2.n * k2, x2.d)}</div>`, true));
  hints.push('분자 × 자연수를 계산하여 분자에 써요. 약분할 수 있으면 약분하고, 가분수이면 대분수로 바꾸어요.');

  // 3번: 계산 (곱이 1보다 작은 것 1, 큰 것 1)
  const C3 = [F.gen(() => [F.proper(5, 12), R(2, 4)], ([x, k]) => x.n * k < x.d),
              F.gen(() => [F.proper(3, 10), R(3, 9)], ([x, k]) => x.n * k > x.d && x.n * k <= 60)];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([x, k]) => `<div class="qbox">${F.calc(F.fr(x.n, x.d) + X + k, F.mul(x, F.nat(k)))}</div>`)), true));
  hints.push('분모는 그대로, 분자 × 자연수 → 약분 → 가분수면 대분수로');

  // 4번: 문장제
  const [x4, k4] = F.gen(() => [F.proper(3, 9), R(2, 6)], ([x, k]) => x.n * k > x.d);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">한 병에 ${ft(x4)} L씩 들어 있는 보리차가 ${k4}병 있습니다. ${k4}병에 들어 있는 보리차는 모두 몇 L인가요?</div>` +
    `<div class="eq">${F.ans(F.mul(x4, F.nat(k4)))} L</div>`, true));
  hints.push(`${ft(x4)} L씩 ${k4}병이므로 ${ft(x4)} × ${J(k4, '을', '를')} 계산해요.`);

  // 5번: 바르게 계산한 것 고르기 (함정: 분모에도 곱함, 분모에 곱함)
  const [x5, k5] = F.gen(() => [F.proper(3, 9), R(2, 5)], ([x, k]) => x.n * k !== x.d);
  const pre = `${ft(x5)} × ${k5} = `;
  const r5 = pre + F.st(F.mul(x5, F.nat(k5)));
  const w5 = [pre + (x5.n * k5) + '/' + (x5.d * k5), pre + x5.n + '/' + (x5.d * k5)].filter(s => s !== r5);
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` + F.one(r5, w5), true));
  hints.push('(진분수) × (자연수)에서 자연수는 분자에만 곱해요. 분모에 곱하면 분수의 크기가 달라져요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
