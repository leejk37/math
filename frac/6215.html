<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(분수) ÷ (분수)를 (분수) × (분수)로</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(분수) ÷ (분수)를 (분수) × (분수)로 나타내요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나눗셈을 곱셈으로 바꾸고, 나누는 분수의 분자와 분모를 바꾸어요</div>
  <div class="rule-line"><span class="rule-tag">원리</span> <sup>7</sup>⁄<sub>10</sub> ÷ <sup>2</sup>⁄<sub>3</sub> = <sup>7</sup>⁄<sub>10</sub> ÷ 2 × 3 = <sup>7</sup>⁄<sub>10</sub> × <sup>1</sup>⁄<sub>2</sub> × 3 = <sup>7</sup>⁄<sub>10</sub> × <sup>3</sup>⁄<sub>2</sub></div>
  <div class="rule-line"><span class="rule-tag t2">계산</span> <sup>2</sup>⁄<sub>5</sub> ÷ <sup>3</sup>⁄<sub>8</sub> = <sup>2</sup>⁄<sub>5</sub> × <sup>8</sup>⁄<sub>3</sub> = <sup>16</sup>⁄<sub>15</sub> = <b>1<sup>1</sup>⁄<sub>15</sub></b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분자와 분모를 바꾸는 것은 나누는 분수(÷ 뒤)예요. 나누어지는 분수(÷ 앞)는 그대로 두어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6215 — (분수) ÷ (분수)를 (분수) × (분수)로 나타내기 (교과서 6-2-1 20~21쪽, 수학 익힘 18~19쪽, 성취기준 [6수01-11])
// 진단 포인트: 나누어지는 분수를 뒤집음, 나누는 분수를 뒤집지 않고 그대로 곱함
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, X, LP, RP, J, ro } = G;
const sf = G.sf, ft = F.ft;
// 두 분수 (나누는 분수의 분자는 2 이상 — 뒤집었는지가 드러나도록)
const pairGen = (lo, hi) => F.gen(() => [G.proper(lo, hi), G.proper(lo, hi)], ([x, y]) => y.n >= 2 && x.n >= 2 && !F.eq(x, y) && x.d * y.n <= 99 && x.n * y.d <= 99);
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 두 단계 — 통의 c/d를 채우는 양 → 한 통
  const [x1, y1] = F.gen(() => [G.proper(3, 9), G.proper(3, 6)], ([x, y]) => y.n >= 2 && x.d * y.n <= 50);
  const v1 = G.div(x1, G.nat(y1.n));
  cards.push(M.card(0, `<div class="q-text">문제를 읽고 빈칸에 알맞은 수를 써넣으세요.</div>` +
    G.word(`승민이가 주스 ${ft(x1)} L를 빈 통에 담아 보니 통의 ${ft(y1)}이(가) 찼습니다. 한 통을 가득 채울 수 있는 주스는 몇 L인가요?`.replace('이(가)', M.josa(y1.n, '이', '가'))) +
    `<table class="flow">` +
    `<tr><td class="lab">통의 ${sf(1, y1.d)}</td><td><div class="eq">${F.fr(x1.n, x1.d)}${DV}${M.box(y1.n)}${EQ}${F.fr(x1.n, x1.d)}${X}${F.fd(1, y1.n)}${EQ}${F.ans(v1)} (L)</div></td></tr>` +
    `<tr><td class="lab">한 통</td><td><div class="eq">${F.ans(v1)}${X}${M.box(y1.d)}${EQ}${F.ans(G.div(x1, y1))} (L)</div></td></tr>` +
    `<tr><td class="lab">하나의 식으로</td><td><div class="eq">${F.fr(x1.n, x1.d)}${DV}${F.fr(y1.n, y1.d)}${EQ}${F.fr(x1.n, x1.d)}${X}${F.ff(y1.d, y1.n)}${EQ}${F.ans(G.div(x1, y1))}</div></td></tr>` +
    `</table>`, true));
  hints.push(`통의 ${M.frac(y1.n, y1.d, true)}${M.josa(y1.n, '은', '는')} 통의 ${M.frac(1, y1.d, true)}이 ${y1.n}개예요. 먼저 ${ro(y1.n)} 나누어 통의 ${M.frac(1, y1.d, true)}만큼을 구하고, ${y1.d}배를 하면 한 통이에요.`);

  // 2번: ÷ c/d = ÷ c × d = × 1/c × d = × d/c
  const [x2, y2] = pairGen(3, 9);
  cards.push(M.card(1, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    `<div class="eq">${F.fr(x2.n, x2.d)}${DV}${F.fr(y2.n, y2.d)}${EQ}${F.fr(x2.n, x2.d)}${DV}${M.box(y2.n)}${X}${M.box(y2.d)}${EQ}${F.fr(x2.n, x2.d)}${X}${LP}${F.fd(1, y2.n)}${X}${M.box(y2.d)}${RP}</div>` +
    `<div class="eq">${EQ}${F.fr(x2.n, x2.d)}${X}${F.ff(y2.d, y2.n)}${EQ}${F.ans(G.div(x2, y2))}</div>`, true));
  hints.push('÷ (분수)는 분자로 나누고 분모를 곱하는 것과 같아요. ÷ (분자)는 × 1/(분자)이므로, 결국 나누는 분수의 분자와 분모를 바꾸어 곱해요.');

  // 3번: 곱셈으로 나타내어 계산 (2문제)
  const c3 = [pairGen(2, 9), pairGen(3, 11)];
  cards.push(M.card(2, `<div class="q-text">분수의 나눗셈을 분수의 곱셈으로 나타내어 계산해 보세요.</div>` +
    M.line(...c3.map(([x, y]) => `<div class="eq qbox">${F.fr(x.n, x.d)}${DV}${F.fr(y.n, y.d)}${EQ}${F.fr(x.n, x.d)}${X}${F.ff(y.d, y.n)}${EQ}${F.ans(G.div(x, y))}</div>`)), true));
  hints.push('나누는 분수의 분자와 분모를 바꾸어 곱해요. 곱하기 전에 약분할 수 있으면 약분해요.');

  // 4번: 문장제 (평행사변형의 높이 / 몇 배)
  const [x4, y4] = F.gen(() => [G.proper(3, 9), { n: R(5, 26), d: R(7, 27) }], ([x, y]) => y.n < y.d && G.coprime(y.n, y.d) && y.n >= 2 && x.d * y.n <= 200 && !F.eq(x, y));
  const T4 = Math.random() < 0.5
    ? { text: `넓이가 ${ft(x4)} m²인 평행사변형이 있습니다. 밑변의 길이가 ${ft(y4)} m일 때, 높이는 몇 m인가요?`, unit: 'm', hint: '평행사변형의 넓이 = 밑변 × 높이이므로, 높이 = 넓이 ÷ 밑변이에요.' }
    : { text: `참외 한 개의 무게는 ${ft(x4)} kg이고, 사과 한 개의 무게는 ${ft(y4)} kg입니다. 참외 한 개의 무게는 사과 한 개의 무게의 몇 배인가요?`, unit: '배', hint: '"몇 배인가요?"는 기준이 되는 양(사과)으로 나누어요.' };
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 식을 쓰고 답을 구해 보세요.</div>` + G.word(T4.text) +
    M.line(`<div class="eq">식: ${F.ff(x4.n, x4.d)}${DV}${F.ff(y4.n, y4.d)}</div>`, `<div class="eq">답: ${F.ans(G.div(x4, y4))} ${T4.unit}</div>`), true));
  hints.push(T4.hint + '<br>나누는 분수의 분자와 분모를 바꾸어 곱해요.');

  // 5번: 같은 곱셈식 고르기 (함정: 나누어지는 분수를 뒤집음, 뒤집지 않음) + 계산
  const [x5, y5] = pairGen(3, 9);
  const f = (n, d) => sf(n, d);
  cards.push(M.card(4, `<div class="q-text">${sf(x5.n, x5.d)} ÷ ${sf(y5.n, y5.d)}${M.josa(y5.n, '과', '와')} 계산 결과가 같은 곱셈식을 고르고, 몫을 구해 보세요.</div>` +
    F.one(`${f(x5.n, x5.d)} × ${f(y5.d, y5.n)}`, [`${f(x5.d, x5.n)} × ${f(y5.n, y5.d)}`, `${f(x5.n, x5.d)} × ${f(y5.n, y5.d)}`]) +
    `<div class="eq">${F.fr(x5.n, x5.d)}${DV}${F.fr(y5.n, y5.d)}${EQ}${F.ans(G.div(x5, y5))}</div>`, true));
  hints.push('나눗셈을 곱셈으로 바꿀 때는 ÷ 뒤의 분수(나누는 분수)만 분자와 분모를 바꾸어요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
