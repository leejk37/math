<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>

<title>소수만큼 색칠하기</title>
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
    color: #222;
  }
  h2 { font-size: 19px; margin-bottom: 24px; }

  .board {
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
  }
  .item {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .label-box {
    border-radius: 16px;
    padding: 18px 16px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 4px;
  }
  svg { display: block; }
  .piece { cursor: pointer; }

  .controls {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .check-btn { background: #6a5acd; color: #fff; }
  .check-btn:hover { background: #5a4bb8; }
  .reset-btn { background: #eee; color: #555; }
  .reset-btn:hover { background: #ddd; }
  .feedback {
    min-height: 20px;
    font-size: 14px;
    font-weight: bold;
    margin-top: 14px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .section {
    margin-bottom: 40px;
    padding-bottom: 30px;
    border-bottom: 2px dashed #ddd;
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .section-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #6a5acd;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
  }
  .sub-instruction {
    font-size: 15px;
    color: #555;
    margin-bottom: 18px;
  }

  /* 문제 2: 가로 수막대 */
  .h-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .h-label-box {
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 17px;
    font-weight: bold;
    color: #333;
    background: #e4e4ea;
    min-width: 40px;
    text-align: center;
  }
  .tick-row {
    position: relative;
    height: 18px;
  }
  .tick-row span {
    position: absolute;
    font-size: 13px;
    color: #333;
    transform: translateX(-50%);
  }

  .sentence2 {
    font-size: 16px;
    line-height: 2.4;
    margin-top: 10px;
  }
  .count-input2 {
    width: 44px;
    height: 32px;
    font-size: 15px;
    text-align: center;
    border: 2px solid #7ec8e3;
    border-radius: 6px;
    box-sizing: border-box;
  }
  .decimal-answer-input {
    width: 60px;
    height: 32px;
    font-size: 15px;
    text-align: center;
    border: 2px solid #7ec8e3;
    border-radius: 6px;
    box-sizing: border-box;
  }

  /* 4~5번: 소수 크기 비교 (빈 원에 부등호/등호 입력) */
  .compare-row {
    display: flex;
    gap: 50px;
    flex-wrap: wrap;
    font-size: 18px;
    align-items: center;
    margin-bottom: 10px;
  }
  .compare-pair {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .op-circle-input {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #7ec8e3;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: #fff;
    box-sizing: border-box;
  }
  .op-mini-group {
    display: flex;
    gap: 4px;
  }
  .op-mini-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #7ec8e3;
    background: #fff;
    color: #333;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .op-mini-btn:hover { background: #eef8fc; }
  .op-mini-btn.selected {
    background: #7ec8e3;
    color: #fff;
  }
  .op-mini-dropdown {
    font-size: 15px;
    font-weight: bold;
    border: 2px solid #7ec8e3;
    border-radius: 8px;
    padding: 6px 8px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .global-check-btn {
    background: #e05656;
  }
  .global-check-btn:hover { background: #c94848; }

  /* 전체 확인 시 문제별 정답/오답 테두리 표시 */
  .section.section-correct {
    border: 3px solid #2e9e44;
  }
  .section.section-wrong {
    border: 3px solid #e05656;
  }
</style>

<body>

<div class="section" id="section1">
  <div class="section-title"><span class="section-badge">1</span><span id="title">0.9와 0.7만큼 각각 색칠하고, 크기를 비교해 보세요.</span></div>

  <div class="board" id="board"></div>

  <div class="feedback" id="feedback"></div>
</div>

<div class="section" id="section2">
  <div class="section-title"><span class="section-badge">2</span><span id="title2">1.7과 2.1의 크기를 비교해 봅시다.</span></div>
  <div class="sub-instruction">0.1이 몇 개인지 세어 비교해 보세요.</div>

  <div id="board2"></div>

  <div class="sentence2" id="sentence2"></div>

  <div class="feedback" id="feedback2"></div>
</div>

<div class="section" id="section3">
  <div class="section-title"><span class="section-badge">3</span><span id="title3">얼마만큼의 수인지 알아보고 비교해 보세요.</span></div>

  <div id="board3"></div>

  <div class="sentence2" id="sentence3"></div>

  <div class="feedback" id="feedback3"></div>
</div>

<div class="section" id="section4">
  <div class="section-title"><span class="section-badge">4</span><span>두 소수의 크기를 비교하여 ○ 안에 &gt;, =, &lt; 중 알맞은 것을 써넣어 봅시다.</span></div>

  <div class="compare-row" id="compareRow4"></div>

  <div class="feedback" id="feedback4"></div>
</div>

<div class="section" id="section5">
  <div class="section-title"><span class="section-badge">5</span><span>두 소수의 크기를 비교하여 ○ 안에 &gt;, =, &lt; 중 알맞은 것을 써넣어 봅시다.</span></div>

  <div class="compare-row" id="compareRow5"></div>

  <div class="feedback" id="feedback5"></div>
</div>

<div class="controls" style="margin-top: 10px;">
  <button class="btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="btn reset-btn" id="newAllBtn">새 문제</button>
  <span id="allSummary" style="font-size: 15px; font-weight: bold;"></span>
</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomDistinctPair(min, max) {
  const a = randomInt(min, max);
  let b = randomInt(min, max);
  while (b === a) b = randomInt(min, max);
  return [a, b];
}

const LABEL_COLORS = ['#d7ecd2', '#dcd6f2']; // 지환(초록), 깨비(보라) 느낌의 파스텔 색
const FILL_COLORS = ['#bfe0ff', '#d3cbee'];

// 세로 수막대: 10칸, 아래(0)에서부터 위(1)로 채워짐
function makeVerticalBar(color) {
  let filledCount = 0; // 아래에서부터 채워진 칸 수
  const w = 70, h = 220, x0 = 6, y0 = 6;
  const innerW = w - 12, innerH = h - 12;
  const cellH = innerH / 10;

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', w + 40);
  svg.setAttribute('height', h + 12);
  svg.setAttribute('viewBox', `0 0 ${w + 40} ${h + 12}`);

  const pieces = [];

  function updateVisual() {
    // 아래에서부터 filledCount칸을 채운다 (인덱스 0 = 맨 아래 칸)
    pieces.forEach((p, idx) => {
      p.setAttribute('fill', idx < filledCount ? color : '#ffffff');
    });
  }

  // 칸은 위에서부터 그리되(그림 좌표), 클릭 시 "아래에서부터 몇 번째 칸인지"로 환산
  for (let row = 0; row < 10; row++) {
    const idxFromBottom = 9 - row; // 0 = 맨 아래
    const y = y0 + row * cellH;
    const piece = el('rect', { x: x0, y, width: innerW, height: cellH, fill: '#ffffff', class: 'piece' });
    piece.addEventListener('click', () => {
      // 아래에서부터 idxFromBottom번째 칸까지 채우거나, 이미 채워졌으면 그 칸부터 위쪽을 지움
      if (idxFromBottom < filledCount) {
        filledCount = idxFromBottom;
      } else {
        filledCount = idxFromBottom + 1;
      }
      updateVisual();
    });
    svg.appendChild(piece);
    pieces.push(null); // placeholder, 아래에서 순서 맞춰 채움
  }
  // pieces 배열을 "아래에서부터" 순서로 재구성
  const childRects = Array.from(svg.querySelectorAll('rect'));
  for (let row = 0; row < 10; row++) {
    const idxFromBottom = 9 - row;
    pieces[idxFromBottom] = childRects[row];
  }

  // 테두리
  svg.appendChild(el('rect', { x: x0, y: y0, width: innerW, height: innerH, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
  // 내부 구분선 (점선)
  for (let row = 1; row < 10; row++) {
    const y = y0 + row * cellH;
    svg.appendChild(el('line', { x1: x0, y1: y, x2: x0 + innerW, y2: y, stroke: '#333', 'stroke-width': 1.2, 'stroke-dasharray': '4,3', 'pointer-events': 'none' }));
  }

  // "1"(맨 위), "0"(맨 아래) 라벨 - 막대 오른쪽
  const t1 = document.createElementNS(svgNS, 'text');
  t1.setAttribute('x', x0 + innerW + 8); t1.setAttribute('y', y0 + 5);
  t1.setAttribute('font-size', '14'); t1.textContent = '1';
  svg.appendChild(t1);

  const t0 = document.createElementNS(svgNS, 'text');
  t0.setAttribute('x', x0 + innerW + 8); t0.setAttribute('y', y0 + innerH + 5);
  t0.setAttribute('font-size', '14'); t0.textContent = '0';
  svg.appendChild(t0);

  // "0.1" 라벨은 맨 아래 칸 안쪽 정중앙에 표시
  const bottomLabel = document.createElementNS(svgNS, 'text');
  bottomLabel.setAttribute('x', x0 + innerW / 2);
  bottomLabel.setAttribute('y', y0 + innerH - cellH / 2 + 5);
  bottomLabel.setAttribute('text-anchor', 'middle');
  bottomLabel.setAttribute('font-size', '13');
  bottomLabel.setAttribute('pointer-events', 'none');
  bottomLabel.textContent = '0.1';
  svg.appendChild(bottomLabel);

  return {
    svg,
    getShadedCount: () => filledCount,
    resetShading: () => { filledCount = 0; updateVisual(); }
  };
}

function makeItem(colorIdx) {
  const wrapper = document.createElement('div');
  wrapper.className = 'item';

  const label = document.createElement('div');
  label.className = 'label-box';
  label.style.background = LABEL_COLORS[colorIdx];

  const bar = makeVerticalBar(FILL_COLORS[colorIdx]);

  wrapper.appendChild(label);
  wrapper.appendChild(bar.svg);

  return { wrapper, label, bar };
}

/* ===================== 초기화 ===================== */
const board = document.getElementById('board');
const titleEl = document.getElementById('title');
const feedbackEl = document.getElementById('feedback');

const item1 = makeItem(0);
const item2 = makeItem(1);
board.appendChild(item1.wrapper);
board.appendChild(item2.wrapper);

let k1, k2;

function newProblem() {
  [k1, k2] = randomDistinctPair(1, 9);
  item1.label.textContent = '0.' + k1;
  item2.label.textContent = '0.' + k2;
  item1.bar.resetShading();
  item2.bar.resetShading();
  titleEl.textContent = `0.${k1}과 0.${k2}만큼 각각 색칠하고, 크기를 비교해 보세요.`;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
}
newProblem();

function checkProblem1() {
  const ok1 = item1.bar.getShadedCount() === k1;
  const ok2 = item2.bar.getShadedCount() === k2;
  const correct = ok1 && ok2;
  feedbackEl.textContent = correct ? '정답이에요! 👏' : '색칠한 칸 수를 다시 확인해 볼까요?';
  feedbackEl.className = correct ? 'feedback correct' : 'feedback wrong';
  return correct;
}
// 개별 확인/새 문제 버튼은 제거되었고, 아래 전체 버튼에서 한 번에 처리합니다.

/* ===================== 문제 2: 가로 수막대(0~3)로 두 소수 비교 ===================== */
function blockNonNatural(inp) {
  inp.addEventListener('keydown', (e) => {
    if (['-', '.', 'e', 'E', '+', ' '].includes(e.key)) e.preventDefault();
  });
}
function isNaturalNumber(raw) {
  if (raw === '' || raw === undefined) return false;
  const n = Number(raw);
  return Number.isInteger(n) && n >= 0;
}
// "1.7" 같은 [정수부 한 자리].[소수부 한 자리] 형식인지 확인
function isOneDigitDecimal(raw) {
  return /^\d\.\d$/.test(raw.trim());
}

const H_FILL_COLORS = ['#bfe0ff', '#d3cbee'];
const TOTAL_SEGMENTS = 30; // 0~3, 0.1칸 30개

// 가로 수막대: 0~3 범위, 30칸, 왼쪽부터 채워짐
function makeHorizontalBar(color) {
  let filledCount = 0;
  const segW = 14, segH = 34, x0 = 6, y0 = 6;
  const innerW = segW * TOTAL_SEGMENTS, innerH = segH;

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', innerW + 12);
  svg.setAttribute('height', innerH + 30);
  svg.setAttribute('viewBox', `0 0 ${innerW + 12} ${innerH + 30}`);

  const pieces = [];

  function updateVisual() {
    pieces.forEach((p, idx) => p.setAttribute('fill', idx < filledCount ? color : '#ffffff'));
  }

  for (let i = 0; i < TOTAL_SEGMENTS; i++) {
    const x = x0 + i * segW;
    const piece = el('rect', { x, y: y0, width: segW, height: innerH, fill: '#ffffff', class: 'piece' });
    piece.addEventListener('click', () => {
      if (i < filledCount) filledCount = i;
      else filledCount = i + 1;
      updateVisual();
    });
    svg.appendChild(piece);
    pieces.push(piece);
  }

  svg.appendChild(el('rect', { x: x0, y: y0, width: innerW, height: innerH, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
  for (let i = 1; i < TOTAL_SEGMENTS; i++) {
    const x = x0 + i * segW;
    svg.appendChild(el('line', { x1: x, y1: y0, x2: x, y2: y0 + innerH, stroke: '#333', 'stroke-width': 1, 'stroke-dasharray': '3,2', 'pointer-events': 'none' }));
  }

  // "0.1" 라벨: 맨 왼쪽 칸 안쪽
  const firstLabel = document.createElementNS(svgNS, 'text');
  firstLabel.setAttribute('x', x0 + segW / 2);
  firstLabel.setAttribute('y', y0 + innerH / 2 + 4);
  firstLabel.setAttribute('text-anchor', 'middle');
  firstLabel.setAttribute('font-size', '9');
  firstLabel.setAttribute('pointer-events', 'none');
  firstLabel.textContent = '0.1';
  svg.appendChild(firstLabel);

  // 0, 1, 2, 3 눈금 라벨 (막대 아래)
  [0, 1, 2, 3].forEach(n => {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x0 + n * 10 * segW);
    t.setAttribute('y', y0 + innerH + 18);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '13');
    t.textContent = n;
    svg.appendChild(t);
  });

  return {
    svg,
    getShadedCount: () => filledCount,
    resetShading: () => { filledCount = 0; updateVisual(); }
  };
}

function makeHItem(colorIdx) {
  const wrapper = document.createElement('div');
  wrapper.className = 'h-item';

  const label = document.createElement('div');
  label.className = 'h-label-box';

  const bar = makeHorizontalBar(H_FILL_COLORS[colorIdx]);

  wrapper.appendChild(label);
  wrapper.appendChild(bar.svg);

  return { wrapper, label, bar };
}

const board2 = document.getElementById('board2');
const title2El = document.getElementById('title2');
const sentence2El = document.getElementById('sentence2');
const feedback2El = document.getElementById('feedback2');

const hItem1 = makeHItem(0);
const hItem2 = makeHItem(1);
board2.appendChild(hItem1.wrapper);
board2.appendChild(hItem2.wrapper);

const count1Input = document.createElement('input');
count1Input.type = 'text'; count1Input.inputMode = 'numeric'; count1Input.className = 'count-input2';
blockNonNatural(count1Input);

const count2Input = document.createElement('input');
count2Input.type = 'text'; count2Input.inputMode = 'numeric'; count2Input.className = 'count-input2';
blockNonNatural(count2Input);

const biggerAnswerInput = document.createElement('input');
biggerAnswerInput.type = 'text'; biggerAnswerInput.className = 'decimal-answer-input'; biggerAnswerInput.placeholder = '0.0';
biggerAnswerInput.addEventListener('keydown', (e) => {
  const allowedKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'];
  if (allowedKeys.includes(e.key)) return;
  if (!/[0-9.]/.test(e.key)) e.preventDefault();
});

let dec1, dec2, tenths1, tenths2, decimalStr1, decimalStr2, biggerStr;

function buildSentence2() {
  sentence2El.innerHTML = '';
  sentence2El.appendChild(document.createTextNode(`${decimalStr1}은 0.1이 `));
  sentence2El.appendChild(count1Input);
  sentence2El.appendChild(document.createTextNode(`개이고 ${decimalStr2}은 0.1이 `));
  sentence2El.appendChild(count2Input);
  sentence2El.appendChild(document.createTextNode('개입니다.'));

  const line2 = document.createElement('div');
  line2.appendChild(document.createTextNode('따라서 0.1의 개수가 더 많은 '));
  line2.appendChild(biggerAnswerInput);
  line2.appendChild(document.createTextNode('이 더 큽니다.'));
  sentence2El.appendChild(line2);
}

function newProblem2() {
  // 1.1~1.9, 2.1~2.9 범위의 소수를 각각 하나씩 생성
  const d1 = randomInt(1, 9);
  const d2 = randomInt(1, 9);
  decimalStr1 = '1.' + d1;
  decimalStr2 = '2.' + d2;
  tenths1 = 10 + d1; // 1.d1 -> 0.1이 (10+d1)개
  tenths2 = 20 + d2; // 2.d2 -> 0.1이 (20+d2)개
  biggerStr = tenths1 > tenths2 ? decimalStr1 : decimalStr2; // 2.x가 항상 더 크지만 일반화해서 계산

  hItem1.label.textContent = decimalStr1;
  hItem2.label.textContent = decimalStr2;
  hItem1.bar.resetShading();
  hItem2.bar.resetShading();

  title2El.textContent = `${decimalStr1}과 ${decimalStr2}의 크기를 비교해 봅시다.`;
  buildSentence2();
  count1Input.value = ''; count2Input.value = ''; biggerAnswerInput.value = '';
  feedback2El.textContent = ''; feedback2El.className = 'feedback';
}
newProblem2();

function checkProblem2() {
  const wrongParts = [];

  const shade1ok = hItem1.bar.getShadedCount() === tenths1;
  const shade2ok = hItem2.bar.getShadedCount() === tenths2;
  if (!shade1ok || !shade2ok) wrongParts.push('색칠');

  const c1ok = isNaturalNumber(count1Input.value.trim()) && Number(count1Input.value.trim()) === tenths1;
  if (!c1ok) wrongParts.push('첫 번째 개수 빈칸');

  const c2ok = isNaturalNumber(count2Input.value.trim()) && Number(count2Input.value.trim()) === tenths2;
  if (!c2ok) wrongParts.push('두 번째 개수 빈칸');

  const ansOk = isOneDigitDecimal(biggerAnswerInput.value) && biggerAnswerInput.value.trim() === biggerStr;
  if (!ansOk) wrongParts.push('마지막 빈칸');

  const correct = wrongParts.length === 0;
  feedback2El.textContent = correct ? '정답이에요! 👏' : `다시 확인해 볼까요? (${wrongParts.join(', ')})`;
  feedback2El.className = correct ? 'feedback correct' : 'feedback wrong';
  return correct;
}
// 개별 버튼 제거 (전체 버튼에서 처리)

/* ===================== 문제 3: 수직선 위에 점을 표시해 두 소수 비교 ===================== */
// 수직선(0~3)을 그리고, 주어진 값 위치에 화살표(점)를 표시 (클릭 불가, 정적 그림)
function makeNumberLineDiagram(value) {
  const totalUnits = 3;
  const pxPerUnit = 140;
  const w = totalUnits * pxPerUnit, x0 = 10, y0 = 40;
  const svgH = 78; // 아래쪽 정수 라벨(0,1,2,3)이 잘리지 않도록 충분한 높이 확보

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', w + 20);
  svg.setAttribute('height', svgH);
  svg.setAttribute('viewBox', `0 0 ${w + 20} ${svgH}`);

  // 기준선
  svg.appendChild(el('line', { x1: x0, y1: y0, x2: x0 + w, y2: y0, stroke: '#333', 'stroke-width': 1.5 }));

  // 0.1 단위 눈금 (30개) + 정수 단위(0,1,2,3) 큰 눈금
  for (let i = 0; i <= totalUnits * 10; i++) {
    const x = x0 + (i / 10) * pxPerUnit;
    const isMajor = i % 10 === 0;
    svg.appendChild(el('line', {
      x1: x, y1: y0 - (isMajor ? 8 : 4), x2: x, y2: y0 + (isMajor ? 8 : 4),
      stroke: '#333', 'stroke-width': isMajor ? 1.5 : 1
    }));
  }

  // 정수 라벨 0,1,2,3 (기준선 아래, 잘리지 않도록 y0+24 위치, svgH가 충분히 커서 안전)
  for (let n = 0; n <= totalUnits; n++) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x0 + n * pxPerUnit);
    t.setAttribute('y', y0 + 24);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '13');
    t.textContent = n;
    svg.appendChild(t);
  }

  // "0.1" 위치를 화살표(작은 삼각형)로 표시 + 그 아래 "0.1" 글자 라벨
  const zeroOneX = x0 + pxPerUnit / 10;
  const zeroOneArrow = el('polygon', {
    points: `${zeroOneX - 4},${y0 - 18} ${zeroOneX + 4},${y0 - 18} ${zeroOneX},${y0 - 10}`,
    fill: '#4a90d9'
  });
  svg.appendChild(zeroOneArrow);

  const t01 = document.createElementNS(svgNS, 'text');
  t01.setAttribute('x', zeroOneX);
  t01.setAttribute('y', y0 - 22);
  t01.setAttribute('text-anchor', 'middle');
  t01.setAttribute('font-size', '11');
  t01.setAttribute('fill', '#4a90d9');
  t01.textContent = '0.1';
  svg.appendChild(t01);

  // 값 위치에 화살표(삼각형) 표시
  const px = x0 + value * pxPerUnit;
  const arrow = el('polygon', {
    points: `${px - 5},${y0 - 22} ${px + 5},${y0 - 22} ${px},${y0 - 12}`,
    fill: '#e05656'
  });
  svg.appendChild(arrow);

  return svg;
}

/* ===================== 모든 입력칸: 완료되면 자동으로 다음 칸으로 이동 ===================== */
// 입력이 최대 자릿수에 도달하면 다음 칸으로, 비어 있는 상태에서 백스페이스를 누르면
// 이전 칸으로 돌아가며 내용을 블록 선택(바로 덮어쓰기 가능)하도록 하는 체이닝 유틸
function chainInputs(inputs) {
  for (let i = 0; i < inputs.length; i++) {
    const cur = inputs[i];
    const next = inputs[i + 1];
    const prev = inputs[i - 1];

    if (next) {
      cur.addEventListener('input', () => {
        if (cur.value.length >= cur.maxLength) next.focus();
      });
    }
    if (prev) {
      cur.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && cur.value === '') {
          prev.focus();
          prev.select();
        }
      });
    }
  }
}

/* ===================== 문제 4, 5: 두 소수의 크기 비교 (○ 안에 >, =, < 입력) ===================== */
// 정수부 1자리(0~9) + 소수부 1자리(0~9) 형태의 소수를 무작위 생성
function randomOneDigitDecimal() {
  const intPart = randomInt(0, 9);
  const fracPart = randomInt(0, 9);
  return intPart + fracPart / 10;
}
function formatOneDigitDecimal(v) {
  return v.toFixed(1);
}
function correctCompareOperator(a, b) {
  if (a > b) return '>';
  if (a < b) return '<';
  return '=';
}

function makeCompareOperatorSelector() {
  const select = document.createElement('select');
  select.className = 'op-mini-dropdown';

  const placeholderOpt = document.createElement('option');
  placeholderOpt.value = '';
  placeholderOpt.textContent = '기호';
  placeholderOpt.disabled = true;
  placeholderOpt.selected = true;
  select.appendChild(placeholderOpt);

  ['<', '=', '>'].forEach(sym => {
    const opt = document.createElement('option');
    opt.value = sym;
    opt.textContent = sym;
    select.appendChild(opt);
  });

  return {
    wrap: select,
    getSelected: () => select.value || null,
    reset: () => { select.value = ''; }
  };
}

// 두 정수의 차이가 정확히 diff가 되도록 [min, max] 범위 안에서 생성 (순서는 무작위)
function randomIntPairWithDiff(min, max, diff) {
  const base = randomInt(min, max - diff);
  return Math.random() < 0.5 ? [base + diff, base] : [base, base + diff];
}

// 각 쌍의 유형에 따라 소수 두 개를 생성 (차이가 너무 크면 변별력이 없으므로 1~2 범위로 제한)
// i=0: "0.몇" 형태 (정수부 0, 소수부만 다름)
// i=1: 일의 자리(정수부)가 서로 다르되, 그 차이는 1~2
// i=2: 일의 자리(정수부)는 같고, 소수 첫째 자리의 차이가 1~2
function generateComparePair(i) {
  if (i === 0) {
    const [f1, f2] = randomDistinctPair(0, 9);
    return { a: f1 / 10, b: f2 / 10 };
  } else if (i === 1) {
    const diff = randomInt(1, 2);
    const [int1, int2] = randomIntPairWithDiff(0, 9, diff);
    const f1 = randomInt(0, 9), f2 = randomInt(0, 9);
    return { a: int1 + f1 / 10, b: int2 + f2 / 10 };
  } else {
    const intPart = randomInt(0, 9);
    const diff = randomInt(1, 2);
    const [f1, f2] = randomIntPairWithDiff(0, 9, diff);
    return { a: intPart + f1 / 10, b: intPart + f2 / 10 };
  }
}

function makeCompareProblem(rowId, feedbackId) {
  const row = document.getElementById(rowId);
  const feedback = document.getElementById(feedbackId);

  const PAIR_COUNT = 3;
  let values = []; // [{a, b, opInput}, ...]

  function build() {
    row.innerHTML = '';
    values = [];
    for (let i = 0; i < PAIR_COUNT; i++) {
      const { a, b } = generateComparePair(i);
      const pair = document.createElement('div');
      pair.className = 'compare-pair';

      const aText = document.createElement('span');
      aText.textContent = formatOneDigitDecimal(a);

      const opSelector = makeCompareOperatorSelector();

      const bText = document.createElement('span');
      bText.textContent = formatOneDigitDecimal(b);

      pair.appendChild(aText);
      pair.appendChild(opSelector.wrap);
      pair.appendChild(bText);
      row.appendChild(pair);

      values.push({ a, b, opSelector });
    }
  }
  build();

  function check() {
    let allCorrect = true;
    let filledAll = true;
    values.forEach(v => {
      const val = v.opSelector.getSelected();
      if (!val) filledAll = false;
      else if (val !== correctCompareOperator(v.a, v.b)) allCorrect = false;
    });

    if (!filledAll) {
      feedback.textContent = '모든 ○ 안에 >, =, < 중 하나를 선택해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    feedback.textContent = allCorrect ? '정답이에요! 👏' : '다시 한 번 확인해 볼까요?';
    feedback.className = allCorrect ? 'feedback correct' : 'feedback wrong';
    return allCorrect;
  }

  function regenerate() {
    build();
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  return { check, regenerate };
}
