<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수의 크기 비교</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">소수의 크기 비교</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 0.1이 몇 개인지 세어 소수의 크기를 비교해요</div>
  <div class="rule-line"><span class="rule-tag">개수</span> 1.5는 0.1이 15개, 2.1은 0.1이 21개 → <b>1.5 &lt; 2.1</b></div>
  <div class="rule-line"><span class="rule-tag t2">순서</span> 소수점 왼쪽 수를 먼저 비교하고, 같으면 소수점 오른쪽 수를 비교해요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3169 — 소수의 크기 비교 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 소수점 오른쪽 숫자만 보고 비교함(1.7 < 0.9라고 생각), 0.1의 개수로 바꾸지 못함
M.inlineQuestion = true;
const f1 = v => M.fmt(v, 1);
// 0.1 단위 수 두 개 (서로 다름, 자연수 제외)
function tenth(lo, hi) { let v; do { v = M.rand(lo, hi); } while (v % 10 === 0); return v; }
function two(lo, hi, test) { let a, b; do { a = tenth(lo, hi); b = tenth(lo, hi); } while (a === b || (test && !test(a, b))); return [a, b]; }
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 세로 막대에 색칠하고 비교 (1보다 작은 소수)
  const [a1, b1] = two(1, 9);
  cards.push(M.card(0, `<div class="q-text">0.${a1}과 0.${b1}만큼 각각 색칠하고, 크기를 비교해 보세요.</div>`.replace(`0.${a1}과`, `0.${a1}${M.josa(a1, '과', '와')}`) +
    `<div class="row" style="gap:50px;align-items:flex-end"><div style="text-align:center"><div class="eq">0.${a1}</div>${M.barPick(a1, true)}</div>` +
    `<div style="text-align:center"><div class="eq">0.${b1}</div>${M.barPick(b1, true)}</div></div>` +
    `<div class="cmp-row">0.${a1}${M.cmp(a1, b1)}0.${b1}</div>`, true));
  hints.push('아래 칸부터 눌러서 색칠해요. 한 칸이 0.1이에요. 더 높이 색칠된 쪽이 더 커요.');

  // 2번: 0.1의 개수로 비교
  const [a2, b2] = two(11, 39, (a, b) => Math.floor(a / 10) !== Math.floor(b / 10));
  cards.push(M.card(1, `<div class="q-text">0.1이 몇 개인지 세어 크기를 비교해 보세요.</div>` +
    `<div class="eq" style="font-size:18px">${f1(a2)}${M.josa(a2, '은', '는')} 0.1이 ${M.box(a2)}개, &nbsp;${f1(b2)}${M.josa(b2, '은', '는')} 0.1이 <span class="tail">${M.box(b2)}개</span></div>` +
    `<div class="cmp-row">${f1(a2)}${M.cmp(a2, b2)}${f1(b2)}</div>`, true));
  hints.push('2.3은 0.1이 23개예요. 소수점을 빼고 읽은 수가 0.1의 개수예요.');

  // 3번: 수직선에 나타낸 두 소수
  const [a3, b3] = two(1, 29, (a, b) => Math.abs(a - b) >= 4);
  cards.push(M.card(2, `<div class="q-text">수직선에 나타낸 두 소수를 읽고 크기를 비교해 보세요.</div>` +
    M.lineSvg({ start: 0, unit: 1, p: 1, ticks: 30, major: 10, mid: 5, trim: true, arrows: [{ at: a3, color: '#2563eb', label: '㉠' }, { at: b3, color: '#ea580c', label: '㉡' }] }) +
    `<div class="eq" style="font-size:18px">㉠ ${M.dbox(a3, 1, true)} &nbsp; ㉡ <span class="tail">${M.dbox(b3, 1, true)}</span></div>` +
    `<div class="cmp-row">㉠${M.cmp(a3, b3)}㉡</div>`, true));
  hints.push('수직선에서는 <b>오른쪽</b>에 있는 수가 더 커요. 작은 눈금 한 칸은 0.1이에요.');

  // 4번: 크기 비교 (3쌍) — 소수점 오른쪽 숫자만 보면 틀리는 쌍 포함
  const tricky = (() => { let a, b; do { a = tenth(11, 59); b = tenth(1, 9); } while (a % 10 >= b); return M.pick([[a, b], [b, a]]); })();
  const c4 = M.shuffle([tricky, two(1, 59), two(11, 99, (a, b) => Math.floor(a / 10) === Math.floor(b / 10))]);
  cards.push(M.card(3, `<div class="q-text">두 소수의 크기를 비교하여 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    M.line(...c4.map(([a, b]) => `<div class="qbox"><div class="cmp-row">${f1(a)}${M.cmp(a, b)}${f1(b)}</div></div>`)), true));
  hints.push('소수점 왼쪽 수(자연수 부분)를 먼저 비교해요. 같을 때만 소수점 오른쪽 수를 비교해요.');

  // 5번: 문장제
  const [a5, b5] = two(5, 25, (a, b) => Math.floor(a / 10) !== Math.floor(b / 10));
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 골라 보세요.</div>` +
    `<div class="word">빨간 리본은 ${f1(a5)} m, 파란 리본은 ${f1(b5)} m입니다. 더 긴 리본은 어느 것인가요?</div>` +
    M.choices(a5 > b5 ? 0 : 1, [[0, '빨간 리본'], [1, '파란 리본']]), true));
  hints.push('두 소수의 크기를 비교해요. 소수점 왼쪽 수부터 비교해요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
