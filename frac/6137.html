<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>어림셈으로 몫의 소수점 위치 확인하기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">어림셈한 결과를 이용하여 몫의 소수점 위치를 확인해 보아요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 먼저 어림하고, 어림한 값에 가깝게 소수점을 찍어요!</div>
  <div class="rule-line"><span class="rule-tag">어림</span> 21.8 ÷ 4 → 21.8을 약 22로 어림하면 22 ÷ 4 → 약 5</div>
  <div class="rule-line"><span class="rule-tag t3">확인</span> 몫의 숫자가 5, 4, 5이면 5에 가까운 <b>5.45</b>가 알맞아요. (545, 54.5는 너무 커요)</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 어림할 때는 나누어지는 수를 나누기 쉬운 가까운 자연수로 바꾸어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6137 — 어림셈한 결과를 이용하여 몫의 소수점 위치 확인하기 (교과서 6-1-3 70~71쪽, 수학 익힘 48~49쪽)
const f = M.fmt, f0 = M.fmt0;
// 몫 q(10^-qp 단위)를 먼저 뽑고 a = q × n ÷ 10^(qp−pa) (정수여야 함).  몫의 숫자가 2~3개가 되도록
function mk(pa, qp, qLo, qHi, nLo, nHi, test) {
  return F.gen(() => {
    const n = M.rand(nLo || 2, nHi || 9), q = M.rand(qLo, qHi);
    return { n, q, qp, pa, a: q * n / M.pow(qp - pa) };
  }, o => Number.isInteger(o.a) && o.a % 10 !== 0 && o.q % 10 !== 0 && (!test || test(o)));
}
const ex = (o) => `${f(o.a, o.pa)} ÷ ${o.n}`;
const val = (o) => o.q / M.pow(o.qp);
// 소수점 위치만 다른 보기 글자 (k > 0: 10^k배, k < 0: 1/10^k배)
const shifted = (o, k) => f0(o.q * M.pow(Math.max(0, k)), o.qp + Math.max(0, -k));

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 어림셈한 결과를 이용하여 옳은 식 찾기 (21.8 ÷ 4 = 5.45)
  const p1 = mk(1, 2, 111, 999, 3, 8);
  const one1 = F.one(`${ex(p1)} = ${f0(p1.q, 2)}`, [`${ex(p1)} = ${shifted(p1, 1)}`, `${ex(p1)} = ${shifted(p1, 2)}`]);
  cards.push(M.card(0, `<div class="q-text">어림셈한 결과를 이용하여 옳은 식을 찾아 보세요.</div>` +
    `<div class="eq" style="font-size:18px">${f(p1.a, 1)}${M.josa(f(p1.a, 1), '을', '를')} 가까운 자연수로 어림하면 몫은 ${D.est(p1.q, 2, '')}</div>` + one1, true));
  hints.push(`${f(p1.a, 1)}${M.josa(f(p1.a, 1), '은', '는')} 약 ${Math.round(p1.a / 10)}예요. ${Math.round(p1.a / 10)} ÷ ${p1.n}의 몫은 얼마쯤인지 생각해 보세요.<br>어림한 몫과 가장 가까운 식이 옳은 식이에요.`);

  // 2번: 식 → 어림셈 → 몫에 소수점 찍기 (두 개)
  const p2a = mk(1, 2, 101, 999, 3, 9, o => Math.floor(o.q / 10) % 10 === 0 || Math.random() < 0.4);
  const p2b = mk(1, 1, 101, 199, 3, 9, o => o.a >= 100);
  const panel = (o) => {
    const dg = D.digitsOf(o.q, o.qp);
    return `<div class="mpanel"><div class="eq" style="font-size:19px">식: ${ex(o)}</div>` +
      `<div class="eq" style="font-size:17px">어림셈: ${D.est(o.q, o.qp, '')}</div>` +
      `<div class="eq" style="font-size:17px">몫: ${D.dotPick(dg.digits, dg.gap)}</div></div>`;
  };
  cards.push(M.card(1, `<div class="q-text">어림셈한 결과를 고르고, 몫에 소수점을 찍어 보세요. (숫자 사이의 점선 칸을 누르면 소수점이 찍혀요)</div>` +
    `<div class="mbox">${panel(p2a)}${panel(p2b)}</div>`, true));
  hints.push(`나누어지는 수를 가까운 자연수로 어림하여 나누면 몫이 대략 얼마인지 알 수 있어요.<br>몫의 자연수 부분이 어림한 값과 비슷하도록 소수점을 찍어요.`);

  // 3번: 몫으로 알맞은 수 고르기 (소수 두 자리 수 ÷ 한 자리 수)
  const p3a = mk(2, 2, 11, 99, 3, 9, o => o.a >= 100);
  const p3b = mk(2, 2, 201, 999, 3, 9);
  const pick3 = (o) => {
    const opts = [2, 1, 0, -1].map(k => shifted(o, k));
    return `<div class="qbox" style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="eq" style="font-size:19px">${ex(o)}</div>` +
      M.choices(f0(o.q, o.qp), opts.map(s => [s, s])) + `</div>`;
  };
  cards.push(M.card(2, `<div class="q-text">어림셈한 결과를 이용하여 몫을 옳게 나타낸 것을 골라 보세요.</div>` + M.line(pick3(p3a), pick3(p3b)), true));
  hints.push(`예) 4.96 ÷ 8 → 4.96은 약 5, 5 ÷ 8은 1보다 작아요 → 몫은 0.62<br>보기의 숫자는 모두 같아요. 어림한 몫의 크기와 맞는 것을 골라요.`);

  // 4번: 몫이 4보다 큰 나눗셈 모두 찾기
  const big = [0, 1, 2].map(() => mk(M.pick([1, 2]), 2, 470, 950, 3, 9));
  const small = [0, 1, 2].map(() => mk(M.pick([1, 2]), 2, 120, 340, 2, 9));
  const all4 = big.map(o => ['b', o]).concat(small.map(o => ['s', o]));
  const uniq = {};
  const opts4 = M.shuffle(all4.map((x, i) => [x[0] + i, ex(x[1])]).filter(o => !uniq[o[1]] && (uniq[o[1]] = 1)));
  cards.push(M.card(3, `<div class="q-text">어림셈한 결과를 이용하여 몫이 4보다 큰 나눗셈을 모두 골라 보세요.</div>` +
    F.multi(opts4, opts4.filter(o => o[0][0] === 'b').map(o => o[0])), true));
  hints.push(`나누어지는 수를 가까운 자연수로 어림하여 나누어 보세요.<br>예) 25.8 ÷ 4 → 26 ÷ 4는 약 6이니 4보다 커요.  6.25 ÷ 5 → 6 ÷ 5는 약 1이니 4보다 작아요.`);

  // 5번: 소수점을 잘못 찍은 사람 찾기
  const ok5 = mk(2, 2, 111, 499, 2, 3), bad5 = mk(2, 2, 111, 299, 2, 4, o => o.a !== ok5.a);
  const firstOk = Math.random() < 0.5;
  const sayOk = `${ex(ok5)}${M.josa(String(ok5.n), '을', '를')} 어림셈으로 확인하면 몫은 ${f0(ok5.q, 2)}${M.josa(f0(ok5.q, 2), '이야', '야')}.`;
  const sayBad = `${ex(bad5)}${M.josa(String(bad5.n), '을', '를')} 어림셈으로 확인하면 몫은 ${shifted(bad5, 1)}${M.josa(shifted(bad5, 1), '이야', '야')}.`;
  const ppl = firstOk ? [['민하', sayOk], ['은호', sayBad]] : [['민하', sayBad], ['은호', sayOk]];
  const badName = firstOk ? '은호' : '민하';
  cards.push(M.card(4, `<div class="q-text">몫의 소수점을 잘못 찍은 사람을 고르고, 몫을 바르게 고쳐 보세요.</div>` +
    `<div class="choice-group speech-pick" tabindex="-1" data-ans="${badName}">` + ppl.map(p => `<button type="button" class="choice-btn" data-v="${p[0]}"><span class="who">${p[0]}</span>${p[1]}</button>`).join('') + `</div>` +
    `<div class="eq">바르게 고치기: ${ex(bad5)} = ${M.dbox(bad5.q, 2)}</div>`, true));
  hints.push(`두 나눗셈의 나누어지는 수를 각각 가까운 자연수로 어림하여 나누어 보세요.<br>어림한 값과 크게 다른 몫을 말한 사람이 소수점을 잘못 찍었어요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
