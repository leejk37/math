<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) × (소수) — 1보다 작은 소수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) × (소수)를 계산해요 — 1보다 작은 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 모눈 한 칸의 넓이는 0.01이에요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 0.6 × 0.4 → 가로 6칸, 세로 4칸 = 24칸 → 0.01 × 24 = <b>0.24</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 0.8 × 0.7 = <sup>8</sup>⁄<sub>10</sub> × <sup>7</sup>⁄<sub>10</sub> = <sup>56</sup>⁄<sub>100</sub> = 0.56</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 8 × 7 = 56 → 두 수가 각각 <sup>1</sup>⁄<sub>10</sub>배이니 곱은 <sup>1</sup>⁄<sub>100</sub>배 → 0.56</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 소수 한 자리 수끼리 곱하면 소수 <b>두</b> 자리 수가 돼요. 0.8 × 0.7 ≠ 5.6</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5245 — (소수) × (소수), 1보다 작은 소수 (교과서 5-2-4 96~97쪽, 수학 익힘 62~63쪽)
const f = M.fmt;
const STORY = [
  (a, b) => ({ unit: 'm²', text: `유준이는 가로가 ${f(a, 1)} m, 세로가 ${f(b, 1)} m인 직사각형 모양의 재활용 종이로 필통을 만들려고 합니다. 종이의 넓이는 몇 m²인가요?` }),
  (a, b) => ({ unit: 'm²', text: `가로가 ${f(a, 1)} m, 세로가 ${f(b, 1)} m인 직사각형 모양의 꽃밭이 있습니다. 꽃밭의 넓이는 몇 m²인가요?` }),
  (a, b) => ({ unit: 'kg', text: `1 m의 무게가 ${f(a, 1)} kg인 막대가 있습니다. 이 막대 ${f(b, 1)} m의 무게는 몇 kg인가요?` })
];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (0.a × 0.b)
  let a1, b1; do { a1 = M.rand(2, 9); b1 = M.rand(2, 9); } while ((a1 * b1) % 10 === 0 || a1 * b1 < 10 || a1 === b1);
  const s1 = M.pick(STORY)(a1, b1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(a1 * b1, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', a1, 1)} × ${M.pairbox('s', b1, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(a1 * b1, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`두 수가 모두 1보다 작으니 곱은 ${f(a1, 1)}보다도, ${f(b1, 1)}보다도 작아요.<br>${f(a1, 1)}의 약 절반 정도인지, 그보다 큰지 작은지 생각해 보세요.`);

  // 2번: 모눈 — 직사각형 색칠, 0.01의 개수
  let a2, b2; do { a2 = M.rand(2, 9); b2 = M.rand(2, 9); } while ((a2 * b2) % 10 === 0 || a2 === b2);
  cards.push(M.card(1, `<div class="q-text">모눈종이의 가로를 ${f(a2, 1)}만큼, 세로를 ${f(b2, 1)}만큼 색칠하고 ${f(a2, 1)} × ${f(b2, 1)}${M.josa(f(b2, 1), '을', '를')} 계산해 보세요.</div>` +
    `<div class="q-small">칸을 누르면 왼쪽 아래 모서리부터 그 칸까지 색칠돼요. (같은 칸을 다시 누르면 지워져요)</div>` +
    D.rectPick(a2, b2, 10, 10, 24) +
    M.line(`<div class="eq" style="font-size:18px">모두 <span class="tail">${M.box(a2 * b2)}칸이므로</span> 색칠한 부분의 넓이는 <span class="tail">${M.dbox(a2 * b2, 2)}입니다.</span></div>`) +
    `<div class="eq">${f(a2, 1)} × ${f(b2, 1)} = 0.01 × ${M.box(a2 * b2)} = ${M.dbox(a2 * b2, 2)}</div>`, true));
  hints.push(`큰 정사각형(가로 1, 세로 1)이 100칸으로 나뉘어 있어요. 한 칸은 가로 0.1, 세로 0.1이에요.<br>가로 ${f(a2, 1)}${M.josa(f(a2, 1), '은', '는')} ${a2}칸, 세로 ${f(b2, 1)}${M.josa(f(b2, 1), '은', '는')} ${b2}칸이에요. 색칠한 칸 수 × 0.01 = 넓이`);

  // 3번: 분수의 곱셈 / 자연수의 곱셈으로 (0.a × 0.b)
  let a3, b3; do { a3 = M.rand(2, 9); b3 = M.rand(2, 9); } while ((a3 * b3) % 10 === 0 || a3 * b3 < 10 || (a3 === a2 && b3 === b2));
  cards.push(M.card(2, `<div class="q-text">${f(a3, 1)} × ${f(b3, 1)}${M.josa(f(b3, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${f(a3, 1)} × ${f(b3, 1)} = ${M.frac(M.box(a3), 10)} × ${M.frac(M.box(b3), 10)} = ${M.frac(M.box(a3 * b3), 100)} = ${M.dbox(a3 * b3, 2)}</div>`,
      D.arrows({ A: a3, pa: 1, B: b3, pb: 1, pick: true })), true));
  hints.push(`① 분모끼리 곱하면 10 × 10 = <b>100</b>이에요.<br>② 두 수가 각각 ${M.frac(1, 10, true)}배가 되었으니 곱은 ${M.frac(1, 10, true)} × ${M.frac(1, 10, true)} = ${M.frac(1, 100, true)}배가 돼요.`);

  // 4번: 두 가지 방법 (0.ab × 0.c)
  let x4, c4; do { x4 = M.rand(11, 99); c4 = M.rand(2, 9); } while (x4 % 10 === 0 || (x4 * c4) % 10 === 0);
  cards.push(M.card(3, `<div class="q-text">${f(x4, 2)} × ${f(c4, 1)}${M.josa(f(c4, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${f(x4, 2)} × ${f(c4, 1)} = ${M.frac(M.box(x4), 100)} × ${M.frac(M.box(c4), 10)} = ${M.frac(M.box(x4 * c4), 1000)} = ${M.dbox(x4 * c4, 3)}</div>`,
      D.arrows({ A: x4, pa: 2, B: c4, pb: 1, topBox: true, pick: true })), true));
  hints.push(`① 분모끼리 곱하면 100 × 10 = <b>1000</b>이에요. 분모가 1000인 분수는 소수 세 자리 수예요.<br>② ${M.frac(1, 100, true)}배와 ${M.frac(1, 10, true)}배를 하면 곱은 ${M.frac(1, 1000, true)}배가 돼요.`);

  // 5번: 계산하기 (가로셈 0.a × 0.b, 세로셈 0.ab × 0.c)
  let a5, b5; do { a5 = M.rand(2, 9); b5 = M.rand(2, 9); } while ((a5 * b5) % 10 === 0 || a5 === b5);
  let x5, c5; do { x5 = M.rand(11, 99); c5 = M.rand(2, 9); } while (x5 % 10 === 0 || (x5 * c5) % 10 === 0);
  cards.push(M.card(4, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${f(a5, 1)} × ${f(b5, 1)} = ${M.dbox(a5 * b5, 2)}</div>`, D.vmul(x5, 2, c5, 1)), true));
  hints.push(`자연수의 곱셈을 한 다음, 두 수의 소수점 아래 자릿수를 <b>더한 만큼</b> 소수점을 찍어요.<br>소수 한 자리 × 소수 한 자리 → 소수 두 자리,  소수 두 자리 × 소수 한 자리 → 소수 세 자리`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
