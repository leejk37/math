<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 4학년 분수 도우미(m421) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m421-common.js?v=20261109-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>대분수의 뺄셈 (가분수로 바꾸어)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">대분수의 뺄셈 (가분수로 바꾸어)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수를 가분수로 바꾸어 분자끼리 빼요</div>
  <div class="rule-line"><span class="rule-tag">바꾸기</span> 3 4/7는 1/7이 7 × 3 + 4 = 25개 → <b>25/7</b></div>
  <div class="rule-line"><span class="rule-tag t2">순서</span> 3 4/7 − 1 6/7 = 25/7 − 13/7 = 12/7 = <b>1 5/7</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 계산한 결과가 가분수이면 대분수로 나타내요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4214b — 대분수의 뺄셈, 방법 2: 가분수로 바꾸어 (교과서 4-2-1 '분수의 덧셈과 뺄셈')
// 진단 포인트: 대분수를 가분수로 바꾸지 못함(분모×자연수+분자), 가분수 결과를 대분수로 바꾸지 못함
M.inlineQuestion = true;
// w1 a/d − w2 b/d (결과는 자연수가 아니게)
function mm(test) {
  return F.gen(() => { const d = M.rand(3, 9); return { d, w1: M.rand(2, 5), w2: M.rand(1, 3), a: M.rand(1, d - 1), b: M.rand(1, d - 1) }; },
    p => p.w1 > p.w2 && p.a !== p.b && (!test || test(p)));
}
const imp = (w, n, d) => w * d + n;
const L = p => M.mixed(p.w1, p.a, p.d) + G.MINUS + M.mixed(p.w2, p.b, p.d);
const steps = p => {
  const x = imp(p.w1, p.a, p.d), y = imp(p.w2, p.b, p.d);
  return `<div class="eq">${L(p)}${G.EQ}${F.fn(x, p.d)}${G.MINUS}${F.fn(y, p.d)}${G.EQ}${F.fn(x - y, p.d)}${G.EQ}${G.ansN(x - y, p.d)}</div>`;
};
const res = p => imp(p.w1, p.a, p.d) - imp(p.w2, p.b, p.d);
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 대분수를 가분수로 바꾸기
  const v1 = [0, 1].map(() => { const d = M.rand(3, 9); return { d, w: M.rand(1, 5), n: M.rand(1, d - 1) }; });
  cards.push(M.card(0, `<div class="q-text">대분수를 가분수로 나타내 보세요.</div>` +
    M.line(...v1.map(v => `<div class="qbox"><div class="eq">${M.mixed(v.w, v.n, v.d)}${G.EQ}${F.fn(imp(v.w, v.n, v.d), v.d)}</div></div>`)), true));
  hints.push(`자연수 1은 ${M.frac(v1[0].d, v1[0].d, true)} 이에요. (분모 × 자연수 + 분자)가 새 분자가 되고, 분모는 그대로예요.`);

  // 2번: 가분수로 바꾸어 빼기 (분수 부분끼리 뺄 수 있음)
  const p2 = mm(p => p.a > p.b);
  cards.push(M.card(1, `<div class="q-text">가분수로 바꾸어 계산하고, 대분수로 나타내 보세요.</div>` + steps(p2), true));
  hints.push(`${M.mixed(p2.w1, p2.a, p2.d)} ${M.josa(p2.a, '과', '와')} ${M.mixed(p2.w2, p2.b, p2.d)} ${M.josa(p2.b, '을', '를')} 각각 가분수로 바꾼 다음 분자끼리 빼요.`);

  // 3번: 분수 부분끼리 뺄 수 없을 때도 가분수로 바꾸면 바로 계산
  const p3 = mm(p => p.a < p.b && p.w1 - p.w2 >= 2);
  cards.push(M.card(2, `<div class="q-text">분수 부분끼리 뺄 수 없어요. 가분수로 바꾸어 계산해 보세요.</div>` + steps(p3), true));
  hints.push(`${M.frac(p3.a, p3.d, true)} 에서 ${M.frac(p3.b, p3.d, true)} ${M.josa(p3.b, '을', '를')} 바로 뺄 수 없지만, 가분수로 바꾸면 분자끼리 뺄 수 있어요.`);

  // 4번: 계산 (2문제)
  const c4 = [mm(p => p.a > p.b), mm(p => p.a < p.b)];
  cards.push(M.card(3, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c4.map(p => `<div class="qbox">${G.calc(L(p), res(p), p.d)}</div>`)), true));
  hints.push('대분수를 가분수로 바꾸어 분자끼리 빼고, 결과를 대분수로 나타내요.');

  // 5번: 문장제
  const p5 = mm();
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">밀가루가 ${G.t(p5.w1, p5.a, p5.d)} kg 있었습니다. 빵을 만드는 데 ${G.t(p5.w2, p5.b, p5.d)} kg을 사용했습니다. 남은 밀가루는 몇 kg인가요?</div>` +
    `<div class="eq">${G.ans(res(p5), p5.d)} <span class="unit">kg</span></div>`, true));
  hints.push('"남은 양"은 처음 양에서 사용한 양을 빼요. 가분수로 바꾸어 계산해 봐요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
