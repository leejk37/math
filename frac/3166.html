<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>단위분수 비교 문제 모음</title>
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
    color: #222;
  }
  h2 { font-size: 19px; margin-bottom: 24px; }

  .problem {
    background: #fff;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .problem-num {
    display: inline-block;
    background: #6a5acd;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    text-align: center;
    line-height: 24px;
    margin-right: 8px;
  }
  .problem-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  svg { display: block; }
  .piece { cursor: pointer; }

  .inline-fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 6px;
    background: #e4e4ea;
    border-radius: 8px;
    padding: 4px 10px;
    min-width: 30px;
  }
  .inline-fraction .cell { font-size: 18px; font-weight: bold; line-height: 1.2; }
  .inline-fraction .bar { width: 100%; height: 2px; background: #333; margin: 1px 0; }

  .op-input {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #7ec8e3;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    background: #fff;
  }

  /* 연산자/장소 선택 버튼 그룹 */
  .choice-group { display: flex; gap: 8px; }
  .choice-btn {
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #7ec8e3;
    border-radius: 10px;
    padding: 8px 16px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }
  .choice-btn.op-choice {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    padding: 0;
    font-size: 20px;
  }
  .choice-btn:hover { background: #eef8fc; }
  .choice-btn.selected {
    background: #7ec8e3;
    color: #fff;
  }
  .choice-btn.correct-highlight {
    font-weight: bold;
    color: #2e9e44;
    border-color: #2e9e44;
    background: #eafaf0;
  }

  .dropdown-select {
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #7ec8e3;
    border-radius: 8px;
    padding: 8px 10px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .text-input {
    border: 2px solid #7ec8e3;
    border-radius: 8px;
    font-size: 15px;
    padding: 6px 10px;
    min-width: 100px;
  }

  .sentence { font-size: 16px; line-height: 2.2; }

  .feedback {
    min-height: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 12px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .global-controls {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .global-btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .global-check-btn { background: #6a5acd; color: #fff; }
  .global-check-btn:hover { background: #5a4bb8; }
  .global-reset-btn { background: #eee; color: #555; }
  .global-reset-btn:hover { background: #ddd; }
  .summary { font-size: 15px; font-weight: bold; }
</style>
</head>
<body>

<h2>단위분수 비교 문제 모음</h2>

<div id="problems"></div>

<div class="global-controls">
  <button class="global-btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="global-btn global-reset-btn" id="newAllBtn">새 문제 (전체)</button>
  <span class="summary" id="summary"></span>
</div>

<script>
/* ===================== 공통 유틸 ===================== */
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// 서로 다른 두 수를 [min,max] 범위에서 뽑기
function randomDistinctPair(min, max) {
  const a = randomInt(min, max);
  let b = randomInt(min, max);
  while (b === a) b = randomInt(min, max);
  return [a, b];
}

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function inlineFraction(numerator, denominator) {
  const wrap = document.createElement('span');
  wrap.className = 'inline-fraction';
  const num = document.createElement('div'); num.className = 'cell'; num.textContent = numerator;
  const bar = document.createElement('div'); bar.className = 'bar';
  const den = document.createElement('div'); den.className = 'cell'; den.textContent = denominator;
  wrap.appendChild(num); wrap.appendChild(bar); wrap.appendChild(den);
  return wrap;
}

// 단위분수(1/n1, 1/n2) 크기 비교: 분모가 클수록 분수는 작다
function unitCompareOperator(n1, n2) {
  if (n1 < n2) return '>';  // 분모가 작으면 분수가 더 크다
  if (n1 > n2) return '<';
  return '=';
}

function createOperatorInput() {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'op-input';
  input.maxLength = 1;
  input.addEventListener('keydown', (e) => {
    const allowedKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'];
    if (allowedKeys.includes(e.key)) return;
    if (!['<', '=', '>'].includes(e.key)) e.preventDefault();
  });
  return { input, getValue: () => input.value.trim(), reset: () => { input.value = ''; } };
}

// <, =, > 중 하나를 선택하는 버튼 그룹
function createOperatorSelector() {
  const wrap = document.createElement('div');
  wrap.className = 'choice-group';
  let selected = null;
  const buttons = {};
  ['<', '=', '>'].forEach(sym => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn op-choice';
    btn.textContent = sym;
    btn.onclick = () => {
      selected = sym;
      Object.values(buttons).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    buttons[sym] = btn;
    wrap.appendChild(btn);
  });
  return {
    wrap,
    getSelected: () => selected,
    reset: () => { selected = null; Object.values(buttons).forEach(b => b.classList.remove('selected')); }
  };
}

// 주어진 옵션(문자열 배열) 중 하나를 선택하는 버튼 그룹 (예: 장소 선택)
function createChoiceSelector(options) {
  const wrap = document.createElement('div');
  wrap.className = 'choice-group';
  let selected = null;
  const buttons = [];
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      selected = opt;
      buttons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    buttons.push(btn);
    wrap.appendChild(btn);
  });
  return {
    wrap,
    getSelected: () => selected,
    reset: () => { selected = null; buttons.forEach(b => { b.classList.remove('selected'); b.classList.remove('correct-highlight'); }); },
    // 정답에 해당하는 버튼을 굵게 + 초록색으로 강조 표시
    highlightCorrect: (value) => {
      buttons.forEach(b => {
        if (b.textContent === value) b.classList.add('correct-highlight');
      });
    }
  };
}

// 드롭다운(select)으로 옵션 중 하나를 선택 (2~4번 문제용)
function createDropdownSelector(options, placeholderText) {
  const select = document.createElement('select');
  select.className = 'dropdown-select';

  const placeholderOpt = document.createElement('option');
  placeholderOpt.value = '';
  placeholderOpt.textContent = placeholderText || '선택';
  placeholderOpt.disabled = true;
  placeholderOpt.selected = true;
  select.appendChild(placeholderOpt);

  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    select.appendChild(o);
  });

  return {
    select,
    getSelected: () => select.value || null,
    reset: () => { select.value = ''; }
  };
}

function makeProblemWrapper(num, titleText) {
  const wrap = document.createElement('div');
  wrap.className = 'problem';
  const title = document.createElement('div');
  title.className = 'problem-title';
  const badge = document.createElement('span');
  badge.className = 'problem-num';
  badge.textContent = num;
  title.appendChild(badge);
  title.appendChild(document.createTextNode(titleText));
  wrap.appendChild(title);
  return wrap;
}

// 클릭해서 색칠하는 가로 수막대 (단위분수: 정답은 항상 "1개 색칠")
function makeClickableBar(n, color, widthPx) {
  let filledCount = 0; // 왼쪽부터 몇 칸이 채워졌는지
  const w = widthPx || 260, h = 44;
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const x0 = 4, y0 = 4;
  const innerW = w - 8, innerH = h - 8;
  const pieces = [];

  function updateVisual() {
    pieces.forEach((p, idx) => p.setAttribute('fill', idx < filledCount ? color : '#ffffff'));
  }

  for (let i = 0; i < n; i++) {
    const segW = innerW / n;
    const piece = el('rect', { x: x0 + i * segW, y: y0, width: segW, height: innerH, fill: '#ffffff', class: 'piece' });
    piece.addEventListener('click', () => {
      // 왼쪽칸부터 순서대로 채워지도록: 클릭한 칸까지 색칠하거나,
      // 이미 색칠된 칸을 클릭하면 그 칸부터 오른쪽을 지움
      if (i < filledCount) {
        filledCount = i;
      } else {
        filledCount = i + 1;
      }
      updateVisual();
    });
    svg.appendChild(piece);
    pieces.push(piece);
  }
  svg.appendChild(el('rect', { x: x0, y: y0, width: innerW, height: innerH, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
  for (let i = 1; i < n; i++) {
    const segW = innerW / n;
    const x = x0 + i * segW;
    svg.appendChild(el('line', { x1: x, y1: y0, x2: x, y2: y0 + innerH, stroke: '#333', 'stroke-width': 1.3, 'stroke-dasharray': '4,3', 'pointer-events': 'none' }));
  }

  return {
    svg,
    getShadedCount: () => filledCount,
    resetShading: () => { filledCount = 0; updateVisual(); }
  };
}

/* ===================== 문제 1: 수막대에 서로 다른 단위분수 제시하고 색칠하기 ===================== */
function makeProblem1() {
  const wrap = makeProblemWrapper(1, '종이띠에 주어진 단위분수만큼 색칠하고, 크기를 비교해보세요.');

  let n1, n2, bar1, bar2;

  function build() {
    wrap.querySelectorAll('.bar-row').forEach(r => r.remove());

    [n1, n2] = randomDistinctPair(2, 8);

    const row1 = document.createElement('div'); row1.className = 'bar-row';
    bar1 = makeClickableBar(n1, '#bfe0ff');
    row1.appendChild(inlineFraction(1, n1));
    row1.appendChild(bar1.svg);
    wrap.appendChild(row1);

    const row2 = document.createElement('div'); row2.className = 'bar-row';
    bar2 = makeClickableBar(n2, '#d3cbee');
    row2.appendChild(inlineFraction(1, n2));
    row2.appendChild(bar2.svg);
    wrap.appendChild(row2);

    wrap.appendChild(feedback); // 피드백을 맨 아래로 유지
  }

  const feedback = document.createElement('div'); feedback.className = 'feedback';
  build();

  function check() {
    const ok1 = bar1.getShadedCount() === 1;
    const ok2 = bar2.getShadedCount() === 1;
    const correct = ok1 && ok2;
    feedback.textContent = correct ? '정답이에요! 👏' : '각 종이띠에 조각을 정확히 1개씩 색칠해 주세요.';
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    feedback.textContent = ''; feedback.className = 'feedback';
    build();
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 2: 종이띠 1, 1/2, 1/3, 1/4 색칠하기 ===================== */
function makeProblem2() {
  const wrap = makeProblemWrapper(2, "제시된 단위분수만큼 각각 색칠하고, 제시된 문장에서 올바른 답을 선택해 보세요.");

  // "1" 예시 줄 (항상 전체가 색칠된 채로 고정, 클릭 불가)
  const row0 = document.createElement('div'); row0.className = 'bar-row';
  const wholeSvg = document.createElementNS(svgNS, 'svg');
  wholeSvg.setAttribute('width', 260); wholeSvg.setAttribute('height', 44); wholeSvg.setAttribute('viewBox', '0 0 260 44');
  wholeSvg.appendChild(el('rect', { x: 4, y: 4, width: 252, height: 36, fill: '#cdeadf' }));
  wholeSvg.appendChild(el('rect', { x: 4, y: 4, width: 252, height: 36, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
  row0.appendChild(inlineFraction(1, 1));
  row0.appendChild(wholeSvg);
  wrap.appendChild(row0);

  const denominators = [2, 3, 4];
  const colors = ['#bfe0ff', '#d3cbee', '#f6c9cd'];
  let bars = [];

  const rowsContainer = document.createElement('div');
  wrap.appendChild(rowsContainer);

  function build() {
    rowsContainer.innerHTML = '';
    bars = denominators.map((n, idx) => {
      const row = document.createElement('div'); row.className = 'bar-row';
      const bar = makeClickableBar(n, colors[idx]);
      row.appendChild(inlineFraction(1, n));
      row.appendChild(bar.svg);
      rowsContainer.appendChild(row);
      return bar;
    });
  }
  build();

  // 문장 완성: "단위분수는 [ ]가 작을수록 더 큰 분수이다."
  const sentenceRow = document.createElement('div');
  sentenceRow.className = 'sentence';
  sentenceRow.style.marginTop = '16px';
  sentenceRow.appendChild(document.createTextNode('단위분수는 '));
  const blankSelector = createDropdownSelector(['분자', '분모'], '선택');
  sentenceRow.appendChild(blankSelector.select);
  sentenceRow.appendChild(document.createTextNode('가 작을수록 '));
  const biggerFracSpan = document.createElement('span');
  biggerFracSpan.textContent = '더 큰 분수';
  biggerFracSpan.style.color = '#2f6fdb';
  biggerFracSpan.style.fontWeight = 'bold';
  sentenceRow.appendChild(biggerFracSpan);
  sentenceRow.appendChild(document.createTextNode('입니다.'));
  wrap.appendChild(sentenceRow);

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const shadingResults = bars.map(b => b.getShadedCount() === 1);
    const shadingCorrect = shadingResults.every(r => r);

    const blankVal = blankSelector.getSelected();
    if (!blankVal) {
      feedback.textContent = '빈칸에 들어갈 말을 선택해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const blankCorrect = blankVal === '분모';

    const correct = shadingCorrect && blankCorrect;
    if (!shadingCorrect) {
      feedback.textContent = '1/2, 1/3, 1/4에 해당하는 만큼 조각을 1개씩 색칠해 주세요.';
    } else if (!blankCorrect) {
      feedback.textContent = '색칠은 맞았지만, 빈칸을 다시 확인해 볼까요?';
    } else {
      feedback.textContent = '정답이에요! 👏';
    }
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    bars.forEach(b => b.resetShading());
    blankSelector.reset();
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 3 / 4: 분모가 다른 두 단위분수 크기 비교 ===================== */
function makeUnitFractionCompareProblem(num) {
  const wrap = makeProblemWrapper(num, '두 단위분수의 크기를 비교해 보세요.');
  const row = document.createElement('div');
  row.className = 'bar-row';
  wrap.appendChild(row);

  let n1, n2;
  const opSelector = createDropdownSelector(['<', '=', '>'], '기호');

  function build() {
    row.innerHTML = '';
    [n1, n2] = randomDistinctPair(2, 12);
    row.appendChild(inlineFraction(1, n1));
    row.appendChild(opSelector.select);
    row.appendChild(inlineFraction(1, n2));
  }
  build();

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const val = opSelector.getSelected();
    if (!val) {
      feedback.textContent = '<, =, > 중 하나를 선택해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const correct = val === unitCompareOperator(n1, n2);
    feedback.textContent = correct ? '정답이에요! 👏' : '다시 한 번 확인해 볼까요? (분모가 클수록 분수는 작아져요)';
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    build();
    opSelector.reset();
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 5: 단위분수 크기 비교 문장제 ===================== */
function makeProblem5() {
  const wrap = makeProblemWrapper(5, '문제를 읽고 알맞은 장소를 선택해 보세요.');

  const namePool = ['도윤', '서연', '하준', '지우', '예은', '민준'];
  const placePairs = [
    ['도서관', '학교'],
    ['공원', '마트'],
    ['병원', '우체국'],
    ['문구점', '놀이터'],
    ['수영장', '체육관']
  ];

  let personName, placeA, placeB, nA, nB, correctPlace, questionType;

  const sentence = document.createElement('div');
  sentence.className = 'sentence';
  wrap.appendChild(sentence);

  const choiceRow = document.createElement('div');
  choiceRow.className = 'bar-row';
  wrap.appendChild(choiceRow);

  let placeSelector;

  function build() {
    personName = namePool[randomInt(0, namePool.length - 1)];
    let pair = placePairs[randomInt(0, placePairs.length - 1)];
    // 장소가 문장에 나오는 순서를 절반 확률로 뒤바꿈 (항상 같은 장소가 먼저 나오지 않도록)
    if (Math.random() < 0.5) pair = [pair[1], pair[0]];
    [placeA, placeB] = pair;

    [nA, nB] = randomDistinctPair(2, 9);

    // "더 가까운 곳"을 물을지 "더 먼 곳"을 물을지도 매번 무작위로 결정
    questionType = Math.random() < 0.5 ? '가까운' : '먼';
    const closerPlace = nA > nB ? placeA : placeB; // 분모가 클수록 거리가 가까움
    const fartherPlace = closerPlace === placeA ? placeB : placeA;
    correctPlace = questionType === '가까운' ? closerPlace : fartherPlace;

    sentence.innerHTML = '';
    sentence.appendChild(document.createTextNode(`${personName}이네 집에서 ${placeA}까지의 거리는 `));
    sentence.appendChild(inlineFraction(1, nA));
    sentence.appendChild(document.createTextNode(' km이고, '));
    sentence.appendChild(document.createTextNode(`${placeB}까지의 거리는 `));
    sentence.appendChild(inlineFraction(1, nB));
    sentence.appendChild(document.createTextNode(` km입니다. ${placeA}와(과) ${placeB} 중 ${personName}이네 집에서 `));
    const questionSpan = document.createElement('span');
    questionSpan.textContent = `더 ${questionType} 곳`;
    questionSpan.style.color = '#2f6fdb';
    questionSpan.style.fontWeight = 'bold';
    sentence.appendChild(questionSpan);
    sentence.appendChild(document.createTextNode('은 어디일까요?'));

    choiceRow.innerHTML = '';
    placeSelector = createChoiceSelector([placeA, placeB]);
    choiceRow.appendChild(placeSelector.wrap);
  }
  build();

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const val = placeSelector.getSelected();
    if (!val) {
      feedback.textContent = '더 가까운 곳을 선택해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const correct = val === correctPlace;
    placeSelector.highlightCorrect(correctPlace); // 정답 장소를 굵게 + 초록색으로 강조
    feedback.textContent = correct ? '정답이에요! 👏' : '다시 한 번 확인해 볼까요? (분모가 클수록 거리가 가까워요)';
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    build();
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 초기화 ===================== */
const problemsEl = document.getElementById('problems');
const summaryEl = document.getElementById('summary');

const problems = [
  makeProblem1(),
  makeProblem2(),
  makeUnitFractionCompareProblem(3),
  makeUnitFractionCompareProblem(4),
  makeProblem5()
];

problems.forEach(p => problemsEl.appendChild(p.wrap));

document.getElementById('checkAllBtn').onclick = () => {
  const results = problems.map(p => p.check());
  const correctCount = results.filter(r => r === true).length;
  summaryEl.textContent = `${problems.length}문제 중 ${correctCount}개 정답`;
};

document.getElementById('newAllBtn').onclick = () => {
  problems.forEach(p => p.regenerate());
  summaryEl.textContent = '';
};
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: '#checkAllBtn', newBtn: '#newAllBtn', grade: () => { const r = problems.map(p => p.check()); summaryEl.textContent = `${r.length}문제 중 ${r.filter(Boolean).length}개 정답`; return r; } });
</script>
