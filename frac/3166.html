<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>단위분수의 크기 비교</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">단위분수의 크기 비교</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 단위분수는 분모가 작을수록 큰 분수예요</div>
  <div class="rule-line"><span class="rule-tag">까닭</span> 똑같이 적게 나눌수록 한 조각이 커요. 1/2 &gt; 1/3 &gt; 1/4</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모가 큰 수라고 해서 큰 분수가 아니에요. 1/8 &lt; 1/5</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3166 — 단위분수의 크기 비교 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 분모가 클수록 크다고 생각함(자연수 크기와 헷갈림)
M.inlineQuestion = true;
function two(lo, hi) { let a, b; do { a = M.rand(lo || 2, hi || 12); b = M.rand(lo || 2, hi || 12); } while (a === b); return [a, b]; }
const U = d => M.frac(1, d);
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 같은 길이 막대에서 한 칸 비교
  const [a1, b1] = two(2, 8);
  cards.push(M.card(0, `<div class="q-text">같은 길이의 막대에 색칠한 단위분수를 보고 크기를 비교해 보세요.</div>` +
    `<div style="display:flex;flex-direction:column;gap:6px;align-items:center">` +
    `<div class="row" style="align-items:center;gap:10px"><div class="eq" style="width:44px">${U(a1)}</div>${S.bar(a1, 1, { w: 320 })}</div>` +
    `<div class="row" style="align-items:center;gap:10px"><div class="eq" style="width:44px">${U(b1)}</div>${S.bar(b1, 1, { w: 320 })}</div></div>` +
    `<div class="cmp-row">${U(a1)}${M.cmp(b1, a1)}${U(b1)}</div>`, true));
  hints.push('색칠한 한 칸의 길이를 비교해 보세요. 칸이 긴 쪽이 더 큰 분수예요.');

  // 2번: 규칙 고르기
  cards.push(M.card(1, `<div class="q-text">알맞은 말을 골라 문장을 완성해 보세요.</div>` +
    `<div class="pick-v" style="font-size:18px;font-weight:bold;color:#1e293b">단위분수는 분모가` + M.choices('s', [['b', '클수록'], ['s', '작을수록']]) + `<span class="tail">더 큰 분수입니다.</span></div>`, true));
  hints.push('피자를 2조각으로 나눌 때와 8조각으로 나눌 때, 한 조각이 더 큰 쪽은 어느 쪽일까요?');

  // 3번: 크기 비교 (3쌍)
  const c3 = [two(), two(), two()];
  cards.push(M.card(2, `<div class="q-text">두 분수의 크기를 비교하여 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    M.line(...c3.map(([a, b]) => `<div class="qbox"><div class="cmp-row">${U(a)}${M.cmp(b, a)}${U(b)}</div></div>`)), true));
  hints.push('분자가 모두 1이에요. 분모가 <b>작은</b> 쪽이 더 커요.');

  // 4번: 가장 작은 단위분수 고르기
  const ds4 = M.shuffle([2, 3, 4, 5, 6, 7, 8, 9, 10, 12]).slice(0, 4), min4 = Math.max(...ds4);
  cards.push(M.card(3, `<div class="q-text">가장 작은 분수를 골라 보세요.</div>` +
    M.choices(min4, ds4.map(d => [d, '1/' + d])), true));
  hints.push('단위분수는 분모가 클수록 한 조각이 작아요.');

  // 5번: 문장제
  const [a5, b5] = two(2, 10);
  const far = a5 < b5 ? 0 : 1;
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 골라 보세요.</div>` +
    `<div class="word">하준이네 집에서 공원까지의 거리는 1/${a5} km이고, 도서관까지의 거리는 1/${b5} km입니다. 하준이네 집에서 더 먼 곳은 어디인가요?</div>` +
    M.choices(far, [[0, '공원'], [1, '도서관']]), true));
  hints.push('두 단위분수 중 더 큰 분수가 더 먼 거리예요. 분모가 작은 쪽이 더 커요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
