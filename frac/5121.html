<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>약수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">약수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 약수: 어떤 수를 나누어떨어지게 하는 수</div>
  <div class="rule-line"><span class="rule-tag">뜻</span> 6 ÷ 1, 6 ÷ 2, 6 ÷ 3, 6 ÷ 6은 나누어떨어져요 → 6의 약수는 <b>1, 2, 3, 6</b></div>
  <div class="rule-line"><span class="rule-tag t2">짝</span> 곱셈식으로 짝을 찾아요. 12 = 1 × 12 = 2 × 6 = 3 × 4 → 12의 약수 <b>1, 2, 3, 4, 6, 12</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 1과 자기 자신은 언제나 약수예요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5121 — 약수 (교과서 5-1-2 32~33쪽, 수학익힘 22~23쪽, 성취기준 [6수01-04])
// 진단 포인트: 1이나 자기 자신을 빠뜨림, 곱셈식의 짝을 놓침, 나누어떨어지지 않는 수를 약수로 고름
const R = M.rand;
M.inlineQuestion = true;
const NS = [12, 16, 18, 20, 24, 28, 30, 32, 36];
const pairs = n => F.divisors(n).filter(a => a * a <= n).map(a => [a, n / a]);
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: n의 약수 모두 고르기 (1~n 수판)
  const n1 = M.pick(NS);
  cards.push(M.card(0, `<div class="q-text">${n1}의 약수를 모두 골라 보세요.</div>` + F.nums(Array.from({ length: n1 }, (_, i) => i + 1), F.divisors(n1)), true));
  hints.push(`${n1}을(를) 1부터 차례로 나누어 보세요. 나누어떨어지는 수가 약수예요. 1과 ${n1}도 잊지 마세요.`);

  // 2번: 곱셈식으로 짝 찾기 + 약수의 개수
  const n2 = M.pick([24, 30, 36, 40, 42, 45, 48].filter(x => x !== n1));
  const pr = pairs(n2);
  cards.push(M.card(1, `<div class="q-text">곱셈식을 완성하고, ${n2}의 약수는 모두 몇 개인지 써 보세요.</div>` +
    M.line(...pr.map(([a, b]) => `<div class="qbox"><div class="eq">${n2} = ${a} × ${M.box(b)}</div></div>`)) +
    `<div class="eq">${n2}의 약수는 모두 ${M.box(F.divisors(n2).length)}개</div>`, true));
  hints.push(`곱해서 ${n2}이(가) 되는 두 수를 찾아요. 한 식에서 약수가 2개씩 나와요. 같은 수끼리 곱한 식(예: 6 × 6)은 1개로 세요.`);

  // 3번: 나누어떨어지는 나눗셈 고르기
  const t3 = F.gen(() => { const n = R(24, 60), ks = M.shuffle([2, 3, 4, 5, 6, 7, 8, 9, 11, 12]).slice(0, 6); return { n, ks }; },
    o => { const c = o.ks.filter(k => o.n % k === 0).length; return c >= 2 && c <= 4; });
  cards.push(M.card(2, `<div class="q-text">${t3.n}을(를) 나누어떨어지게 하는 나눗셈을 모두 골라 보세요.</div>` +
    F.multi(t3.ks.map(k => [k, `${t3.n} ÷ ${k}`]), t3.ks.filter(k => t3.n % k === 0)), true));
  hints.push('몫을 구했을 때 나머지가 0이면 나누어떨어진 거예요. 나누는 수가 약수예요.');

  // 4번: 약수의 개수 비교
  const t4 = F.gen(() => M.shuffle(NS.concat([15, 21, 25, 27, 35, 40])).slice(0, 2), p => F.divisors(p[0]).length !== F.divisors(p[1]).length);
  const more = F.divisors(t4[0]).length > F.divisors(t4[1]).length ? t4[0] : t4[1];
  cards.push(M.card(3, `<div class="q-text">약수의 개수가 더 많은 수를 골라 보세요.</div>` + M.choices(more, t4.map(v => [v, v])), true));
  hints.push('두 수의 약수를 각각 모두 써 보고 개수를 세어 비교해요.');

  // 5번: 문장제 (똑같이 나누어 줄 수 있는 사람 수)
  const n5 = M.pick([12, 18, 20, 24, 30]);
  const ppl = []; for (let k = 2; k <= 10; k++) ppl.push(k);
  cards.push(M.card(4, `<div class="q-text">사탕 ${n5}개를 친구들에게 남김없이 똑같이 나누어 주려고 합니다. 나누어 줄 수 있는 사람 수를 모두 골라 보세요. (2명부터 10명까지)</div>` +
    F.nums(ppl, ppl.filter(k => n5 % k === 0)), true));
  hints.push(`남김없이 똑같이 나누려면 ${n5}을(를) 나누어떨어지게 하는 수, 곧 ${n5}의 약수만큼 나누어 줄 수 있어요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
