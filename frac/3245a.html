<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 3학년 2학기 분수 공통 화면 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m324-common.js"></script>
<title>대분수를 알아볼까요 (대분수 → 가분수)</title>
</head>
<body>

<div class="header-text">대분수를 알아볼까요 (대분수 → 가분수)</div>
<div class="sub-text"><div class="rule-box"><div class="rule-title">🔎 대분수를 단위분수로 세어요!</div><div class="rule-line"><span class="rule-tag etc">대분수</span> <b>자연수</b>와 <b>진분수</b>로 이루어진 분수 (예: 1과 2분의 1)</div><div class="rule-line"><span class="rule-tag den">① 자연수</span> 자연수 1은 분모와 분자가 같은 분수예요 (1 = 3/3, 2 = 6/3).</div><div class="rule-line"><span class="rule-tag num">② 분자</span> 자연수 부분과 진분수 부분의 단위분수를 <b>모두 세어</b> 분자에 써요.</div></div><br><span style="font-size:13px;color:#94a3b8">(입력하면 자동으로 다음 칸으로 넘어갑니다.)</span></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3245a — 대분수를 알아볼까요 (대분수 → 가분수)
// 교과서 3-2-4 96~97쪽: 대분수 뜻, 진·가·대분수 분류, 2 1/3을 가분수로(1은 3/3, 2는 6/3), 1 1/4·3 4/5
function mixedProb(used, wMax, dMin, dMax) {
  let w, n, d, key;
  do { d = M.rand(dMin, dMax); w = M.rand(1, wMax); n = M.rand(1, d - 1); key = w + '-' + n + '/' + d; } while (used.has(key));
  used.add(key);
  return { w, n, d, N: w * d + n };
}
function generate() {
  const hints = [];
  const cards = [], used = new Set();
  // 1번: 진·가·대분수 고르기
  const kind = M.pick(['진', '가', '대', '대']);
  let shown;
  if (kind === '진') { const d = M.rand(3, 12); shown = M.frac(M.rand(1, d - 1), d); }
  else if (kind === '가') { const d = M.rand(3, 9); shown = M.frac(M.pick([d, M.rand(d + 1, 2 * d + 2)]), d); }
  else { const p = mixedProb(used, 4, 3, 12); shown = M.mixed(p.w, p.n, p.d); }
  cards.push(M.card(0, `<div class="eq" style="font-size:24px">${shown}</div>` +
    M.choices(kind, [['진', '진분수'], ['가', '가분수'], ['대', '대분수']])));
  hints.push('<b>자연수와 진분수</b>가 함께 있으면 대분수예요. 분수만 있다면 분자와 분모를 비교해요: 분자가 작으면 진분수, 같거나 크면 가분수.');
  // 2번: 그림을 보고 대분수로
  let p = mixedProb(used, 2, 2, 6);
  cards.push(M.card(1, M.piecesSvg(p.w + 1, p.d, p.N, false) +
    `<div class="q-text">색칠한 부분을 대분수로 나타내세요.</div>` +
    `<div class="eq">${M.mixed(M.box(p.w), M.box(p.n), p.d)}</div>`));
  hints.push('<b>모두 색칠한</b> 도형은 자연수 1이에요. 그런 도형이 몇 개인지가 자연수, <b>일부만 색칠한</b> 도형은 색칠한 칸 수가 분자예요.');
  // 3번: 단위분수가 몇 개인지 생각하며 가분수로
  p = mixedProb(used, 3, 2, 6);
  cards.push(M.card(2, `<div class="eq" style="font-size:18px">${M.mixed(p.w, p.n, p.d, true)}${M.josa(p.n, '은', '는')}&nbsp;${M.frac(1, p.d, true)}이 ${M.box(p.N)}개</div>` +
    `<div class="eq">${M.mixed(p.w, p.n, p.d)} <span class="op">=</span> ${M.frac(M.box(p.N), p.d)}</div>`));
  hints.push(`자연수 1은 ${M.frac(p.d, p.d, true)}, 곧 ${M.frac(1, p.d, true)}이 ${p.d}개예요. 자연수 부분과 진분수 부분에 ${M.frac(1, p.d, true)}이 각각 몇 개인지 세어 더해 보세요.`);
  // 4~5번: 가분수로 바로
  for (let i = 3; i < 5; i++) {
    p = mixedProb(used, 4, 2, 9);
    cards.push(M.card(i, `<div class="eq" style="margin-top:8px">${M.mixed(p.w, p.n, p.d)} <span class="op">=</span> ${M.frac(M.box(p.N), p.d)}</div>`));
    hints.push(`자연수 1은 ${M.frac(p.d, p.d, true)}${M.josa(p.d, '이에요', '예요')}. 자연수 ${p.w}은(는) 분자가 얼마인 분수일까요? 거기에 진분수의 분자 ${p.n}을(를) 더해요.`.replace('은(는)', M.josa(p.w, '은', '는')).replace('을(를)', M.josa(p.n, '을', '를')));
  }
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
