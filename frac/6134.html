<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (자연수) — 소수점 아래 0을 내려 계산하는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (자연수)를 계산해요 — 소수점 아래 0을 내려 계산하는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나누어떨어지지 않으면 소수점 아래 0을 내려요!</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 2.6 ÷ 4 → 2.6 = 2.60 이므로 0을 내려 20 ÷ 4 = 5 → <b>0.65</b></div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 260 ÷ 4 = 65 → 나누어지는 수가 <sup>1</sup>⁄<sub>100</sub>배이면 몫도 <sup>1</sup>⁄<sub>100</sub>배 → 2.6 ÷ 4 = 0.65</div>
  <div class="rule-line"><span class="rule-tag t4">단위</span> 2.6 m = 260 cm,  260 cm ÷ 4 = 65 cm = 0.65 m</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6134 — (소수) ÷ (자연수), 소수점 아래 0을 내려 계산하는 경우 (교과서 6-1-3 64~65쪽, 수학 익힘 42~43쪽)
const f = M.fmt, f0 = M.fmt0;
const STORY = [
  (a, n) => ({ unit: 'm', text: `길이가 ${f(a, 1)} m인 나무 막대를 ${n}개로 똑같이 나누어 투호살을 만들었습니다. 투호살 한 개의 길이는 몇 m인가요?` }),
  (a, n) => ({ unit: 'kg', text: `설탕 ${f(a, 1)} kg을 ${n}봉지에 똑같이 나누어 담았습니다. 한 봉지에 담은 설탕은 몇 kg인가요?` }),
  (a, n) => ({ unit: 'L', text: `페인트 ${f(a, 1)} L를 ${n}통에 똑같이 나누어 담았습니다. 한 통에 담은 페인트는 몇 L인가요?` })
];
// 나누어지는 수 a(소수 한 자리), 몫 q(소수 두 자리, 끝자리 0이 아님) → 0을 한 번 내려야 나누어떨어짐
function mk(nList, aMax) {
  return F.gen(() => { const n = M.pick(nList), q = M.rand(11, 999); return { n, q, a: q * n / 10 }; },
    o => Number.isInteger(o.a) && o.q % 10 !== 0 && o.a % 10 !== 0 && o.a <= aMax && o.a >= 5);
}
const ex = (o) => `${f(o.a, 1)} ÷ ${o.n}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기
  const p1 = mk([2, 4, 5, 6, 8], 99);
  const s1 = M.pick(STORY)(p1.a, p1.n);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 1)} ÷ ${M.box(p1.n)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(p1.a, 1)}${M.josa(f(p1.a, 1), '을', '를')} 가까운 자연수로 어림하여 ${p1.n}(으)로 나누어 보세요.<br>계산할 때 나누어떨어지지 않으면 ${f(p1.a, 1)} = ${f(p1.a * 10, 2)}처럼 0을 내려 계산해요.`);

  // 2번: 자연수의 나눗셈을 이용하기 (260 ÷ 4 = 65 → 2.6 ÷ 4)
  const p2 = F.gen(() => mk([2, 4, 5, 6, 8], 99), o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">${p2.a * 10} ÷ ${p2.n} = ${p2.q}${M.josa(String(p2.q), '을', '를')} 이용하여 ${ex(p2)}${M.josa(String(p2.n), '을', '를')} 계산해 보세요.</div>` +
    D.divArrows({ A: p2.a * 10, n: p2.n, pa: 2, pick: true }), true));
  hints.push(`나누는 수는 그대로이고, 나누어지는 수 ${p2.a * 10}${M.josa(String(p2.a * 10), '이', '가')} ${f0(p2.a * 10, 2)}${M.josa(f0(p2.a * 10, 2), '으로', '로')} ${M.frac(1, 100, true)}배가 되었어요.<br>그러면 몫도 ${M.frac(1, 100, true)}배가 돼요.`);

  // 3번: 단위를 바꾸어 계산하기 (m → cm)
  const p3 = F.gen(() => mk([2, 4, 5, 6, 8], 99), o => o.a !== p2.a && o.a !== p1.a);
  cards.push(M.card(2, `<div class="q-text">길이가 ${f(p3.a, 1)} m인 막대를 ${p3.n}도막으로 똑같이 나누려고 합니다. cm로 바꾸어 한 도막의 길이를 구해 보세요.</div>` +
    `<div class="eq" style="font-size:19px">${f(p3.a, 1)} m = <span class="tail">${M.box(p3.a * 10)} cm</span></div>` +
    `<div class="eq" style="font-size:19px">${M.box(p3.a * 10)} cm ÷ ${p3.n} = <span class="tail">${M.box(p3.q)} cm</span> = <span class="tail">${M.dbox(p3.q, 2)} m</span></div>`, true));
  hints.push(`1 m = 100 cm예요. 0.01 m는 1 cm와 같아요.<br>cm로 바꾸면 자연수의 나눗셈이 되고, 답을 다시 m로 바꾸어요.`);

  // 4번: 세로로 계산하기 (소수점 아래 0을 내려)
  const p4a = mk([2, 4, 5, 6, 8], 99), p4b = F.gen(() => mk([2, 4, 5, 6, 8], 99), o => o.a !== p4a.a);
  cards.push(M.card(3, `<div class="q-text">세로로 계산해 보세요. (흐린 0은 소수점 아래에 내려 쓴 0이에요)</div>` +
    M.line(D.vdiv({ a: p4a.a, pa: 1, n: p4a.n }), D.vdiv({ a: p4b.a, pa: 1, n: p4b.n })), true));
  hints.push(`남은 수가 있는데 더 내릴 숫자가 없으면, 소수점 아래 끝에 0이 있는 것으로 생각하고 0을 내려요.<br>예) 6.8 ÷ 8 → 6.80 ÷ 8 = 0.85`);

  // 5번: 계산하기 + 몫의 크기 비교
  const p5a = mk([2, 4, 5, 6, 8], 99), p5b = F.gen(() => mk([2, 4, 5, 6, 8], 99), o => o.a !== p5a.a);
  const c1 = mk([2, 4, 5, 6, 8], 99), c2 = F.gen(() => mk([2, 4, 5, 6, 8], 99), o => o.q !== c1.q);
  cards.push(M.card(4, `<div class="q-text">계산해 보고, 몫의 크기를 비교해 보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.dbox(p5a.q, 2)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.dbox(p5b.q, 2)}</div>`) +
    `<div class="cmp-row qbox">${ex(c1)} ${M.cmp(c1.q, c2.q)} ${ex(c2)}</div>`, true));
  hints.push(`나누어떨어질 때까지 소수점 아래 0을 내려 계산해요.<br>몫의 크기를 비교할 때는 두 몫을 먼저 구해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
