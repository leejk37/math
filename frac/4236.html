<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 4학년 소수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수 두 자리 수의 덧셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">소수 두 자리 수의 덧셈을 해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 소수점을 맞추면 자릿수가 달라도 더할 수 있어요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 1.82 + 0.5 → 0.01이 182개 + 50개 = 232개 → <b>2.32</b></div>
  <div class="rule-line"><span class="rule-tag t2">① 맞추기</span> <b>소수점</b>을 맞추어 써요. 0.5는 0.50과 같아서 빈 자리에 <b>0</b>이 있다고 생각해요.</div>
  <div class="rule-line"><span class="rule-tag t3">② 더하기</span> 오른쪽 자리부터 더하고, 10이 되면 왼쪽 자리로 받아올림해요.</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 끝자리끼리 맞추면 안 돼요. 1.65 + 0.8 ≠ 1.73 · 1.65 + 0.8 = <b>2.45</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4236 — 소수 두 자리 수의 덧셈 (교과서 4-2-3 68~69쪽, 성취기준 [4수01-16])
const P = 2;
const f = n => M.fmt(n, P), f1 = n => M.fmt(n / 10, 1);   // f1: 소수 한 자리로 보이기(0.01 단위 정수를 받음)

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 모눈에 0.ab가 색칠되어 있음 → 0.cd만큼 더 색칠하고 합 쓰기
  let a1, b1; do { a1 = M.rand(11, 69); b1 = M.rand(11, 39); } while (a1 % 10 === 0 || b1 % 10 === 0 || a1 + b1 > 99 || (a1 % 10) + (b1 % 10) >= 10);
  cards.push(M.card(0, `<div class="q-text">동생은 대추를 ${f(a1)} kg 수확했고, 재윤이는 동생보다 ${f(b1)} kg 더 많이 수확했습니다. 재윤이가 수확한 대추는 몇 kg인가요?</div>` +
    `<div class="q-small">분홍색이 동생이 수확한 ${f(a1)}이에요. ${f(b1)}만큼 이어서 더 색칠해 보세요.</div>` +
    M.line(M.gridPick(a1 + b1, a1, 170),
      `<div class="eq">${f(a1)} + ${f(b1)} = <span class="tail">${M.dbox(a1 + b1, P)} kg</span></div>`), true));
  hints.push(`모눈 한 칸은 0.01이에요. ${f(b1)}은 0.01이 ${b1}칸이에요.<br>분홍 칸 바로 다음 칸부터 ${b1}칸을 더 칠한 뒤, 색칠한 칸을 모두 세어 보세요.`);

  // 2번: 0.01의 개수로 계산 (a.bc + d.e, 자릿수가 다름, 소수 첫째 자리에서 받아올림)
  let x2, e2; do { x2 = M.rand(1, 4) * 100 + M.rand(1, 9) * 10 + M.rand(1, 9); e2 = M.rand(1, 9); } while (Math.floor(x2 / 10) % 10 + e2 < 10);
  const y2 = e2 * 10; // 0.e → 0.01이 e0개
  cards.push(M.card(1, `<div class="q-text">0.01의 개수를 이용하여 ${f(x2)} + ${f1(y2)}${M.josa(e2, '을', '를')} 계산해 보세요.</div>` +
    M.line(`<div class="eq" style="font-size:18px">${f(x2)}${M.josa(f(x2), '은', '는')} 0.01이 <span class="tail">${M.box(x2)}개,</span></div>`,
      `<div class="eq" style="font-size:18px">${f1(y2)}${M.josa(e2, '은', '는')} 0.01이 <span class="tail">${M.box(y2)}개</span></div>`) +
    M.line(`<div class="eq" style="font-size:18px">합은 0.01이 <span class="tail">${M.box(x2 + y2)}개</span></div>`,
      `<div class="eq">→ ${f(x2)} + ${f1(y2)} = <span class="tail">${M.dbox(x2 + y2, P)}</span></div>`), true));
  hints.push(`${f1(y2)}${M.josa(e2, '은', '는')} ${f(y2)}과 같아요. 그래서 0.01이 <b>${y2}개</b>예요 (${e2}개가 아니에요).`);

  // 3번: 세로셈, 자릿수 같음 (① 소수 둘째 자리에서 받아올림 1회  ② 받아올림 2회)
  let A, B;
  do { A = M.rand(1, 6) * 100 + M.rand(0, 8) * 10 + M.rand(1, 9); B = M.rand(1, 6) * 100 + M.rand(0, 8) * 10 + M.rand(1, 9); }
  while (A % 10 + B % 10 < 10 || Math.floor(A / 10) % 10 + Math.floor(B / 10) % 10 + 1 > 9 || Math.floor(A / 100) + Math.floor(B / 100) > 9);
  let C, D;
  do { C = M.rand(1, 6) * 100 + M.rand(1, 9) * 10 + M.rand(1, 9); D = M.rand(1, 6) * 100 + M.rand(1, 9) * 10 + M.rand(1, 9); }
  while (C % 10 + D % 10 < 10 || Math.floor(C / 10) % 10 + Math.floor(D / 10) % 10 + 1 < 10 || Math.floor(C / 100) + Math.floor(D / 100) + 1 > 9);
  cards.push(M.card(2, `<div class="q-text">세로로 계산해 보세요.</div><div class="row">` +
    M.vBlock(`① ${f(A)} + ${f(B)}`, M.vAdd(A, B, P)) + M.vBlock(`② ${f(C)} + ${f(D)}`, M.vAdd(C, D, P)) + `</div>`));
  hints.push('소수 둘째 자리부터 더해요. 0.01이 10개면 0.1이 1개이므로 소수 첫째 자리 위 노란 칸에 1을 써요.<br>소수 첫째 자리 합이 10 이상이면 일의 자리로 받아올림해요.');

  // 4번: 자릿수가 다른 덧셈 — 가로식으로 답만 (끝자리 맞춤 오류 확인)
  let x4, t4; do { x4 = M.rand(1, 5) * 100 + M.rand(1, 9) * 10 + M.rand(1, 9); t4 = M.rand(1, 9); } while (Math.floor(x4 / 10) % 10 + t4 < 10);
  let p4, q4; do { p4 = M.rand(11, 89); q4 = M.rand(11, 89); } while (p4 % 10 === 0 || q4 % 10 === 0 || p4 + q4 < 100 || p4 + q4 === 100);
  cards.push(M.card(3, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq">${f(x4)} + ${f1(t4 * 10)} = <span class="tail">${M.dbox(x4 + t4 * 10, P)}</span></div>`,
      `<div class="eq">${f(p4)} + ${f(q4)} = <span class="tail">${M.dbox(p4 + q4, P)}</span></div>`), true));
  hints.push(`머릿속이나 연습장에서 <b>소수점을 맞추어</b> 세로로 써 보세요. ${f1(t4 * 10)}${M.josa(t4, '은', '는')} ${f(t4 * 10)}과 같아요.<br>${f(p4)} + ${f(q4)}처럼 합이 1을 넘으면 일의 자리에 받아올림이 생겨요.`);

  // 5번: 숫자 카드로 가장 큰·가장 작은 소수 두 자리 수를 만들어 더하기 (교과서 창의+)
  let ds; do { ds = [M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)]; } while (new Set(ds).size < 3);
  const asc = ds.slice().sort((p, q) => p - q), big = asc[2] * 100 + asc[1] * 10 + asc[0], small = asc[0] * 100 + asc[1] * 10 + asc[2];
  cards.push(M.card(4, `<div class="q-text">카드를 한 번씩 모두 사용하여 □.□□ 모양의 소수 두 자리 수를 만들려고 합니다.</div>` +
    `<div class="digit-cards">${ds.map(d => `<div class="digit-card">${d}</div>`).join('')}<div class="digit-card">.</div></div>` +
    M.line(`<div class="eq" style="font-size:18px">가장 큰 수 <span class="tail">${M.dbox(big, P, true)}</span></div>`,
      `<div class="eq" style="font-size:18px">가장 작은 수 <span class="tail">${M.dbox(small, P, true)}</span></div>`,
      `<div class="eq" style="font-size:18px">두 수의 합 <span class="tail">${M.dbox(big + small, P)}</span></div>`), true));
  hints.push('가장 큰 수는 높은 자리(일의 자리)부터 <b>큰 숫자</b>를, 가장 작은 수는 <b>작은 숫자</b>를 놓아요.<br>그다음 소수점을 맞추어 더해요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
