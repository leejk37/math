<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>여러 가지 분수의 곱셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">여러 가지 분수의 곱셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수는 가분수로, 자연수는 분모가 1인 분수로</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 2 1/2 × 1 2/5 = 5/2 × 7/5 = 35/10 = <b>3 1/2</b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 2 1/2 × 1 2/5 = (2 1/2 × 1) + (2 1/2 × 2/5) = 2 1/2 + 1 = <b>3 1/2</b></div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 8 × 2/5 = 8/1 × 2/5 = 16/5 = <b>3 1/5</b> (8은 8/1과 같아요)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5226 — 여러 가지 분수의 곱셈 (교과서 5-2-2 48~49쪽, 수학익힘 36~37쪽, 성취기준 [6수01-10])
// 진단 포인트: 대분수끼리 자연수 부분·분수 부분만 따로 곱함, 가분수로 바꾸지 않고 약분함
const R = M.rand;
M.inlineQuestion = true;
const X = F.OP['x'], P = F.OP['+'], EQ = '<span class="op">=</span>';
const LP = '<span class="op">(</span>', RP = '<span class="op">)</span>';
const ft = F.ft;
// 조사: 분수는 분자를 마지막에 읽으므로(사분의 삼) 분자로, 자연수는 그 수로 받침을 판단
const J = (s, a, b) => { const t = String(s), k = t.includes('/') ? t.split('/')[0].split(' ').pop() : t; return t + M.josa(k, a, b); };
const mix = (lo, hi) => ({ w: R(1, 2), x: F.proper(lo || 2, hi || 6) });
const V = m => F.v(m.w, m.x.n, m.x.d);
const MX = m => F.mx(m.w, m.x.n, m.x.d);
const mt = m => m.w + ' ' + ft(m.x);
const ok = (a, b) => a.x.d * b.x.d <= 36 && V(a).n * V(b).n <= 120;
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 방법 1 (가분수로)
  const [a1, b1] = F.gen(() => [mix(), mix()], ([a, b]) => ok(a, b));
  const p1 = V(a1).n, q1 = V(b1).n;
  cards.push(M.card(0, `<div class="q-text">대분수를 가분수로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${MX(a1)}${X}${MX(b1)}${EQ}${F.fn(p1, a1.x.d)}${X}${F.fn(q1, b1.x.d)}${EQ}${F.tailF(p1 * q1, a1.x.d * b1.x.d)}</div>`, true));
  hints.push('두 대분수를 모두 가분수로 바꾼 다음, 분자끼리 분모끼리 곱해요. 마지막에 약분하고 대분수로 바꾸어요.');

  // 2번: 방법 2 (곱하는 수를 1과 진분수의 합으로)
  const [a2, y2] = F.gen(() => [mix(2, 6), F.proper(2, 6)], ([a, y]) => V(a).n * y.n <= 60 && a.x.d * y.d <= 36);
  const in2 = F.mul(V(a2), y2);
  cards.push(M.card(1, `<div class="q-text">곱하는 대분수를 자연수와 진분수의 합으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${MX(a2)}${X}${F.mx(1, y2.n, y2.d)}${EQ}${LP}${MX(a2)}${X}1${RP}${P}${LP}${MX(a2)}${X}${F.fr(y2.n, y2.d)}${RP}</div>` +
    `<div class="eq">${EQ}${MX(a2)}${P}${LP}${F.fn(V(a2).n, a2.x.d)}${X}${F.fr(y2.n, y2.d)}${RP}${EQ}${MX(a2)}${P}${F.ans(in2)}${EQ}${F.ans(F.add(V(a2), in2))}</div>`, true));
  hints.push(`${mt(a2)} × 1 = ${J(mt(a2), '이에요', '예요')}. ${mt(a2)} × ${J(ft(y2), '은', '는')} 가분수로 바꾸어 곱한 뒤 기약분수로 나타내고, 두 수를 더해요.`);

  // 3번: 계산 (대분수 × 대분수 2문제)
  const C3 = [F.gen(() => [mix(), mix()], ([a, b]) => ok(a, b)), F.gen(() => [mix(), mix()], ([a, b]) => ok(a, b))];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([a, b]) => `<div class="qbox">${F.calc(MX(a) + X + MX(b), F.mul(V(a), V(b)))}</div>`)), true));
  hints.push('대분수 → 가분수 → 분자끼리, 분모끼리 곱하기 → 약분 → 대분수로');

  // 4번: 자연수를 분모가 1인 분수로 (보기처럼)
  const [k4, x4] = F.gen(() => [R(2, 9), F.proper(3, 9)], ([k, x]) => k * x.n > x.d);
  const [x5, k5] = F.gen(() => [F.proper(3, 9), R(2, 9)], ([x, k]) => k * x.n > x.d);
  cards.push(M.card(3, `<div class="q-text">자연수를 분모가 1인 분수로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${k4}${X}${F.fr(x4.n, x4.d)}${EQ}${F.fn(k4, 1)}${X}${F.fr(x4.n, x4.d)}${EQ}${F.tailN(k4 * x4.n, x4.d)}</div>` +
    `<div class="eq">${F.fr(x5.n, x5.d)}${X}${k5}${EQ}${F.fr(x5.n, x5.d)}${X}${F.fn(k5, 1)}${EQ}${F.tailN(k5 * x5.n, x5.d)}</div>`, true));
  hints.push('8은 8/1과 같아요. 자연수를 분모가 1인 분수로 바꾸면 분수끼리의 곱셈처럼 분자끼리, 분모끼리 곱할 수 있어요.');

  // 5번: 문장제 (넓이)
  const [a5, b5] = F.gen(() => [mix(2, 5), mix(2, 5)], ([a, b]) => ok(a, b));
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">지수와 우석이가 꾸미는 직사각형 모양 게시판의 가로는 ${mt(a5)} m, 세로는 ${mt(b5)} m입니다. 게시판의 넓이는 몇 m²인가요?</div>` +
    `<div class="eq">${F.ans(F.mul(V(a5), V(b5)))} <span class="unit">m²</span></div>`, true));
  hints.push(`직사각형의 넓이 = 가로 × 세로이므로 ${mt(a5)} × ${J(mt(b5), '을', '를')} 계산해요. 자연수 부분끼리, 분수 부분끼리만 곱하면 안 돼요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
