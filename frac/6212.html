<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분모가 같은 (분수) ÷ (분수) — 분자끼리 나누어떨어지지 않는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분모가 같은 (분수) ÷ (분수) — 분자끼리 나누어떨어지지 않는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분자끼리 나누어떨어지지 않으면 몫을 분수로!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> <sup>5</sup>⁄<sub>9</sub> ÷ <sup>2</sup>⁄<sub>9</sub> → <sup>2</sup>⁄<sub>9</sub>씩 2번 묶고, 남는 부분은 <sup>2</sup>⁄<sub>9</sub>의 <sup>1</sup>⁄<sub>2</sub> → <b>2<sup>1</sup>⁄<sub>2</sub></b></div>
  <div class="rule-line"><span class="rule-tag t2">계산</span> <sup>5</sup>⁄<sub>7</sub> ÷ <sup>3</sup>⁄<sub>7</sub> = 5 ÷ 3 = <sup>5</sup>⁄<sub>3</sub> = <b>1<sup>2</sup>⁄<sub>3</sub></b> &nbsp;(분자끼리 나눈 몫을 분수로)</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 남는 부분은 나누는 분수(<sup>2</sup>⁄<sub>9</sub>)를 기준으로 읽어요. 1을 기준으로 <sup>1</sup>⁄<sub>9</sub>이라고 읽으면 안 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6212 — 분모가 같은 (분수) ÷ (분수) ⑵ 분자끼리 나누어떨어지지 않는 경우 (교과서 6-2-1 14~15쪽, 수학 익힘 12~13쪽, 성취기준 [6수01-11])
// 진단 포인트: 남는 부분을 1/(분모)로 읽음(7/9 ÷ 2/9 = 3 1/9), 나누어지는 수와 나누는 수를 바꾸어 나눔
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, J } = G;
const sf = G.sf;
const STORY = [
  (a, b, d) => ({ text: `은서네 텃밭에서 상추를 심은 부분의 넓이는 ${a}/${d} m²이고, 토마토를 심은 부분의 넓이는 ${b}/${d} m²입니다. 상추를 심은 부분의 넓이는 토마토를 심은 부분의 넓이의 몇 배인가요?`, unit: '배' }),
  (a, b, d) => ({ text: `빵을 만들기 위해 반죽 ${a}/${d} kg을 틀에 ${b}/${d} kg씩 나누어 담으려고 합니다. 반죽을 몇 틀에 담을 수 있는지 분수로 나타내면 얼마인가요?`, unit: '틀' }),
  (a, b, d) => ({ text: `민호는 우유를 ${a}/${d} L 마셨고, 동생은 ${b}/${d} L 마셨습니다. 민호가 마신 우유의 양은 동생이 마신 우유의 양의 몇 배인가요?`, unit: '배' })
];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 그림 — b/d씩 몇 번 묶고 남는 부분은 b/d의 얼마
  const [d1, a1, b1] = F.gen(() => [R(7, 12), R(3, 11), R(2, 4)], ([d, a, b]) => a < d && a > b && a % b !== 0 && G.coprime(a, b));
  const q1 = Math.floor(a1 / b1), r1 = a1 % b1;
  cards.push(M.card(0, `<div class="q-text">그림을 보고 ${sf(a1, d1)} ÷ ${sf(b1, d1)}${M.josa(b1, '이', '가')} 얼마인지 알아보세요.</div>` + G.jumps(d1, a1, b1) +
    `<div class="eq" style="font-size:18px">${F.fr(a1, d1)}${M.josa(a1, '은', '는')} ${F.fr(b1, d1)}씩 ${M.box(q1)}번 묶을 수 있고, 남는 부분은 ${F.fr(b1, d1)}의 ${F.ff(r1, b1)}입니다.</div>` +
    `<div class="eq">${F.fr(a1, d1)}${DV}${F.fr(b1, d1)}${EQ}${F.ans({ n: a1, d: b1 })}</div>`, true));
  hints.push(`${M.frac(b1, d1, true)}${M.josa(b1, '은', '는')} 작은 칸 ${b1}칸이에요. 남는 칸이 ${r1}칸이면 ${M.frac(b1, d1, true)}(${b1}칸)의 ${M.frac(r1, b1, true)}${M.josa(r1, '이에요', '예요')}.`);

  // 2번: 분자끼리 나누어 계산 (몫이 1보다 큰 것, 작은 것)
  const [d2, a2, b2] = F.gen(() => [R(5, 13), R(3, 12), R(2, 11)], ([d, a, b]) => a < d && b < d && a > b && a % b !== 0 && G.coprime(a, b));
  const [d2b, a2b, b2b] = F.gen(() => [R(7, 15), R(1, 13), R(2, 14)], ([d, a, b]) => a < d && b < d && a < b && G.coprime(a, b));
  cards.push(M.card(1, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    `<div class="eq">${F.fr(a2, d2)}${DV}${F.fr(b2, d2)}${EQ}${M.box(a2)}${DV}${M.box(b2)}${EQ}${F.ff(a2, b2)}${EQ}${F.ans({ n: a2, d: b2 })}</div>` +
    `<div class="eq">${F.fr(a2b, d2b)}${DV}${F.fr(b2b, d2b)}${EQ}${M.box(a2b)}${DV}${M.box(b2b)}${EQ}${F.ff(a2b, b2b)}</div>`, true));
  hints.push('분모가 같으면 분자끼리 나누어요. 나누어떨어지지 않으면 (자연수) ÷ (자연수)처럼 몫을 분수로 나타내요.<br>나누어지는 분자가 분자, 나누는 분자가 분모예요.');

  // 3번: 계산
  const c3 = [0, 1].map(() => F.gen(() => [R(5, 17), R(1, 15), R(2, 16)], ([d, a, b]) => a < d && b < d && a !== b && a % b !== 0));
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c3.map(([d, a, b]) => `<div class="qbox">${F.calc(F.fr(a, d) + DV + F.fr(b, d), F.simp(a, b))}</div>`)), true));
  hints.push('분자끼리 나눈 몫을 분수로 나타내요. 약분할 수 있으면 약분하고, 1보다 크면 대분수로 나타내요.');

  // 4번: 몇 배 문장제
  const [d4, a4, b4] = F.gen(() => [R(5, 13), R(2, 12), R(2, 11)], ([d, a, b]) => a < d && b < d && a > b && a % b !== 0 && G.coprime(a, b));
  const s4 = M.pick(STORY)(a4, b4, d4);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 식을 쓰고 답을 구해 보세요.</div>` + G.word(s4.text) +
    M.line(`<div class="eq">식: ${F.ff(a4, d4)}${DV}${F.ff(b4, d4)}</div>`, `<div class="eq">답: ${F.ans({ n: a4, d: b4 })} ${s4.unit}</div>`), true));
  hints.push('"몇 배인가요?"는 기준이 되는 양으로 나누어요. "~의 몇 배"에서 "~의" 앞에 있는 양이 나누는 수예요.');

  // 5번: 바르게 계산한 것 고르기 (함정: 남는 부분을 1/d로 읽음, 나누는 순서를 바꿈)
  const [d5, a5, b5] = F.gen(() => [R(7, 12), R(5, 11), R(2, 4)], ([d, a, b]) => a < d && a > 2 * b && a % b !== 0 && G.coprime(a, b) &&
    !F.eq({ n: Math.floor(a / b) * d + a % b, d: d }, { n: a, d: b }));
  const pre = `${sf(a5, d5)} ÷ ${sf(b5, d5)} = `;
  const right5 = { n: a5, d: b5 }, bad1 = { n: Math.floor(a5 / b5) * d5 + a5 % b5, d: d5 }, bad2 = { n: b5, d: a5 };
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` +
    F.one(pre + G.fs(right5), [pre + G.fs(bad1), pre + G.fs(bad2)]), true));
  hints.push(`${M.frac(a5, d5, true)}에 ${M.frac(b5, d5, true)}${M.josa(b5, '이', '가')} 몇 번 들어가는지 생각해요. 남는 부분은 ${M.frac(b5, d5, true)}의 몇 분의 몇인지로 나타내요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
