<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수의 크기 비교</title>
</head>
<body>

<div class="header-text">분수의 크기 비교</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모가 다른 분수는 통분한 다음 분자를 비교</div>
  <div class="rule-line"><span class="rule-tag">방법</span> (5/6, 7/10) → (25/30, 21/30) → 25 > 21이므로 <b>5/6 > 7/10</b></div>
  <div class="rule-line"><span class="rule-tag t2">대분수</span> 자연수 부분부터 비교하고, 같으면 분수 부분을 통분해 비교해요.</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분자가 크다고 큰 분수가 아니에요. 7/12 &lt; 5/8</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5145 — 분수의 크기 비교 (교과서 5-1-4 80~81쪽, 수학익힘 50~51쪽, 성취기준 [6수01-07])
// 진단 포인트: 통분하지 않고 분자만(또는 분모만) 비교함, 대분수에서 자연수 부분을 보지 않음
const R = M.rand;
M.inlineQuestion = true;
// 분자만 비교하면 틀리는 두 진분수
function trap() {
  return F.gen(() => [F.proper(3, 12), F.proper(3, 12)], ([x, y]) => x.d !== y.d && !F.eq(x, y) && (x.n > y.n) !== (x.n * y.d > y.n * x.d) && x.n !== y.n);
}
const C = (x, y) => M.cmp(x.n * y.d, y.n * x.d);
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 두 분수 비교 (분자만 보면 틀리는 쌍 2개)
  const T1 = [trap(), trap()];
  cards.push(M.card(0, `<div class="q-text">두 분수의 크기를 비교하여 &gt;, =, &lt; 를 골라 보세요.</div>` +
    M.line(...T1.map(([x, y]) => `<div class="qbox"><div class="eq cmp-row">${F.fr(x.n, x.d)} ${C(x, y)} ${F.fr(y.n, y.d)}</div></div>`)), true));
  hints.push('분자만 보고 비교하면 안 돼요. 통분한 다음 분자를 비교해요.');

  // 2번: 통분하고 비교
  const [x2, y2] = trap(), L2 = F.lcm(x2.d, y2.d);
  cards.push(M.card(1, `<div class="q-text">두 분수를 통분하여 크기를 비교해 보세요.</div>` +
    `<div class="eq">(${F.fr(x2.n, x2.d)}, ${F.fr(y2.n, y2.d)}) → (${F.fn(x2.n * L2 / x2.d, L2)}, ${F.fn(y2.n * L2 / y2.d, L2)})</div>` +
    `<div class="eq cmp-row">${F.fr(x2.n, x2.d)} ${C(x2, y2)} ${F.fr(y2.n, y2.d)}</div>`, true));
  hints.push(`${x2.d}과(와) ${y2.d}의 최소공배수 ${L2}을(를) 공통분모로 해요.`);

  // 3번: 대분수 비교 (자연수가 같은 것, 자연수가 다른 것)
  const [u, v] = trap(), w = R(1, 4);
  const wA = R(1, 4), wB = F.gen(() => R(1, 4), t => t !== wA), [p, q] = trap();
  // 자연수가 다른 쌍은 분수 부분이 큰 쪽의 자연수가 더 작게 (분수 부분만 보면 틀림)
  const [fA, fB] = (wA < wB) === F.lt(q, p) ? [p, q] : [q, p];
  cards.push(M.card(2, `<div class="q-text">두 분수의 크기를 비교해 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq cmp-row">${F.mx(w, u.n, u.d)} ${C(u, v)} ${F.mx(w, v.n, v.d)}</div></div>`,
      `<div class="qbox"><div class="eq cmp-row">${F.mx(wA, fA.n, fA.d)} ${M.cmp(wA, wB)} ${F.mx(wB, fB.n, fB.d)}</div></div>`), true));
  hints.push('자연수 부분을 먼저 비교해요. 자연수가 같을 때만 분수 부분을 통분해 비교해요.');

  // 4번: 세 분수 중 가장 큰 것·가장 작은 것
  const three = F.gen(() => [F.proper(3, 10), F.proper(3, 10), F.proper(3, 10)], l => new Set(l.map(x => x.d)).size === 3 && !F.eq(l[0], l[1]) && !F.eq(l[1], l[2]) && !F.eq(l[0], l[2]));
  const val = x => x.n / x.d, big = three.reduce((a, b) => val(a) > val(b) ? a : b), small = three.reduce((a, b) => val(a) < val(b) ? a : b);
  const opt = three.map(x => [x.n + '_' + x.d, x.n + '/' + x.d]);
  cards.push(M.card(3, `<div class="q-text">${three.map(x => F.fr(x.n, x.d)).join(', ')} 중에서 골라 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">가장 큰 분수 ${M.choices(big.n + '_' + big.d, opt)}</div></div>`,
      `<div class="qbox"><div class="eq">가장 작은 분수 ${M.choices(small.n + '_' + small.d, opt)}</div></div>`), true));
  hints.push('두 분수씩 통분하여 비교해 보세요. 또는 세 분모의 공배수로 한꺼번에 통분해도 돼요.');

  // 5번: 문장제
  const [x5, y5] = trap();
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 알맞은 것을 골라 보세요.</div>` +
    `<div class="word">크기가 같은 통에 딸기 맛 젤라토는 ${x5.n}/${x5.d}만큼, 초코 맛 젤라토는 ${y5.n}/${y5.d}만큼 남아 있습니다. 어느 맛 젤라토가 더 많이 남아 있나요?</div>` +
    M.choices(F.lt(y5, x5) ? 'st' : 'ch', [['st', '딸기 맛'], ['ch', '초코 맛']]), true));
  hints.push('두 분수를 통분하여 분자를 비교해요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
