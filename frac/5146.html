<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수와 소수의 크기 비교</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분수와 소수의 크기 비교</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분수를 소수로, 또는 소수를 분수로 바꾸어 비교</div>
  <div class="rule-line"><span class="rule-tag">분수→소수</span> 3/5 = 6/10 = <b>0.6</b> (분모를 10, 100으로)</div>
  <div class="rule-line"><span class="rule-tag t2">소수→분수</span> 0.48 = 48/100 = <b>12/25</b> (소수 한 자리는 분모 10, 두 자리는 분모 100)</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 2/5와 0.3에서 2 &lt; 3이라고 2/5가 작은 것이 아니에요. 2/5 = 0.4 &gt; 0.3</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5146 — 분수와 소수의 크기 비교 (교과서 5-1-4 82~83쪽, 수학익힘 52~53쪽, 성취기준 [6수01-12])
// 진단 포인트: 분수의 분자와 소수의 숫자만 비교함, 분수를 소수(또는 소수를 분수)로 바꾸지 못함
const R = M.rand;
M.inlineQuestion = true;
// 분모가 10이나 100으로 바뀌는 진분수 (기약)
function dfrac() {
  return F.gen(() => { const d = M.pick([2, 4, 5, 20, 25, 50]); return { n: R(1, d - 1), d }; }, x => F.gcd(x.n, x.d) === 1);
}
const P = x => (x.d === 2 || x.d === 5) ? 1 : 2;               // 소수 몇 자리
const S = x => x.n * Math.pow(10, P(x)) / x.d;                    // 0.6 → 6, 0.48 → 48
const dec = (v, p) => M.fmt(v, p);
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 분수를 소수로
  const X1 = [dfrac(), dfrac()];
  cards.push(M.card(0, `<div class="q-text">분수를 소수로 나타내 보세요.</div>` +
    M.line(...X1.map(x => `<div class="qbox"><div class="eq">${F.fr(x.n, x.d)} = ${F.fn(S(x), Math.pow(10, P(x)))} = ${M.dbox(S(x), P(x), true)}</div></div>`)), true));
  hints.push('분모와 분자에 같은 수를 곱해 분모를 10 또는 100으로 만들어요.');

  // 2번: 소수를 기약분수로
  const x2 = F.gen(dfrac, x => P(x) === 2 && F.gcd(S(x), 100) > 1);
  cards.push(M.card(1, `<div class="q-text">소수를 기약분수로 나타내 보세요.</div>` +
    `<div class="eq">${dec(S(x2), 2)} = ${F.fn(S(x2), 100)} = ${F.ans(x2)}</div>`, true));
  hints.push('소수 두 자리 수는 분모가 100인 분수로 써요. 그다음 약분해요.');

  // 3번: 분수와 소수 비교 (숫자만 보면 틀리는 것 포함)
  const T3 = [0, 1].map(() => F.gen(() => { const x = dfrac(), p = P(x), s = S(x), t = s + M.pick([-3, -2, -1, 1, 2, 3]) * (p === 1 ? 1 : 5); return { x, p, t }; },
    o => o.t > 0 && o.t < Math.pow(10, o.p) && o.t !== S(o.x)));
  cards.push(M.card(2, `<div class="q-text">두 수의 크기를 비교하여 &gt;, =, &lt; 를 골라 보세요.</div>` +
    M.line(...T3.map(o => `<div class="qbox"><div class="eq cmp-row">${F.fr(o.x.n, o.x.d)} ${M.cmp(S(o.x), o.t)} ${dec(o.t, o.p)}</div></div>`)), true));
  hints.push('분수를 소수로 바꾸거나, 소수를 분수로 바꾸어 같은 모양으로 만든 다음 비교해요.');

  // 4번: 1/2보다 작은 수 모두 고르기 (분수와 소수 섞어서)
  const pool = F.gen(() => { const l = []; while (l.length < 6) { const d = R(3, 12), n = R(1, d - 1); if (2 * n !== d && !l.some(v => v[0] === n && v[1] === d)) l.push([n, d]); } return l; },
    l => { const c = l.filter(([n, d]) => 2 * n < d).length; return c >= 2 && c <= 4; });
  cards.push(M.card(3, `<div class="q-text">1/2보다 작은 분수를 모두 골라 보세요.</div>` +
    F.multi(pool.map(([n, d]) => [n + '_' + d, n + '/' + d]), pool.filter(([n, d]) => 2 * n < d).map(([n, d]) => n + '_' + d)), true));
  hints.push('분자를 2배 한 수가 분모보다 작으면 1/2보다 작은 분수예요.');

  // 5번: 문장제
  const T5 = F.gen(() => { const x = F.gen(dfrac, x => P(x) === 1), t = R(1, 9); return { x, t }; }, o => o.t !== S(o.x) && o.x.n !== o.t && (o.x.n > o.t) !== (S(o.x) > o.t));
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 알맞은 것을 골라 보세요.</div>` +
    `<div class="word">망고주스를 준서는 ${T5.x.n}/${T5.x.d} L, 하은이는 ${dec(T5.t, 1)} L 따랐습니다. 누가 망고주스를 더 많이 따랐나요?</div>` +
    M.choices(S(T5.x) > T5.t ? 'j' : 'h', [['j', '준서'], ['h', '하은']]), true));
  hints.push('분수를 소수로 바꾸어 비교해 보세요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
