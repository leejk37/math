<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(대분수) ÷ (자연수)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(대분수) ÷ (자연수)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수의 나눗셈: 두 가지 방법</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 자연수 부분과 진분수 부분으로 나누어 계산해요. 3<sup>3</sup>⁄<sub>7</sub> ÷ 3 = (3 ÷ 3) + (<sup>3</sup>⁄<sub>7</sub> ÷ 3) = 1 + <sup>1</sup>⁄<sub>7</sub> = <b>1<sup>1</sup>⁄<sub>7</sub></b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 가분수로 바꾸어 계산해요. 3<sup>3</sup>⁄<sub>7</sub> ÷ 3 = <sup>24</sup>⁄<sub>7</sub> ÷ 3 = <sup>24 ÷ 3</sup>⁄<sub>7</sub> = <sup>8</sup>⁄<sub>7</sub> = <b>1<sup>1</sup>⁄<sub>7</sub></b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 자연수 부분도 꼭 나누어요. 진분수 부분만 나누면 안 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6115 — (대분수) ÷ (자연수) (교과서 6-1-1 20~21쪽, 수학 익힘 18~19쪽, 성취기준 [6수01-11])
// 진단 포인트: 진분수 부분만 나누고 자연수 부분은 그대로 둠(1 5/12 ÷ 5 = 1 1/12, 익힘 19쪽 6번)
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, X, P, LP, RP, J, ro } = G;
const ft = F.ft;
const mt = (w, x) => w + ' ' + ft(x);
const STORY = [
  (w, x, k) => ({ unit: 'g', text: `플라스틱 병뚜껑 ${mt(w, x)} g을 새 활용하여 똑같은 열쇠고리 ${k}개를 만들었습니다. 열쇠고리 한 개를 만드는 데 사용한 병뚜껑은 몇 g인가요?` }),
  (w, x, k) => ({ unit: 'L', text: `우유 ${mt(w, x)} L를 ${k}명이 똑같이 나누어 마셨습니다. 한 사람이 마신 우유는 몇 L인가요?` }),
  (w, x, k) => ({ unit: 'km', text: `길이가 ${mt(w, x)} km인 철망을 똑같이 나누어 유도울타리 ${k}개를 만들었습니다. 유도울타리 한 개를 만드는 데 사용한 철망은 몇 km인가요?` })
];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 방법 1 — 자연수 부분과 진분수 부분으로 나누어 (자연수 부분이 나누어떨어짐)
  const [q1, x1, k1] = F.gen(() => [R(1, 3), G.proper(2, 7), R(2, 4)], ([q, x, k]) => G.coprime(x.n, k) && x.d * k <= 28);
  const w1 = q1 * k1;
  cards.push(M.card(0, `<div class="q-text">대분수를 자연수 부분과 진분수 부분으로 나누어 계산해 보세요.</div>` +
    `<div class="eq">${F.mx(w1, x1.n, x1.d)}${DV}${k1}${EQ}${LP}${w1}${DV}${k1}${RP}${P}${LP}${F.fr(x1.n, x1.d)}${DV}${k1}${RP}</div>` +
    `<div class="eq">${EQ}${M.box(q1)}${P}${F.ff(x1.n, x1.d * k1)}${EQ}${F.ans({ n: q1 * x1.d * k1 + x1.n, d: x1.d * k1 })}</div>`, true));
  hints.push(`자연수 부분 ${w1}${M.josa(w1, '을', '를')} ${ro(k1)} 나누고, 진분수 부분 ${ft(x1)}도 ${ro(k1)} 나누어 더해요.<br>진분수 부분은 분자가 ${k1}의 배수가 되도록 크기가 같은 분수로 바꾸어 나누어요.`);

  // 2번: 방법 2 — 가분수로 바꾸어 곱셈으로
  const [w2, x2, k2] = F.gen(() => [R(1, 4), G.proper(2, 9), R(2, 7)], ([w, x, k]) => w % k !== 0 && (w * x.d + x.n) <= 40 && x.d * k <= 63);
  const p2 = w2 * x2.d + x2.n;
  cards.push(M.card(1, `<div class="q-text">대분수를 가분수로 바꾸어 계산해 보세요.</div>` +
    `<div class="eq">${F.mx(w2, x2.n, x2.d)}${DV}${k2}${EQ}${F.fn(p2, x2.d)}${DV}${k2}${EQ}${F.fn(p2, x2.d)}${X}${F.fd(1, k2)}${EQ}${F.tailF(p2, x2.d * k2)}</div>`, true));
  hints.push('가분수의 분자 = 자연수 × 분모 + 분자예요.<br>가분수로 바꾼 다음 ÷ (자연수)를 × 1/(자연수)로 바꾸어 계산해요.');

  // 3번: 계산
  const c3 = [0, 1].map(() => F.gen(() => [R(1, 5), G.proper(2, 9), R(2, 6)], ([w, x, k]) => (w * x.d + x.n) <= 50 && x.d * k <= 54));
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c3.map(([w, x, k]) => `<div class="qbox">${F.calc(F.mx(w, x.n, x.d) + DV + k, G.div(F.v(w, x.n, x.d), G.nat(k)))}</div>`)), true));
  hints.push('두 가지 방법 중 편한 방법으로 계산해요. 자연수 부분이 자연수로 나누어떨어지지 않으면 가분수로 바꾸는 방법이 편해요.');

  // 4번: 잘못 계산한 곳 찾기 (진분수 부분만 나눔) + 옳은 계산
  const [w4, m4, d4, k4] = F.gen(() => [R(1, 3), R(1, 3), R(5, 13), R(2, 5)], ([w, m, d, k]) => w % k !== 0 && m * k < d && G.coprime(m * k, d) && G.coprime(m, d));
  const n4 = m4 * k4;
  cards.push(M.card(3, `<div class="q-text">잘못 계산한 이유를 고르고, 옳게 계산해 보세요.</div>` +
    `<div class="wrong-calc">${F.mx(w4, n4, d4)}${DV}${k4}${EQ}${F.mx(w4, n4 + ' ÷ ' + k4, d4)}${EQ}${F.mx(w4, m4, d4)}</div>` +
    `<div class="sub-q">이유</div>` +
    G.why('자연수 부분은 나누지 않고 진분수 부분만 나누었어요.',
      ['분모도 자연수로 나누어야 해요.', '나눗셈을 곱셈으로 바꾸지 않았어요.']) +
    `<div class="sub-q">옳은 계산</div>` +
    `<div class="eq">${F.mx(w4, n4, d4)}${DV}${k4}${EQ}${F.ans(G.div(F.v(w4, n4, d4), G.nat(k4)))}</div>`, true));
  hints.push(`자연수 부분 ${w4}도 ${ro(k4)} 나누어야 해요. 대분수를 가분수로 바꾸면 실수를 줄일 수 있어요.`);

  // 5번: 문장제
  const [w5, x5, k5] = F.gen(() => [R(1, 22), G.proper(3, 9), R(2, 5)], ([w, x, k]) => (w * x.d + x.n) <= 160 && x.d * k <= 45);
  const s5 = M.pick(STORY)(w5, x5, k5);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` + G.word(s5.text) +
    `<div class="eq">${F.ans(G.div(F.v(w5, x5.n, x5.d), G.nat(k5)))} ${s5.unit}</div>`, true));
  hints.push(`${mt(w5, x5)} ÷ ${k5}${M.josa(k5, '을', '를')} 계산해요. 대분수를 가분수로 바꾸어 계산해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
