<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>대분수의 덧셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">대분수의 덧셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수의 덧셈: 두 가지 방법</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 자연수끼리, 분수끼리 더해요. 1 3/4 + 2 1/8 = 1 6/8 + 2 1/8 = <b>3 7/8</b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 가분수로 바꾸어 더해요. 1 3/4 + 2 1/8 = 14/8 + 17/8 = 31/8 = <b>3 7/8</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분수 부분의 합이 1보다 크면 1을 자연수 부분으로 올려요. 3 7/6 = 4 1/6</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5153 — 대분수의 덧셈 (교과서 5-1-5 100~101쪽, 수학익힘 60~61쪽, 성취기준 [6수01-08])
// 진단 포인트: 분수 부분의 합이 1보다 클 때 자연수로 올리지 않음, 통분하지 않고 더함
const R = M.rand;
M.inlineQuestion = true;
// 진분수 두 개: 분모가 다르고, 최소공배수가 lim 이하
function two(test, lim) {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= (lim || 36) && (!test || test(x, y)));
}
const L = (x, y) => F.lcm(x.d, y.d);
const ft = x => x.n + '/' + x.d;
const W = () => R(1, 4);
function generate() {
  M.reset();
  const cards = [], hints = [];
  const carry = (x, y) => x.n * y.d + y.n * x.d > x.d * y.d;
  const nocarry = (x, y) => x.n * y.d + y.n * x.d < x.d * y.d;
  // 1번: 방법 1 (자연수끼리, 분수끼리) — 받아올림 있음
  const [x1, y1] = two(carry, 30), a1 = W(), b1 = W();
  cards.push(M.card(0, `<div class="q-text">자연수는 자연수끼리, 분수는 분수끼리 계산해 보세요.</div>` + F.stepsMM(a1, x1, b1, y1, '+', L(x1, y1)), true));
  hints.push('통분한 다음 자연수끼리, 분수끼리 더해요. 분수 부분이 1보다 크면 1을 자연수로 올려요.');

  // 2번: 방법 2 (가분수로 바꾸어)
  const [x2, y2] = two(null, 24), a2 = R(1, 3), b2 = R(1, 3);
  cards.push(M.card(1, `<div class="q-text">대분수를 가분수로 나타내어 계산해 보세요.</div>` + F.stepsImp(a2, x2, b2, y2, '+', L(x2, y2)), true));
  hints.push('가분수의 분자 = 자연수 × 분모 + 분자예요. 통분하여 더한 다음 대분수로 바꾸어요.');

  // 3번: 계산 (받아올림 없음 1, 있음 1)
  const C3 = [[two(nocarry), W(), W()], [two(carry), W(), W()]];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([[x, y], a, b]) => `<div class="qbox">${F.calc(F.mx(a, x.n, x.d) + F.OP['+'] + F.mx(b, y.n, y.d), F.add(F.v(a, x.n, x.d), F.v(b, y.n, y.d)))}</div>`)), true));
  hints.push('통분 → 자연수끼리, 분수끼리 더하기 → 분수 부분이 1보다 크면 자연수로 올리기');

  // 4번: 문장제
  const [x4, y4] = two(), a4 = R(1, 3), b4 = R(1, 3);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">소윤이는 청소하는 데 물을 ${a4} ${ft(x4)}통 사용한 후, 부족하여 ${b4} ${ft(y4)}통을 더 사용했습니다. 사용한 물은 모두 몇 통인가요?</div>` +
    `<div class="eq">${F.ans(F.add(F.v(a4, x4.n, x4.d), F.v(b4, y4.n, y4.d)))} 통</div>`, true));
  hints.push('사용한 물의 양을 더해요. 대분수의 덧셈이에요.');

  // 5번: 어림 (자연수와 비교)
  const [x5, y5] = two(), a5 = W(), b5 = W(), K5 = a5 + b5 + 1, s5 = F.add(F.v(a5, x5.n, x5.d), F.v(b5, y5.n, y5.d));
  cards.push(M.card(4, `<div class="q-text">계산 결과가 ${K5}보다 큰지 작은지 비교해 보세요.</div>` +
    `<div class="eq cmp-row">${F.mx(a5, x5.n, x5.d)} + ${F.mx(b5, y5.n, y5.d)} ${M.cmp(s5.n, K5 * s5.d)} ${K5}</div>`, true));
  hints.push(`자연수 부분의 합은 ${a5 + b5}이에요. 분수 부분의 합이 1보다 큰지 작은지 생각해 보세요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
