<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(자연수) ÷ (분수)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(자연수) ÷ (분수)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 자연수를 분자로 나누고, 분모를 곱해요</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 6 kg을 <sup>3</sup>⁄<sub>4</sub>시간에 포장 → <sup>1</sup>⁄<sub>4</sub>시간에 6 ÷ 3 = 2 kg → 1시간에 2 × 4 = <b>8 kg</b></div>
  <div class="rule-line"><span class="rule-tag t2">계산</span> 12 ÷ <sup>3</sup>⁄<sub>4</sub> = (12 ÷ 3) × 4 = <b>16</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분자로 나누고 분모를 곱해요. 분모로 나누고 분자를 곱하면 안 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6214 — (자연수) ÷ (분수) (교과서 6-2-1 18~19쪽, 수학 익힘 16~17쪽, 성취기준 [6수01-11])
// 진단 포인트: 분모로 나누고 분자를 곱함(분자·분모 역할 혼동), 분모를 빠뜨리고 분자로만 나눔
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, X, LP, RP, J, ro } = G;
const sf = G.sf;
const STORY1 = [
  (n, a, b) => ({ thing: '한라봉', verb: '수확하는', text: `예원이가 한라봉 ${n} kg을 수확하는 데 ${a}/${b}시간이 걸렸습니다. 같은 빠르기로 1시간 동안 수확할 수 있는 한라봉은 몇 kg인가요?` }),
  (n, a, b) => ({ thing: '초콜릿', verb: '포장하는', text: `다현이와 친구들이 초콜릿 ${n} kg을 포장하는 데 ${a}/${b}시간이 걸렸습니다. 같은 빠르기로 1시간 동안 포장할 수 있는 초콜릿은 몇 kg인가요?` }),
  (n, a, b) => ({ thing: '감자', verb: '캐는', text: `할머니께서 감자 ${n} kg을 캐는 데 ${a}/${b}시간이 걸렸습니다. 같은 빠르기로 1시간 동안 캘 수 있는 감자는 몇 kg인가요?` })
];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 두 단계 — 1/b시간 동안의 양 → 1시간 동안의 양
  const [a1, b1, m1] = F.gen(() => [R(2, 4), R(3, 7), R(2, 5)], ([a, b]) => a < b && G.coprime(a, b));
  const n1 = a1 * m1;
  const s1 = M.pick(STORY1)(n1, a1, b1);
  cards.push(M.card(0, `<div class="q-text">문제를 읽고 빈칸에 알맞은 수를 써넣으세요.</div>` + G.word(s1.text) +
    `<table class="flow">` +
    `<tr><td class="lab">${sf(1, b1)}시간 동안</td><td><div class="eq">${n1}${DV}${M.box(a1)}${EQ}${M.box(m1)} (kg)</div></td></tr>` +
    `<tr><td class="lab">1시간 동안</td><td><div class="eq">${M.pairbox('m', m1, 0)}${X}${M.pairbox('m', b1, 0)}${EQ}${M.box(m1 * b1)} (kg)</div></td></tr>` +
    `<tr><td class="lab">하나의 식으로</td><td><div class="eq">${n1}${DV}${F.fr(a1, b1)}${EQ}${LP}${n1}${DV}${M.box(a1)}${RP}${X}${M.box(b1)}${EQ}${M.box(m1 * b1)}</div></td></tr>` +
    `</table>`, true));
  hints.push(`${M.frac(a1, b1, true)}시간은 ${M.frac(1, b1, true)}시간이 ${a1}번이에요. 그래서 ${M.frac(1, b1, true)}시간 동안의 양은 ${n1} ÷ ${G.ye(a1)}.<br>1시간은 ${M.frac(1, b1, true)}시간이 ${b1}번이므로 ${b1}배를 해요.`);

  // 2번: (자연수 ÷ 분자) × 분모
  const q2 = [0, 1].map(() => F.gen(() => [R(2, 7), R(3, 11), R(1, 6)], ([a, b]) => a < b && G.coprime(a, b)));
  cards.push(M.card(1, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(...q2.map(([a, b, m]) => `<div class="eq qbox">${a * m}${DV}${F.fr(a, b)}${EQ}${LP}${a * m}${DV}${M.box(a)}${RP}${X}${M.box(b)}${EQ}${M.box(m * b)}</div>`)), true));
  hints.push('자연수를 분수의 분자로 나눈 다음, 분수의 분모를 곱해요.');

  // 3번: 계산
  const c3 = [0, 1].map(() => F.gen(() => [R(2, 9), R(3, 13), R(1, 5)], ([a, b]) => a < b && G.coprime(a, b)));
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c3.map(([a, b, m]) => `<div class="eq qbox">${a * m}${DV}${F.fr(a, b)}${EQ}${M.box(m * b)}</div>`)), true));
  hints.push('(자연수 ÷ 분자) × 분모로 계산해요.');

  // 4번: 문장제 — 전체를 채우는 데 걸리는 시간
  const [a4, b4, m4] = F.gen(() => [R(2, 4), R(3, 9), R(1, 4)], ([a, b]) => a < b && G.coprime(a, b));
  const h4 = a4 * m4;
  const T4 = M.pick([
    `무선 청소기의 배터리를 ${a4}/${b4}만큼 충전하는 데 ${h4}시간이 걸렸습니다. 같은 빠르기로 충전된다면 배터리를 완전히 충전하는 데 걸리는 시간은 몇 시간인가요?`,
    `물통의 ${a4}/${b4}만큼 물을 채우는 데 ${h4}분이 걸렸습니다. 같은 빠르기로 물을 받는다면 물통을 가득 채우는 데 걸리는 시간은 몇 분인가요?`
  ]);
  const u4 = T4.includes('분이') ? '분' : '시간';
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 식을 쓰고 답을 구해 보세요.</div>` + G.word(T4) +
    M.line(`<div class="eq">식: ${M.box(h4)}${DV}${F.ff(a4, b4)}</div>`, `<div class="eq">답: ${M.box(m4 * b4)} ${u4}</div>`), true));
  hints.push(`전체의 ${M.frac(a4, b4, true)}만큼에 ${h4}${u4}이 걸렸으므로, 전체(1)에 걸리는 시간은 ${h4} ÷ ${M.frac(a4, b4, true)}${M.josa(a4, '이에요', '예요')}.`);

  // 5번: 바르게 계산한 것 고르기 (함정: 분모로 나누고 분자를 곱함, 분자로만 나눔)
  const [a5, b5, m5] = F.gen(() => [R(2, 5), R(3, 9), R(2, 4)], ([a, b, m]) => a < b && G.coprime(a, b) && (a * m) % b !== 0);
  const n5 = a5 * m5;
  const pre = `${n5} ÷ ${sf(a5, b5)} = `;
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` +
    F.one(pre + `(${n5} ÷ ${a5}) × ${b5} = ${m5 * b5}`,
      [pre + `(${n5} ÷ ${b5}) × ${a5} = ${G.fs(F.simp(n5 * a5, b5))}`, pre + `${n5} ÷ ${a5} = ${m5}`]), true));
  hints.push(`${M.frac(a5, b5, true)}${M.josa(a5, '은', '는')} ${M.frac(1, b5, true)}이 ${a5}개예요. 먼저 분자 ${ro(a5)} 나누어 ${M.frac(1, b5, true)}만큼의 값을 구하고, 분모 ${b5}만큼 곱해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
