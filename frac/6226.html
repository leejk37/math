<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>나누어 주고 남는 양 알아보기</title>
</head>
<body>

<div class="header-text">나누어 주고 남는 양을 알아보아요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 몫은 자연수까지만 구하고, 남는 양은 나누어지는 수의 소수점에 맞추어 써요!</div>
  <div class="rule-line"><span class="rule-tag">뺄셈</span> 8.5 − 2 − 2 − 2 − 2 = 0.5 → 8.5 ÷ 2 = 4 … 0.5</div>
  <div class="rule-line"><span class="rule-tag t3">확인</span> 2 × 4 + 0.5 = 8.5</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 사람 수, 상자 수는 자연수예요. 몫을 소수로 구하지 않아요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6226 — 나누어 주고 남는 양 알아보기 (교과서 6-2-2 46~47쪽, 수학 익힘 34~35쪽)
const f = M.fmt;
const STORY = [
  { thing: '밀가루', unit: 'kg', who: '사람', cnt: '명', verb: (a, n) => `밀가루 ${a} kg을 한 사람에게 ${n} kg씩 나누어 주려고 합니다.` },
  { thing: '철사', unit: 'm', who: '사람', cnt: '명', verb: (a, n) => `철사 ${a} m를 한 사람에게 ${n} m씩 나누어 주려고 합니다.` },
  { thing: '고구마', unit: 'kg', who: '상자', cnt: '상자', verb: (a, n) => `고구마 ${a} kg을 한 상자에 ${n} kg씩 나누어 담으려고 합니다.` },
  { thing: '물', unit: 'L', who: '사람', cnt: '명', verb: (a, n) => `물 ${a} L를 한 사람에게 ${n} L씩 나누어 주려고 합니다.` }
];
// 나누어지는 수 a(소수 한 자리), 나누는 수 n(자연수) → 몫 q(자연수), 남는 양 r(소수 한 자리, 0이 아니고 소수 부분이 있음)
function mk(nLo, nHi, qLo, qHi, test) {
  return F.gen(() => { const n = M.rand(nLo, nHi), q = M.rand(qLo, qHi), r = M.rand(1, n * 10 - 1); return { n, q, r, a: q * n * 10 + r }; },
    o => o.r % 10 !== 0 && (!test || test(o)));
}
const ex = (o) => `${f(o.a, 1)} ÷ ${o.n}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 막대 그림 — 뺄셈식으로 알아보기
  const p1 = mk(2, 4, 3, 5);
  const s1 = M.pick(STORY);
  cards.push(M.card(0, `<div class="q-text">${s1.verb(f(p1.a, 1), p1.n)} 나누어 줄 수 있는 ${s1.who} 수와 남는 ${s1.thing}의 양을 뺄셈식으로 알아보세요.</div>` +
    D.takeBar(p1.a, 1, p1.n, s1.unit) +
    `<div class="eq" style="font-size:19px">${f(p1.a, 1)}${new Array(p1.q + 1).join(' − ' + p1.n)} = ${M.dbox(p1.r, 1)}</div>` +
    `<div class="eq" style="font-size:19px">➡ ${ex(p1)} = ${M.box(p1.q)} … ${M.dbox(p1.r, 1)}</div>`, true));
  hints.push(`${f(p1.a, 1)}에서 ${p1.n}씩 더 뺄 수 없을 때까지 빼요. 뺀 횟수가 몫, 남은 수가 남는 양이에요.<br>막대 그림에서 ${p1.n} ${s1.unit}씩 묶음이 몇 개인지 세어 보세요.`);

  // 2번: 세로로 계산하기 — 몫은 자연수까지, 남는 양의 소수점
  const p2 = mk(3, 9, 2, 9, o => o.a >= 100);
  const s2 = M.pick(STORY);
  cards.push(M.card(1, `<div class="q-text">${s2.verb(f(p2.a, 1), p2.n)} 몫을 자연수까지 구하여 나누어 줄 수 있는 ${s2.who} 수와 남는 양을 알아보세요.</div>` +
    `<div class="row" style="align-items:center">${D.vdiv({ a: p2.a, pa: 1, n: p2.n, qp: 0 })}` +
    `<div style="display:flex;flex-direction:column;gap:12px">` +
    `<div class="eq" style="font-size:19px">${s2.who} 수: <span class="tail">${M.box(p2.q)} ${s2.cnt}</span></div>` +
    `<div class="eq" style="font-size:19px">남는 ${s2.thing}: <span class="tail">${M.dbox(p2.r, 1)} ${s2.unit}</span></div></div></div>`, true));
  hints.push(`몫의 일의 자리까지만 구하고 멈춰요. 마지막에 남은 수가 남는 양이에요.<br>남는 양의 소수점은 나누어지는 수의 소수점에 맞추어 찍어요.`);

  // 3번: 계산 결과 확인하기 (검산)
  const p3 = mk(3, 9, 2, 9, o => o.a >= 100 && o.a !== p2.a);
  cards.push(M.card(2, `<div class="q-text">${ex(p3)}${M.josa(String(p3.n), '을', '를')} 몫을 자연수까지 구하고, 계산 결과가 맞는지 확인해 보세요.</div>` +
    `<div class="eq">${ex(p3)} = ${M.box(p3.q)} … ${M.dbox(p3.r, 1)}</div>` +
    `<div class="eq" style="font-size:19px">확인: ${p3.n} × ${M.box(p3.q)} + ${M.dbox(p3.r, 1)} = ${M.dbox(p3.a, 1)}</div>`, true));
  hints.push(`(나누는 수) × (몫) + (남는 양) = (나누어지는 수)가 되면 맞게 계산한 거예요.<br>남는 양은 나누는 수 ${p3.n}보다 작아야 해요.`);

  // 4번: 잘못 계산한 곳 찾기 (몫을 소수까지 구함)
  const p4 = mk(2, 5, 3, 9, o => (o.a % o.n === 0) && o.r % 10 !== 0);
  const wq = p4.a / p4.n;                       // 몫을 소수 첫째 자리까지 구한 값(0.1 단위)
  const why = F.one('사람 수는 자연수이므로 몫을 자연수까지만 구해야 해요', ['몫의 소수점을 잘못 찍었어요', '나누는 수와 나누어지는 수를 바꾸어 나누었어요']);
  cards.push(M.card(3, `<div class="q-text">페인트 ${f(p4.a, 1)} L를 한 사람에게 ${p4.n} L씩 나누어 주려고 합니다. 잘못 계산한 이유를 고르고, 옳게 계산해 보세요.</div>` +
    `<div class="row" style="align-items:center">` + D.wrongBox('잘못한 계산', D.vdivShow({ a: p4.a, pa: 1, n: p4.n }), `사람 수: ${Math.floor(wq / 10)}명, 남는 페인트: ${f(wq % 10, 1)} L`) +
    `<div style="display:flex;flex-direction:column;gap:12px;align-items:center">${why}` +
    `<div class="eq" style="font-size:19px">사람 수: <span class="tail">${M.box(p4.q)} 명</span></div>` +
    `<div class="eq" style="font-size:19px">남는 페인트: <span class="tail">${M.dbox(p4.r, 1)} L</span></div></div></div>`, true));
  hints.push(`몫을 소수 첫째 자리까지 구하면 남는 양을 알 수 없어요.<br>몫의 일의 자리까지만 나누고, 그때 남은 수가 남는 페인트의 양이에요.`);

  // 5번: 계산하기 (몫은 자연수까지)
  const p5a = mk(3, 9, 2, 9, o => o.a >= 100), p5b = mk(3, 9, 3, 9, o => o.a >= 200 && o.a !== p5a.a);
  cards.push(M.card(4, `<div class="q-text">몫을 자연수까지 구하고, 남는 양을 알아보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.box(p5a.q)} … ${M.dbox(p5a.r, 1)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.box(p5b.q)} … ${M.dbox(p5b.r, 1)}</div>`), true));
  hints.push(`몫은 자연수까지만 구해요. 남는 양은 나누는 수보다 작아야 해요.<br>예) 21.3 ÷ 4 = 5 … 1.3`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
