<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>크기가 같은 분수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">크기가 같은 분수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 크기가 같은 분수: 나타내는 양이 같은 분수</div>
  <div class="rule-line"><span class="rule-tag">그림</span> 1/2, 2/4, 3/6, 4/8은 색칠한 부분의 길이가 같아요 → 크기가 같은 분수</div>
  <div class="rule-line"><span class="rule-tag t2">규칙</span> 분모가 2배, 3배, …가 되면 분자도 2배, 3배, …가 돼요.</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 1/2과 2/3처럼 분모·분자에 1씩 더한 분수는 크기가 같지 않아요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5141 — 크기가 같은 분수 (교과서 5-1-4 72~73쪽, 수학익힘 42~43쪽, 성취기준 [6수01-06])
// 진단 포인트: 분모·분자에 같은 수를 더해도 크기가 같다고 생각함, 그림의 칸 수만 보고 크기를 비교함
const R = M.rand;
M.inlineQuestion = true;
// 크기가 같은 분수 두 개 + 분모·분자에 같은 수를 더한 분수 두 개
function eqSet(b) {
  const a = F.proper(2, 5);
  const eq = [2, 3, 4].map(m => [a.n * m, a.d * m]), add = [1, 2, 3].map(k => [a.n + k, a.d + k]);
  return { a, eq: M.shuffle(eq).slice(0, 2), add: M.shuffle(add).slice(0, 2) };
}
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 막대 그림 두 개 → 분수로 나타내고 크기 비교
  const a1 = F.proper(2, 5), m1 = R(2, 3);
  cards.push(M.card(0, `<div class="q-text">색칠한 부분을 분수로 나타내고, 크기를 비교해 보세요.</div>` +
    `<div>${F.bar(a1.d, a1.n)}<br>${F.bar(a1.d * m1, a1.n * m1)}</div>` +
    `<div class="eq cmp-row">${F.fn(a1.n, a1.d)} ${M.cmp(1, 1)} ${F.fn(a1.n * m1, a1.d * m1)}</div>`, true));
  hints.push('두 막대에서 색칠한 부분의 길이를 비교해요. 길이가 같으면 크기가 같은 분수예요.');

  // 2번: 1/2 = □/4 = □/6 = □/8 꼴
  const a2 = F.proper(2, 5);
  cards.push(M.card(1, `<div class="q-text">크기가 같은 분수를 만들어 보세요.</div>` +
    `<div class="eq">${F.fr(a2.n, a2.d)} = ${[2, 3, 4].map(m => F.fn(a2.n * m, a2.d * m)).join(' = ')}</div>`, true));
  hints.push('분모가 몇 배가 되었는지 보고, 분자도 같은 만큼 몇 배 해요.');

  // 3번: 크기가 같은 분수 모두 고르기 (함정: 분모·분자에 같은 수를 더한 분수)
  const s3 = eqSet();
  const o3 = M.shuffle(s3.eq.concat(s3.add)).map(([n, d]) => [n + '_' + d, n + '/' + d]);
  cards.push(M.card(2, `<div class="q-text">${F.fr(s3.a.n, s3.a.d)}와(과) 크기가 같은 분수를 모두 골라 보세요.</div>` +
    F.multi(o3, s3.eq.map(([n, d]) => n + '_' + d)), true));
  hints.push('분모와 분자가 같은 만큼 몇 배가 되었는지 확인해요. 같은 수를 더한 것은 크기가 달라요.');

  // 4번: 그림으로 크기 비교 (같을 수도, 다를 수도)
  const t4 = F.gen(() => { const x = F.proper(2, 6), y = R(0, 1) ? { n: x.n * 2, d: x.d * 2 } : { n: x.n + 1, d: x.d + 1 }; return [x, y]; }, ([x, y]) => y.d <= 12);
  const [x4, y4] = R(0, 1) ? t4 : [t4[1], t4[0]];
  cards.push(M.card(3, `<div class="q-text">그림을 보고 두 분수의 크기를 비교해 보세요.</div>` +
    `<div>${F.bar(x4.d, x4.n)}<br>${F.bar(y4.d, y4.n)}</div>` +
    `<div class="eq cmp-row">${F.fr(x4.n, x4.d)} ${M.cmp(x4.n * y4.d, y4.n * x4.d)} ${F.fr(y4.n, y4.d)}</div>`, true));
  hints.push('색칠한 부분의 오른쪽 끝을 비교해요. 더 길게 색칠된 쪽이 더 큰 분수예요.');

  // 5번: 분모가 정해진 크기가 같은 분수
  const a5 = F.proper(2, 6), m5 = R(2, 4);
  cards.push(M.card(4, `<div class="q-text">${F.fr(a5.n, a5.d)}와(과) 크기가 같은 분수 중에서 분모가 ${a5.d * m5}인 분수를 써 보세요.</div>` +
    `<div class="eq">${F.fn(a5.n * m5, a5.d * m5)}</div>`, true));
  hints.push(`${a5.d}을(를) 몇 배 하면 ${a5.d * m5}이(가) 되나요? 분자도 같은 만큼 몇 배 해요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
