<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결(활동 페이지: 기록 없음): 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<title>원을 똑같이 나누어 봅시다</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  .act-in{display:flex;gap:8px;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#1e293b}
  .act-in input{width:64px;height:40px;border:2px solid #94a3b8;border-radius:8px;font-size:20px;font-weight:bold;text-align:center;font-family:inherit;color:#0284c7}
  .act-in input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
  .act-btn{border:none;border-radius:8px;padding:9px 16px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;background:#3b82f6;color:#fff}
  .act-btn.sub{background:#e2e8f0;color:#334155}
  .act-msg{font-size:15px;font-weight:bold;min-height:22px;text-align:center}
  .act-msg.bad{color:#b91c1c}.act-msg.ok{color:#15803d}
</style>
</head>
<body>

<div class="header-text">원을 똑같이 나누어 봅시다</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 똑같이 나누면 조각의 모양과 크기가 모두 같아요</div>
  <div class="rule-line"><span class="rule-tag">해 보기</span> 나누고 싶은 수(2~12)를 쓰고 <b>나누기</b>를 누르세요.</div>
  <div class="rule-line"><span class="rule-tag t2">색칠</span> 조각을 누르면 색칠돼요. 몇 조각 중 몇 조각인지 말해 보세요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<script>
// 3161 — 원을 똑같이 나누기 (교과서 3-1 6단원 '분수와 소수' 도입 활동) — 채점·기록 없음
M.inlineQuestion = true;
const SHAPES = [
  ['원', n => S.circle(n, 0, { pick: true, size: 200 })],
  ['직사각형', n => S.rect(n, 0, { pick: true, w: 280, h: 150 })]
];
function generate() {
  M.reset();
  const cards = SHAPES.map(([name], i) => M.card(i,
    `<div class="q-text">${name}을(를) 똑같이 나누어 보세요.</div>`.replace('원을(를)', '원을').replace('직사각형을(를)', '직사각형을') +
    `<div class="act-in"><input type="text" inputmode="numeric" maxlength="2" id="n-${i}" value="${[4, 3][i]}"> 조각으로 ` +
    `<button type="button" class="act-btn" onclick="draw(${i})">나누기</button>` +
    `<button type="button" class="act-btn sub" onclick="draw(${i})">색칠 지우기</button></div>` +
    `<div id="pic-${i}"></div><div class="act-msg" id="msg-${i}"></div>`, true));
  M.render(cards, [
    '조각의 크기가 서로 다르면 똑같이 나눈 것이 아니에요. 가운데 점에서 똑같은 간격으로 나누어요.',
    '세로로 같은 너비만큼 나누면 똑같이 나눌 수 있어요.'
  ]);
  document.querySelectorAll('#quiz .quiz-number').forEach((e, i) => { e.textContent = '활동 ' + (i + 1); });
  SHAPES.forEach((_, i) => {
    const inp = document.getElementById('n-' + i);
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g, ''); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') draw(i); });
    draw(i);
  });
}
// 색칠한 조각 수 세기 (활동용 — 채점하지 않음)
function draw(i) {
  const n = parseInt(document.getElementById('n-' + i).value, 10), msg = document.getElementById('msg-' + i), pic = document.getElementById('pic-' + i);
  if (!(n >= 2 && n <= 12)) { msg.className = 'act-msg bad'; msg.textContent = '2부터 12까지의 수를 써 주세요.'; return; }
  pic.innerHTML = SHAPES[i][1](n);
  msg.className = 'act-msg ok';
  msg.textContent = `똑같이 ${n}조각으로 나누었어요. 조각을 눌러 색칠해 보세요.`;
  pic.querySelectorAll('.pick-cell').forEach(c => c.addEventListener('click', () => {
    c.setAttribute('fill', c.getAttribute('fill') === '#fff' ? '#93c5fd' : '#fff');
    const k = pic.querySelectorAll('.pick-cell[fill="#93c5fd"]').length;
    msg.innerHTML = k ? `${n}조각 중 ${k}조각을 색칠했어요. → ${M.frac(k, n, true)}` : `똑같이 ${n}조각으로 나누었어요. 조각을 눌러 색칠해 보세요.`;
  }));
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 활동 페이지라 채점·기록 없음
FracKit.init({ activity: true });
</script>
</body>
</html>
