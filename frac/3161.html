<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>원을 똑같이 나누어 봅시다</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
  }
  h2 {
    font-size: 20px;
    margin-bottom: 24px;
    color: #222;
  }
  .board {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }
  .card {
    border: 2px dashed #b9b6e0;
    border-radius: 16px;
    padding: 16px;
    width: 240px;
    text-align: center;
    background: #fff;
  }
  .input-box {
    background: #e6e3f5;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .input-box input {
    width: 60px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    border: 2px solid #b9b6e0;
    border-radius: 8px;
    padding: 4px 2px;
  }
  .input-box button {
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    background: #6a5acd;
    color: #fff;
    cursor: pointer;
  }
  .input-box button:hover {
    background: #5a4bb8;
  }
  .error-msg {
    min-height: 18px;
    font-size: 13px;
    color: #e05656;
    font-weight: bold;
    margin-bottom: 8px;
  }
  svg {
    display: block;
    margin: 0 auto;
  }
  .reset-btn {
    margin-top: 12px;
    font-size: 13px;
    color: #888;
    background: none;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .reset-btn:hover {
    background: #f0f0f0;
  }
</style>
</head>
<body>

<h2>나누고 싶은 수를 입력하고, 원을 똑같이 나누어 봅시다.</h2>

<div class="board" id="board"></div>

<script>
// ===== 등분 가능 범위 설정 =====
const MIN_N = 2;   // 최소 등분 수 (1은 나누는 의미가 없어서 제외)
const MAX_N = 24;  // 최대 등분 수 (너무 많으면 선이 겹쳐 보기 어려움)

const R = 80;          // 원 반지름
const CX = 100, CY = 100; // 원 중심 (svg 좌표)
const DOT_COUNT = 12;  // 둘레에 찍힌 점 개수 (보기용)

function makeCircleCard(index) {
  const card = document.createElement('div');
  card.className = 'card';

  // 입력창 + 확인 버튼
  const inputBox = document.createElement('div');
  inputBox.className = 'input-box';

  const input = document.createElement('input');
  input.type = 'number';
  input.placeholder = '숫자';
  input.min = String(MIN_N);
  input.max = String(MAX_N);
  input.step = '1';
  input.inputMode = 'numeric'; // 모바일에서 숫자 키패드만 뜨도록

  // 자연수가 아닌 문자(-, ., e, +)는 입력 자체를 막음
  input.addEventListener('keydown', (e) => {
    if (['-', '.', 'e', 'E', '+'].includes(e.key)) {
      e.preventDefault();
    }
  });

  const confirmBtn = document.createElement('button');
  confirmBtn.textContent = '확인';

  inputBox.appendChild(input);
  inputBox.appendChild(confirmBtn);
  card.appendChild(inputBox);

  // 오류 메시지 영역
  const errorMsg = document.createElement('div');
  errorMsg.className = 'error-msg';
  card.appendChild(errorMsg);

  // SVG 원
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", "200");
  svg.setAttribute("height", "200");
  svg.setAttribute("viewBox", "0 0 200 200");

  // 둘레 원
  const circle = document.createElementNS(svgNS, "circle");
  circle.setAttribute("cx", CX);
  circle.setAttribute("cy", CY);
  circle.setAttribute("r", R);
  circle.setAttribute("fill", "none");
  circle.setAttribute("stroke", "#333");
  circle.setAttribute("stroke-width", "2");
  svg.appendChild(circle);

  // 둘레 점들 (보기용)
  for (let i = 0; i < DOT_COUNT; i++) {
    const angle = (360 / DOT_COUNT) * i - 90;
    const rad = angle * Math.PI / 180;
    const dx = CX + R * Math.cos(rad);
    const dy = CY + R * Math.sin(rad);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", dx);
    dot.setAttribute("cy", dy);
    dot.setAttribute("r", 3);
    dot.setAttribute("fill", "#333");
    svg.appendChild(dot);
  }

  // 중심 점
  const centerDot = document.createElementNS(svgNS, "circle");
  centerDot.setAttribute("cx", CX);
  centerDot.setAttribute("cy", CY);
  centerDot.setAttribute("r", 3);
  centerDot.setAttribute("fill", "#333");
  svg.appendChild(centerDot);

  // 등분선 그룹
  const linesGroup = document.createElementNS(svgNS, "g");
  svg.appendChild(linesGroup);

  card.appendChild(svg);

  // 초기화 버튼
  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-btn';
  resetBtn.textContent = '다시 하기';
  resetBtn.onclick = () => {
    linesGroup.innerHTML = '';
    input.value = '';
    errorMsg.textContent = '';
  };
  card.appendChild(resetBtn);

  // 확인 동작
  const handleSubmit = () => {
    const raw = input.value.trim();
    const result = validateN(raw);

    if (!result.valid) {
      errorMsg.textContent = result.message;
      linesGroup.innerHTML = '';
      return;
    }

    errorMsg.textContent = '';
    drawDivisions(linesGroup, result.n);
  };

  confirmBtn.onclick = handleSubmit;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSubmit();
  });

  return card;
}

// 입력값 검증: 자연수(1, 2, 3...)인지, 범위(MIN_N ~ MAX_N) 안에 있는지 확인
function validateN(raw) {
  if (raw === '') {
    return { valid: false, message: '자연수를 입력해 주세요.' };
  }

  const num = Number(raw);

  if (Number.isNaN(num)) {
    return { valid: false, message: '자연수만 입력할 수 있어요.' };
  }

  // 자연수 = 소수점이 없고, 0보다 큰 정수
  if (!Number.isInteger(num) || num <= 0) {
    return { valid: false, message: '자연수(1, 2, 3…)만 입력할 수 있어요.' };
  }

  if (num < MIN_N) {
    return { valid: false, message: `${MIN_N} 이상의 자연수를 입력해 주세요.` };
  }

  if (num > MAX_N) {
    return { valid: false, message: `${MAX_N} 이하의 자연수를 입력해 주세요.` };
  }

  return { valid: true, n: num };
}

// n등분 선 그리기
function drawDivisions(linesGroup, n) {
  linesGroup.innerHTML = '';
  const svgNS = "http://www.w3.org/2000/svg";

  for (let i = 0; i < n; i++) {
    const angle = (360 / n) * i - 90;
    const rad = angle * Math.PI / 180;
    const x2 = CX + R * Math.cos(rad);
    const y2 = CY + R * Math.sin(rad);

    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", CX);
    line.setAttribute("y1", CY);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("stroke", "#e05656");
    line.setAttribute("stroke-width", "2.5");
    linesGroup.appendChild(line);
  }
}

// 원 1개 생성
const board = document.getElementById('board');
board.appendChild(makeCircleCard(0));
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ activity: true });
</script>
</body>
</html>
