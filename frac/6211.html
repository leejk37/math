<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분모가 같은 (분수) ÷ (분수) — 분자끼리 나누어떨어지는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분모가 같은 (분수) ÷ (분수) — 분자끼리 나누어떨어지는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모가 같으면 분자끼리 나누어요</div>
  <div class="rule-line"><span class="rule-tag">뜻</span> <sup>3</sup>⁄<sub>5</sub> ÷ <sup>1</sup>⁄<sub>5</sub> → <sup>3</sup>⁄<sub>5</sub>에서 <sup>1</sup>⁄<sub>5</sub>을 몇 번 덜어 낼 수 있나요? → <b>3번</b></div>
  <div class="rule-line"><span class="rule-tag t2">원리</span> <sup>6</sup>⁄<sub>7</sub>은 <sup>1</sup>⁄<sub>7</sub>이 6개, <sup>3</sup>⁄<sub>7</sub>은 <sup>1</sup>⁄<sub>7</sub>이 3개 → <sup>6</sup>⁄<sub>7</sub> ÷ <sup>3</sup>⁄<sub>7</sub> = 6 ÷ 3 = <b>2</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 몫은 분자끼리 나눈 수예요. 분모를 그대로 붙여 쓰면 안 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6211 — 분모가 같은 (분수) ÷ (분수) ⑴ 분자끼리 나누어떨어지는 경우 (교과서 6-2-1 12~13쪽, 수학 익힘 10~11쪽, 성취기준 [6수01-11])
// 진단 포인트: 분자끼리 나눈 몫에 분모를 그대로 붙임(18/31 ÷ 6/31 = 3/31, 익힘 11쪽 6번)
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, J } = G;
const ft = F.ft, sf = G.sf;
const STORY = [
  (a, b, d) => ({ unit: '명', text: `찰흙 ${a}/${d} kg을 한 사람에게 ${b}/${d} kg씩 나누어 주려고 합니다. 나누어 줄 수 있는 사람은 모두 몇 명인가요?` }),
  (a, b, d) => ({ unit: '개', text: `밀가루 ${a}/${d} kg을 그릇에 ${b}/${d} kg씩 나누어 담으려고 합니다. 그릇은 몇 개 필요한가요?` }),
  (a, b, d) => ({ unit: '도막', text: `리본 ${a}/${d} m를 ${b}/${d} m씩 잘랐습니다. 리본은 몇 도막이 되나요?` })
];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 그림 — a/d에서 1/d을 몇 번 덜어 낼 수 있나
  const d1 = R(5, 10), a1 = R(2, d1 - 1);
  cards.push(M.card(0, `<div class="q-text">그림을 보고 ${sf(a1, d1)} ÷ ${sf(1, d1)}이 얼마인지 알아보세요.</div>` + G.jumps(d1, a1, 1, { arcLabel: false }) +
    `<div class="eq" style="font-size:18px">${F.fr(a1, d1)}에서 ${F.fr(1, d1)}을 ${M.box(a1)}번 덜어 낼 수 있습니다.</div>` +
    `<div class="eq">${F.fr(a1, d1)}${DV}${F.fr(1, d1)}${EQ}${M.box(a1)}</div>`, true));
  hints.push(`작은 한 칸이 ${M.frac(1, d1, true)}이에요. 색칠한 부분은 몇 칸인지 세어 보아요.`);

  // 2번: 수직선 — a/d ÷ b/d (b가 a의 약수)
  const [d2, b2, q2] = F.gen(() => [R(7, 15), R(2, 4), R(2, 5)], ([d, b, q]) => b * q < d && G.coprime(b * q, d));
  const a2 = b2 * q2;
  cards.push(M.card(1, `<div class="q-text">${sf(a2, d2)} ÷ ${sf(b2, d2)}${M.josa(b2, '이', '가')} 얼마인지 알아보세요.</div>` + G.jumps(d2, a2, b2, { ticks: false }) +
    `<div class="eq" style="font-size:18px">${F.fr(a2, d2)}${M.josa(a2, '은', '는')} ${F.fr(1, d2)}이 ${M.box(a2)}개이고, ${F.fr(b2, d2)}${M.josa(b2, '은', '는')} ${F.fr(1, d2)}이 ${M.box(b2)}개입니다.</div>` +
    `<div class="eq">${F.fr(a2, d2)}${DV}${F.fr(b2, d2)}${EQ}${M.box(a2)}${DV}${M.box(b2)}${EQ}${M.box(q2)}</div>`, true));
  hints.push(`두 분수 모두 ${M.frac(1, d2, true)}이 몇 개인지로 바꾸면 자연수의 나눗셈 ${a2} ÷ ${b2}가 돼요.`);

  // 3번: 계산
  const c3 = [0, 1].map(() => F.gen(() => [R(5, 25), R(1, 6), R(2, 6)], ([d, b, q]) => b * q < d && G.coprime(b * q, d)));
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...c3.map(([d, b, q]) => `<div class="eq qbox">${F.fr(b * q, d)}${DV}${F.fr(b, d)}${EQ}${M.box(q)}</div>`)), true));
  hints.push('분모가 같으므로 분자끼리 나누어요. 몫은 자연수예요.');

  // 4번: 잘못 계산한 이유 + 옳은 계산
  const [d4, b4, q4] = F.gen(() => [R(13, 37), R(2, 7), R(2, 5)], ([d, b, q]) => b * q < d && G.coprime(q, d));
  const a4 = b4 * q4;
  cards.push(M.card(3, `<div class="q-text">잘못 계산한 이유를 고르고, 옳게 계산해 보세요.</div>` +
    `<div class="wrong-calc">${F.fr(a4, d4)}${DV}${F.fr(b4, d4)}${EQ}${F.fr(a4 + ' ÷ ' + b4, d4)}${EQ}${F.fr(q4, d4)}</div>` +
    `<div class="sub-q">이유</div>` +
    G.why('분자끼리 나눈 몫이 답인데, 분모를 그대로 붙여 썼어요.', ['분모끼리도 나누어야 해요.', '나누는 분수의 분자와 분모를 바꾸어야 해요.']) +
    `<div class="sub-q">옳은 계산</div>` +
    `<div class="eq">${F.fr(a4, d4)}${DV}${F.fr(b4, d4)}${EQ}${M.box(q4)}</div>`, true));
  hints.push(`${M.frac(a4, d4, true)}에서 ${M.frac(b4, d4, true)}${M.josa(b4, '을', '를')} 몇 번 덜어 낼 수 있는지 생각해요. 몇 번인지는 자연수예요.`);

  // 5번: 문장제
  const [d5, b5, q5] = F.gen(() => [R(7, 19), R(2, 5), R(2, 6)], ([d, b, q]) => b * q < d && G.coprime(b, d));
  const s5 = M.pick(STORY)(b5 * q5, b5, d5);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 식을 쓰고 답을 구해 보세요.</div>` + G.word(s5.text) +
    M.line(`<div class="eq">식: ${F.ff(b5 * q5, d5)}${DV}${F.ff(b5, d5)}</div>`, `<div class="eq">답: ${M.box(q5)} ${s5.unit}</div>`), true));
  hints.push('전체 양을 한 번에 덜어 내는 양으로 나누어요. 분모가 같으므로 분자끼리 나누어요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
