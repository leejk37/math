<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(자연수) × (소수) — 1보다 작은 소수</title>
</head>
<body>

<div class="header-text">(자연수) × (소수)를 계산해요 — 1보다 작은 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 2 × 0.7은 2의 0.7배예요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 2의 0.7배 = 2의 <sup>7</sup>⁄<sub>10</sub>배 = <sup>14</sup>⁄<sub>10</sub> = <b>1.4</b> &nbsp;(1보다 작은 수를 곱하면 곱은 2보다 작아요)</div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 4 × 0.6 = 4 × <sup>6</sup>⁄<sub>10</sub> = <sup>24</sup>⁄<sub>10</sub> = 2.4</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 4 × 6 = 24 → 곱하는 수가 <sup>1</sup>⁄<sub>10</sub>배이니 곱도 <sup>1</sup>⁄<sub>10</sub>배 → 2.4</div>
  <div class="rule-line"><span class="rule-tag t4">소수점</span> 곱하는 수의 소수점 아래 자릿수만큼 곱에도 소수점을 찍어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5243 — (자연수) × (소수), 1보다 작은 소수 (교과서 5-2-4 92~93쪽, 수학 익힘 58~59쪽)
const f = M.fmt;
const STORY = [
  (n, a) => ({ unit: 'kg', text: `유준이는 친환경 손난로를 만들기 위해 팥을 ${n} kg의 ${f(a, 1)}만큼 준비했습니다. 준비한 팥은 몇 kg인가요?` }),
  (n, a) => ({ unit: 'L', text: `물이 ${n} L 있습니다. 그중 ${f(a, 1)}만큼을 화분에 주었습니다. 화분에 준 물은 몇 L인가요?` }),
  (n, a) => ({ unit: 'm', text: `길이가 ${n} m인 끈의 ${f(a, 1)}만큼을 잘라 썼습니다. 잘라 쓴 끈은 몇 m인가요?` })
];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (n × 0.a)
  let n1, a1; do { n1 = M.rand(2, 9); a1 = M.rand(2, 9); } while ((n1 * a1) % 10 === 0 || n1 * a1 < 10);
  const s1 = M.pick(STORY)(n1, a1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(n1 * a1, 1, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', n1 * 10, 1)} × ${M.pairbox('s', a1, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(n1 * a1, 1)} ${s1.unit}</span></div>`), true));
  hints.push(`'${n1}의 ${f(a1, 1)}만큼'은 ${n1} × ${f(a1, 1)}이에요.<br>${f(a1, 1)}${M.josa(f(a1, 1), '은', '는')} 1보다 작으니 답은 ${n1}보다 작아요. ${f(a1, 1)}${M.josa(f(a1, 1), '이', '가')} 0.5보다 큰지 작은지도 생각해 보세요.`);

  // 2번: 수직선 — n의 0.a배
  let n2, a2; do { n2 = M.rand(2, 6); a2 = M.rand(2, 9); } while ((n2 * a2) % 10 === 0 || a2 === 5);
  cards.push(M.card(1, `<div class="q-text">그림을 보고 ${n2} × ${f(a2, 1)}${M.josa(f(a2, 1), '을', '를')} 계산해 보세요.</div>` + D.mulLine(n2, a2) +
    M.line(`<div class="eq" style="font-size:18px">${n2}의 ${f(a2, 1)}배는 ${n2}의 ${M.frac(M.box(a2), 10)}배이므로 <span class="tail">${M.frac(M.box(n2 * a2), 10)}입니다.</span></div>`) +
    `<div class="eq">${n2} × ${f(a2, 1)} = ${M.frac(M.box(n2 * a2), 10)} = ${M.dbox(n2 * a2, 1)}</div>`, true));
  hints.push(`위 띠의 한 칸은 ${n2}의 0.1배, 즉 ${n2}의 ${M.frac(1, 10, true)}배예요.<br>${n2}의 ${M.frac(1, 10, true)}배는 ${M.frac(n2, 10, true)}이고, ${f(a2, 1)}배는 그것이 ${a2}칸이에요.`);

  // 3번: 분수의 곱셈 / 자연수의 곱셈으로 (n × 0.a)
  let n3, a3; do { n3 = M.rand(2, 9); a3 = M.rand(2, 9); } while ((n3 * a3) % 10 === 0 || n3 * a3 < 10 || (n3 === n2 && a3 === a2));
  cards.push(M.card(2, `<div class="q-text">${n3} × ${f(a3, 1)}${M.josa(f(a3, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${n3} × ${f(a3, 1)} = ${n3} × ${M.frac(M.box(a3), 10)} = ${M.frac(M.box(n3) + ' × ' + M.box(a3), 10)} = ${M.frac(M.box(n3 * a3), 10)} = ${M.dbox(n3 * a3, 1)}</div>`,
      D.arrows({ A: n3, pa: 0, B: a3, pb: 1, pick: true })), true));
  hints.push(`① ${f(a3, 1)} = ${M.frac(a3, 10, true)}이에요. 자연수와 분자를 곱하고 분모는 그대로 두어요.<br>② ${f(a3, 1)}${M.josa(f(a3, 1), '은', '는')} ${a3}의 ${M.frac(1, 10, true)}배예요. 곱하는 수가 ${M.frac(1, 10, true)}배가 되면 곱도 ${M.frac(1, 10, true)}배가 돼요.`);

  // 4번: 두 가지 방법 (n × 0.ab)
  let n4, x4; do { n4 = M.rand(2, 9); x4 = M.rand(11, 99); } while (x4 % 10 === 0 || (n4 * x4) % 10 === 0);
  cards.push(M.card(3, `<div class="q-text">${n4} × ${f(x4, 2)}${M.josa(f(x4, 2), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${n4} × ${f(x4, 2)} = ${n4} × ${M.frac(M.box(x4), 100)} = ${M.frac(M.box(n4 * x4), 100)} = ${M.dbox(n4 * x4, 2)}</div>`,
      D.arrows({ A: n4, pa: 0, B: x4, pb: 2, topBox: true, pick: true })), true));
  hints.push(`소수 두 자리 수는 분모가 <b>100</b>인 분수로 바꾸어요. ${f(x4, 2)} = ${M.frac(x4, 100, true)}<br>${f(x4, 2)}${M.josa(f(x4, 2), '은', '는')} ${x4}의 ${M.frac(1, 100, true)}배이므로 ${n4} × ${x4}의 곱도 ${M.frac(1, 100, true)}배가 돼요.`);

  // 5번: 계산하기 (가로셈 n × 0.a, 세로셈 n × 0.ab)
  let n5, a5; do { n5 = M.rand(3, 9); a5 = M.rand(2, 9); } while ((n5 * a5) % 10 === 0 || n5 === a5);
  let m5, x5; do { m5 = M.rand(3, 9); x5 = M.rand(11, 99); } while (x5 % 10 === 0 || (m5 * x5) % 10 === 0);
  cards.push(M.card(4, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${n5} × ${f(a5, 1)} = ${M.dbox(n5 * a5, 1)}</div>`, D.vmul(m5, 0, x5, 2)), true));
  hints.push(`자연수의 곱셈을 한 다음, 곱하는 소수의 소수점 아래 자릿수만큼 소수점을 찍어요.<br>세로셈은 ${f(x5, 2)}${M.josa(f(x5, 2), '이', '가')} 소수 <b>두 자리</b> 수이니 곱도 소수 두 자리 수예요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
