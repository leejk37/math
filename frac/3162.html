<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>도형을 등분하고 분수로 나타내기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
  }
  h2 {
    font-size: 20px;
    margin-bottom: 24px;
    color: #222;
  }
  .board {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
  }
  .card {
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 18px;
    width: 260px;
    text-align: center;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .shape-title {
    font-size: 15px;
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
  }
  svg {
    display: block;
    margin: 0 auto;
  }
  .fraction-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .fraction-box {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fraction-box input {
    width: 46px;
    height: 40px;
    font-size: 18px;
    text-align: center;
    border: 2px solid #7ec8e3;
    border-radius: 8px;
    margin: 3px 0;
  }
  .fraction-line {
    width: 46px;
    height: 2px;
    background: #333;
    margin: 2px 0;
  }
  .speaker-btn {
    font-size: 22px;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }
  .btn-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .action-btn {
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .check-btn {
    background: #6a5acd;
    color: #fff;
  }
  .check-btn:hover { background: #5a4bb8; }
  .reset-btn {
    background: #eee;
    color: #555;
  }
  .reset-btn:hover { background: #ddd; }
  .feedback {
    min-height: 20px;
    font-size: 14px;
    font-weight: bold;
    margin-top: 10px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .global-controls {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .global-btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .global-check-btn {
    background: #6a5acd;
    color: #fff;
  }
  .global-check-btn:hover { background: #5a4bb8; }
  .global-reset-btn {
    background: #eee;
    color: #555;
  }
  .global-reset-btn:hover { background: #ddd; }
  .summary {
    font-size: 15px;
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>

<h2>도형을 똑같이 나누고, 색칠한 부분을 분수로 나타내 봅시다.</h2>

<div class="board" id="board"></div>

<div class="global-controls">
  <button class="global-btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="global-btn global-reset-btn" id="newAllBtn">새 문제 (전체)</button>
  <span class="summary" id="summary"></span>
</div>

<script>
/* ===================== 공통 유틸 ===================== */
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 연속된 k개의 조각을 무작위 위치에서 선택
// allowWrap: true면 원(다각형)처럼 끝과 처음이 이어진 것으로 취급 (예: 5,0,1도 연속으로 인정)
//            false면 직사각형처럼 한 줄로 보고 끝에서 넘어가지 않게 선택
function pickContiguousIndices(n, k, allowWrap) {
  const start = allowWrap ? randomInt(0, n - 1) : randomInt(0, n - k);
  const indices = new Set();
  for (let i = 0; i < k; i++) {
    const idx = allowWrap ? (start + i) % n : start + i;
    indices.add(idx);
  }
  return indices;
}

function polygonVertices(cx, cy, r, n, startAngleDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (startAngleDeg + (360 / n) * i) * Math.PI / 180;
    pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
  }
  return pts;
}

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ===================== 도형별 상태 생성 ===================== */
function generateState(type) {
  let n;
  if (type === 'rect') n = randomInt(2, 6);
  else if (type === 'pentagon') n = 5;
  else if (type === 'hexagon') n = 6;

  const k = randomInt(1, n - 1); // 색칠할 조각 수 (전부 흰색/전부 색칠은 제외)
  const allowWrap = type !== 'rect'; // 다각형은 원형으로 이어짐, 직사각형은 한 줄
  const shaded = pickContiguousIndices(n, k, allowWrap);
  return { n, shadedCount: k, shaded };
}

/* ===================== SVG 렌더링 ===================== */
function renderShape(svg, type, state) {
  svg.innerHTML = '';
  const { n, shaded } = state;

  if (type === 'rect') {
    const color = '#bfe0ff';
    const x0 = 20, y0 = 20, w = 220, h = 130;
    const stripW = w / n;

    // 색칠 먼저
    for (let i = 0; i < n; i++) {
      const rect = el('rect', {
        x: x0 + i * stripW, y: y0, width: stripW, height: h,
        fill: shaded.has(i) ? color : '#ffffff'
      });
      svg.appendChild(rect);
    }
    // 테두리
    svg.appendChild(el('rect', { x: x0, y: y0, width: w, height: h, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
    // 내부 구분선 (점선)
    for (let i = 1; i < n; i++) {
      const x = x0 + i * stripW;
      svg.appendChild(el('line', {
        x1: x, y1: y0, x2: x, y2: y0 + h,
        stroke: '#333', 'stroke-width': 1.5, 'stroke-dasharray': '4,3'
      }));
    }
  } else {
    // 오각형 / 육각형: 중심에서 각 꼭짓점으로 나눈 부채꼴(삼각형)
    const color = type === 'pentagon' ? '#d3cbee' : '#f6c9cd';
    const cx = 130, cy = 95, r = 78;
    const startAngle = type === 'pentagon' ? -90 : 0;
    const verts = polygonVertices(cx, cy, r, n, startAngle);

    // 색칠 삼각형 먼저
    for (let i = 0; i < n; i++) {
      const a = verts[i], b = verts[(i + 1) % n];
      const points = `${cx},${cy} ${a[0]},${a[1]} ${b[0]},${b[1]}`;
      svg.appendChild(el('polygon', {
        points, fill: shaded.has(i) ? color : '#ffffff'
      }));
    }
    // 바깥 테두리
    const outline = verts.map(p => p.join(',')).join(' ');
    svg.appendChild(el('polygon', { points: outline, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
    // 중심 -> 꼭짓점 점선
    verts.forEach(p => {
      svg.appendChild(el('line', {
        x1: cx, y1: cy, x2: p[0], y2: p[1],
        stroke: '#333', 'stroke-width': 1.5, 'stroke-dasharray': '4,3'
      }));
    });
  }
}

/* ===================== 카드(도형+분수입력) 생성 ===================== */
function makeCard(type, label) {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('div');
  title.className = 'shape-title';
  title.textContent = label;
  card.appendChild(title);

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '260');
  svg.setAttribute('height', '190');
  svg.setAttribute('viewBox', '0 0 260 190');
  card.appendChild(svg);

  let state = generateState(type);
  renderShape(svg, type, state);

  // 분수 입력 영역
  const fracRow = document.createElement('div');
  fracRow.className = 'fraction-row';

  const fracBox = document.createElement('div');
  fracBox.className = 'fraction-box';

  const numInput = document.createElement('input');
  numInput.type = 'text';
  numInput.inputMode = 'numeric';
  numInput.placeholder = '분자';

  const line = document.createElement('div');
  line.className = 'fraction-line';

  const denInput = document.createElement('input');
  denInput.type = 'text';
  denInput.inputMode = 'numeric';
  denInput.placeholder = '분모';

  // 자연수 외 입력(부호, 소수점 등) 차단
  [numInput, denInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (['-', '.', 'e', 'E', '+', ' '].includes(e.key)) e.preventDefault();
    });
  });

  fracBox.appendChild(numInput);
  fracBox.appendChild(line);
  fracBox.appendChild(denInput);
  fracRow.appendChild(fracBox);

  // 말하기(음성 읽기) 버튼
  const speakerBtn = document.createElement('button');
  speakerBtn.className = 'speaker-btn';
  speakerBtn.textContent = '🔊';
  speakerBtn.title = '입력한 분수 읽어주기';
  speakerBtn.onclick = () => {
    const num = numInput.value.trim();
    const den = denInput.value.trim();
    if (!num || !den) return;
    const utter = new SpeechSynthesisUtterance(`${den} 분의 ${num}`);
    utter.lang = 'ko-KR';
    speechSynthesis.speak(utter);
  };
  fracRow.appendChild(speakerBtn);

  card.appendChild(fracRow);

  // 피드백 텍스트
  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  card.appendChild(feedback);

  // 이 카드 하나를 채점하는 함수 (전체 확인 버튼에서 동시에 호출됨)
  function check() {
    const numRaw = numInput.value.trim();
    const denRaw = denInput.value.trim();

    if (numRaw === '' || denRaw === '') {
      feedback.textContent = '분자와 분모를 모두 입력해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const num = Number(numRaw);
    const den = Number(denRaw);

    if (!Number.isInteger(num) || !Number.isInteger(den) || num <= 0 || den <= 0) {
      feedback.textContent = '분자, 분모 모두 자연수로 입력해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }

    // 교차 곱셈으로 동치분수까지 정답 처리 (예: 2/4 == 1/2)
    const isCorrect = num * state.n === state.shadedCount * den;

    if (isCorrect) {
      feedback.textContent = '정답이에요! 👏';
      feedback.className = 'feedback correct';
    } else {
      feedback.textContent = '다시 한 번 확인해 볼까요?';
      feedback.className = 'feedback wrong';
    }
    return isCorrect;
  }

  // 이 카드 하나를 새 문제로 초기화하는 함수
  function regenerate() {
    state = generateState(type);
    renderShape(svg, type, state);
    numInput.value = '';
    denInput.value = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  return { card, check, regenerate };
}

/* ===================== 초기 생성 ===================== */
const board = document.getElementById('board');
const summaryEl = document.getElementById('summary');

const cards = [
  makeCard('rect', '직사각형'),
  makeCard('pentagon', '오각형'),
  makeCard('hexagon', '육각형')
];

cards.forEach(c => board.appendChild(c.card));

// 전체 정답 확인: 세 문제를 동시에 채점
document.getElementById('checkAllBtn').onclick = () => {
  const results = cards.map(c => c.check());
  const correctCount = results.filter(r => r === true).length;
  summaryEl.textContent = `${cards.length}문제 중 ${correctCount}개 정답`;
};

// 전체 새 문제: 세 도형을 동시에 새로 생성
document.getElementById('newAllBtn').onclick = () => {
  cards.forEach(c => c.regenerate());
  summaryEl.textContent = '';
};
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: '#checkAllBtn', newBtn: '#newAllBtn', grade: () => { const r = cards.map(p => p.check()); summaryEl.textContent = `${r.length}문제 중 ${r.filter(Boolean).length}개 정답`; return r; } });
</script>
</body>
</html>
