<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>똑같이 나누고 분수로 나타내기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">똑같이 나누고 분수로 나타내기</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 전체를 똑같이 나눈 것 중의 부분을 분수로 나타내요</div>
  <div class="rule-line"><span class="rule-tag">분모</span> 전체를 <b>똑같이 몇으로</b> 나누었나요? (아래에 써요)</div>
  <div class="rule-line"><span class="rule-tag t2">분자</span> 그중에서 <b>몇 조각</b>인가요? (위에 써요)</div>
  <div class="rule-line"><span class="rule-tag t3">읽기</span> 3/4 → <b>4분의 3</b> (분모를 먼저 읽어요)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3162 — 똑같이 나누고 분수로 나타내기 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 똑같이 나누지 않은 것도 분수로 봄, 분자·분모를 바꾸어 씀, 색칠하지 않은 부분과 헷갈림, 분수를 거꾸로 읽음
M.inlineQuestion = true;
const KINDS = ['circle', 'rect', 'poly'];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 똑같이 나눈 도형 고르기
  const d1 = M.rand(3, 6), kinds1 = M.shuffle(KINDS.slice()), right = M.rand(0, 2);
  const O1 = { size: 120, w: 150, h: 90 };
  const opts1 = kinds1.map((k, i) => [i, i === right ? S.any(d1, 0, Object.assign({ kind: k }, O1)) : S.unequal(d1, k, O1)]);
  cards.push(M.card(0, `<div class="q-text">전체를 똑같이 ${d1}${S.ro(d1)} 나눈 도형을 골라 보세요.</div>` + M.choices(right, opts1), true));
  hints.push('조각의 <b>모양과 크기가 모두 같아야</b> 똑같이 나눈 거예요. 조각 수만 같다고 되는 건 아니에요.');

  // 2번: 직사각형 — 색칠한 부분을 분수로
  const d2 = M.rand(3, 8), a2 = M.rand(1, d2 - 1);
  cards.push(M.card(1, `<div class="q-text">색칠한 부분은 전체의 얼마인지 분수로 나타내 보세요.</div>` +
    `<div class="row" style="align-items:center;gap:30px">${S.rect(d2, a2)}<div class="eq">${F.ff(a2, d2)}</div></div>`, true));
  hints.push('전체가 몇 칸인지 세어 <b>분모</b>에, 색칠한 칸이 몇 칸인지 세어 <b>분자</b>에 써요.');

  // 3번: 원 — 색칠한 부분과 색칠하지 않은 부분
  const d3 = M.rand(4, 8), a3 = M.rand(1, d3 - 1);
  cards.push(M.card(2, `<div class="q-text">색칠한 부분과 색칠하지 않은 부분을 각각 분수로 나타내 보세요.</div>` +
    `<div class="row" style="align-items:center;gap:30px">${S.circle(d3, a3)}` +
    `<div style="display:flex;flex-direction:column;gap:14px"><div class="eq" style="font-size:18px">색칠한 부분: ${F.ff(a3, d3)}</div>` +
    `<div class="eq" style="font-size:18px">색칠하지 않은 부분: ${F.ff(d3 - a3, d3)}</div></div></div>`, true));
  hints.push('분모는 두 분수 모두 같아요(전체 조각 수). 분자만 색칠한 조각, 색칠하지 않은 조각으로 달라져요.');

  // 4번: 분수 읽기
  const d4 = M.rand(3, 9), a4 = M.rand(1, d4 - 1), KN = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  cards.push(M.card(3, `<div class="q-text">분수를 바르게 읽은 것을 골라 보세요.</div>` +
    `<div class="pick-v"><div class="eq" style="font-size:26px">${M.frac(a4, d4)}</div>` +
    F.one(`${KN[d4]}분의 ${KN[a4]}`, [`${KN[a4]}분의 ${KN[d4]}`, `${KN[a4]}${M.josa(a4, "과", "와")} ${KN[d4]}`]) + `</div>`, true));
  hints.push('분수는 <b>분모를 먼저</b> 읽어요. 아래 수 + "분의" + 위의 수');

  // 5번: 문장제
  const d5 = M.pick([4, 6, 8]), a5 = M.rand(1, d5 - 1);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">피자 한 판을 똑같이 ${d5}조각으로 나누어 그중 ${a5}조각을 먹었습니다. 먹은 피자는 전체의 얼마인지 분수로 나타내 보세요.</div>` +
    `<div class="eq">${F.ff(a5, d5)}</div>`, true));
  hints.push('피자 한 판이 <b>전체</b>예요. 몇 조각으로 나누었는지가 분모, 먹은 조각이 분자예요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
