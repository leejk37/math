<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 4학년 소수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261104-1515"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수 사이의 관계</title>
</head>
<body>

<div class="header-text">소수 사이의 관계를 알아봐요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 소수점을 기준으로 숫자가 자리를 옮겨요!</div>
  <div class="rule-line"><span class="rule-tag">관계</span> 1 → 0.1 → 0.01 → 0.001 : 오른쪽으로 갈 때마다 <b>1/10</b>, 왼쪽으로 갈 때마다 <b>10배</b></div>
  <div class="rule-line"><span class="rule-tag t2">10배</span> 숫자가 <b>왼쪽으로 한 자리</b>씩 옮겨요. 0.716 → 7.16 (10배) → 71.6 (100배)</div>
  <div class="rule-line"><span class="rule-tag t3">1/10</span> 숫자가 <b>오른쪽으로 한 자리</b>씩 옮겨요. 3.5 → 0.35 (1/10) → 0.035 (1/100)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4234 — 소수 사이의 관계 (교과서 4-2-3 64~65쪽, 성취기준 [4수01-13])
// 모든 수를 0.0001 단위(P=4)로 다루어 10배·1/10 계산에서 오차가 생기지 않게 합니다.
const P = 4;
const s4 = n => M.fmt0(n, P);                      // 7160 → "0.716"
const U = { '1': 10000, '0.1': 1000, '0.01': 100, '0.001': 10 };
const R = (k) => k === 10 ? '10배' : k === 100 ? '100배' : '1000배';
const INV = (k) => M.frac(1, k, true);

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 1, 0.1, 0.01, 0.001 사이의 관계 (세 문장, 유형을 섞어서)
  const pool = [
    () => { const u = M.pick(['0.1', '0.01', '0.001']); return `${u}의 10배는 <span class="tail">${M.dbox(U[u] * 10, P)}</span>`; },
    () => { const u = M.pick(['1', '0.1', '0.01']); return `${u}의 ${INV(10)} 은 <span class="tail">${M.dbox(U[u] / 10, P)}</span>`; },
    () => { const [big, small] = M.pick([['1', '0.1'], ['1', '0.01'], ['1', '0.001'], ['0.1', '0.01'], ['0.1', '0.001'], ['0.01', '0.001']]);
            return `${big}${M.josa(big, '은', '는')} ${small}의 <span class="tail">${M.box(U[big] / U[small])} 배</span>`; }
  ];
  const lines1 = M.shuffle(pool.slice()).map(fn => `<div class="eq" style="font-size:19px">${fn()}</div>`).join('');
  cards.push(M.card(0, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` + M.line(lines1), true));
  hints.push('1을 10칸으로 나누면 0.1, 0.1을 10칸으로 나누면 0.01, 0.01을 10칸으로 나누면 0.001이에요.<br>그래서 한 단계씩 <b>10배</b> 또는 <b>1/10</b> 관계예요.');

  // 2번: 0.abc의 10배, 100배
  const d2 = [M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)], v2 = (d2[0] * 100 + d2[1] * 10 + d2[2]) * 10;
  cards.push(M.card(1, `<div class="q-text">${s4(v2)}의 10배와 100배를 구해 보세요.</div>` +
    M.line(`<div class="eq">${s4(v2)}의 10배는 <span class="tail">${M.dbox(v2 * 10, P)}</span></div>`,
      `<div class="eq">${s4(v2)}의 100배는 <span class="tail">${M.dbox(v2 * 100, P)}</span></div>`), true));
  hints.push('10배를 하면 숫자가 <b>왼쪽으로 한 자리</b>, 100배를 하면 <b>두 자리</b> 옮겨요.<br>소수점이 오른쪽으로 옮겨진다고 생각해도 돼요.');

  // 3번: a.b의 1/10, 1/100
  const a3 = M.rand(1, 9), b3 = M.rand(1, 9), v3 = (a3 * 10 + b3) * 1000;
  cards.push(M.card(2, `<div class="q-text">${s4(v3)}의 ${INV(10)} 과 ${INV(100)} 을 구해 보세요.</div>` +
    M.line(`<div class="eq">${s4(v3)}의 ${M.frac(1, 10)} 은 <span class="tail">${M.dbox(v3 / 10, P)}</span></div>`,
      `<div class="eq">${s4(v3)}의 ${M.frac(1, 100)} 은 <span class="tail">${M.dbox(v3 / 100, P)}</span></div>`), true));
  hints.push('1/10을 하면 숫자가 <b>오른쪽으로 한 자리</b>, 1/100을 하면 <b>두 자리</b> 옮겨요.<br>빈 자리에는 0을 써요. 예) 3.5의 1/100 → 0.035');

  // 4번: a.bcd의 100배, 1000배 / 세 자리 자연수의 1/100, 1/1000
  const v4 = M.rand(1, 9) * 10000 + M.rand(0, 9) * 1000 + M.rand(0, 9) * 100 + M.rand(1, 9) * 10;
  const n4 = M.rand(1, 9) * 100 + M.rand(0, 9) * 10 + M.rand(1, 9);
  cards.push(M.card(3, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    `<div class="eq" style="font-size:19px">${s4(v4)}의 100배는 ${M.dbox(v4 * 100, P)}이고, <span class="tail">1000배는 ${M.dbox(v4 * 1000, P)}입니다.</span></div>` +
    `<div class="eq" style="font-size:19px">${n4}의 ${M.frac(1, 100, true)} 은 ${M.dbox(n4 * 100, P)}이고, <span class="tail">${M.frac(1, 1000, true)} 은 ${M.dbox(n4 * 10, P)}입니다.</span></div>`, true));
  hints.push('100배·1000배는 숫자가 왼쪽으로 두 자리·세 자리, 1/100·1/1000은 오른쪽으로 두 자리·세 자리 옮겨요.');

  // 5번: 다른 수를 설명한 사람 고르기 (기준 수 a.b, 두 사람은 맞는 설명, 한 사람은 배수가 한 단계 어긋남)
  const base = (M.rand(1, 9) * 10 + M.rand(1, 9)) * 1000;   // a.b
  const kinds = [
    { y: base / 10, say: y => `${s4(y)}의 10배야.` },
    { y: base / 100, say: y => `${s4(y)}의 100배야.` },
    { y: base * 10, say: y => `${s4(y)}의 ${INV(10)} 이야.` },
    { y: base * 100, say: y => `${s4(y)}의 ${INV(100)} 이야.` }
  ];
  const chosen = M.shuffle(kinds.slice()).slice(0, 3);
  const wrongIdx = M.rand(0, 2);
  // 틀린 설명: 같은 말투로, 시작 수만 10배 크거나 작게
  const names = ['예지', '하준', '다윤'];
  const speech = chosen.map((k, i) => {
    let y = k.y;
    if (i === wrongIdx) y = ((k.y / 10) % 10 === 0 && Math.random() < 0.5) ? k.y / 10 : k.y * 10; // 소수 넷째 자리가 생기지 않게
    return `<div class="speech"><span class="who">${names[i]}</span>${k.say(y)}</div>`;
  }).join('');
  cards.push(M.card(4, `<div class="q-text">세 사람 중 <b>다른 수</b>를 설명한 사람을 골라 보세요.</div>` +
    `<div class="row">${speech}</div>` + M.choices(wrongIdx, names.map((n, i) => [i, n])), true));
  hints.push('세 사람이 말한 수를 각각 계산해 보세요. 예) 0.93의 10배 = 9.3, 93의 1/10 = 9.3<br>계산한 값이 혼자 다른 사람을 골라요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
