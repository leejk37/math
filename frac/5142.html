<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>크기가 같은 분수 만들기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">크기가 같은 분수 만들기</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모와 분자에 0이 아닌 같은 수를 곱하거나 나누면 크기가 같은 분수</div>
  <div class="rule-line"><span class="rule-tag">곱하기</span> 1/2 = (1 × 3)/(2 × 3) = <b>3/6</b></div>
  <div class="rule-line"><span class="rule-tag t2">나누기</span> 12/18 = (12 ÷ 6)/(18 ÷ 6) = <b>2/3</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모와 분자에 반드시 <b>같은 수</b>를 곱하거나 나누어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5142 — 크기가 같은 분수 만들기 (교과서 5-1-4 74~75쪽, 수학익힘 44~45쪽, 성취기준 [6수01-06])
// 진단 포인트: 분모에만 곱하거나 나눔, 분모와 분자에 서로 다른 수를 곱함
const R = M.rand;
M.inlineQuestion = true;
const t = (n, d) => `<span style="font-size:18px">${n}/${d}</span>`;
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 곱해서 만들기 (두 줄)
  const L1 = [0, 1].map(() => { const a = F.proper(2, 7), m = R(2, 5); return { a, m }; });
  cards.push(M.card(0, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(...L1.map(({ a, m }) => `<div class="qbox"><div class="eq">${F.fr(a.n, a.d)} = ${F.fr(a.n + ' × ' + m, a.d + ' × ' + m)} = ${F.fn(a.n * m, a.d * m)}</div></div>`)), true));
  hints.push('분모와 분자에 같은 수를 곱해요.');

  // 2번: 나누어 만들기 (두 줄)
  const L2 = [0, 1].map(() => F.gen(() => { const a = F.proper(2, 6), k = R(2, 8); return { a, k }; }, ({ a, k }) => a.d * k <= 72));
  cards.push(M.card(1, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(...L2.map(({ a, k }) => `<div class="qbox"><div class="eq">${F.fr(a.n * k, a.d * k)} = ${F.fr(a.n * k + ' ÷ ' + k, a.d * k + ' ÷ ' + k)} = ${F.fn(a.n, a.d)}</div></div>`)), true));
  hints.push('분모와 분자를 같은 수로 나누어요.');

  // 3번: 분자·분모 빈칸 섞기
  const a3 = F.proper(2, 7), m3a = R(2, 3), m3b = m3a + R(1, 2);
  cards.push(M.card(2, `<div class="q-text">크기가 같은 분수가 되도록 빈칸에 알맞은 수를 써넣으세요.</div>` +
    `<div class="eq">${F.fr(a3.n, a3.d)} = ${F.fd(a3.n * m3a, a3.d * m3a)} = ${F.fn(a3.n * m3b, a3.d * m3b)}</div>`, true));
  hints.push('주어진 분자(또는 분모)가 몇 배가 되었는지 먼저 찾아요. 빈칸도 같은 만큼 몇 배 해요.');

  // 4번: 크기가 다른 분수 하나 찾기
  const a4 = F.proper(2, 5);
  const same4 = M.shuffle([2, 3, 4, 5]).slice(0, 3).map(m => t(a4.n * m, a4.d * m)), k4 = R(1, 3);
  const odd4 = R(0, 1) ? t(a4.n + k4, a4.d + k4) : t(a4.n * 2, a4.d * 3);
  cards.push(M.card(3, `<div class="q-text">${F.fr(a4.n, a4.d)}와(과) 크기가 <b>다른</b> 분수를 골라 보세요.</div>` + F.one(odd4, same4), true));
  hints.push('분모와 분자가 같은 수만큼 몇 배가 되었는지 하나씩 확인해요.');

  // 5번: 크기가 같은 분수 3개 (분모가 작은 것부터)
  const a5 = F.proper(2, 6);
  cards.push(M.card(4, `<div class="q-text">${F.fr(a5.n, a5.d)}와(과) 크기가 같은 분수를 분모가 작은 것부터 3개 써 보세요.</div>` +
    `<div class="eq">${[2, 3, 4].map(m => F.ff(a5.n * m, a5.d * m)).join(', ')}</div>`, true));
  hints.push('분모와 분자에 2, 3, 4를 차례로 곱해요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
