<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(자연수) ÷ (자연수)의 몫을 분수로 — 몫이 1보다 큰 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(자연수) ÷ (자연수)의 몫을 분수로 나타내요 — 몫이 1보다 큰 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 몫이 1보다 크면 가분수 또는 대분수로!</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 4 ÷ 3 = (3 ÷ 3) + (1 ÷ 3) = 1 + <sup>1</sup>⁄<sub>3</sub> = <b>1<sup>1</sup>⁄<sub>3</sub></b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 4 ÷ 3 → 1 ÷ 3 = <sup>1</sup>⁄<sub>3</sub>이 4개 → <b><sup>4</sup>⁄<sub>3</sub></b></div>
  <div class="rule-line"><span class="rule-tag t3">정리</span> 몫이 1보다 커도 ● ÷ ▲ = <sup>●</sup>⁄<sub>▲</sub> 이고, 대분수로 바꿀 수 있어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6112 — (자연수) ÷ (자연수)의 몫을 분수로 나타내기 ⑵ 몫이 1보다 큰 경우
//        (교과서 6-1-1 14~15쪽, 수학 익힘 12~13쪽, 성취기준 [6수01-10])
// 진단 포인트: 몫이 1보다 크다는 것을 알아보는지, 가분수 ↔ 대분수 바꾸기, 몫의 크기 비교
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, P, LP, RP, J } = G;
const SHAPES = [['정삼각형', 3, '이', '은'], ['마름모', 4, '가', '는'], ['정사각형', 4, '이', '은'], ['정오각형', 5, '이', '은'], ['정육각형', 6, '이', '은']];
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 두 가지 방법 (b < a < 2b)
  const [a1, b1] = F.gen(() => [R(3, 11), R(2, 6)], ([a, b]) => b < a && a < 2 * b && G.coprime(a, b) && a <= 7);
  const r1 = a1 - b1;
  cards.push(M.card(0, `<div class="q-text">${a1} ÷ ${J(b1, '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` + G.unitBars(a1, b1, 1) +
    G.methods('방법 ① 1씩 나누고 남은 것을 나누기',
      `<div class="eq">${a1}${DV}${b1}${EQ}${LP}${b1}${DV}${b1}${RP}${P}${LP}${r1}${DV}${b1}${RP}</div>` +
      `<div class="eq">${EQ}${M.box(1)}${P}${F.ff(r1, b1)}${EQ}${F.ans({ n: a1, d: b1 })}</div>`,
      '방법 ② 1 ÷ ' + b1 + '의 몫이 몇 개인지 세기',
      `<div class="eq">1${DV}${b1}${EQ}${F.ff(1, b1)}</div>` +
      `<div class="eq">${a1}${DV}${b1}${M.josa(b1, '은', '는')} ${F.fr(1, b1)}이 ${M.box(a1)}개</div>` +
      `<div class="eq">${a1}${DV}${b1}${EQ}${F.ff(a1, b1)}</div>`), true));
  hints.push(`방법 ①: ${a1} 중 ${b1}${M.josa(b1, '은', '는')} ${b1}명이 1씩 나누어 가지고, 남은 ${J(r1, '을', '를')} 다시 ${G.ro(b1)} 나누어요.<br>방법 ②: 1 하나를 ${G.ro(b1)} 나누면 ${M.frac(1, b1, true)}, 1이 ${a1}개이므로 ${M.frac(1, b1, true)}이 ${a1}개예요.`);

  // 2번: 가분수와 대분수로
  const q2 = [];
  while (q2.length < 2) {
    const p = G.pair(7, 25, 2, 9, ([a, b]) => a > b && a % b !== 0);
    if (!q2.some(q => q[0] === p[0] && q[1] === p[1])) q2.push(p);
  }
  cards.push(M.card(1, `<div class="q-text">나눗셈의 몫을 가분수와 대분수로 나타내어 보세요.</div>` +
    M.line(...q2.map(([a, b]) => `<div class="eq qbox">${a}${DV}${b}${EQ}${F.ff(a, b)}${EQ}${F.ans({ n: a, d: b })}</div>`)), true));
  hints.push('나누어지는 수를 분자, 나누는 수를 분모로 쓰면 가분수가 돼요.<br>대분수로 바꿀 때는 분자 안에 분모가 몇 번 들어가는지(자연수 부분)와 남는 수(분자)를 찾아요.');

  // 3번: 몫이 1보다 큰 나눗셈 모두 고르기
  const SYM = ['㉠', '㉡', '㉢', '㉣'];
  const opts3 = F.gen(() => SYM.map(() => {
    const big = Math.random() < 0.5, b = R(5, 15);
    const a = big ? R(b + 1, b + 5) : R(Math.max(2, b - 5), b - 1);
    return [a, b];
  }), arr => { const n = arr.filter(([a, b]) => a > b).length; return n >= 1 && n <= 3; });
  cards.push(M.card(2, `<div class="q-text">몫이 1보다 큰 나눗셈을 모두 골라 보세요.</div>` +
    F.multi(opts3.map(([a, b], i) => [i, `${SYM[i]} ${a} ÷ ${b}`]), opts3.map(([a, b], i) => a > b ? i : -1).filter(i => i >= 0)), true));
  hints.push('나누어지는 수가 나누는 수보다 크면 몫은 1보다 커요. (분자가 분모보다 큰 가분수)');

  // 4번: 몫의 크기 비교
  const pairs4 = [0, 1].map(() => F.gen(() => {
    const b = R(2, 9), d = R(2, 9);
    return [R(b + 1, 4 * b), b, R(d + 1, 4 * d), d];
  }, ([a, b, c, d]) => a % b && c % d && G.coprime(a, b) && G.coprime(c, d) && !(a === c && b === d) && Math.floor(a / b) === Math.floor(c / d)));
  cards.push(M.card(3, `<div class="q-text">몫의 크기를 비교하여 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    M.line(...pairs4.map(([a, b, c, d]) => `<div class="cmp-row qbox">${a}${DV}${b} ${M.cmp(a * d, c * b)} ${c}${DV}${d}</div>`)), true));
  hints.push('몫을 대분수로 나타내어 비교해요. 자연수 부분이 같으면 분수 부분을 비교해요.<br>분수 부분의 분모가 다르면 통분해서 비교해요.');

  // 5번: 문장제 — 정다각형 둘레
  const [shape, n5, iga, eun] = M.pick(SHAPES);
  const L5 = F.gen(() => R(n5 + 1, n5 * 6), L => L % n5 !== 0 && G.coprime(L, n5));
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 식을 쓰고 답을 분수로 나타내어 보세요.</div>` +
    G.word(`둘레가 ${L5} cm인 ${shape}${iga} 있습니다. 이 ${shape}의 한 변의 길이는 몇 cm인가요?`) +
    M.line(`<div class="eq">식: ${M.box(L5)}${DV}${M.box(n5)}</div>`, `<div class="eq">답: ${F.ans({ n: L5, d: n5 })} cm</div>`), true));
  hints.push(`${shape}${eun} 변이 ${n5}개이고 길이가 모두 같아요. 둘레를 변의 수로 나누어요.<br>몫이 1보다 크면 대분수로 나타내요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
