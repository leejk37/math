<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) ÷ (자연수) — 몫의 소수 첫째 자리에 0이 있는 경우</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) ÷ (자연수)를 계산해요 — 몫의 소수 첫째 자리에 0이 있는 경우</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나눌 수 없는 자리에는 몫에 0을 써요!</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 2.14 ÷ 2 → 2 ÷ 2 = 1 → 1은 2로 나눌 수 없으니 몫에 <b>0</b> → 14 ÷ 2 = 7 → <b>1.07</b></div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 214 ÷ 2 = 107 → 나누어지는 수가 <sup>1</sup>⁄<sub>100</sub>배이면 몫도 <sup>1</sup>⁄<sub>100</sub>배 → 2.14 ÷ 2 = 1.07</div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 몫의 0을 빠뜨리면 1.07이 1.7이 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6135 — (소수) ÷ (자연수), 몫의 소수 첫째 자리에 0이 있는 경우 (교과서 6-1-3 66~67쪽, 수학 익힘 44~45쪽)
const f = M.fmt;
const STORY = [
  (a, n) => ({ unit: 'L', text: `식혜 ${f(a, 2)} L를 병 ${n}개에 똑같이 나누어 담으려고 합니다. 병 한 개에 담을 수 있는 식혜는 몇 L인가요?` }),
  (a, n) => ({ unit: 'kg', text: `쌀 ${f(a, 2)} kg을 ${n}봉지에 똑같이 나누어 담았습니다. 한 봉지에 담은 쌀은 몇 kg인가요?` }),
  (a, n) => ({ unit: 'm', text: `길이가 ${f(a, 2)} m인 색 테이프를 ${n}도막으로 똑같이 나누었습니다. 한 도막의 길이는 몇 m인가요?` })
];
// 몫 = W.0h (소수 첫째 자리가 0)
// pa = 2 : a = q × n (예 2.14 ÷ 2 = 1.07),  pa = 1 : a = q × n / 10 이 정수 (예 5.3 ÷ 5 = 1.06, 0을 내려 계산)
function mk(pa, wMax, nList) {
  return F.gen(() => { const n = M.pick(nList), q = M.rand(1, wMax) * 100 + M.rand(1, 9); return { n, q, a: pa === 2 ? q * n : q * n / 10, pa }; },
    o => Number.isInteger(o.a) && o.a % 10 !== 0);
}
const ex = (o) => `${f(o.a, o.pa)} ÷ ${o.n}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기
  const p1 = mk(2, 3, [2, 3, 4, 5, 6, 7, 8, 9]);
  const s1 = M.pick(STORY)(p1.a, p1.n);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.q, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.dbox(p1.a, 2)} ÷ ${M.box(p1.n)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(p1.q, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(p1.a, 2)}${M.josa(f(p1.a, 2), '을', '를')} 가까운 자연수로 어림하여 ${p1.n}(으)로 나누어 보세요.<br>계산할 때 나눌 수 없는 자리가 나오면 몫에 0을 써요.`);

  // 2번: 자연수의 나눗셈을 이용하기 (214 ÷ 2 = 107 → 2.14 ÷ 2)
  const p2 = F.gen(() => mk(2, 9, [2, 3, 4, 5, 6, 7, 8, 9]), o => o.a !== p1.a);
  cards.push(M.card(1, `<div class="q-text">${p2.a} ÷ ${p2.n} = ${p2.q}${M.josa(String(p2.q), '을', '를')} 이용하여 ${ex(p2)}${M.josa(String(p2.n), '을', '를')} 계산해 보세요.</div>` +
    D.divArrows({ A: p2.a, n: p2.n, pa: 2, pick: true }), true));
  hints.push(`나누는 수는 그대로이고, 나누어지는 수가 ${M.frac(1, 100, true)}배가 되었어요. 그러면 몫도 ${M.frac(1, 100, true)}배가 돼요.<br>${p2.q}의 ${M.frac(1, 100, true)}배는 소수점이 왼쪽으로 두 자리 옮겨진 수예요.`);

  // 3번: 세로로 계산하기 (소수 두 자리 수, 소수 한 자리 수에서 0을 내려)
  const p3a = F.gen(() => mk(2, 9, [3, 4, 6, 7, 8, 9]), o => o.a !== p2.a);
  const p3b = mk(1, 9, [2, 4, 5, 6, 8]);
  cards.push(M.card(2, `<div class="q-text">세로로 계산해 보세요. (흐린 0은 소수점 아래에 내려 쓴 0이에요)</div>` +
    M.line(D.vdiv({ a: p3a.a, pa: 2, n: p3a.n }), D.vdiv({ a: p3b.a, pa: 1, n: p3b.n })), true));
  hints.push(`내린 수가 나누는 수보다 작아서 나눌 수 없으면 몫에 0을 쓰고, 다음 숫자를 하나 더 내려요.<br>예) 6.27 ÷ 3 → 6 ÷ 3 = 2, 2는 3으로 나눌 수 없으니 몫에 0, 27 ÷ 3 = 9 → 2.09`);

  // 4번: 잘못 계산한 곳 찾기 (몫의 0을 빠뜨림)
  const p4 = F.gen(() => mk(2, 9, [2, 3, 4]), o => o.a < 1000 && o.a !== p2.a && o.a !== p3a.a);
  const W4 = Math.floor(p4.q / 100), h4 = p4.q % 10;
  const wrong = D.vdivShow({ a: p4.a, pa: 2, n: p4.n, qOver: { 0: String(W4).slice(-1), 1: String(h4), dot: true } });
  const why = F.one('몫의 소수 첫째 자리에 0을 쓰지 않았어요', ['소수점을 잘못 찍었어요', '빼는 수를 잘못 썼어요']);
  cards.push(M.card(3, `<div class="q-text">잘못 계산한 곳을 찾아 이유를 고르고, 옳게 계산해 보세요.</div>` +
    `<div class="row" style="align-items:center">${D.wrongBox('잘못한 계산', wrong, `${ex(p4)} = ${W4}.${h4}`)}` +
    `<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div class="eq" style="font-size:17px">이유: </div>${why}` +
    `<div class="eq">옳은 계산: ${ex(p4)} = ${M.dbox(p4.q, 2)}</div></div></div>`, true));
  hints.push(`${W4 * p4.n}${M.josa(String(W4 * p4.n), '을', '를')} 빼고 내린 수가 ${p4.n}보다 작으면 그 자리 몫은 0이에요.<br>몫의 각 자리 숫자를 나누어지는 수의 같은 자리 위에 맞추어 써야 해요.`);

  // 5번: 계산하기
  const p5a = mk(2, 9, [2, 3, 4, 5, 6, 7, 8, 9]), p5b = F.gen(() => mk(1, 9, [2, 4, 5, 6, 8]), o => o.a !== p3b.a);
  cards.push(M.card(4, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${ex(p5a)} = ${M.dbox(p5a.q, 2)}</div>`, `<div class="eq qbox">${ex(p5b)} = ${M.dbox(p5b.q, 2)}</div>`), true));
  hints.push(`나눌 수 없는 자리에는 몫에 0을 써요.<br>나누어떨어지지 않으면 소수점 아래 0을 내려 계산해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
