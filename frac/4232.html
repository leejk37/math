<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 4학년 소수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261104-1550"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수 세 자리 수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
.cnt-grid{display:grid;grid-template-columns:auto auto auto auto;gap:8px 10px;align-items:center;justify-items:start}
.cnt-grid > div:nth-child(4n+1){justify-self:end}
.cnt-grid .ans-box{width:72px}
.cnt-grid .cnt-last{border-top:1.5px dashed #cbd5e1;padding-top:10px;align-self:stretch;display:flex;align-items:center}
.cnt-grid .cnt-last:nth-child(4n+1){justify-content:flex-end;justify-self:stretch}
</style>
</head>
<body>

<div class="header-text">소수 세 자리 수를 알아봐요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 0.01을 10칸으로 나눈 한 칸이 0.001이에요!</div>
  <div class="rule-line"><span class="rule-tag">쓰기</span> <b>1/1000 = 0.001</b>, 0.001이 125개면 <b>0.125</b>, 47개면 <b>0.047</b> (빈 자리에 0을 써요)</div>
  <div class="rule-line"><span class="rule-tag t2">읽기</span> 소수점 아래는 숫자를 하나씩 읽어요. 0.125 → 영 점 <b>일이오</b></div>
  <div class="rule-line"><span class="rule-tag t3">자리</span> 1.853에서 8은 소수 첫째 자리(0.8), 5는 소수 둘째 자리(0.05), 3은 <b>소수 셋째 자리</b>(0.003)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4232 — 소수 세 자리 수 (교과서 4-2-3 58~61쪽, 성취기준 [4수01-13])
const P = 3;
const f = n => M.fmt(n, P);
function noZeroDigits(k) { let s = ''; for (let i = 0; i < k; i++) s += M.rand(1, 9); return +s; }

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 수직선 (0.01 사이를 10칸으로 나눈 눈금) → 화살표가 가리키는 수
  const start = M.rand(10, 98) * 10, at = M.rand(1, 9);   // 0.10~0.98 에서 시작, 0.001 단위
  cards.push(M.card(0, `<div class="q-text">수직선에서 화살표가 가리키는 위치를 네모 칸에 소수로 나타내어 보세요.</div>` +
    M.lineSvg({ start, unit: 1, p: P, ticks: 10, major: 10, mid: 5, trim: true, arrows: [{ at }], width: 520 }) +
    `<div class="eq" style="font-size:18px">화살표(<span style="color:#ef4444">↓</span>)가 가리키는 수는 <span class="tail">${M.dbox(start + at, P, true)} 입니다.</span></div>`, true));
  hints.push(`작은 눈금 10칸이 0.01이에요. 그러니 작은 눈금 <b>한 칸은 0.001</b>이에요.<br>${M.fmt0(start, P)}에서 오른쪽으로 몇 칸 갔는지 세어 보세요.`);

  // 2번: 분수 → 소수 (세 자리 하나, 첫째 자리가 0인 것 하나)
  const a2 = noZeroDigits(3);
  let b2; do { b2 = M.rand(11, 99); } while (b2 % 10 === 0);
  cards.push(M.card(1, `<div class="q-text">분수를 소수로 나타내어 보세요.</div>` +
    M.line(`<div class="eq">${M.frac(a2, 1000)} = ${M.dbox(a2, P, true)}</div>`,
      `<div class="eq">${M.frac(b2, 1000)} = ${M.dbox(b2, P, true)}</div>`), true));
  hints.push(`${M.frac(1, 1000, true)} = 0.001이에요. ${M.frac(b2, 1000, true)} 은 0.001이 ${b2}개라서 소수 <b>첫째 자리가 0</b>이에요.`);

  // 3번: 대분수 → 소수, 1·0.1·0.01·0.001이 몇 개
  const w3 = M.rand(1, 9), d3 = [M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)];
  const fr3 = d3[0] * 100 + d3[1] * 10 + d3[2], v3 = w3 * 1000 + fr3;
  cards.push(M.card(2, `<div class="q-text">대분수를 소수로 나타내어 보세요.</div>` +
    M.line(`<div class="eq">${M.mixed(w3, fr3, 1000)} = ${M.dbox(v3, P, true)}</div>`,
    // 앞 칸의 정답(소수)을 문장에 미리 보여 주지 않도록 '이 소수는'으로
    `<div class="eq" style="font-size:17px">이 소수는 1이 ${M.box(w3)}개, 0.1이 ${M.box(d3[0])}개, 0.01이 ${M.box(d3[1])}개, 0.001이 <span class="tail">${M.box(d3[2])}개입니다.</span></div>`), true));
  hints.push('자연수 부분은 일의 자리에, 분수 부분은 소수 세 자리 수로 바꾸어 소수점 뒤에 써요.<br>소수점 뒤 첫째 숫자가 0.1의 개수, 둘째가 0.01의 개수, 셋째가 0.001의 개수예요.');

  // 4번: 자리 이름과 나타내는 값 (소수 둘째·셋째 자리)
  let d4; do { d4 = [M.rand(1, 9), M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)]; } while (new Set(d4).size < 4);
  const s4 = d4[0] + '.' + d4[1] + d4[2] + d4[3];
  cards.push(M.card(3, `<div class="q-text">네모 안의 소수가 나타내는 자리와 값을 알아보세요.</div>` +
    M.placeBlock(s4, [M.placeLine(s4, d4[2], 2, 3, d4[2] * 10, P), M.placeLine(s4, d4[3], 3, 3, d4[3], P)]), true));
  hints.push('소수점 오른쪽으로 첫째(0.■), 둘째(0.0■), 셋째(0.00■) 자리예요.<br>예) 1.853에서 5는 0.05, 3은 0.003을 나타내요.');

  // 5번: 0.001이 몇 개인 수 (교과서 창의+) — 자리별로 나누어 센 다음 모두 합하기
  const g5 = [M.rand(1, 3), M.rand(1, 9), M.rand(1, 9), M.rand(1, 9)];          // 일의 자리, 소수 첫째·둘째·셋째 자리 숫자
  const v5 = g5[0] * 1000 + g5[1] * 100 + g5[2] * 10 + g5[3];
  const parts5 = [[String(g5[0]), g5[0] * 1000], ['0.' + g5[1], g5[1] * 100], ['0.0' + g5[2], g5[2] * 10], ['0.00' + g5[3], g5[3]]];
  // 4칸 표 모양: [수는] [0.001이] [□] [개] — 칸이 위아래로 줄 맞추어 보이게
  const cell = 'style="font-size:18px;font-weight:bold;color:#1e293b"';
  const row5 = (label, n, last) => `<div ${cell} class="${last ? 'cnt-last' : ''}">${last ? '→ ' : ''}${label}${M.josa(label, '은', '는')}</div>` +
    `<div ${cell} class="${last ? 'cnt-last' : ''}">0.001이</div><div class="${last ? 'cnt-last' : ''}">${M.box(n)}</div><div ${cell} class="${last ? 'cnt-last' : ''}">개</div>`;
  cards.push(M.card(4, `<div class="q-text">네모 안의 소수는 0.001이 몇 개인 수인지 자리별로 나누어 알아보세요.</div>` +
    `<div class="place-wrap"><div class="big-num">${f(v5)}</div>` +
    `<div class="cnt-grid">` + parts5.map(([l, n]) => row5(l, n)).join('') + row5(f(v5), v5, true) + `</div></div>`, true));
  hints.push('1은 0.001이 1000개, 0.1은 0.001이 100개, 0.01은 0.001이 10개예요.<br>예) 1.324 → 1은 1000개, 0.3은 300개, 0.02는 20개, 0.004는 4개 → 모두 <b>1324개</b>');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
