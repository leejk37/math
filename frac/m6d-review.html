<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>6학년 소수의 나눗셈 검토</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1f5f9; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; color: #1e293b; }
  header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 2px solid #e2e8f0; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 19px; margin: 0 12px 0 0; }
  header .note { font-size: 13px; color: #64748b; flex-basis: 100%; }
  nav a { display: inline-block; font-size: 13px; padding: 5px 10px; border-radius: 14px; background: #e2e8f0; color: #334155; text-decoration: none; margin: 2px; }
  nav a.done { background: #dcfce7; color: #166534; }
  main { max-width: 1020px; margin: 0 auto; padding: 16px; }
  section { background: #fff; border: 2px solid #cbd5e1; border-radius: 14px; margin-bottom: 22px; overflow: hidden; }
  section.done { border-color: #86efac; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
  .bar h2 { font-size: 17px; margin: 0; flex: 1 1 260px; }
  .bar .tb { font-size: 12px; color: #64748b; font-weight: normal; display: block; margin-top: 2px; }
  button { border: none; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
  .b-new { background: #8b5cf6; color: #fff; }
  .b-ans { background: #f59e0b; color: #fff; }
  .b-ans.on { background: #b45309; }
  iframe { width: 100%; border: none; display: block; min-height: 400px; }
  .review { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid #e2e8f0; background: #fffbeb; }
  .review label { font-weight: bold; font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .review textarea { flex: 1 1 400px; min-height: 54px; font-size: 14px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
  .copy { background: #0ea5e9; color: #fff; }
  #copied { font-size: 13px; color: #15803d; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>6학년 소수의 나눗셈(1학기 M613 · 2학기 M622) 검토</h1>
  <nav id="nav"></nav>
  <button class="copy" onclick="copyNotes()">검토 의견 모두 복사</button>
  <span id="copied"></span>
  <div class="note">문제는 연습 모드라 기록이 저장되지 않습니다. '정답 보기'를 누르면 칸에 정답이 들어가고, 이어서 '정답 확인하기'를 누르면 채점까지 확인됩니다.
    검토 의견과 체크는 이 컴퓨터의 브라우저에만 남으니, 다 쓰면 '검토 의견 모두 복사'로 Claude에게 붙여 넣어 주세요.</div>
</header>
<main id="main"></main>

<script>
const LEVELS = [
  ['6131', '(6131) (소수) ÷ (자연수) — 몫이 1보다 크고 각 자리에서 나누어떨어지는 경우', '6-1 교과서 58~59쪽 · 수학 익힘 36~37쪽'],
  ['6132', '(6132) (소수) ÷ (자연수) — 몫이 1보다 크고 각 자리에서 나누어떨어지지 않는 경우', '6-1 교과서 60~61쪽 · 수학 익힘 38~39쪽'],
  ['6133', '(6133) (소수) ÷ (자연수) — 몫이 1보다 작은 경우', '6-1 교과서 62~63쪽 · 수학 익힘 40~41쪽'],
  ['6134', '(6134) (소수) ÷ (자연수) — 소수점 아래 0을 내려 계산하는 경우', '6-1 교과서 64~65쪽 · 수학 익힘 42~43쪽'],
  ['6135', '(6135) (소수) ÷ (자연수) — 몫의 소수 첫째 자리에 0이 있는 경우', '6-1 교과서 66~67쪽 · 수학 익힘 44~45쪽'],
  ['6136', '(6136) (자연수) ÷ (자연수)의 몫을 소수로 나타내기', '6-1 교과서 68~69쪽 · 수학 익힘 46~47쪽'],
  ['6137', '(6137) 어림셈으로 몫의 소수점 위치 확인하기', '6-1 교과서 70~71쪽 · 수학 익힘 48~49쪽'],
  ['6221', '(6221) 자연수의 나눗셈을 이용한 (소수) ÷ (소수)', '6-2 교과서 34~37쪽 · 수학 익힘 24~25쪽'],
  ['6222', '(6222) (소수) ÷ (소수) — 자릿수가 같은 경우', '6-2 교과서 38~39쪽 · 수학 익힘 26~27쪽'],
  ['6223', '(6223) (소수) ÷ (소수) — 자릿수가 다른 경우', '6-2 교과서 40~41쪽 · 수학 익힘 28~29쪽'],
  ['6224', '(6224) (자연수) ÷ (소수)', '6-2 교과서 42~43쪽 · 수학 익힘 30~31쪽'],
  ['6225', '(6225) 몫을 반올림하여 나타내기', '6-2 교과서 44~45쪽 · 수학 익힘 32~33쪽'],
  ['6226', '(6226) 나누어 주고 남는 양 알아보기', '6-2 교과서 46~47쪽 · 수학 익힘 34~35쪽']
];
const KEY = 'm6d-review';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

const main = document.getElementById('main'), nav = document.getElementById('nav');
LEVELS.forEach(([code, title, tb]) => {
  const s = saved[code] || {};
  main.insertAdjacentHTML('beforeend', `
  <section id="sec-${code}" class="${s.ok ? 'done' : ''}">
    <div class="bar">
      <h2>${title}<span class="tb">${tb} · 파일 frac/${code}.html</span></h2>
      <button class="b-new" onclick="newSet('${code}')">새 문제 🎲</button>
      <button class="b-ans" id="ans-${code}" onclick="toggleAns('${code}')">정답 보기</button>
    </div>
    <iframe id="f-${code}" src="${code}.html" title="${title}"></iframe>
    <div class="review">
      <label><input type="checkbox" id="ok-${code}" ${s.ok ? 'checked' : ''} onchange="mark('${code}')"> 검토 완료</label>
      <textarea id="memo-${code}" placeholder="고칠 점 (예: 3번 문제 숫자가 너무 큼, 문장 바꾸기 …)" oninput="memo('${code}')">${s.memo || ''}</textarea>
    </div>
  </section>`);
  nav.insertAdjacentHTML('beforeend', `<a href="#sec-${code}" id="nav-${code}" class="${s.ok ? 'done' : ''}">${title.split(' ')[0]}</a>`);
});

function frameDoc(code) { const f = document.getElementById('f-' + code); return f && f.contentDocument; }
function newSet(code) {
  const d = frameDoc(code); if (!d) return;
  const btn = d.querySelector('.reset-btn'); if (btn) btn.click();
  const b = document.getElementById('ans-' + code); b.classList.remove('on'); b.textContent = '정답 보기';
}
function toggleAns(code) {
  const f = document.getElementById('f-' + code), w = f && f.contentWindow;
  if (!w || !w.M || !w.M.fill) return;
  const b = document.getElementById('ans-' + code), on = !b.classList.contains('on');
  w.M.fill(on);
  b.classList.toggle('on', on); b.textContent = on ? '정답 지우기' : '정답 보기';
}
function mark(code) {
  const ok = document.getElementById('ok-' + code).checked;
  (saved[code] = saved[code] || {}).ok = ok; save();
  document.getElementById('sec-' + code).classList.toggle('done', ok);
  document.getElementById('nav-' + code).classList.toggle('done', ok);
}
function memo(code) { (saved[code] = saved[code] || {}).memo = document.getElementById('memo-' + code).value; save(); }
function copyNotes() {
  const text = LEVELS.map(([code, title]) => {
    const s = saved[code] || {};
    return `[${title}] ${s.ok ? '검토 완료' : '검토 전'}${s.memo ? '\n- ' + s.memo.trim().replace(/\n/g, '\n- ') : ''}`;
  }).join('\n\n');
  const done = () => { document.getElementById('copied').textContent = '복사했습니다 ✔'; setTimeout(() => document.getElementById('copied').textContent = '', 2500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('아래 내용을 복사하세요', text));
  else prompt('아래 내용을 복사하세요', text);
}
// 문제 화면(iframe)이 보내는 높이에 맞춰 늘이기
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'frac-height') return;
  LEVELS.forEach(([code]) => { const f = document.getElementById('f-' + code); if (f.contentWindow === e.source) f.style.height = Math.max(400, e.data.h) + 'px'; });
});
</script>
</body>
</html>
