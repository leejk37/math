<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>진분수의 곱셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">진분수의 곱셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분자는 분자끼리, 분모는 분모끼리 곱해요</div>
  <div class="rule-line"><span class="rule-tag">단위분수</span> 1/4 × 1/5 = 1/(4 × 5) = <b>1/20</b></div>
  <div class="rule-line"><span class="rule-tag t2">진분수</span> 5/6 × 3/4 = (5 × 3)/(6 × 4) = 15/24 = <b>5/8</b> (약분하여 기약분수로)</div>
  <div class="rule-line"><span class="rule-tag t3">세 분수</span> 1/2 × 1/5 × 2/3 = (1 × 1 × 2)/(2 × 5 × 3) = 2/30 = <b>1/15</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5225 — 진분수의 곱셈 (교과서 5-2-2 44~47쪽, 수학익힘 34~35쪽, 성취기준 [6수01-10])
// 진단 포인트: 분모를 그대로 두고 분자만 곱함(덧셈처럼 생각), 약분하지 않음, 진분수를 곱하면 작아진다는 감각
const R = M.rand;
M.inlineQuestion = true;
const X = F.OP['x'], P = F.OP['+'], EQ = '<span class="op">=</span>';
const LP = '<span class="op">(</span>', RP = '<span class="op">)</span>';
const ft = F.ft;
// 조사: 분수는 분자를 마지막에 읽으므로(사분의 삼) 분자로, 자연수는 그 수로 받침을 판단
const J = (s, a, b) => { const t = String(s), k = t.includes('/') ? t.split('/')[0].split(' ').pop() : t; return t + M.josa(k, a, b); };
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: (단위분수) × (단위분수) 2문제
  const U = () => F.gen(() => [R(2, 9), R(2, 9)], ([a, b]) => a !== b);
  cards.push(M.card(0, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(...[U(), U()].map(([a, b]) => `<div class="qbox"><div class="eq">${F.fr(1, a)}${X}${F.fr(1, b)}${EQ}${F.fd(1, a * b)}</div></div>`)), true));
  hints.push('1/4 × 1/5는 1/4을 다시 5로 나눈 것 중 하나예요. 분모끼리 곱해요.');

  // 2번: 분자끼리, 분모끼리 (약분이 필요한 수)
  const [x2, y2] = F.gen(() => [F.proper(2, 9), F.proper(2, 9)], ([x, y]) => x.d * y.d <= 72 && F.gcd(x.n * y.n, x.d * y.d) > 1 && x.n * y.n > 1);
  cards.push(M.card(1, `<div class="q-text">분자는 분자끼리, 분모는 분모끼리 곱하여 계산해 보세요.</div>` +
    `<div class="eq">${F.fr(x2.n, x2.d)}${X}${F.fr(y2.n, y2.d)}${EQ}${F.ex(x2.n + ' × ' + y2.n, x2.d + ' × ' + y2.d)}${EQ}${F.tailF(x2.n * y2.n, x2.d * y2.d)}</div>`, true));
  hints.push('분자끼리 곱한 수를 분자에, 분모끼리 곱한 수를 분모에 써요. 그다음 약분하여 기약분수로 나타내요.');

  // 3번: 계산 (두 분수 1, 세 분수 1)
  const [x3, y3] = F.gen(() => [F.proper(3, 12), F.proper(3, 12)], ([x, y]) => x.d * y.d <= 96 && x.n * y.n > 1);
  const T = F.gen(() => [F.proper(2, 5), F.proper(2, 5), F.proper(2, 5)], t => t[0].d * t[1].d * t[2].d <= 60);
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="qbox">${F.calc(F.fr(x3.n, x3.d) + X + F.fr(y3.n, y3.d), F.mul(x3, y3))}</div>`,
           `<div class="qbox">${F.calc(T.map(t => F.fr(t.n, t.d)).join(X), F.mul(F.mul(T[0], T[1]), T[2]))}</div>`), true));
  hints.push('세 분수의 곱셈도 분자는 분자끼리, 분모는 분모끼리 곱해요. 중간에 약분하면 계산이 쉬워요.');

  // 4번: 크기 비교
  const x4 = F.proper(2, 9), y4 = F.proper(2, 9);
  const z4 = F.proper(2, 9), [a4, b4] = F.gen(() => [R(2, 9), R(2, 9)], ([a, b]) => a !== b);
  cards.push(M.card(3, `<div class="q-text">크기를 비교하여 ○ 안에 &gt;, =, &lt;를 알맞게 골라 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq cmp-row">${F.fr(x4.n, x4.d)} ${M.cmp(y4.d, y4.n)} ${F.fr(x4.n, x4.d)}${X}${F.fr(y4.n, y4.d)}</div></div>`,
           `<div class="qbox"><div class="eq cmp-row">${F.fr(z4.n, z4.d)}${X}${F.fr(1, a4)} ${M.cmp(b4, a4)} ${F.fr(z4.n, z4.d)}${X}${F.fr(1, b4)}</div></div>`), true));
  hints.push('어떤 수에 진분수를 곱하면 처음 수보다 작아져요. 단위분수는 분모가 클수록 작아요.');

  // 5번: 문장제 (남은 부분의 몇 분의 몇)
  const a5 = R(3, 6), y5 = F.gen(() => F.proper(2, 7), y => y.n > 1 || y.d > 2);
  const left5 = { n: a5 - 1, d: a5 };
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">은우는 어제 책 한 권의 1/${a5}을 읽었습니다. 오늘은 어제 읽고 남은 나머지의 ${J(ft(y5), '을', '를')} 읽었습니다. 오늘 읽은 부분은 전체 책의 얼마인가요?</div>` +
    `<div class="eq">전체의 ${F.ans(F.mul(left5, y5))}</div>`, true));
  hints.push(`어제 읽고 남은 부분은 전체의 ${a5 - 1}/${a5}이에요. 오늘은 그 ${J(ft(y5), '을', '를')} 읽었으니 ${a5 - 1}/${a5} × ${J(ft(y5), '을', '를')} 계산해요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
