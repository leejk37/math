<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261105-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>공배수와 최소공배수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">공배수와 최소공배수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 공배수: 두 수의 공통된 배수 · 최소공배수: 그중 가장 작은 수</div>
  <div class="rule-line"><span class="rule-tag">뜻</span> 4의 배수 4, 8, <b>12</b>, 16, 20, <b>24</b>, … / 6의 배수 6, <b>12</b>, 18, <b>24</b>, … → 공배수 12, 24, …, 최소공배수 <b>12</b></div>
  <div class="rule-line"><span class="rule-tag t2">곱</span> 18 = 2 × 3 × 3, 30 = 2 × 3 × 5 → 공통인 2 × 3에 남은 3과 5를 곱해 <b>90</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 두 수의 곱이 늘 최소공배수인 것은 아니에요. 4 × 6 = 24지만 최소공배수는 12예요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5124 — 공배수와 최소공배수 (교과서 5-1-2 40~43쪽, 수학익힘 28~29쪽, 성취기준 [6수01-05])
// 진단 포인트: 두 수의 곱을 최소공배수로 씀, 한쪽 수의 배수만 고름, 공배수가 최소공배수의 배수임을 모름
const R = M.rand;
M.inlineQuestion = true;
// 최소공배수가 lim 이하이고 두 수의 곱과 다른 두 수 (한 수가 다른 수의 배수가 아님)
function pairL(lo, hi, lim) {
  return F.gen(() => { const a = R(lo, hi), b = R(lo, hi); return [a, b, F.lcm(a, b)]; },
    ([a, b, l]) => a !== b && a % b && b % a && l <= lim && l < a * b);
}
function factor(n) { const f = []; for (let p = 2; n > 1; p++) while (n % p === 0) { f.push(p); n /= p; } return f.join(' × '); }
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 배수 표 보고 공배수 고르기 + 최소공배수
  const [a1, b1, l1] = pairL(3, 10, 30);
  const mA = [], mB = []; for (let v = a1; v <= 60; v += a1) mA.push(v); for (let v = b1; v <= 60; v += b1) mB.push(v);
  cards.push(M.card(0, `<div class="q-text">${a1}과(와) ${b1}의 공배수를 60까지 모두 고르고, 최소공배수를 써 보세요.</div>` +
    `<table class="tbl"><tr><th>${a1}의 배수</th><td>${mA.join(', ')}</td></tr><tr><th>${b1}의 배수</th><td>${mB.join(', ')}</td></tr></table>` +
    `<div class="q-small">공배수</div>` + F.nums(mA, mA.filter(v => v % b1 === 0)) + `<div class="eq">최소공배수 ${M.box(l1)}</div>`, true));
  hints.push('두 줄에 모두 들어 있는 수를 찾아요. 그중 가장 작은 수가 최소공배수예요.');

  // 2번: 공배수 작은 수부터 3개
  const [a2, b2, l2] = pairL(2, 12, 36);
  cards.push(M.card(1, `<div class="q-text">${a2}과(와) ${b2}의 공배수를 가장 작은 수부터 차례대로 3개 써 보세요.</div>` +
    `<div class="eq">${M.box(l2)}, ${M.box(l2 * 2)}, ${M.box(l2 * 3)}</div>`, true));
  hints.push('먼저 최소공배수를 찾아요. 공배수는 최소공배수를 1배, 2배, 3배 한 수예요.');

  // 3번: 여러 수의 곱으로 최소공배수
  const [a3, b3, l3] = F.gen(() => pairL(6, 30, 200), ([a, b]) => F.gcd(a, b) > 2 && factor(a).includes('×') && factor(b).includes('×'));
  cards.push(M.card(2, `<div class="q-text">여러 수의 곱으로 나타낸 식을 보고 ${a3}과(와) ${b3}의 최소공배수를 구해 보세요.</div>` +
    `<div class="prod">${a3} = ${factor(a3)}<br>${b3} = ${factor(b3)}</div><div class="eq">최소공배수 ${M.box(l3)}</div>`, true));
  hints.push('공통으로 들어 있는 수는 한 번만 곱하고, 공통이 아닌 남은 수를 모두 곱해요.');

  // 4번: 문장제 (동시에 출발)
  const [a4, b4, l4] = pairL(4, 15, 59);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">놀이공원에서 코끼리 열차는 ${a4}분마다, 호랑이 열차는 ${b4}분마다 출발합니다. 두 열차가 오전 10시에 동시에 출발했습니다.</div>` +
    M.line(`<div class="qbox"><div class="eq">두 열차는 ${M.box(l4)}분마다 동시에 출발</div></div>`,
      `<div class="qbox"><div class="eq">다음번 동시 출발: 오전 10시 ${M.box(l4)}분</div></div>`), true));
  hints.push(`${a4}의 배수이면서 ${b4}의 배수인 시간마다 함께 출발해요. 가장 작은 공배수를 찾아요.`);

  // 5번: 최대공약수와 최소공배수
  const [a5, b5, l5] = pairL(12, 60, 400);
  cards.push(M.card(4, `<div class="q-text">${a5}과(와) ${b5}의 최대공약수와 최소공배수를 구해 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">최대공약수 ${M.box(F.gcd(a5, b5))}</div></div>`, `<div class="qbox"><div class="eq">최소공배수 ${M.box(l5)}</div></div>`), true));
  hints.push('두 수를 공약수로 계속 나누어 보세요. 나눈 수들의 곱이 최대공약수, 나눈 수들과 마지막 몫들의 곱이 최소공배수예요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
