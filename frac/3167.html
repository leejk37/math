<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>분수와 소수 문제 모음</title>
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
    color: #222;
    font-size: 16px;
  }
  h2 { font-size: 19px; margin-bottom: 24px; }

  .problem {
    background: #fff;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .problem-num {
    display: inline-block;
    background: #6a5acd;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    text-align: center;
    line-height: 24px;
    margin-right: 8px;
  }
  .problem-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  svg { display: block; }

  .sub-question {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 16px;
    line-height: 1.6;
    margin: 10px 0;
  }

  /* 분수 입력칸: 본문 글자 크기와 비슷하게, 여백도 문제 크기에 맞춰 축소 */
  .fraction-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }
  .fraction-box .cell {
    width: 38px;
    height: 30px;
    font-size: 16px;
    text-align: center;
    border-radius: 6px;
    margin: 2px 0;
    box-sizing: border-box;
    padding: 0;
  }
  .fraction-box input.cell {
    border: 2px solid #7ec8e3;
    background: #fff;
  }
  .fraction-box input.cell:disabled {
    background: #eee;
    color: #777;
    border-color: #ccc;
    cursor: not-allowed;
    font-weight: bold;
  }
  .fraction-line { width: 38px; height: 2px; background: #333; margin: 2px 0; }

  .count-input, .decimal-input {
    width: 52px;
    height: 30px;
    font-size: 16px;
    text-align: center;
    border: 2px solid #7ec8e3;
    border-radius: 6px;
    box-sizing: border-box;
    padding: 0;
  }

  .sentence { font-size: 16px; line-height: 2.2; }

  .feedback {
    min-height: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 12px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .global-controls {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .global-btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .global-check-btn { background: #6a5acd; color: #fff; }
  .global-check-btn:hover { background: #5a4bb8; }
  .global-reset-btn { background: #eee; color: #555; }
  .global-reset-btn:hover { background: #ddd; }
  .summary { font-size: 15px; font-weight: bold; }
</style>
</head>
<body>

<h2>분수와 소수 문제 모음</h2>

<div id="problems"></div>

<div class="global-controls">
  <button class="global-btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="global-btn global-reset-btn" id="newAllBtn">새 문제 (전체)</button>
  <span class="summary" id="summary"></span>
</div>

<script>
/* ===================== 공통 유틸 ===================== */
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function blockNonNatural(inp) {
  inp.addEventListener('keydown', (e) => {
    if (['-', '.', 'e', 'E', '+', ' '].includes(e.key)) e.preventDefault();
  });
}
function isNaturalNumber(raw) {
  if (raw === '' || raw === undefined) return false;
  const n = Number(raw);
  return Number.isInteger(n) && n > 0;
}

// 소수 입력칸: 숫자와 점(.)만 입력 가능
function blockNonDecimal(inp) {
  inp.addEventListener('keydown', (e) => {
    const allowedKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'];
    if (allowedKeys.includes(e.key)) return;
    if (!/[0-9.]/.test(e.key)) e.preventDefault();
  });
}
// 0.1 ~ 0.9 형태의 소수인지 확인
function isTenthsDecimal(raw) {
  return /^0\.[1-9]$/.test(raw.trim());
}

// 분수 입력 박스: 분자 1칸(1자리), 분모 1칸(최대 2자리)
// - 분모를 다 입력하면 자동으로 분자 칸으로 이동
// - 분자 칸이 비어 있는 상태에서 백스페이스를 누르면 분모 칸으로 돌아가면서
//   분모 내용을 블록 선택(바로 덮어쓸 수 있게) 처리
function makeFractionInputBox() {
  const box = document.createElement('div');
  box.className = 'fraction-box';

  const numInput = document.createElement('input');
  numInput.className = 'cell'; numInput.type = 'text'; numInput.inputMode = 'numeric';
  numInput.placeholder = '분자'; numInput.maxLength = 1;
  blockNonNatural(numInput);

  const line = document.createElement('div'); line.className = 'fraction-line';

  const denInput = document.createElement('input');
  denInput.className = 'cell'; denInput.type = 'text'; denInput.inputMode = 'numeric';
  denInput.placeholder = '분모'; denInput.maxLength = 2;
  blockNonNatural(denInput);

  // 분모를 다 입력하면(최대 자릿수에 도달하면) 자동으로 분자 칸으로 이동
  denInput.addEventListener('input', () => {
    if (denInput.value.length >= denInput.maxLength) {
      numInput.focus();
    }
  });
  // 한 자리 분모(예: 2, 5)만 입력하고 Enter를 누르면 바로 분자 칸으로 이동
  denInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') numInput.focus();
  });

  // 분자 칸이 비어 있을 때 백스페이스를 누르면 분모 칸으로 돌아가서 내용을 블록 선택
  numInput.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && numInput.value === '') {
      denInput.focus();
      denInput.select();
    }
  });

  box.appendChild(numInput); box.appendChild(line); box.appendChild(denInput);
  return { box, numInput, denInput };
}

function makeProblemWrapper(num, titleText) {
  const wrap = document.createElement('div');
  wrap.className = 'problem';
  const title = document.createElement('div');
  title.className = 'problem-title';
  const badge = document.createElement('span');
  badge.className = 'problem-num';
  badge.textContent = num;
  title.appendChild(badge);
  title.appendChild(document.createTextNode(titleText));
  wrap.appendChild(title);
  return wrap;
}

/* ===================== 문제 1: 수막대 + 4가지 질문 ===================== */
function makeProblem1() {
  const wrap = makeProblemWrapper(1, '수막대를 보고 물음에 답해 보세요.');

  let k;
  const svgWrap = document.createElement('div');
  wrap.appendChild(svgWrap);

  function draw() {
    svgWrap.innerHTML = '';
    const cellW = 40, cellH = 34, x0 = 4, y0 = 4;
    const totalW = cellW * 10 + x0 * 2;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', totalW);
    svg.setAttribute('height', 130);
    svg.setAttribute('viewBox', `0 0 ${totalW} 130`);

    // 분수(1/10) 줄
    for (let i = 0; i < 10; i++) {
      const x = x0 + i * cellW;
      svg.appendChild(el('rect', { x, y: y0, width: cellW, height: cellH, fill: i < k ? '#f6c9cd' : '#ffffff', stroke: '#333', 'stroke-width': 1.2 }));
      const t1 = document.createElementNS(svgNS, 'text');
      t1.setAttribute('x', x + cellW / 2); t1.setAttribute('y', y0 + cellH / 2 - 3);
      t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('font-size', '11'); t1.textContent = '1';
      const line = el('line', { x1: x + cellW / 2 - 8, y1: y0 + cellH / 2, x2: x + cellW / 2 + 8, y2: y0 + cellH / 2, stroke: '#333', 'stroke-width': 1 });
      const t2 = document.createElementNS(svgNS, 'text');
      t2.setAttribute('x', x + cellW / 2); t2.setAttribute('y', y0 + cellH / 2 + 13);
      t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('font-size', '11'); t2.textContent = '10';
      svg.appendChild(t1); svg.appendChild(line); svg.appendChild(t2);
    }
    // 소수(0.1) 줄
    const y1 = y0 + cellH;
    for (let i = 0; i < 10; i++) {
      const x = x0 + i * cellW;
      svg.appendChild(el('rect', { x, y: y1, width: cellW, height: cellH, fill: i < k ? '#f6c9cd' : '#ffffff', stroke: '#333', 'stroke-width': 1.2 }));
      const t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', x + cellW / 2); t.setAttribute('y', y1 + cellH / 2 + 4);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12'); t.textContent = '0.1';
      svg.appendChild(t);
    }
    // 수직선
    const lineY = y1 + cellH + 25;
    svg.appendChild(el('line', { x1: x0, y1: lineY, x2: x0 + cellW * 10, y2: lineY, stroke: '#333', 'stroke-width': 1.5 }));
    svg.appendChild(el('line', { x1: x0, y1: lineY - 6, x2: x0, y2: lineY + 6, stroke: '#333', 'stroke-width': 1.5 }));
    svg.appendChild(el('line', { x1: x0 + cellW * 10, y1: lineY - 6, x2: x0 + cellW * 10, y2: lineY + 6, stroke: '#333', 'stroke-width': 1.5 }));
    svg.appendChild(el('line', { x1: x0, y1: lineY, x2: x0 + cellW * k, y2: lineY, stroke: '#e05656', 'stroke-width': 4 }));
    const t0 = document.createElementNS(svgNS, 'text');
    t0.setAttribute('x', x0); t0.setAttribute('y', lineY + 20); t0.setAttribute('text-anchor', 'middle'); t0.setAttribute('font-size', '13'); t0.textContent = '0';
    const t1txt = document.createElementNS(svgNS, 'text');
    t1txt.setAttribute('x', x0 + cellW * 10); t1txt.setAttribute('y', lineY + 20); t1txt.setAttribute('text-anchor', 'middle'); t1txt.setAttribute('font-size', '13'); t1txt.textContent = '1';
    svg.appendChild(t0); svg.appendChild(t1txt);

    svgWrap.appendChild(svg);
  }

  // 수막대 색칠 범위: 5 이상 9 이하
  function regenerate() { k = randomInt(5, 9); draw(); }
  regenerate();

  const q1 = document.createElement('div'); q1.className = 'sub-question';
  q1.appendChild(document.createTextNode('색칠한 부분을 분수로 나타내면 얼마인가요? '));
  const f1 = makeFractionInputBox();
  q1.appendChild(f1.box);
  wrap.appendChild(q1);

  const q2 = document.createElement('div'); q2.className = 'sub-question';
  q2.appendChild(document.createTextNode('색칠한 부분은 1/10이 몇 개인가요? '));
  const countInput2 = document.createElement('input');
  countInput2.type = 'text'; countInput2.inputMode = 'numeric'; countInput2.className = 'count-input';
  countInput2.maxLength = 1;
  blockNonNatural(countInput2);
  q2.appendChild(countInput2);
  q2.appendChild(document.createTextNode('개'));
  wrap.appendChild(q2);

  const q3 = document.createElement('div'); q3.className = 'sub-question';
  q3.appendChild(document.createTextNode('색칠한 부분을 소수로 나타내면 얼마인가요? '));
  const decInput3 = document.createElement('input');
  decInput3.type = 'text'; decInput3.className = 'decimal-input'; decInput3.placeholder = '0.0';
  decInput3.maxLength = 3;
  blockNonDecimal(decInput3);
  q3.appendChild(decInput3);
  wrap.appendChild(q3);

  const q4 = document.createElement('div'); q4.className = 'sub-question';
  q4.appendChild(document.createTextNode('색칠한 부분은 0.1이 몇 개인가요? '));
  const countInput4 = document.createElement('input');
  countInput4.type = 'text'; countInput4.inputMode = 'numeric'; countInput4.className = 'count-input';
  countInput4.maxLength = 1;
  blockNonNatural(countInput4);
  q4.appendChild(countInput4);
  q4.appendChild(document.createTextNode('개'));
  wrap.appendChild(q4);

  // 문항 사이 자동 이동: 분자 -> 1/10 개수 -> 소수 -> 0.1 개수
  f1.numInput.addEventListener('input', () => {
    if (f1.numInput.value.length >= f1.numInput.maxLength) countInput2.focus();
  });
  countInput2.addEventListener('input', () => {
    if (countInput2.value.length >= countInput2.maxLength) decInput3.focus();
  });
  decInput3.addEventListener('input', () => {
    if (decInput3.value.length >= decInput3.maxLength) countInput4.focus();
  });

  // 백스페이스로 이전 문항 칸으로 돌아가면서 내용을 블록 선택
  countInput2.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && countInput2.value === '') { f1.numInput.focus(); f1.numInput.select(); }
  });
  decInput3.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && decInput3.value === '') { countInput2.focus(); countInput2.select(); }
  });
  countInput4.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && countInput4.value === '') { decInput3.focus(); decInput3.select(); }
  });

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const wrongParts = [];

    const n1 = f1.numInput.value.trim(), d1 = f1.denInput.value.trim();
    const frac1ok = isNaturalNumber(n1) && isNaturalNumber(d1) && Number(n1) * 10 === k * Number(d1);
    if (!frac1ok) wrongParts.push('분수');

    const c2ok = isNaturalNumber(countInput2.value.trim()) && Number(countInput2.value.trim()) === k;
    if (!c2ok) wrongParts.push('1/10의 개수');

    const dec3ok = isTenthsDecimal(decInput3.value) && Math.abs(parseFloat(decInput3.value) - k / 10) < 1e-9;
    if (!dec3ok) wrongParts.push('소수');

    const c4ok = isNaturalNumber(countInput4.value.trim()) && Number(countInput4.value.trim()) === k;
    if (!c4ok) wrongParts.push('0.1의 개수');

    const correct = wrongParts.length === 0;
    feedback.textContent = correct ? '정답이에요! 👏' : `다시 확인해 볼까요? (${wrongParts.join(', ')})`;
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    regenerate();
    f1.numInput.value = ''; f1.denInput.value = '';
    countInput2.value = ''; decInput3.value = ''; countInput4.value = '';
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 2: 직사각형 10등분 색칠 -> 분수/소수 (한 줄) ===================== */
function makeProblem2() {
  const wrap = makeProblemWrapper(2, '직사각형에서 색칠한 부분을 분수와 소수로 나타내어 보세요.');

  let k;
  const svgWrap = document.createElement('div');
  wrap.appendChild(svgWrap);

  function draw() {
    svgWrap.innerHTML = '';
    const x0 = 4, y0 = 4, w = 220, h = 140;
    const stripW = w / 10;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', w + 8); svg.setAttribute('height', h + 8);
    svg.setAttribute('viewBox', `0 0 ${w + 8} ${h + 8}`);
    for (let i = 0; i < 10; i++) {
      svg.appendChild(el('rect', { x: x0 + i * stripW, y: y0, width: stripW, height: h, fill: i < k ? '#ffcc99' : '#ffffff' }));
    }
    svg.appendChild(el('rect', { x: x0, y: y0, width: w, height: h, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
    for (let i = 1; i < 10; i++) {
      const x = x0 + i * stripW;
      svg.appendChild(el('line', { x1: x, y1: y0, x2: x, y2: y0 + h, stroke: '#333', 'stroke-width': 1.2, 'stroke-dasharray': '4,3' }));
    }
    svgWrap.appendChild(svg);
  }

  function regenerate() { k = randomInt(1, 9); draw(); }
  regenerate();

  // 분수, 소수 입력을 한 줄에 배치
  const qRow = document.createElement('div'); qRow.className = 'sub-question';
  qRow.appendChild(document.createTextNode('분수: '));
  const f1 = makeFractionInputBox();
  qRow.appendChild(f1.box);
  qRow.appendChild(document.createTextNode('소수: '));
  const decInput = document.createElement('input');
  decInput.type = 'text'; decInput.className = 'decimal-input'; decInput.placeholder = '0.0';
  decInput.maxLength = 3;
  blockNonDecimal(decInput);
  qRow.appendChild(decInput);
  wrap.appendChild(qRow);

  // 분자 입력을 마치면 자동으로 소수 칸으로 이동, 백스페이스로는 다시 분수 칸으로
  f1.numInput.addEventListener('input', () => {
    if (f1.numInput.value.length >= f1.numInput.maxLength) decInput.focus();
  });
  decInput.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && decInput.value === '') { f1.numInput.focus(); f1.numInput.select(); }
  });

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const wrongParts = [];
    const n1 = f1.numInput.value.trim(), d1 = f1.denInput.value.trim();
    const fracOk = isNaturalNumber(n1) && isNaturalNumber(d1) && Number(n1) * 10 === k * Number(d1);
    if (!fracOk) wrongParts.push('분수');

    const decOk = isTenthsDecimal(decInput.value) && Math.abs(parseFloat(decInput.value) - k / 10) < 1e-9;
    if (!decOk) wrongParts.push('소수');

    const correct = wrongParts.length === 0;
    feedback.textContent = correct ? '정답이에요! 👏' : `다시 확인해 볼까요? (${wrongParts.join(', ')})`;
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    regenerate();
    f1.numInput.value = ''; f1.denInput.value = ''; decInput.value = '';
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 3: 원 10등분 색칠 -> 분수/소수 (한 줄) ===================== */
function makeProblem3() {
  const wrap = makeProblemWrapper(3, '원에서 색칠한 부분을 분수와 소수로 나타내어 보세요.');

  let k;
  const svgWrap = document.createElement('div');
  wrap.appendChild(svgWrap);

  function draw() {
    svgWrap.innerHTML = '';
    const cx = 90, cy = 85, r = 75;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', 180); svg.setAttribute('height', 170); svg.setAttribute('viewBox', '0 0 180 170');
    for (let i = 0; i < 10; i++) {
      const a0 = (-90 + 36 * i) * Math.PI / 180;
      const a1 = (-90 + 36 * (i + 1)) * Math.PI / 180;
      const x1 = cx + r * Math.cos(a0), y1 = cy + r * Math.sin(a0);
      const x2 = cx + r * Math.cos(a1), y2 = cy + r * Math.sin(a1);
      const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;
      svg.appendChild(el('path', { d: path, fill: i < k ? '#bfe6d4' : '#ffffff' }));
    }
    svg.appendChild(el('circle', { cx, cy, r, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
    for (let i = 0; i < 10; i++) {
      const a = (-90 + 36 * i) * Math.PI / 180;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      svg.appendChild(el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: '#333', 'stroke-width': 1.3, 'stroke-dasharray': '4,3' }));
    }
    svgWrap.appendChild(svg);
  }

  function regenerate() { k = randomInt(1, 9); draw(); }
  regenerate();

  const qRow = document.createElement('div'); qRow.className = 'sub-question';
  qRow.appendChild(document.createTextNode('분수: '));
  const f1 = makeFractionInputBox();
  qRow.appendChild(f1.box);
  qRow.appendChild(document.createTextNode('소수: '));
  const decInput = document.createElement('input');
  decInput.type = 'text'; decInput.className = 'decimal-input'; decInput.placeholder = '0.0';
  decInput.maxLength = 3;
  blockNonDecimal(decInput);
  qRow.appendChild(decInput);
  wrap.appendChild(qRow);

  // 분자 입력을 마치면 자동으로 소수 칸으로 이동, 백스페이스로는 다시 분수 칸으로
  f1.numInput.addEventListener('input', () => {
    if (f1.numInput.value.length >= f1.numInput.maxLength) decInput.focus();
  });
  decInput.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && decInput.value === '') { f1.numInput.focus(); f1.numInput.select(); }
  });

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const wrongParts = [];
    const n1 = f1.numInput.value.trim(), d1 = f1.denInput.value.trim();
    const fracOk = isNaturalNumber(n1) && isNaturalNumber(d1) && Number(n1) * 10 === k * Number(d1);
    if (!fracOk) wrongParts.push('분수');

    const decOk = isTenthsDecimal(decInput.value) && Math.abs(parseFloat(decInput.value) - k / 10) < 1e-9;
    if (!decOk) wrongParts.push('소수');

    const correct = wrongParts.length === 0;
    feedback.textContent = correct ? '정답이에요! 👏' : `다시 확인해 볼까요? (${wrongParts.join(', ')})`;
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    regenerate();
    f1.numInput.value = ''; f1.denInput.value = ''; decInput.value = '';
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 4, 5 (통합형): 0.1과 소수 사이의 관계 문장제 =====================
   한 문제 안에 두 문장을 함께 제시한다.
   ① "0.k은 0.1이 [ ]개입니다."  (개수 빈칸, 정답 k)
   ② "0.1이 k개이면 [ ]입니다."  (소수 빈칸, 정답 0.k)
   두 문장 모두 같은 k값을 사용하며, 이 유형을 4번/5번에 각각 독립적으로 출제한다. */
function makeUnitDecimalSentenceProblem(num) {
  const wrap = makeProblemWrapper(num, '빈칸에 알맞은 수를 써 보세요.');

  let k;
  const sentenceRow = document.createElement('div');
  sentenceRow.className = 'sentence';
  sentenceRow.style.display = 'flex';
  sentenceRow.style.flexWrap = 'wrap';
  sentenceRow.style.alignItems = 'center';
  sentenceRow.style.gap = '6px';
  wrap.appendChild(sentenceRow);

  const countInput = document.createElement('input');
  countInput.type = 'text'; countInput.inputMode = 'numeric'; countInput.className = 'count-input';
  countInput.maxLength = 1;
  blockNonNatural(countInput);

  const decInput = document.createElement('input');
  decInput.type = 'text'; decInput.className = 'decimal-input'; decInput.placeholder = '0.0';
  decInput.maxLength = 3;
  blockNonDecimal(decInput);

  function build() {
    // k=1이면 "0.1은 0.1이 [ ]개입니다."처럼 문장이 어색해지므로 2~9 범위로 제한
    k = randomInt(2, 9);
    const decimalStr = '0.' + k;

    sentenceRow.innerHTML = '';
    sentenceRow.appendChild(document.createTextNode(`${decimalStr}은 0.1이 `));
    sentenceRow.appendChild(countInput);
    sentenceRow.appendChild(document.createTextNode(' 개입니다.'));
    sentenceRow.appendChild(document.createTextNode(`  0.1이 ${k}개이면 `));
    sentenceRow.appendChild(decInput);
    sentenceRow.appendChild(document.createTextNode(' 입니다.'));
  }
  build();

  // 개수 칸을 입력하면 자동으로 소수 칸으로 이동, 백스페이스로는 다시 개수 칸으로
  countInput.addEventListener('input', () => {
    if (countInput.value.length >= countInput.maxLength) decInput.focus();
  });
  decInput.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && decInput.value === '') { countInput.focus(); countInput.select(); }
  });

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const wrongParts = [];

    const countOk = isNaturalNumber(countInput.value.trim()) && Number(countInput.value.trim()) === k;
    if (!countOk) wrongParts.push('첫 번째 빈칸');

    const decOk = isTenthsDecimal(decInput.value) && Math.abs(parseFloat(decInput.value) - k / 10) < 1e-9;
    if (!decOk) wrongParts.push('두 번째 빈칸');

    const correct = wrongParts.length === 0;
    feedback.textContent = correct ? '정답이에요! 👏' : `다시 확인해 볼까요? (${wrongParts.join(', ')})`;
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    build();
    decInput.value = ''; countInput.value = '';
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 초기화 ===================== */
const problemsEl = document.getElementById('problems');
const summaryEl = document.getElementById('summary');

const problems = [
  makeProblem1(),
  makeProblem2(),
  makeProblem3(),
  makeUnitDecimalSentenceProblem(4),
  makeUnitDecimalSentenceProblem(5)
];
problems.forEach(p => problemsEl.appendChild(p.wrap));

document.getElementById('checkAllBtn').onclick = () => {
  const results = problems.map(p => p.check());
  const correctCount = results.filter(r => r === true).length;
  summaryEl.textContent = `${problems.length}문제 중 ${correctCount}개 정답`;
};

document.getElementById('newAllBtn').onclick = () => {
  problems.forEach(p => p.regenerate());
  summaryEl.textContent = '';
};
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: '#checkAllBtn', newBtn: '#newAllBtn', grade: () => { const r = problems.map(p => p.check()); summaryEl.textContent = `${r.length}문제 중 ${r.filter(Boolean).length}개 정답`; return r; } });
</script>
</body>
