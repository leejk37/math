<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수와 소수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분수와 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 1/10을 0.1이라 쓰고 영 점 일이라고 읽어요</div>
  <div class="rule-line"><span class="rule-tag">소수</span> 1/10 = <b>0.1</b>, 3/10 = <b>0.3</b> (0.1이 3개)</div>
  <div class="rule-line"><span class="rule-tag t2">읽기</span> 0.7 → <b>영 점 칠</b></div>
  <div class="rule-line"><span class="rule-tag t3">소수점</span> 0.1, 0.5처럼 '.'을 소수점이라고 해요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3167 — 분수와 소수 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 분모가 10인 분수와 소수를 연결하지 못함, 0.1의 개수로 생각하지 못함, 소수를 자연수처럼 읽음
M.inlineQuestion = true;
const n9 = () => M.rand(1, 9);
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 10칸 막대 → 분수와 소수
  const a1 = n9();
  cards.push(M.card(0, `<div class="q-text">색칠한 부분을 분수와 소수로 나타내 보세요.</div>` + M.bar(a1) +
    `<div class="row" style="gap:40px;align-items:center"><div class="eq" style="font-size:18px">분수: ${F.fn(a1, 10)}</div>` +
    `<div class="eq" style="font-size:18px">소수: <span class="tail">${M.dbox(a1, 1, true)}</span></div></div>`, true));
  hints.push('막대 전체를 똑같이 10칸으로 나누었어요. 한 칸은 1/10이고 소수로 0.1이에요.');

  // 2번: 원 10조각 → 분수와 소수
  const a2 = n9();
  cards.push(M.card(1, `<div class="q-text">색칠한 부분을 분수와 소수로 나타내 보세요.</div>` +
    `<div class="row" style="align-items:center;gap:36px">${S.circle(10, a2)}` +
    `<div style="display:flex;flex-direction:column;gap:12px"><div class="eq" style="font-size:18px">분수: ${F.fn(a2, 10)}</div>` +
    `<div class="eq" style="font-size:18px">소수: <span class="tail">${M.dbox(a2, 1, true)}</span></div></div></div>`, true));
  hints.push('원을 똑같이 10조각으로 나누었어요. 색칠한 조각 수만큼 0.1이 있어요.');

  // 3번: 0.1의 개수
  const a3 = n9(); let b3; do { b3 = n9(); } while (b3 === a3);
  cards.push(M.card(2, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(`<div class="qbox"><div class="eq" style="font-size:18px">0.${a3}${M.josa(a3, '은', '는')} 0.1이 <span class="tail">${M.box(a3)}개입니다.</span></div></div>`,
      `<div class="qbox"><div class="eq" style="font-size:18px">0.1이 ${b3}개이면 <span class="tail">${M.dbox(b3, 1, true)}입니다.</span></div></div>`), true));
  hints.push('0.1이 ■개이면 0.■ 이에요. 소수점 오른쪽 숫자가 0.1의 개수예요.');

  // 4번: 소수 읽기
  const a4 = n9(), DIG = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  cards.push(M.card(3, `<div class="q-text">소수를 바르게 읽은 것을 골라 보세요.</div>` +
    `<div class="pick-v"><div class="eq" style="font-size:26px">0.${a4}</div>` +
    F.one(`영 점 ${DIG[a4]}`, [`${DIG[a4]}`, `영 ${DIG[a4]}`]) + `</div>`, true));
  hints.push('소수점은 <b>점</b>이라고 읽어요. 0.4 → 영 점 사');

  // 5번: 분수 → 소수
  const a5 = n9(); let b5; do { b5 = n9(); } while (b5 === a5);
  cards.push(M.card(4, `<div class="q-text">분수를 소수로 나타내 보세요.</div>` +
    M.line(...[a5, b5].map(v => `<div class="qbox"><div class="eq">${M.frac(v, 10)}${G0.EQ}${M.dbox(v, 1, true)}</div></div>`)), true));
  hints.push('분모가 10인 분수는 분자가 0.1의 개수예요. 7/10 = 0.7');
  M.render(cards, hints);
}
const G0 = { EQ: '<span class="op">=</span>' };
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
