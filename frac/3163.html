<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>분수만큼 색칠하고 나머지 분수로 나타내기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
  }
  h2 {
    font-size: 19px;
    margin-bottom: 6px;
    color: #222;
  }
  .sub {
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }
  .board {
    display: flex;
    flex-wrap: nowrap;      /* 세 도형이 항상 한 줄에 표시되도록 */
    gap: 22px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .card {
    flex: 0 0 auto;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 16px;
    width: 230px;
    text-align: center;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .shape-title {
    font-size: 14px;
    font-weight: bold;
    color: #555;
    margin-bottom: 8px;
  }
  svg {
    display: block;
    margin: 0 auto;
  }
  .piece {
    cursor: pointer;
  }
  .fraction-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .fraction-box {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fraction-box .cell {
    width: 44px;
    height: 38px;
    font-size: 17px;
    text-align: center;
    border-radius: 8px;
    margin: 3px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fraction-box.given .cell {
    background: #e4e4ea;
    color: #333;
    font-weight: bold;
  }
  .fraction-box.answer input.cell {
    border: 2px solid #7ec8e3;
    background: #fff;
  }
  .fraction-line {
    width: 44px;
    height: 2px;
    background: #333;
    margin: 2px 0;
  }
  .speaker-btn {
    font-size: 20px;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }
  .feedback {
    min-height: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 10px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .global-controls {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .global-btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .global-check-btn { background: #6a5acd; color: #fff; }
  .global-check-btn:hover { background: #5a4bb8; }
  .global-reset-btn { background: #eee; color: #555; }
  .global-reset-btn:hover { background: #ddd; }
  .summary { font-size: 15px; font-weight: bold; color: #333; }
</style>
</head>
<body>

<h2>주어진 분수만큼 도형의 조각을 클릭하여 색칠해 보고, 색칠하지 않은 부분을 분수로 나타내어 봅시다.</h2>
<div class="sub">회색 칸에 적힌 분수만큼 도형 조각을 눌러 색칠하세요.</div>

<div class="board" id="board"></div>

<div class="global-controls">
  <button class="global-btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="global-btn global-reset-btn" id="newAllBtn">새 문제 (전체)</button>
  <span class="summary" id="summary"></span>
</div>

<script>
/* ===================== 공통 유틸 ===================== */
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function polygonVertices(cx, cy, r, n, startAngleDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (startAngleDeg + (360 / n) * i) * Math.PI / 180;
    pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
  }
  return pts;
}

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ===================== 도형별 상태 생성 =====================
   n: 전체 등분 수(분모), targetNumerator: 색칠해야 할 분수의 분자
   shaded: 학습자가 실제로 클릭해서 색칠한 조각 번호 집합 (처음엔 비어 있음) */
function generateState(type) {
  let n;
  if (type === 'square') n = 4;
  else if (type === 'octagon') n = 8;
  else if (type === 'circle') n = randomInt(3, 12);

  const targetNumerator = randomInt(1, n - 1);
  return { n, targetNumerator, shaded: new Set() };
}

/* ===================== SVG 렌더링 (클릭 가능한 조각) ===================== */
function renderShape(svg, type, state, onToggle) {
  svg.innerHTML = '';
  const { n, shaded } = state;
  const color = type === 'square' ? '#bfe0ff'
              : type === 'octagon' ? '#d3cbee'
              : '#f6c9cd';
  const cx = 110, cy = 95, r = 78;

  function applyPieceStyle(piece, index) {
    piece.setAttribute('fill', shaded.has(index) ? color : '#ffffff');
  }

  if (type === 'circle') {
    for (let i = 0; i < n; i++) {
      const a0 = (-90 + (360 / n) * i) * Math.PI / 180;
      const a1 = (-90 + (360 / n) * (i + 1)) * Math.PI / 180;
      const x1 = cx + r * Math.cos(a0), y1 = cy + r * Math.sin(a0);
      const x2 = cx + r * Math.cos(a1), y2 = cy + r * Math.sin(a1);
      const largeArc = (360 / n) > 180 ? 1 : 0;
      const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
      const piece = el('path', { d: path, class: 'piece' });
      applyPieceStyle(piece, i);
      piece.addEventListener('click', () => {
        if (shaded.has(i)) shaded.delete(i); else shaded.add(i);
        applyPieceStyle(piece, i);
        onToggle();
      });
      svg.appendChild(piece);
    }
    svg.appendChild(el('circle', { cx, cy, r, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
    for (let i = 0; i < n; i++) {
      const a = (-90 + (360 / n) * i) * Math.PI / 180;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      svg.appendChild(el('line', {
        x1: cx, y1: cy, x2: x, y2: y,
        stroke: '#333', 'stroke-width': 1.5, 'stroke-dasharray': '4,3', 'pointer-events': 'none'
      }));
    }
  } else {
    const startAngle = type === 'square' ? 45 : 22.5;
    const verts = polygonVertices(cx, cy, r, n, startAngle);

    for (let i = 0; i < n; i++) {
      const a = verts[i], b = verts[(i + 1) % n];
      const points = `${cx},${cy} ${a[0]},${a[1]} ${b[0]},${b[1]}`;
      const piece = el('polygon', { points, class: 'piece' });
      applyPieceStyle(piece, i);
      piece.addEventListener('click', () => {
        if (shaded.has(i)) shaded.delete(i); else shaded.add(i);
        applyPieceStyle(piece, i);
        onToggle();
      });
      svg.appendChild(piece);
    }
    const outline = verts.map(p => p.join(',')).join(' ');
    svg.appendChild(el('polygon', { points: outline, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
    verts.forEach(p => {
      svg.appendChild(el('line', {
        x1: cx, y1: cy, x2: p[0], y2: p[1],
        stroke: '#333', 'stroke-width': 1.5, 'stroke-dasharray': '4,3', 'pointer-events': 'none'
      }));
    });
  }
}

/* ===================== 분수 박스 생성 ===================== */
function makeGivenFractionBox(numerator, denominator) {
  const box = document.createElement('div');
  box.className = 'fraction-box given';

  const num = document.createElement('div');
  num.className = 'cell';
  num.textContent = numerator;

  const line = document.createElement('div');
  line.className = 'fraction-line';

  const den = document.createElement('div');
  den.className = 'cell';
  den.textContent = denominator;

  box.appendChild(num);
  box.appendChild(line);
  box.appendChild(den);
  return box;
}

function makeAnswerFractionBox() {
  const box = document.createElement('div');
  box.className = 'fraction-box answer';

  const numInput = document.createElement('input');
  numInput.className = 'cell';
  numInput.type = 'text';
  numInput.inputMode = 'numeric';
  numInput.placeholder = '분자';

  const line = document.createElement('div');
  line.className = 'fraction-line';

  const denInput = document.createElement('input');
  denInput.className = 'cell';
  denInput.type = 'text';
  denInput.inputMode = 'numeric';
  denInput.placeholder = '분모';

  [numInput, denInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (['-', '.', 'e', 'E', '+', ' '].includes(e.key)) e.preventDefault();
    });
  });

  box.appendChild(numInput);
  box.appendChild(line);
  box.appendChild(denInput);
  return { box, numInput, denInput };
}

/* ===================== 카드 생성 ===================== */
function makeCard(type, label) {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('div');
  title.className = 'shape-title';
  title.textContent = label;
  card.appendChild(title);

  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '220');
  svg.setAttribute('height', '190');
  svg.setAttribute('viewBox', '0 0 220 190');
  card.appendChild(svg);

  let state = generateState(type);

  const fracRow = document.createElement('div');
  fracRow.className = 'fraction-row';

  let givenBox = makeGivenFractionBox(state.targetNumerator, state.n);
  fracRow.appendChild(givenBox);

  const { box: answerBox, numInput, denInput } = makeAnswerFractionBox();
  fracRow.appendChild(answerBox);

  const speakerBtn = document.createElement('button');
  speakerBtn.className = 'speaker-btn';
  speakerBtn.textContent = '🔊';
  speakerBtn.title = '입력한 분수 읽어주기';
  speakerBtn.onclick = () => {
    const num = numInput.value.trim();
    const den = denInput.value.trim();
    if (!num || !den) return;
    const utter = new SpeechSynthesisUtterance(`${den} 분의 ${num}`);
    utter.lang = 'ko-KR';
    speechSynthesis.speak(utter);
  };
  fracRow.appendChild(speakerBtn);

  card.appendChild(fracRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  card.appendChild(feedback);

  renderShape(svg, type, state, () => {
    // 색칠 상태가 바뀔 때마다 이전 채점 메시지는 지워서 혼동 방지
    feedback.textContent = '';
    feedback.className = 'feedback';
  });

  function check() {
    // 1) 학습자가 색칠한 조각 수가 주어진 분수(분자)와 맞는지 확인
    if (state.shaded.size !== state.targetNumerator) {
      feedback.textContent = `조각을 ${state.targetNumerator}개 색칠해야 해요. (현재 ${state.shaded.size}개)`;
      feedback.className = 'feedback wrong';
      return false;
    }

    // 2) 색칠하지 않은 부분을 나타낸 분수가 맞는지 확인
    const numRaw = numInput.value.trim();
    const denRaw = denInput.value.trim();

    if (numRaw === '' || denRaw === '') {
      feedback.textContent = '색칠하지 않은 부분을 분수로 입력해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const num = Number(numRaw);
    const den = Number(denRaw);

    if (!Number.isInteger(num) || !Number.isInteger(den) || num <= 0 || den <= 0) {
      feedback.textContent = '분자, 분모 모두 자연수로 입력해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }

    const remainNumerator = state.n - state.targetNumerator; // 색칠하지 않은 부분의 분자
    const isCorrect = num * state.n === remainNumerator * den; // 동치분수까지 인정

    if (isCorrect) {
      feedback.textContent = '정답이에요! 👏';
      feedback.className = 'feedback correct';
    } else {
      feedback.textContent = '색칠은 맞았지만, 분수를 다시 확인해 볼까요?';
      feedback.className = 'feedback wrong';
    }
    return isCorrect;
  }

  function regenerate() {
    state = generateState(type);

    const newGivenBox = makeGivenFractionBox(state.targetNumerator, state.n);
    fracRow.replaceChild(newGivenBox, givenBox);
    givenBox = newGivenBox;

    renderShape(svg, type, state, () => {
      feedback.textContent = '';
      feedback.className = 'feedback';
    });

    numInput.value = '';
    denInput.value = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
  }

  return { card, check, regenerate };
}

/* ===================== 초기 생성 ===================== */
const board = document.getElementById('board');
const summaryEl = document.getElementById('summary');

const cards = [
  makeCard('square', '정사각형'),
  makeCard('octagon', '정팔각형'),
  makeCard('circle', '원')
];

cards.forEach(c => board.appendChild(c.card));

document.getElementById('checkAllBtn').onclick = () => {
  const results = cards.map(c => c.check());
  const correctCount = results.filter(r => r === true).length;
  summaryEl.textContent = `${cards.length}문제 중 ${correctCount}개 정답`;
};

document.getElementById('newAllBtn').onclick = () => {
  cards.forEach(c => c.regenerate());
  summaryEl.textContent = '';
};
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: '#checkAllBtn', newBtn: '#newAllBtn', grade: () => { const r = cards.map(p => p.check()); summaryEl.textContent = `${r.length}문제 중 ${r.filter(Boolean).length}개 정답`; return r; } });
</script>
</body>
</html>
