<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수만큼 색칠하고 나머지를 분수로</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분수만큼 색칠하고 나머지를 분수로</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분수만큼 색칠하고, 남은 부분도 분수로 나타내요</div>
  <div class="rule-line"><span class="rule-tag">색칠</span> 3/5만큼 → 똑같이 5로 나눈 것 중 <b>3조각</b>을 색칠해요.</div>
  <div class="rule-line"><span class="rule-tag t2">나머지</span> 색칠하지 않은 조각은 5 − 3 = 2조각 → <b>2/5</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모(전체 조각 수)는 바뀌지 않아요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3163 — 분수만큼 색칠하고 나머지를 분수로 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 분자만큼이 아니라 분모만큼 색칠함, 남은 부분의 분모를 바꿈(분모에 색칠한 수를 씀)
M.inlineQuestion = true;
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 도형에 분수만큼 색칠 (아무 조각이나 눌러 색칠)
  const d1 = M.rand(4, 8), a1 = M.rand(2, d1 - 1), k1 = M.pick(['circle', 'poly']);
  cards.push(M.card(0, `<div class="q-text">${a1}/${d1}만큼 색칠해 보세요. (조각을 누르면 색칠되고, 다시 누르면 지워져요)</div>` +
    M.cellPick(a1, S.any(d1, 0, { kind: k1, pick: true }), false), true));
  hints.push(`분모 ${d1}${M.josa(d1, '은', '는')} 전체 조각 수, 분자 ${a1}${M.josa(a1, '은', '는')} 색칠할 조각 수예요. ${a1}조각만 색칠해요.`);

  // 2번: 막대에 색칠하고, 색칠하지 않은 부분을 분수로
  const d2 = M.rand(4, 9), a2 = M.rand(1, d2 - 1);
  cards.push(M.card(1, `<div class="q-text">막대에 ${a2}/${d2}만큼 색칠하고, 색칠하지 않은 부분을 분수로 나타내 보세요.</div>` +
    M.cellPick(a2, S.bar(d2, 0, { pick: true }), true) +
    `<div class="eq" style="font-size:18px">색칠하지 않은 부분: ${F.ff(d2 - a2, d2)}</div>`, true));
  hints.push('왼쪽 칸부터 눌러서 색칠해요. 색칠하지 않은 칸 수가 분자, 전체 칸 수가 분모예요.');

  // 3번: 색칠한 그림 → 색칠하지 않은 부분
  const d3 = M.rand(3, 8), a3 = M.rand(1, d3 - 1);
  cards.push(M.card(2, `<div class="q-text">색칠하지 않은 부분은 전체의 얼마인지 분수로 나타내 보세요.</div>` +
    `<div class="row" style="align-items:center;gap:30px">${S.any(d3, a3)}<div class="eq">${F.ff(d3 - a3, d3)}</div></div>`, true));
  hints.push('색칠하지 <b>않은</b> 조각을 세어요. 전체 조각 수는 그대로 분모에 써요.');

  // 4번: 문장제 — 남은 양
  const d4 = M.pick([4, 5, 6, 8]), a4 = M.rand(1, d4 - 1);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">케이크 한 개를 똑같이 ${d4}조각으로 나누어 ${a4}조각을 먹었습니다. 남은 케이크는 전체의 얼마인지 분수로 나타내 보세요.</div>` +
    `<div class="eq">${F.ff(d4 - a4, d4)}</div>`, true));
  hints.push(`남은 조각은 ${d4} − ${a4} = ${d4 - a4}조각이에요. 케이크 한 개가 전체예요.`);

  // 5번: 그림 없이 — 색칠한 부분과 남은 부분
  const d5 = M.rand(5, 9), a5 = M.rand(1, d5 - 1);
  cards.push(M.card(4, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    `<div class="eq" style="font-size:18px">전체를 똑같이 ${d5}${S.ro(d5)} 나눈 것 중 ${a5}만큼 색칠하면, 색칠하지 않은 부분은 전체의 ${F.ff(d5 - a5, d5)} 입니다.</div>`, true));
  hints.push('조각 그림을 머릿속으로 그려 보세요. 전체 조각에서 색칠한 조각을 빼면 남은 조각이에요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
