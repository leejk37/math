<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 4학년 분수 도우미(m421) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m421-common.js?v=20261109-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>대분수의 뺄셈 (자연수끼리·분수끼리)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">대분수의 뺄셈 (자연수끼리·분수끼리)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 자연수는 자연수끼리, 분수는 분수끼리 빼요</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 3 4/7 − 1 2/7 = (3 − 1) + (4/7 − 2/7) = 2 + 2/7 = <b>2 2/7</b></div>
  <div class="rule-line"><span class="rule-tag t2">가분수</span> 빼는 수가 가분수이면 먼저 대분수로 바꿔요. 9/7 = 1 2/7</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 분모는 그대로 써요. 분모끼리 빼면 안 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4214a — 대분수의 뺄셈, 방법 1: 자연수끼리·분수끼리 (교과서 4-2-1 '분수의 덧셈과 뺄셈', 받아내림 없음)
// 진단 포인트: 자연수와 분수를 따로 계산하지 못함, 분모끼리 뺌, 빼는 수가 가분수일 때 대분수로 바꾸지 못함
M.inlineQuestion = true;
// w1 a/d − w2 b/d  (a > b: 받아내림 없음, w1 > w2)
function mm(minW2) {
  return F.gen(() => { const d = M.rand(3, 9); return { d, w1: M.rand(2, 6), w2: M.rand(minW2, 4), a: M.rand(2, d - 1), b: M.rand(1, d - 2) }; },
    p => p.a > p.b && p.w1 > p.w2);
}
const L = p => G.mx(p.w1, p.a, p.d) + G.MINUS + G.mx(p.w2, p.b, p.d);
const res = p => (p.w1 - p.w2) * p.d + p.a - p.b;   // 차를 가분수 분자로
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 자연수끼리·분수끼리 뺀 식을 보고 합치기
  const p1 = mm(1);
  cards.push(M.card(0, `<div class="q-text">자연수끼리, 분수끼리 뺀 값을 써 보세요.</div>` +
    `<div class="eq">${L(p1)}${G.EQ}${G.par(p1.w1 + G.MINUS + p1.w2)}${G.PLUS}${G.par(M.frac(p1.a, p1.d) + G.MINUS + M.frac(p1.b, p1.d))}${G.EQ}${M.box(p1.w1 - p1.w2)}${G.PLUS}${F.fn(p1.a - p1.b, p1.d)}${G.EQ}${G.ansN(res(p1), p1.d)}</div>`, true));
  hints.push(`자연수 ${p1.w1} − ${p1.w2}, 분수 ${M.frac(p1.a, p1.d, true)} − ${M.frac(p1.b, p1.d, true)} 의 값을 각각 구한 다음 합쳐서 대분수로 써요.`);

  // 2번: 식을 직접 쓰기
  const p2 = mm(1);
  cards.push(M.card(1, `<div class="q-text">자연수끼리, 분수끼리 빼서 계산해 보세요.</div>` +
    `<div class="eq">${L(p2)}${G.EQ}${G.par(M.box(p2.w1) + G.MINUS + M.box(p2.w2))}${G.PLUS}${G.par(F.fn(p2.a, p2.d) + G.MINUS + F.fn(p2.b, p2.d))}${G.EQ}${G.ansN(res(p2), p2.d)}</div>`, true));
  hints.push('괄호 안에 자연수 부분끼리, 분수 부분끼리 옮겨 써요. 그다음 각각 빼서 대분수로 합쳐요.');

  // 3번: 계산 — 대분수 − 대분수, 대분수 − 진분수
  const p3 = mm(1), q3 = mm(1);
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="qbox">${G.calc(L(p3), res(p3), p3.d)}</div>`,
      `<div class="qbox">${G.calc(M.mixed(q3.w1, q3.a, q3.d) + G.MINUS + M.frac(q3.b, q3.d), q3.w1 * q3.d + q3.a - q3.b, q3.d)}</div>`), true));
  hints.push('진분수를 빼는 것은 자연수 부분을 0으로 생각해요. 자연수는 그대로 두고 분수끼리만 빼면 돼요.');

  // 4번: 빼는 수가 가분수 → 대분수로 바꾸어 빼기
  const p4 = F.gen(() => { const d = M.rand(3, 9); return { d, w: M.rand(3, 6), a: M.rand(2, d - 1), b: M.rand(1, d - 2) }; }, p => p.a > p.b);
  const B4 = p4.d + p4.b;
  cards.push(M.card(3, `<div class="q-text">빼는 수를 대분수로 바꾸어 계산해 보세요.</div>` +
    `<div class="eq">${M.mixed(p4.w, p4.a, p4.d)}${G.MINUS}${M.frac(B4, p4.d)}${G.EQ}${M.mixed(p4.w, p4.a, p4.d)}${G.MINUS}${G.ansN(B4, p4.d)}${G.EQ}${G.ansN((p4.w - 1) * p4.d + p4.a - p4.b, p4.d)}</div>`, true));
  hints.push(`${M.frac(B4, p4.d, true)} 에는 ${M.frac(p4.d, p4.d, true)} = 1이 한 번 들어 있어요. 1과 ${M.frac(p4.b, p4.d, true)} 의 합으로 보고 대분수로 바꿔요.`);

  // 5번: 문장제
  const p5 = mm(1);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">리본이 ${G.t(p5.w1, p5.a, p5.d)} m 있었습니다. 선물을 포장하는 데 ${G.t(p5.w2, p5.b, p5.d)} m를 사용했습니다. 남은 리본은 몇 m인가요?</div>` +
    `<div class="eq">${G.ans(res(p5), p5.d)} <span class="unit">m</span></div>`, true));
  hints.push('"남은 양"은 처음 양에서 사용한 양을 빼요. 자연수끼리, 분수끼리 빼요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
