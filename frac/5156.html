<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>대분수의 뺄셈 (받아내림이 있는 경우)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">대분수의 뺄셈 (받아내림이 있는 경우)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분수 부분끼리 뺄 수 없으면 자연수에서 1을 받아내려요</div>
  <div class="rule-line"><span class="rule-tag">받아내림</span> 2 1/3 − 1 3/4 = 2 4/12 − 1 9/12 = <b>1 16/12</b> − 1 9/12 = <b>7/12</b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 가분수로 바꾸어 빼요. 2 1/3 − 1 3/4 = 28/12 − 21/12 = <b>7/12</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 1을 받아내리면 자연수 부분은 1 작아지고, 분수 부분에는 분모만큼 분자가 커져요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5156 — 대분수의 뺄셈 (받아내림이 있는 경우) (교과서 5-1-5 106~107쪽, 수학익힘 66~67쪽, 성취기준 [6수01-08])
// 진단 포인트: 분수 부분을 거꾸로 뺌(큰 분수에서 작은 분수), 받아내린 뒤 자연수 부분을 1 줄이지 않음
const R = M.rand;
M.inlineQuestion = true;
// 진분수 두 개: 분모가 다르고, 최소공배수가 lim 이하
function two(test, lim) {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= (lim || 36) && (!test || test(x, y)));
}
const L = (x, y) => F.lcm(x.d, y.d);
const ft = x => x.n + '/' + x.d;
function generate() {
  M.reset();
  const cards = [], hints = [];
  const need = (x, y) => x.n * y.d < y.n * x.d;   // 분수 부분끼리 뺄 수 없음
  const ws = () => { const b = R(1, 3); return [b + R(1, 3), b]; };
  // 1번: 받아내림 과정
  const [x1, y1] = two(need, 24), [a1, b1] = ws();
  cards.push(M.card(0, `<div class="q-text">자연수에서 1을 받아내려 계산해 보세요.</div>` + F.stepsMM(a1, x1, b1, y1, '-', L(x1, y1)), true));
  hints.push(`통분해 보면 분수 부분끼리 뺄 수 없어요. 자연수 ${a1}에서 1을 받아내려 분수로 바꾸어요. (1 = ${L(x1, y1)}/${L(x1, y1)})`);

  // 2번: 가분수로
  const [x2, y2] = two(need, 24), [a2, b2] = ws();
  cards.push(M.card(1, `<div class="q-text">대분수를 가분수로 나타내어 계산해 보세요.</div>` + F.stepsImp(a2, x2, b2, y2, '-', L(x2, y2)), true));
  hints.push('가분수로 바꾸면 받아내림 없이 뺄 수 있어요. 결과는 대분수로 바꾸어요.');

  // 3번: 계산 (2문제)
  const C3 = [[two(need), ...ws()], [two(need), ...ws()]];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([[x, y], a, b]) => `<div class="qbox">${F.calc(F.mx(a, x.n, x.d) + F.OP['-'] + F.mx(b, y.n, y.d), F.sub(F.v(a, x.n, x.d), F.v(b, y.n, y.d)))}</div>`)), true));
  hints.push('통분 → 분수 부분끼리 뺄 수 없으면 1 받아내림 → 자연수끼리, 분수끼리 빼기');

  // 4번: 문장제
  const [x4, y4] = two(need), [a4, b4] = ws();
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">유기견 간식을 만드는 데 고구마를 소윤이는 ${a4} ${ft(x4)} kg, 지후는 ${b4} ${ft(y4)} kg 사용했습니다. 소윤이는 지후보다 고구마를 몇 kg 더 사용했나요?</div>` +
    `<div class="eq">${F.ans(F.sub(F.v(a4, x4.n, x4.d), F.v(b4, y4.n, y4.d)))} kg</div>`, true));
  hints.push('더 많이 사용한 양에서 적게 사용한 양을 빼요. 분수 부분끼리 뺄 수 있는지 먼저 확인해요.');

  // 5번: 바르게 계산한 것 고르기 (함정: 분수 부분을 거꾸로 뺌, 자연수를 줄이지 않음)
  const [x5, y5] = two(need), [a5, b5] = ws(), L5 = L(x5, y5);
  const fx = x5.n * L5 / x5.d, fy = y5.n * L5 / y5.d;
  const show = (w, n, d) => { const s = F.simp(n, d); return (w ? w + ' ' : '') + (s.n ? s.n + '/' + s.d : ''); };
  const right5 = F.mixedOf(F.sub(F.v(a5, x5.n, x5.d), F.v(b5, y5.n, y5.d)));
  const pre = `${a5} ${ft(x5)} − ${b5} ${ft(y5)} = `;
  const R5 = pre + show(right5.w, right5.n, right5.d).trim();
  const wr = [pre + show(a5 - b5, fy - fx, L5).trim(), pre + show(a5 - b5, fx + L5 - fy, L5).trim()].filter(s => s !== R5);
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` + F.one(R5, wr), true));
  hints.push('받아내림을 하면 자연수 부분이 1 작아져요. 분수 부분은 큰 쪽에서 작은 쪽을 빼는 것이 아니라, 앞의 수에서 뒤의 수를 빼요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
