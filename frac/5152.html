<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>진분수의 덧셈 (합이 1보다 큰 경우)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">진분수의 덧셈 (합이 1보다 큰 경우)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 합이 1보다 크면 가분수를 대분수로 나타내요</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 3/4 + 5/8 = 6/8 + 5/8 = 11/8 = <b>1 3/8</b></div>
  <div class="rule-line"><span class="rule-tag t2">대분수</span> 분자가 분모보다 크면 분모만큼을 1로 떼어 내요. 11/8 = 8/8 + 3/8 = 1 3/8</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 약분할 수 있으면 약분하여 기약분수로 써요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5152 — 진분수의 덧셈 (합이 1보다 큰 경우) (교과서 5-1-5 98~99쪽, 수학익힘 58~59쪽, 성취기준 [6수01-08])
// 진단 포인트: 가분수를 대분수로 바꾸지 못함, 통분하지 않고 더함
const R = M.rand;
M.inlineQuestion = true;
// 진분수 두 개: 분모가 다르고, 최소공배수가 lim 이하
function two(test, lim) {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= (lim || 36) && (!test || test(x, y)));
}
const L = (x, y) => F.lcm(x.d, y.d);
const ft = x => x.n + '/' + x.d;
function generate() {
  M.reset();
  const cards = [], hints = [];
  const more = (x, y) => x.n * y.d + y.n * x.d > x.d * y.d;
  // 1번: 최소공배수로 통분하여 계산
  const [x1, y1] = two(more);
  cards.push(M.card(0, `<div class="q-text">두 분모의 최소공배수를 공통분모로 하여 계산해 보세요.</div>` + F.stepsPP(x1, y1, '+', L(x1, y1)), true));
  hints.push('통분하여 분자끼리 더한 다음, 가분수는 대분수로 바꾸어요.');

  // 2번: 두 분모의 곱으로
  const [x2, y2] = two((x, y) => more(x, y) && F.gcd(x.d, y.d) > 1 && x.d * y.d <= 72, 72);
  cards.push(M.card(1, `<div class="q-text">두 분모의 곱을 공통분모로 하여 계산해 보세요.</div>` + F.stepsPP(x2, y2, '+', x2.d * y2.d), true));
  hints.push(`공통분모는 ${x2.d} × ${y2.d}이에요. 약분과 대분수로 바꾸기를 잊지 마세요.`);

  // 3번: 계산 (2문제)
  const C3 = [two(more), two(more)];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([x, y]) => `<div class="qbox">${F.calc(F.fr(x.n, x.d) + F.OP['+'] + F.fr(y.n, y.d), F.add(x, y))}</div>`)), true));
  hints.push('통분 → 분자끼리 더하기 → 가분수는 대분수로, 약분할 수 있으면 약분해요.');

  // 4번: 문장제
  const [x4, y4] = two(more);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">유기견들에게 사료를 소윤이는 ${ft(x4)} kg, 지후는 ${ft(y4)} kg 나누어 주었습니다. 두 사람이 나누어 준 사료는 모두 몇 kg인가요?</div>` +
    `<div class="eq">${F.ans(F.add(x4, y4))} kg</div>`, true));
  hints.push('두 양을 더해요. 결과가 1보다 크면 대분수로 써요.');

  // 5번: 결과가 1보다 큰 식 모두 고르기
  const pool = F.gen(() => [0, 1, 2, 3, 4].map(() => two()), l => { const c = l.filter(([x, y]) => more(x, y)).length; return c >= 2 && c <= 3 && l.every(([x, y]) => x.n * y.d + y.n * x.d !== x.d * y.d); });
  cards.push(M.card(4, `<div class="q-text">계산 결과가 1보다 큰 덧셈을 모두 골라 보세요.</div>` +
    F.multi(pool.map(([x, y], i) => [i, `${ft(x)} + ${ft(y)}`]), pool.map(([x, y], i) => more(x, y) ? i : -1).filter(i => i >= 0)), true));
  hints.push('통분하여 더한 분자가 공통분모보다 크면 1보다 커요. 또는 각 분수가 1/2보다 큰지 살펴봐도 어림할 수 있어요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
