<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(대분수) × (자연수)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(대분수) × (자연수)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수의 곱셈: 두 가지 방법</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 가분수로 바꾸어 곱해요. 1 1/5 × 3 = 6/5 × 3 = 18/5 = <b>3 3/5</b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 자연수와 진분수로 나누어 곱해요. 1 1/5 × 3 = (1 × 3) + (1/5 × 3) = 3 + 3/5 = <b>3 3/5</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 대분수인 채로 분모와 자연수를 약분하면 안 돼요. 가분수로 바꾼 다음 약분해요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5222 — (대분수) × (자연수) (교과서 5-2-2 38~39쪽, 수학익힘 28~29쪽, 성취기준 [6수01-10])
// 진단 포인트: 대분수 상태로 약분함, 자연수 부분(또는 분수 부분)에만 곱함
const R = M.rand;
M.inlineQuestion = true;
const X = F.OP['x'], P = F.OP['+'], EQ = '<span class="op">=</span>';
const LP = '<span class="op">(</span>', RP = '<span class="op">)</span>';
const ft = F.ft;
// 조사: 분수는 분자를 마지막에 읽으므로(사분의 삼) 분자로, 자연수는 그 수로 받침을 판단
const J = (s, a, b) => { const t = String(s), k = t.includes('/') ? t.split('/')[0].split(' ').pop() : t; return t + M.josa(k, a, b); };
const mix = (lo, hi) => ({ w: R(1, 3), x: F.proper(lo || 2, hi || 9) });
const V = m => F.v(m.w, m.x.n, m.x.d);
const MX = m => F.mx(m.w, m.x.n, m.x.d);
const mt = m => m.w + ' ' + ft(m.x);
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 방법 1 (가분수로)
  const [m1, k1] = F.gen(() => [mix(), R(2, 4)], ([m, k]) => V(m).n * k <= 80);
  const p1 = V(m1).n;
  cards.push(M.card(0, `<div class="q-text">대분수를 가분수로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${MX(m1)}${X}${k1}${EQ}${F.fn(p1, m1.x.d)}${X}${k1}${EQ}${F.tailN(p1 * k1, m1.x.d)}</div>`, true));
  hints.push('가분수의 분자 = 자연수 × 분모 + 분자예요. 가분수로 바꾼 다음 분자에 자연수를 곱해요.');

  // 2번: 방법 2 (자연수와 진분수의 합으로)
  const [m2, k2] = F.gen(() => [mix(), R(2, 4)], ([m, k]) => m.x.n * k > m.x.d && (m.x.n * k) % m.x.d !== 0);
  const tot2 = F.mul(V(m2), F.nat(k2));
  cards.push(M.card(1, `<div class="q-text">대분수를 자연수와 진분수의 합으로 나타내어 계산해 보세요.</div>` +
    `<div class="eq">${MX(m2)}${X}${k2}${EQ}${LP}${m2.w}${X}${k2}${RP}${P}${LP}${F.fr(m2.x.n, m2.x.d)}${X}${k2}${RP}${EQ}` +
    `${M.box(m2.w * k2)}${P}${F.fn(m2.x.n * k2, m2.x.d)}${EQ}${F.ans(tot2)}</div>`, true));
  hints.push(`자연수 ${m2.w}에 ${J(k2, '을', '를')} 곱하고, 진분수 ${ft(m2.x)}에도 ${J(k2, '을', '를')} 곱해서 더해요. 분수 부분이 1보다 크면 자연수로 올려요.`);

  // 3번: 계산 (2문제, 하나는 약분이 있는 수)
  const C3 = [F.gen(() => [mix(), R(2, 5)], ([m, k]) => V(m).n * k <= 80),
              F.gen(() => [mix(3, 12), R(2, 8)], ([m, k]) => F.gcd(m.x.d, k) > 1 && V(m).n * k <= 120)];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([m, k]) => `<div class="qbox">${F.calc(MX(m) + X + k, F.mul(V(m), F.nat(k)))}</div>`)), true));
  hints.push('방법 1(가분수로 바꾸기)이나 방법 2(자연수와 진분수로 나누기) 중 편한 방법으로 계산해요.');

  // 4번: 문장제
  const [m4, k4] = F.gen(() => [mix(2, 6), R(2, 4)], ([m, k]) => (m.x.n * k) % m.x.d !== 0);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">지수는 띠종이를 ${mt(m4)} m 사용했고, 우석이는 지수가 사용한 길이의 ${k4}배만큼 사용했습니다. 우석이가 사용한 띠종이는 몇 m인가요?</div>` +
    `<div class="eq">${F.ans(F.mul(V(m4), F.nat(k4)))} m</div>`, true));
  hints.push(`지수가 사용한 길이의 ${k4}배이므로 ${mt(m4)} × ${J(k4, '을', '를')} 계산해요.`);

  // 5번: 바르게 계산한 것 고르기 (함정: 대분수 상태로 약분, 자연수 부분에만 곱함)
  const [m5, k5] = F.gen(() => [mix(4, 12), R(2, 9)], ([m, k]) => { const g = F.gcd(m.x.d, k); return g > 1 && g < m.x.d && V(m).n * k <= 120; });
  const g5 = F.gcd(m5.x.d, k5), d5 = m5.x.d / g5;
  const pre = `${mt(m5)} × ${k5} = `;
  const r5 = pre + F.st(F.mul(V(m5), F.nat(k5)));
  const bad = [F.mul({ n: m5.w * d5 + m5.x.n, d: d5 }, F.nat(k5 / g5)),        // 대분수인 채로 약분
               F.v(m5.w * k5, m5.x.n, m5.x.d),                                  // 자연수 부분에만 곱함
               F.add(F.nat(m5.w), F.simp(m5.x.n * k5, m5.x.d))];                // 분수 부분에만 곱함
  const w5 = [...new Set(bad.map(v => pre + F.st(v)))].filter(s => s !== r5).slice(0, 2);
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` + F.one(r5, w5), true));
  hints.push('대분수를 가분수로 바꾼 다음 약분해요. 자연수 부분과 분수 부분 모두에 곱해야 해요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
