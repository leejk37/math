<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) × (소수) — 1보다 큰 소수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) × (소수)를 계산해요 — 1보다 큰 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 자연수처럼 곱하고, 소수점 아래 자릿수를 더한 만큼 소수점을 찍어요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 1.7 × 1.6 → 모눈 17칸 × 16칸 = 272칸 → 0.01 × 272 = <b>2.72</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 2.3 × 1.5 = <sup>23</sup>⁄<sub>10</sub> × <sup>15</sup>⁄<sub>10</sub> = <sup>345</sup>⁄<sub>100</sub> = 3.45</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 23 × 15 = 345 → 곱은 <sup>1</sup>⁄<sub>100</sub>배 → 3.45</div>
  <div class="rule-line"><span class="rule-tag t4">시간</span> 30분 = <sup>30</sup>⁄<sub>60</sub>시간 = 0.5시간이에요. 1시간 30분 = 1.5시간</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5246 — (소수) × (소수), 1보다 큰 소수 (교과서 5-2-4 98~99쪽, 수학 익힘 64~65쪽)
const f = M.fmt;
const STORY = [
  (x, y) => ({ unit: 'm²', text: `유준이는 가로가 ${f(x, 1)} m, 세로가 ${f(y, 1)} m인 직사각형 모양의 재활용 천으로 가방을 만들려고 합니다. 천의 넓이는 몇 m²인가요?` }),
  (x, y) => ({ unit: 'm²', text: `가로가 ${f(x, 1)} m, 세로가 ${f(y, 1)} m인 직사각형 모양의 돗자리가 있습니다. 돗자리의 넓이는 몇 m²인가요?` }),
  (x, y) => ({ unit: 'kg', text: `1 m의 무게가 ${f(x, 1)} kg인 쇠막대가 있습니다. 이 쇠막대 ${f(y, 1)} m의 무게는 몇 kg인가요?` })
];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (a.b × c.d)
  let x1, y1; do { x1 = M.rand(11, 39); y1 = M.rand(11, 29); } while (x1 % 10 === 0 || y1 % 10 === 0 || (x1 * y1) % 10 === 0 || x1 === y1);
  const s1 = M.pick(STORY)(x1, y1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(x1 * y1, 2, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', x1, 1)} × ${M.pairbox('s', y1, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(x1 * y1, 2)} ${s1.unit}</span></div>`), true));
  hints.push(`두 수를 각각 가까운 자연수로 생각하고 곱하면 대략의 크기를 알 수 있어요.<br>계산한 답이 어림한 값과 비슷한지 비교해요.`);

  // 2번: 모눈 — 직사각형 색칠 (1.a × 1.b)
  let x2, y2; do { x2 = M.rand(11, 19); y2 = M.rand(11, 19); } while (x2 % 10 === 0 || y2 % 10 === 0 || (x2 * y2) % 10 === 0 || x2 === y2);
  cards.push(M.card(1, `<div class="q-text">모눈종이의 가로를 ${f(x2, 1)}만큼, 세로를 ${f(y2, 1)}만큼 색칠하고 ${f(x2, 1)} × ${f(y2, 1)}${M.josa(f(y2, 1), '을', '를')} 계산해 보세요.</div>` +
    `<div class="q-small">칸을 누르면 왼쪽 아래 모서리부터 그 칸까지 색칠돼요. (같은 칸을 다시 누르면 지워져요)</div>` +
    D.rectPick(x2, y2, 20, 20, 15) +
    M.line(`<div class="eq" style="font-size:18px">모두 <span class="tail">${M.box(x2 * y2)}칸이므로</span> 색칠한 부분의 넓이는 <span class="tail">${M.dbox(x2 * y2, 2)}입니다.</span></div>`) +
    `<div class="eq">${f(x2, 1)} × ${f(y2, 1)} = 0.01 × ${M.box(x2 * y2)} = ${M.dbox(x2 * y2, 2)}</div>`, true));
  hints.push(`파란 굵은 선으로 나뉜 큰 정사각형 하나가 넓이 1이에요. 작은 한 칸은 0.01이에요.<br>가로 ${f(x2, 1)}${M.josa(f(x2, 1), '은', '는')} ${x2}칸, 세로 ${f(y2, 1)}${M.josa(f(y2, 1), '은', '는')} ${y2}칸이에요. 칸 수는 곱셈으로 구해요.`);

  // 3번: 분수의 곱셈 / 자연수의 곱셈으로 (a.b × c.d)
  let x3, y3; do { x3 = M.rand(11, 49); y3 = M.rand(11, 29); } while (x3 % 10 === 0 || y3 % 10 === 0 || (x3 * y3) % 10 === 0 || x3 === y3);
  cards.push(M.card(2, `<div class="q-text">${f(x3, 1)} × ${f(y3, 1)}${M.josa(f(y3, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${f(x3, 1)} × ${f(y3, 1)} = ${M.frac(M.box(x3), 10)} × ${M.frac(M.box(y3), 10)} = ${M.frac(M.box(x3 * y3), 100)} = ${M.dbox(x3 * y3, 2)}</div>`,
      D.arrows({ A: x3, pa: 1, B: y3, pb: 1, pick: true })), true));
  hints.push(`① ${f(x3, 1)} = ${M.frac(x3, 10, true)}, ${f(y3, 1)} = ${M.frac(y3, 10, true)}이에요. 분모끼리 곱하면 100이에요.<br>② 두 수가 각각 ${M.frac(1, 10, true)}배이니 곱은 ${M.frac(1, 100, true)}배가 돼요.`);

  // 4번: 계산하기 (가로셈 a.b × c.d, 세로셈 a.0b × c.d)
  let x4, y4; do { x4 = M.rand(11, 49); y4 = M.rand(11, 29); } while (x4 % 10 === 0 || y4 % 10 === 0 || (x4 * y4) % 10 === 0 || x4 === y4);
  let u4, v4; do { u4 = M.rand(1, 9) * 100 + M.rand(1, 9); v4 = M.rand(11, 29); } while (v4 % 10 === 0 || (u4 * v4) % 10 === 0);
  cards.push(M.card(3, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${f(x4, 1)} × ${f(y4, 1)} = ${M.dbox(x4 * y4, 2)}</div>`, D.vmul(u4, 2, v4, 1)), true));
  hints.push(`자연수의 곱셈을 한 다음, 두 수의 소수점 아래 자릿수를 더한 만큼 소수점을 찍어요.<br>${f(u4, 2)}${M.josa(f(u4, 2), '은', '는')} 소수 두 자리, ${f(v4, 1)}${M.josa(f(v4, 1), '은', '는')} 소수 한 자리 → 곱은 소수 <b>세</b> 자리 수예요. (가운데 0도 함께 생각해요)`);

  // 5번: 시간을 소수로 바꾸어 곱하기 (1시간에 a.b km, h시간 m분 동안)
  let sp, h5, mm; do { sp = M.rand(21, 49); h5 = M.rand(1, 2); mm = M.pick([6, 12, 18, 24, 30, 36, 42, 48, 54]); } while (sp % 10 === 0 || (sp * (h5 * 10 + mm / 6)) % 10 === 0);
  const t5 = h5 * 10 + mm / 6;
  cards.push(M.card(4, `<div class="q-text">은우는 1시간에 ${f(sp, 1)} km를 걷습니다. 같은 빠르기로 ${h5}시간 ${mm}분 동안 걷는다면 몇 km를 걸을 수 있나요?</div>` +
    `<div class="eq" style="font-size:19px">${h5}시간 ${mm}분 = <span class="tail">${M.dbox(t5, 1)}시간</span></div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', sp, 1)} × ${M.pairbox('s', t5, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(sp * t5, 2)} km</span></div>`), true));
  hints.push(`60분이 1시간이에요. ${mm}분은 ${M.frac(mm, 60, true)}시간이고, 분모를 10으로 바꾸면 소수로 나타낼 수 있어요.<br>(걷는 거리) = (1시간에 걷는 거리) × (걸은 시간)`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
