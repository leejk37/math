<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>곱의 소수점 위치</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">곱의 소수점 위치를 알아보아요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 곱하는 수에 따라 소수점이 움직여요!</div>
  <div class="rule-line"><span class="rule-tag">10배</span> 10, 100, 1000을 곱하면 0의 수만큼 소수점이 <b>오른쪽</b>으로 옮겨져요. 4.25 × 100 = 425</div>
  <div class="rule-line"><span class="rule-tag t2">0.1배</span> 0.1, 0.01, 0.001을 곱하면 소수점 아래 자릿수만큼 소수점이 <b>왼쪽</b>으로 옮겨져요. 4250 × 0.01 = 42.5</div>
  <div class="rule-line"><span class="rule-tag t3">소수×소수</span> 곱의 소수점 아래 자릿수 = 두 수의 소수점 아래 자릿수의 <b>합</b>. 0.3 × 0.05 = 0.015</div>
  <div class="rule-line"><span class="rule-tag t4">활용</span> 42 × 23 = 966이면 4.2 × 2.3 = 9.66, 0.42 × 0.23 = 0.0966</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5247 — 곱의 소수점 위치 (교과서 5-2-4 100~101쪽, 수학 익힘 66~67쪽)
const f = M.fmt;
// 수 n(정수)에 10^e를 곱한 값의 글자.  e < 0 이면 소수 (예: show(4250,-2) = "42.5")
const show = (n, e) => e >= 0 ? String(n * Math.pow(10, e)) : M.fmt0(n, -e);
const MUL = [[3, '1000'], [2, '100'], [1, '10'], [-1, '0.1'], [-2, '0.01'], [-3, '0.001']];
const PLACE_W = ['', '한', '두', '세', '네', '다섯'];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: × 1, 10, 100, 1000 (소수 두 자리 수)
  let x1; do { x1 = M.rand(101, 999); } while (x1 % 10 === 0);
  const r1 = [0, 1, 2, 3].map(e => `<tr><td class="l">${f(x1, 2)} × ${Math.pow(10, e)}</td><td>=</td><td style="text-align:left">${M.dbox(x1 * Math.pow(10, e), 2)}</td></tr>`).join('');
  cards.push(M.card(0, `<div class="q-text">계산해 보고, 곱의 소수점이 어떻게 옮겨지는지 찾아보세요.</div><table class="rule-tbl">${r1}</table>`));
  hints.push(`10을 곱할 때마다 소수점이 오른쪽으로 한 자리씩 옮겨져요.<br>옮길 자리에 숫자가 없으면 0을 채워 써요.`);

  // 2번: × 1, 0.1, 0.01, 0.001 (네 자리 자연수)
  let n2; do { n2 = M.rand(1001, 9999); } while (n2 % 10 === 0);
  const r2 = [0, 1, 2, 3].map(e => `<tr><td class="l">${n2} × ${e ? f(1, e) : 1}</td><td>=</td><td style="text-align:left">${M.dbox(n2, e)}</td></tr>`).join('');
  cards.push(M.card(1, `<div class="q-text">계산해 보고, 곱의 소수점이 어떻게 옮겨지는지 찾아보세요.</div><table class="rule-tbl">${r2}</table>`));
  hints.push(`0.1을 곱하면 ${M.frac(1, 10, true)}배가 되어 소수점이 왼쪽으로 한 자리 옮겨져요.<br>0.01은 두 자리, 0.001은 세 자리 옮겨져요.`);

  // 3번: 분수로 곱의 소수점 위치 확인 (0.a × 0.0b, 0.0a × 0.0b) + 자릿수 규칙
  let a3, b3; do { a3 = M.rand(2, 9); b3 = M.rand(2, 9); } while ((a3 * b3) % 10 === 0 || a3 * b3 < 10);
  cards.push(M.card(2, `<div class="q-text">분수의 곱셈으로 계산하여 곱의 소수점 위치를 확인해 보세요.</div>` +
    `<div class="eq">${f(a3, 1)} × ${f(b3, 2)} = ${F.fin(a3, M.box(10))} × ${F.fin(M.box(b3), 100)} = ${F.fin(a3 * b3, M.box(1000))} = ${M.dbox(a3 * b3, 3)}</div>` +
    `<div class="eq">${f(a3, 2)} × ${f(b3, 2)} = ${F.fin(a3, M.box(100))} × ${F.fin(M.box(b3), 100)} = ${F.fin(a3 * b3, M.box(10000))} = ${M.dbox(a3 * b3, 4)}</div>` +
    `<div class="eq" style="font-size:18px">(소수 한 자리 수) × (소수 두 자리 수)의 곱은 소수 ${M.choices('3', [2, 3, 4, 5].map(k => [String(k), PLACE_W[k]]))} 자리 수입니다.</div>`, true));
  hints.push(`소수 한 자리 수는 분모가 10, 소수 두 자리 수는 분모가 100인 분수예요.<br>분모끼리 곱한 수의 0의 개수가 곱의 소수점 아래 자릿수예요.`);

  // 4번: 보기(ab × cd = P)를 이용하여 계산하기
  let A4, B4; do { A4 = M.rand(11, 99); B4 = M.rand(11, 99); } while (A4 % 10 === 0 || B4 % 10 === 0 || (A4 * B4) % 10 === 0 || A4 === B4);
  const P4 = A4 * B4;
  const items = M.shuffle([[1, 0], [1, 1], [2, 1], [2, 2]]).slice(0, 4);
  const rows4 = items.map(([pa, pb]) => `<div class="eq qbox" style="font-size:19px">${f(A4, pa)} × ${f(B4, pb)} = ${M.dbox(P4, pa + pb)}</div>`);
  cards.push(M.card(3, `<div class="q-text">보기를 이용하여 계산해 보세요.</div>` +
    `<div class="row" style="align-items:center"><div class="sign" style="font-size:22px;border-color:#f472b6;background:#fdf2f8">보기 &nbsp;${A4} × ${B4} = ${P4}</div></div>` +
    M.line(rows4[0], rows4[1]) + M.line(rows4[2], rows4[3]), true));
  hints.push(`곱의 숫자는 보기와 같아요. 소수점 위치만 정하면 돼요.<br>두 수의 소수점 아래 자릿수를 더한 만큼 곱의 소수점 아래 자릿수가 생겨요.`);

  // 5번: □ 안에 알맞은 수 고르기 (x × □ = y)
  let x5; do { x5 = M.rand(101, 999); } while (x5 % 10 === 0);
  const big = M.pick(MUL.slice(0, 3)), small = M.pick(MUL.slice(3));
  const qs = M.shuffle([big, small]);
  const rows5 = qs.map(([e, lab]) => `<div class="eq" style="font-size:19px">${f(x5, 1)} × □ = ${show(x5, e - 1)} &nbsp;→ □ = ${M.choices(lab, MUL.map(m => [m[1], m[1]]))}</div>`);
  cards.push(M.card(4, `<div class="q-text">□ 안에 알맞은 수를 골라 보세요.</div>` + rows5.join(''), true));
  hints.push(`곱의 소수점이 오른쪽으로 옮겨졌으면 10, 100, 1000 중에서, 왼쪽으로 옮겨졌으면 0.1, 0.01, 0.001 중에서 골라요.<br>소수점이 몇 자리 옮겨졌는지 세어 보세요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
