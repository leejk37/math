<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수 도우미(m524) → 소수의 나눗셈 도우미(m6d) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<script src="m6d-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(자연수) ÷ (소수)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(자연수) ÷ (소수)를 계산해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나누는 수가 자연수가 되도록 옮기고, 나누어지는 수에는 0을 붙여요!</div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 72 ÷ 0.8 = <sup>720</sup>⁄<sub>10</sub> ÷ <sup>8</sup>⁄<sub>10</sub> = 720 ÷ 8 = 90</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 14 ÷ 3.5 → 두 수를 10배 → 140 ÷ 35 = 4</div>
  <div class="rule-line"><span class="rule-tag">세로</span> 1.25)5 → 125)500 — 옮길 자리에 숫자가 없으면 0을 채워 써요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6224 — (자연수) ÷ (소수) (교과서 6-2-2 42~43쪽, 수학 익힘 30~31쪽)
const f = M.fmt;
const STORY = [
  (a, b) => ({ unit: '개', text: `물 ${a} L를 컵에 ${f(b.b, b.p)} L씩 나누어 담으려고 합니다. 필요한 컵은 몇 개인가요?` }),
  (a, b) => ({ unit: '봉지', text: `콩 ${a} kg을 한 봉지에 ${f(b.b, b.p)} kg씩 나누어 담으려고 합니다. 몇 봉지가 필요한가요?` }),
  (a, b) => ({ unit: '도막', text: `길이가 ${a} m인 철사를 ${f(b.b, b.p)} m씩 자르려고 합니다. 몇 도막이 되나요?` })
];
// 나누는 수 b(10^-p 단위), 몫 Q(자연수) → 나누어지는 수 a = Q × b ÷ 10^p 가 자연수
function mk(p, bLo, bHi, qLo, qHi, test) {
  return F.gen(() => { const b = M.rand(bLo, bHi), Q = M.rand(qLo, qHi); return { p, b, Q, a: Q * b / M.pow(p) }; },
    o => Number.isInteger(o.a) && o.b % 10 !== 0 && o.a >= 2 && (!test || test(o)));
}
const ex = (o) => `${o.a} ÷ ${f(o.b, o.p)}`;

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 식·답 쓰기
  const p1 = mk(M.pick([1, 2]), 2, 95, 4, 40, o => o.a <= 60 && o.b !== 10 * Math.floor(o.b / 10));
  const s1 = M.pick(STORY)(p1.a, p1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(p1.Q, 0, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.box(p1.a)} ÷ ${M.dbox(p1.b, p1.p)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.box(p1.Q)} ${s1.unit}</span></div>`), true));
  hints.push(`(전체 양) ÷ (한 번에 담는 양)이에요.<br>나누는 수가 1보다 작으면 몫은 나누어지는 수보다 커요.`);

  // 2번: 분수의 나눗셈으로 (소수 한 자리, 소수 두 자리)
  const p2a = mk(1, 2, 9, 11, 99, o => o.a !== p1.a);
  const p2b = mk(2, 101, 499, 3, 60, o => o.a < 1000);
  const fr = (o) => {
    const d = M.pow(o.p);
    return `<div class="eq">${ex(o)} = ${F.fin(M.box(o.a * d), d)} ÷ ${F.fin(M.box(o.b), d)} = ${M.box(o.a * d)} ÷ ${M.box(o.b)} = ${M.box(o.Q)}</div>`;
  };
  cards.push(M.card(1, `<div class="q-text">소수의 나눗셈을 분수의 나눗셈으로 나타내어 계산해 보세요.</div>` + fr(p2a) + fr(p2b), true));
  hints.push(`나누는 수와 분모가 같은 분수로 나누어지는 수를 나타내요. 예) 72 = ${M.frac(720, 10, true)},  157 = ${M.frac(15700, 100, true)}<br>분모가 같으면 분자끼리 나누면 돼요.`);

  // 3번: 자연수의 나눗셈을 이용하기 (14 ÷ 3.5, 27 ÷ 0.75)
  const p3a = mk(1, 12, 95, 2, 9, o => o.a < 100);
  const p3b = mk(2, 11, 99, 4, 60, o => o.a < 100 && o.b % 5 === 0);
  cards.push(M.card(2, `<div class="q-text">자연수의 나눗셈을 이용하여 계산해 보세요.</div>` +
    `<div class="mbox"><div class="mpanel">${D.shiftArrows({ a: p3a.a, pa: 0, b: p3a.b, pb: 1, s: 1, showA: false })}</div>` +
    `<div class="mpanel">${D.shiftArrows({ a: p3b.a, pa: 0, b: p3b.b, pb: 2, s: 2, showA: false })}</div></div>`, true));
  hints.push(`나누는 수가 소수 한 자리 수이면 10배, 소수 두 자리 수이면 100배 해서 자연수로 만들어요.<br>나누어지는 수도 똑같이 곱해요. 예) 27의 100배 = 2700`);

  // 4번: 세로로 계산하기 (소수점을 옮기고 0을 채워)
  const p4a = mk(1, 12, 95, 2, 9, o => o.a < 100 && o.a !== p3a.a);
  const p4b = mk(2, 12, 95, 4, 60, o => o.a < 30 && o.b % 5 === 0 && o.b !== p3b.b);
  cards.push(M.card(3, `<div class="q-text">나누는 수가 자연수가 되도록 소수점을 옮겨 세로로 계산해 보세요. (흐린 0은 소수점을 옮기며 채운 0이에요)</div>` +
    M.line(D.vdiv({ a: p4a.a * 10, pa: 0, n: p4a.b, greyInt: 1, label: `${ex(p4a)} → ${p4a.a * 10} ÷ ${p4a.b}` }),
      D.vdiv({ a: p4b.a * 100, pa: 0, n: p4b.b, greyInt: 2, label: `${ex(p4b)} → ${p4b.a * 100} ÷ ${p4b.b}` })), true));
  hints.push(`나누는 수의 소수점을 옮긴 만큼 나누어지는 수의 소수점도 옮겨요.<br>나누어지는 수는 자연수라서 옮길 자리에 숫자가 없으니 0을 채워 써요.`);

  // 5번: 몫이 가장 작은 것 찾기
  const set5 = F.gen(() => [mk(1, 12, 95, 2, 40, o => o.a < 100), mk(1, 12, 95, 2, 40, o => o.a < 100), mk(2, 101, 499, 2, 40, o => o.a < 200), mk(2, 11, 99, 4, 60, o => o.a < 100)],
    s => new Set(s.map(o => o.Q)).size === 4);
  const minQ = Math.min.apply(null, set5.map(o => o.Q));
  const opts5 = M.shuffle(set5.map(o => [String(o.Q), ex(o)]));
  cards.push(M.card(4, `<div class="q-text">몫이 가장 작은 나눗셈을 골라 보세요.</div>` + M.choices(String(minQ), opts5), true));
  hints.push(`각 나눗셈의 몫을 구해서 비교해 보세요.<br>나누는 수가 자연수가 되도록 두 수에 똑같이 10배 또는 100배 해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
