<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분모가 같은 분수의 크기 비교</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분모가 같은 분수의 크기 비교</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모가 같으면 분자가 클수록 큰 분수예요</div>
  <div class="rule-line"><span class="rule-tag">개수</span> 4/7는 1/7이 4개, 2/7는 1/7이 2개 → <b>4/7 &gt; 2/7</b></div>
  <div class="rule-line"><span class="rule-tag t2">그림</span> 같은 막대에 색칠하면 더 많이 색칠한 쪽이 더 커요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3165 — 분모가 같은 분수의 크기 비교 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 분자가 작을수록 크다고 생각함(단위분수 비교와 헷갈림), 단위분수의 개수로 비교하지 못함
M.inlineQuestion = true;
// 분모 d, 서로 다른 분자 두 개
function two(lo) { const d = M.rand(lo || 4, 9); let a, b; do { a = M.rand(1, d - 1); b = M.rand(1, d - 1); } while (a === b); return { d, a, b }; }
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 막대에 색칠하고 비교
  const p1 = two(5);
  cards.push(M.card(0, `<div class="q-text">두 분수만큼 각각 색칠하고, 크기를 비교해 보세요.</div>` +
    `<div style="display:flex;flex-direction:column;gap:6px;align-items:center">` +
    `<div class="row" style="align-items:center;gap:10px"><div class="eq" style="width:44px">${M.frac(p1.a, p1.d)}</div>${M.cellPick(p1.a, S.bar(p1.d, 0, { pick: true, w: 320 }), true)}</div>` +
    `<div class="row" style="align-items:center;gap:10px"><div class="eq" style="width:44px">${M.frac(p1.b, p1.d)}</div>${M.cellPick(p1.b, S.bar(p1.d, 0, { pick: true, w: 320 }), true)}</div></div>` +
    `<div class="cmp-row">${M.frac(p1.a, p1.d)}${M.cmp(p1.a, p1.b)}${M.frac(p1.b, p1.d)}</div>`, true));
  hints.push('왼쪽 칸부터 눌러서 분자만큼 색칠해요. 색칠한 부분이 더 긴 분수가 더 커요.');

  // 2번: 단위분수의 개수로 비교
  const p2 = two();
  const u2 = M.frac(1, p2.d, true);
  cards.push(M.card(1, `<div class="q-text">단위분수가 몇 개인지 세어 크기를 비교해 보세요.</div>` +
    `<div class="eq" style="font-size:18px">${M.frac(p2.a, p2.d)} ${M.josa(p2.a, '은', '는')} ${u2} 이 ${M.box(p2.a)}개, &nbsp;${M.frac(p2.b, p2.d)} ${M.josa(p2.b, '은', '는')} ${u2} 이 <span class="tail">${M.box(p2.b)}개</span></div>` +
    `<div class="cmp-row">${M.frac(p2.a, p2.d)}${M.cmp(p2.a, p2.b)}${M.frac(p2.b, p2.d)}</div>`, true));
  hints.push(`${u2} 이 더 많이 있는 분수가 더 커요.`);

  // 3번: 크기 비교 (3쌍)
  const c3 = [two(), two(), two()];
  cards.push(M.card(2, `<div class="q-text">두 분수의 크기를 비교하여 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    M.line(...c3.map(p => `<div class="qbox"><div class="cmp-row">${M.frac(p.a, p.d)}${M.cmp(p.a, p.b)}${M.frac(p.b, p.d)}</div></div>`)), true));
  hints.push('분모가 같으니 분자만 비교하면 돼요. 분자가 큰 쪽이 더 커요.');

  // 4번: 가장 큰 분수 고르기
  const d4 = M.rand(5, 9), ns4 = M.shuffle(Array.from({ length: d4 - 1 }, (_, i) => i + 1)).slice(0, 4);
  const max4 = Math.max(...ns4);
  cards.push(M.card(3, `<div class="q-text">가장 큰 분수를 골라 보세요.</div>` +
    M.choices(max4, ns4.map(n => [n, n + '/' + d4])), true));
  hints.push('분모가 모두 같아요. 분자가 가장 큰 분수를 찾아요.');

  // 5번: 문장제
  const p5 = two();
  const who = M.shuffle(['민수', '지혜', '서아', '도하']).slice(0, 2);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 골라 보세요.</div>` +
    `<div class="word">우유를 ${who[0]}는 ${p5.a}/${p5.d} L, ${who[1]}는 ${p5.b}/${p5.d} L 마셨습니다. 우유를 더 많이 마신 사람은 누구인가요?</div>` +
    M.choices(p5.a > p5.b ? 0 : 1, [[0, who[0]], [1, who[1]]]), true));
  hints.push('두 분수의 분모가 같아요. 분자가 큰 사람이 더 많이 마셨어요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
