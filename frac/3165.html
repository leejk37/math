<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>

<title>분수 크기 비교 문제 모음</title>
<style>
  body {
    font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #fafafa;
    padding: 30px;
    color: #222;
  }
  h2 { font-size: 19px; margin-bottom: 24px; }

  .problem {
    background: #fff;
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .problem-num {
    display: inline-block;
    background: #6a5acd;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    text-align: center;
    line-height: 24px;
    margin-right: 8px;
  }
  .problem-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .bar-col {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bar-col.vertical { flex-direction: column; }
  svg { display: block; }
  .piece { cursor: pointer; }

  /* 읽기 전용 인라인 분수 */
  .inline-fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 6px;
    background: #e4e4ea;
    border-radius: 8px;
    padding: 4px 10px;
  }
  .inline-fraction .cell { font-size: 18px; font-weight: bold; line-height: 1.2; }
  .inline-fraction .bar { width: 100%; height: 2px; background: #333; margin: 1px 0; }

  /* 연산자 선택 버튼 */
  .operator-selector { display: flex; gap: 6px; }
  .op-btn {
    width: 40px; height: 40px;
    font-size: 20px; font-weight: bold;
    border: 2px solid #7ec8e3;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    color: #333;
  }
  .op-btn:hover { background: #eef8fc; }
  .op-btn.selected {
    background: #7ec8e3;
    color: #fff;
  }

  /* 3~5번 문제: 학생이 직접 기호를 입력하는 원형 빈칸 */
  .op-input {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #7ec8e3;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    background: #fff;
  }

  .op-dropdown {
    font-size: 18px;
    font-weight: bold;
    border: 2px solid #7ec8e3;
    border-radius: 8px;
    padding: 8px 10px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .feedback {
    min-height: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 12px;
  }
  .feedback.correct { color: #2e9e44; }
  .feedback.wrong { color: #e05656; }

  .global-controls {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .global-btn {
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  .global-check-btn { background: #6a5acd; color: #fff; }
  .global-check-btn:hover { background: #5a4bb8; }
  .global-reset-btn { background: #eee; color: #555; }
  .global-reset-btn:hover { background: #ddd; }
  .summary { font-size: 15px; font-weight: bold; }
</style>
</head>
<body>

<h2>분수의 크기 비교 문제 모음</h2>

<div id="problems"></div>

<div class="global-controls">
  <button class="global-btn global-check-btn" id="checkAllBtn">전체 정답 확인</button>
  <button class="global-btn global-reset-btn" id="newAllBtn">새 문제 (전체)</button>
  <span class="summary" id="summary"></span>
</div>

<script>
/* ===================== 공통 유틸 ===================== */
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// 서로 다른 두 정수를 [min,max] 범위에서 뽑기 (같은 크기의 분수가 나오지 않도록)
function randomDistinctPair(min, max) {
  const a = randomInt(min, max);
  let b = randomInt(min, max);
  while (b === a) b = randomInt(min, max);
  return [a, b];
}

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function inlineFraction(numerator, denominator) {
  const wrap = document.createElement('span');
  wrap.className = 'inline-fraction';
  const num = document.createElement('div'); num.className = 'cell'; num.textContent = numerator;
  const bar = document.createElement('div'); bar.className = 'bar';
  const den = document.createElement('div'); den.className = 'cell'; den.textContent = denominator;
  wrap.appendChild(num); wrap.appendChild(bar); wrap.appendChild(den);
  return wrap;
}

// 두 분수(분모가 같음)를 비교하는 정답 연산자 계산
function correctOperator(num1, num2) {
  if (num1 < num2) return '<';
  if (num1 > num2) return '>';
  return '=';
}

// <, =, > 선택 버튼
function createOperatorSelector() {
  const wrap = document.createElement('div');
  wrap.className = 'operator-selector';
  let selected = null;
  const buttons = {};
  ['<', '=', '>'].forEach(sym => {
    const btn = document.createElement('button');
    btn.className = 'op-btn';
    btn.textContent = sym;
    btn.onclick = () => {
      selected = sym;
      Object.values(buttons).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    buttons[sym] = btn;
    wrap.appendChild(btn);
  });
  return {
    wrap,
    getSelected: () => selected,
    reset: () => { selected = null; Object.values(buttons).forEach(b => b.classList.remove('selected')); }
  };
}

// 3~5번 문제용: 학생이 직접 <, =, > 기호를 입력하는 원형 빈칸
function createOperatorInput() {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'op-input';
  input.maxLength = 1;
  input.addEventListener('keydown', (e) => {
    // 이동/삭제 키는 허용, 그 외에는 <, =, > 만 입력 가능
    const allowedKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'];
    if (allowedKeys.includes(e.key)) return;
    if (!['<', '=', '>'].includes(e.key)) e.preventDefault();
  });
  return {
    input,
    getValue: () => input.value.trim(),
    reset: () => { input.value = ''; }
  };
}

// 3~5번 문제용: 드롭다운(select)으로 <, =, > 중 하나를 선택
function createOperatorDropdown() {
  const select = document.createElement('select');
  select.className = 'op-dropdown';

  const placeholderOpt = document.createElement('option');
  placeholderOpt.value = '';
  placeholderOpt.textContent = '기호';
  placeholderOpt.disabled = true;
  placeholderOpt.selected = true;
  select.appendChild(placeholderOpt);

  ['<', '=', '>'].forEach(sym => {
    const opt = document.createElement('option');
    opt.value = sym;
    opt.textContent = sym;
    select.appendChild(opt);
  });

  return {
    select,
    getSelected: () => select.value || null,
    reset: () => { select.value = ''; }
  };
}

function makeProblemWrapper(num, titleText) {
  const wrap = document.createElement('div');
  wrap.className = 'problem';
  const title = document.createElement('div');
  title.className = 'problem-title';
  const badge = document.createElement('span');
  badge.className = 'problem-num';
  badge.textContent = num;
  title.appendChild(badge);
  title.appendChild(document.createTextNode(titleText));
  wrap.appendChild(title);
  return wrap;
}

// 클릭해서 색칠하는 수막대 (세로/가로 공통)
function makeClickableBar(orientation, n, color) {
  const shaded = new Set();
  const svg = document.createElementNS(svgNS, 'svg');
  let w, h;
  if (orientation === 'vertical') { w = 50; h = 170; } else { w = 220; h = 40; }
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const x0 = 5, y0 = 5;
  const innerW = w - 10, innerH = h - 10;
  const pieces = [];

  for (let i = 0; i < n; i++) {
    let attrs;
    if (orientation === 'vertical') {
      const segH = innerH / n;
      attrs = { x: x0, y: y0 + i * segH, width: innerW, height: segH };
    } else {
      const segW = innerW / n;
      attrs = { x: x0 + i * segW, y: y0, width: segW, height: innerH };
    }
    const piece = el('rect', { ...attrs, fill: '#ffffff', class: 'piece' });
    piece.addEventListener('click', () => {
      if (shaded.has(i)) shaded.delete(i); else shaded.add(i);
      piece.setAttribute('fill', shaded.has(i) ? color : '#ffffff');
    });
    svg.appendChild(piece);
    pieces.push(piece);
  }

  // 테두리
  svg.appendChild(el('rect', { x: x0, y: y0, width: innerW, height: innerH, fill: 'none', stroke: '#333', 'stroke-width': 2, 'pointer-events': 'none' }));
  // 내부 구분선
  for (let i = 1; i < n; i++) {
    if (orientation === 'vertical') {
      const segH = innerH / n;
      const y = y0 + i * segH;
      svg.appendChild(el('line', { x1: x0, y1: y, x2: x0 + innerW, y2: y, stroke: '#333', 'stroke-width': 1.3, 'stroke-dasharray': '4,3', 'pointer-events': 'none' }));
    } else {
      const segW = innerW / n;
      const x = x0 + i * segW;
      svg.appendChild(el('line', { x1: x, y1: y0, x2: x, y2: y0 + innerH, stroke: '#333', 'stroke-width': 1.3, 'stroke-dasharray': '4,3', 'pointer-events': 'none' }));
    }
  }

  return {
    svg,
    getShadedCount: () => shaded.size,
    resetShading: () => { shaded.clear(); pieces.forEach(p => p.setAttribute('fill', '#ffffff')); }
  };
}

/* ===================== 문제 1 / 2: 수막대 색칠 + 크기 비교 (공통 로직) ===================== */
function makeBarComparisonProblem(num, orientation, titleText, color) {
  const wrap = makeProblemWrapper(num, titleText);
  const row = document.createElement('div'); row.className = 'row'; wrap.appendChild(row);

  let n, num1, num2;
  let bar1, bar2, fracLabel1, fracLabel2;

  function buildBars() {
    row.innerHTML = '';

    bar1 = makeClickableBar(orientation, n, color);
    bar2 = makeClickableBar(orientation, n, color);

    const col1 = document.createElement('div');
    col1.className = orientation === 'vertical' ? 'bar-col vertical' : 'bar-col';
    fracLabel1 = inlineFraction(num1, n);
    if (orientation === 'vertical') { col1.appendChild(fracLabel1); col1.appendChild(bar1.svg); }
    else { col1.appendChild(fracLabel1); col1.appendChild(bar1.svg); }

    const col2 = document.createElement('div');
    col2.className = orientation === 'vertical' ? 'bar-col vertical' : 'bar-col';
    fracLabel2 = inlineFraction(num2, n);
    col2.appendChild(fracLabel2); col2.appendChild(bar2.svg);

    row.appendChild(col1);
    if (orientation === 'horizontal') {
      // 가로 막대는 위아래로 쌓아서 표시 (그림처럼)
      row.style.flexDirection = 'column';
      row.style.alignItems = 'flex-start';
    } else {
      row.style.flexDirection = 'row';
      row.style.alignItems = 'center';
    }
    row.appendChild(col2);
  }

  function regenerate() {
    n = randomInt(4, 9);
    [num1, num2] = randomDistinctPair(1, n - 1);
    buildBars();
  }
  regenerate();

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const c1ok = bar1.getShadedCount() === num1;
    const c2ok = bar2.getShadedCount() === num2;

    if (!c1ok || !c2ok) {
      feedback.textContent = '주어진 분수만큼 정확히 색칠해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    feedback.textContent = '정답이에요! 색칠된 길이로 두 분수의 크기를 비교해 보세요. 👏';
    feedback.className = 'feedback correct';
    return true;
  }

  function reset() {
    regenerate();
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 문제 3~5: 분모가 같은 두 진분수 크기 비교 (도형 없음, 선택형) ===================== */
function makeFractionCompareProblem(num, titleText) {
  const wrap = makeProblemWrapper(num, titleText);
  const row = document.createElement('div'); row.className = 'row'; wrap.appendChild(row);

  let n, num1, num2;
  let fracLabel1, fracLabel2;
  const opSelector = createOperatorDropdown();

  function build() {
    row.innerHTML = '';
    fracLabel1 = inlineFraction(num1, n);
    fracLabel2 = inlineFraction(num2, n);
    row.appendChild(fracLabel1);
    row.appendChild(opSelector.select);
    row.appendChild(fracLabel2);
  }

  function regenerate() {
    n = randomInt(4, 12);
    [num1, num2] = randomDistinctPair(1, n - 1);
    build();
    opSelector.reset();
  }
  regenerate();

  const feedback = document.createElement('div'); feedback.className = 'feedback'; wrap.appendChild(feedback);

  function check() {
    const val = opSelector.getSelected();
    if (!val) {
      feedback.textContent = '<, =, > 중 하나를 선택해 주세요.';
      feedback.className = 'feedback wrong';
      return false;
    }
    const correct = val === correctOperator(num1, num2);
    feedback.textContent = correct ? '정답이에요! 👏' : '다시 한 번 확인해 볼까요?';
    feedback.className = correct ? 'feedback correct' : 'feedback wrong';
    return correct;
  }

  function reset() {
    regenerate();
    feedback.textContent = ''; feedback.className = 'feedback';
  }

  return { wrap, check, regenerate: reset };
}

/* ===================== 초기화 ===================== */
const problemsEl = document.getElementById('problems');
const summaryEl = document.getElementById('summary');

const problems = [
  makeBarComparisonProblem(1, 'vertical', '세로 수막대에 주어진 분수만큼 색칠하고, 두 분수의 크기를 비교해 보세요.', '#bfe0ff'),
  makeBarComparisonProblem(2, 'horizontal', '가로 수막대에 주어진 분수만큼 색칠하고, 두 분수의 크기를 비교해 보세요.', '#d3cbee'),
  makeFractionCompareProblem(3, '두 분수의 크기를 비교해 보세요.'),
  makeFractionCompareProblem(4, '두 분수의 크기를 비교해 보세요.'),
  makeFractionCompareProblem(5, '두 분수의 크기를 비교해 보세요.')
];

problems.forEach(p => problemsEl.appendChild(p.wrap));

document.getElementById('checkAllBtn').onclick = () => {
  const results = problems.map(p => p.check());
  const correctCount = results.filter(r => r === true).length;
  summaryEl.textContent = `${problems.length}문제 중 ${correctCount}개 정답`;
};

document.getElementById('newAllBtn').onclick = () => {
  problems.forEach(p => p.regenerate());
  summaryEl.textContent = '';
};
</script>

<script>
// 진단시스템 연결 (frac-kit.js)
FracKit.init({ check: '#checkAllBtn', newBtn: '#newAllBtn', grade: () => { const r = problems.map(p => p.check()); summaryEl.textContent = `${r.length}문제 중 ${r.filter(Boolean).length}개 정답`; return r; } });
</script>
</body>
</html>
