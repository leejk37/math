<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 3학년 그림 도우미(m316) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m316-common.js?v=20261109-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>단위분수 알기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">단위분수 알기</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분자가 1인 분수를 단위분수라고 해요</div>
  <div class="rule-line"><span class="rule-tag">단위분수</span> 1/2, 1/3, 1/4 …처럼 전체를 똑같이 나눈 것 중의 <b>한 조각</b></div>
  <div class="rule-line"><span class="rule-tag t2">몇 개</span> 3/5는 1/5이 <b>3개</b>예요. 1/5이 5개이면 <b>1</b>이에요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 3164 — 단위분수 알기 (교과서 3-1 6단원 '분수와 소수')
// 진단 포인트: 분자가 1이 아닌 분수를 단위분수로 고름, 분수를 단위분수의 개수로 보지 못함
M.inlineQuestion = true;
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 한 조각은 전체의 얼마
  const d1 = M.rand(2, 8);
  cards.push(M.card(0, `<div class="q-text">색칠한 한 조각은 전체의 얼마인지 분수로 나타내 보세요.</div>` +
    `<div class="row" style="align-items:center;gap:30px">${S.any(d1, 1, { kind: d1 < 3 ? 'circle' : undefined })}<div class="eq">${F.ff(1, d1)}</div></div>`, true));
  hints.push('전체가 몇 조각으로 똑같이 나뉘었는지 세어요. 한 조각은 분자가 1이에요.');

  // 2번: 단위분수 모두 고르기
  const nu = M.rand(2, 3);
  const units = M.shuffle([2, 3, 4, 5, 6, 7, 8, 9]).slice(0, nu).map(d => [1, d]);
  const others = M.shuffle([3, 4, 5, 6, 7, 8, 9]).slice(0, 6 - nu).map(d => [M.rand(2, d - 1), d]);
  const pool = M.shuffle(units.concat(others));
  cards.push(M.card(1, `<div class="q-text">단위분수를 모두 골라 보세요.</div>` +
    F.multi(pool.map((p, i) => [i, p[0] + '/' + p[1]]), pool.map((p, i) => p[0] === 1 ? i : null).filter(v => v !== null)), true));
  hints.push('<b>분자가 1</b>인 분수가 단위분수예요. 분모는 어떤 수든 괜찮아요.');

  // 3번: 막대 그림 — 단위분수가 몇 개
  const d3 = M.rand(4, 9), a3 = M.rand(2, d3 - 1);
  cards.push(M.card(2, `<div class="q-text">색칠한 부분은 단위분수가 몇 개인지 알아보세요.</div>` + S.bar(d3, a3) +
    `<div class="eq" style="font-size:18px">색칠한 부분은 ${F.ff(a3, d3)} 이고, ${M.frac(1, d3, true)} 이 <span class="tail">${M.box(a3)}개입니다.</span></div>`, true));
  hints.push(`한 칸이 ${M.frac(1, d3, true)} 이에요. 색칠한 칸을 세어 보세요.`);

  // 4번: 단위분수의 개수 ↔ 분수
  const d4 = M.rand(3, 9), a4 = M.rand(2, d4 - 1), d4b = M.rand(3, 9), a4b = M.rand(2, d4b - 1);
  cards.push(M.card(3, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(`<div class="qbox"><div class="eq" style="font-size:18px">${M.frac(a4, d4)} ${M.josa(a4, '은', '는')} ${M.frac(1, d4, true)} 이 <span class="tail">${M.box(a4)}개입니다.</span></div></div>`,
      `<div class="qbox"><div class="eq" style="font-size:18px">${M.frac(1, d4b, true)} 이 ${a4b}개이면 ${F.ff(a4b, d4b)} 입니다.</div></div>`), true));
  hints.push('분자가 단위분수의 개수예요. 분모는 그대로예요.');

  // 5번: 단위분수가 분모만큼 모이면 1
  const d5 = M.rand(2, 9);
  cards.push(M.card(4, `<div class="q-text">빈칸에 알맞은 수를 써넣으세요.</div>` + S.bar(d5, d5) +
    `<div class="eq" style="font-size:18px">${M.frac(1, d5, true)} 이 ${M.box(d5)}개이면 전체가 모두 색칠되므로 <span class="tail">${M.box(1)}입니다.</span></div>`, true));
  hints.push(`${M.frac(1, d5, true)} 이 몇 개 있어야 막대 전체가 될까요? 전체는 자연수 1이에요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
