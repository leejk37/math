<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 4학년 소수 공통 화면(💡 도움말 포함) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261104-1540"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>소수의 크기 비교</title>
<style>
.strip-pair{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.strip-row{display:flex;align-items:flex-start;gap:12px}
.strip-label{width:92px;text-align:right;font-size:20px;font-weight:bold;color:#1e293b;padding-top:10px;line-height:1.2}
.strip-label small{font-size:12px;color:#64748b;font-weight:normal}
</style>
</head>
<body>

<div class="header-text">소수의 크기를 비교해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 높은 자리부터 차례로 비교해요!</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 자연수 부분 → 소수 첫째 자리 → 둘째 자리 → 셋째 자리 순서로 비교해요.</div>
  <div class="rule-line"><span class="rule-tag t2">결정</span> <b>처음으로 숫자가 다른 자리</b>에서 숫자가 큰 쪽이 더 큰 수예요.</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 자릿수가 많다고 큰 수가 아니에요. 0.7 > 0.65 · 끝자리 0은 붙여도 같아요. 0.3 = 0.30</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 4233 — 소수의 크기 비교 (교과서 4-2-3 62~63쪽, 성취기준 [4수01-14])
const f2 = n => M.fmt(n, 2), f3 = n => M.fmt(n, 3);
// 소수 셋째 자리까지의 수(0.001 단위 정수)를 끝자리 0 없이 보이기
const show = (n, p) => M.fmt(n, p);

// 자릿수(p)인 두 수: 정수 부분 같고, diffPos(1~p)번째 소수 자리에서 처음 달라짐
function pairDiffAt(p, diffPos, intMax) {
  const ip = M.rand(0, intMax);
  while (true) {
    const d1 = [], d2 = [];
    for (let k = 1; k <= p; k++) {
      if (k < diffPos) { const d = M.rand(0, 9); d1.push(d); d2.push(d); }
      else { d1.push(M.rand(0, 9)); d2.push(M.rand(0, 9)); }
    }
    if (d1[diffPos - 1] === d2[diffPos - 1]) continue;          // diffPos에서 처음 달라져야 함
    if (d1[p - 1] === 0 || d2[p - 1] === 0) continue;           // 끝자리 0 피하기
    return [ip * M.pow(p) + +d1.join(''), ip * M.pow(p) + +d2.join('')];
  }
}
function cmpPair(x, xp, y, yp) {
  // 비교는 0.001 단위로 맞추어
  const X = x * M.pow(3 - xp), Y = y * M.pow(3 - yp);
  // 한 쌍씩 옅은 상자로 묶고, 수와 ○ 사이도 조금 띄움
  return `<div class="cmp-row" style="gap:14px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:6px 18px">${show(x, xp)} ${M.cmp(X, Y)} ${show(y, yp)}</div>`;
}

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 0.ab와 0.cd를 모눈에 색칠하고 0.01의 개수로 비교
  let a1, b1; do { a1 = M.rand(11, 99); b1 = M.rand(11, 99); } while (a1 % 10 === 0 || b1 % 10 === 0 || Math.abs(a1 - b1) < 5 || Math.abs(a1 - b1) > 40);
  cards.push(M.card(0, `<div class="q-text">흰토끼는 ${f2(a1)} kg, 검은토끼는 ${f2(b1)} kg입니다. 두 수만큼 각각 색칠하고 비교해 보세요.</div>` +
    `<div class="row"><div><div class="vlabel">${f2(a1)}</div>${M.gridPick(a1, 0, 160)}</div><div><div class="vlabel">${f2(b1)}</div>${M.gridPick(b1, 0, 160)}</div></div>` +
    M.line(`<div class="eq" style="font-size:17px">${f2(a1)}${M.josa(f2(a1), '은', '는')} 0.01이 ${M.box(a1)}개, ${f2(b1)}${M.josa(f2(b1), '은', '는')} 0.01이 <span class="tail">${M.box(b1)}개</span></div>`,
      `<div class="eq" style="font-size:17px">더 무거운 토끼의 무게는 <span class="tail">${M.dbox(Math.max(a1, b1), 2)} kg</span></div>`), true));
  hints.push('모눈 한 칸은 0.01이에요. 왼쪽 세로줄부터 위에서 아래로 칸을 눌러 색칠해요.<br>0.01이 <b>더 많은</b> 수가 더 큰 수예요.');

  // 2번: 0.a 와 0.a0 — 끝자리 0
  const a2 = M.rand(1, 9);
  cards.push(M.card(1, `<div class="q-text">0.${a2}${M.josa(a2, '과', '와')} 0.${a2}0만큼 각각 색칠하고 크기를 비교해 보세요.</div>` +
    // 같은 길이의 막대 두 개(위 10칸, 아래 100칸)를 0과 1에 맞추어 위아래로 — 색칠이 끝나는 곳을 견주어 비교
    `<div class="strip-pair">` +
    `<div class="strip-row"><div class="strip-label">0.${a2}<br><small>한 칸 = 0.1</small></div>${M.stripPick(a2, 10)}</div>` +
    `<div class="strip-row"><div class="strip-label">0.${a2}0<br><small>한 칸 = 0.01</small></div>${M.stripPick(a2 * 10, 100)}</div>` +
    `</div>` +
    `<div class="cmp-row" style="gap:14px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:6px 18px">0.${a2} ${M.cmp(1, 1)} 0.${a2}0</div>`, true));
  hints.push(`두 막대의 길이가 같아요. 색칠이 <b>끝나는 곳</b>을 위아래로 견주어 보세요. 0.${a2}은 0.1이 ${a2}개, 0.${a2}0은 0.01이 ${a2 * 10}개예요.<br>소수 <b>오른쪽 끝자리의 0</b>은 붙이거나 빼도 크기가 같아요.`);

  // 3번: 자리별 비교 표 — 처음 달라지는 자리 고르기
  const pos3 = M.rand(1, 3);
  let [x3, y3] = pairDiffAt(3, pos3, 9);
  const dig = n => { const s = f3(n); return [s.split('.')[0], ...s.split('.')[1].split('')]; };
  const tb = n => `<tr><td>${dig(n)[0]}</td><td style="width:16px;border:none">.</td><td>${dig(n)[1]}</td><td>${dig(n)[2]}</td><td>${dig(n)[3]}</td></tr>`;
  cards.push(M.card(2, `<div class="q-text">${f3(x3)}${M.josa(f3(x3), '과', '와')} ${f3(y3)}의 크기를 비교해 보세요.</div>` +
    `<table class="place-table"><tr><th>일의 자리</th><th style="border:none;background:none"></th><th>소수 첫째</th><th>소수 둘째</th><th>소수 셋째</th></tr>${tb(x3)}${tb(y3)}</table>` +
    M.line(`<div class="pick-v" style="font-size:17px;font-weight:bold;color:#1e293b">처음으로 숫자가 다른 자리는${M.places(pos3, 3)}</div>`,
      `<div class="eq" style="font-size:18px">더 큰 수는 <span class="tail">${M.dbox(Math.max(x3, y3), 3, true)}</span></div>`), true));
  hints.push('표에서 왼쪽(일의 자리)부터 위아래 숫자를 차례로 비교해요. 같으면 오른쪽 자리로 넘어가요.<br>처음으로 다른 자리에서 숫자가 큰 쪽이 더 큰 수예요.');

  // 4번: 자릿수가 같은 3쌍 (소수 두 자리 1쌍, 세 자리 2쌍 · 처음 달라지는 자리가 서로 다르게)
  const pos4 = M.shuffle([1, 2, 3]);
  const q4 = [pairDiffAt(2, Math.min(pos4[0], 2), 9), pairDiffAt(3, pos4[1], 9), pairDiffAt(3, pos4[2], 9)];
  cards.push(M.card(3, `<div class="q-text">두 소수의 크기를 비교하여 ○ 안에 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    `<div class="row" style="gap:18px 56px">${cmpPair(q4[0][0], 2, q4[0][1], 2)}${cmpPair(q4[1][0], 3, q4[1][1], 3)}${cmpPair(q4[2][0], 3, q4[2][1], 3)}</div>`, true));
  hints.push('두 수를 위아래로 맞추어 쓴다고 생각하고, 높은 자리부터 비교해요.');

  // 5번: 자릿수가 다른 3쌍 — "자릿수가 많으면 큰 수" 오개념 확인
  const ip5 = M.rand(0, 9);
  // ① 짧은 쪽이 큼: x.a vs x.bc (a > b)
  const a = M.rand(2, 9), b = M.rand(1, a - 1), c = M.rand(1, 9);
  const t1 = [ip5 * 10 + a, 1, ip5 * 100 + b * 10 + c, 2];
  // ② 끝자리 0만 다름: x.ab vs x.ab0
  const ip5b = M.rand(0, 9); let ab; do { ab = M.rand(11, 99); } while (ab % 10 === 0);
  const t2 = [ip5b * 100 + ab, 2, (ip5b * 100 + ab) * 10, 3];
  // ③ 짧은 쪽이 작음: x.a vs x.bc (a < b, 또는 a = b 이고 c > 0)
  const ip5c = M.rand(0, 9); let a3, b3, c3;
  if (Math.random() < 0.5) { a3 = M.rand(1, 8); b3 = M.rand(a3 + 1, 9); c3 = M.rand(0, 9); } else { a3 = M.rand(1, 9); b3 = a3; c3 = M.rand(1, 9); }
  if (c3 === 0) c3 = M.rand(1, 9); // 끝자리 0 피하기
  const t3 = [ip5c * 10 + a3, 1, ip5c * 100 + b3 * 10 + c3, 2];
  const items5 = M.shuffle([t1, t2, t3]).map(t => Math.random() < 0.5 ? t : [t[2], t[3], t[0], t[1]]);
  cards.push(M.card(4, `<div class="q-text">두 소수의 크기를 비교하여 ○ 안에 &gt;, =, &lt; 중 알맞은 것을 골라 보세요.</div>` +
    `<div class="row" style="gap:18px 56px">${items5.map(t => cmpPair(t[0], t[1], t[2], t[3])).join('')}</div>`, true));
  hints.push('자릿수가 다르면 짧은 수의 끝에 <b>0을 붙여</b> 자릿수를 맞추어 보세요.<br>예) 0.7과 0.65 → 0.70과 0.65 → 0.7이 더 커요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
