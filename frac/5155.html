<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>대분수의 뺄셈 (받아내림이 없는 경우)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">대분수의 뺄셈 (받아내림이 없는 경우)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 대분수의 뺄셈: 통분한 후 자연수끼리, 분수끼리</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 3 5/6 − 1 2/3 = 3 5/6 − 1 4/6 = <b>2 1/6</b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 가분수로 바꾸어 빼요. 3 5/6 − 1 2/3 = 23/6 − 10/6 = 13/6 = <b>2 1/6</b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 통분한 다음 분수 부분끼리 뺄 수 있는지 확인해요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5155 — 대분수의 뺄셈 (받아내림이 없는 경우) (교과서 5-1-5 104~105쪽, 수학익힘 64~65쪽, 성취기준 [6수01-08])
// 진단 포인트: 통분하지 않고 분수 부분을 뺌, 자연수 부분을 빼지 않음
const R = M.rand;
M.inlineQuestion = true;
// 진분수 두 개: 분모가 다르고, 최소공배수가 lim 이하
function two(test, lim) {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= (lim || 36) && (!test || test(x, y)));
}
const L = (x, y) => F.lcm(x.d, y.d);
const ft = x => x.n + '/' + x.d;
function generate() {
  M.reset();
  const cards = [], hints = [];
  const ok = (x, y) => x.n * y.d > y.n * x.d;      // 분수 부분끼리 뺄 수 있음
  const ws = () => { const b = R(1, 3); return [b + R(1, 3), b]; };
  // 1번: 방법 1
  const [x1, y1] = two(ok), [a1, b1] = ws();
  cards.push(M.card(0, `<div class="q-text">자연수는 자연수끼리, 분수는 분수끼리 계산해 보세요.</div>` + F.stepsMM(a1, x1, b1, y1, '-', L(x1, y1)), true));
  hints.push('통분한 다음 자연수끼리, 분수끼리 빼요.');

  // 2번: 방법 2
  const [x2, y2] = two(ok, 24), [a2, b2] = ws();
  cards.push(M.card(1, `<div class="q-text">대분수를 가분수로 나타내어 계산해 보세요.</div>` + F.stepsImp(a2, x2, b2, y2, '-', L(x2, y2)), true));
  hints.push('가분수의 분자 = 자연수 × 분모 + 분자예요. 통분하여 뺀 다음 대분수로 바꾸어요.');

  // 3번: 계산 (2문제, 하나는 자연수 부분이 같음)
  const [p3, q3] = two(ok), w3 = R(1, 4), [r3, s3] = two(ok), [c3, e3] = ws();
  const C3 = [[p3, q3, w3, w3], [r3, s3, c3, e3]];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([x, y, a, b]) => `<div class="qbox">${F.calc(F.mx(a, x.n, x.d) + F.OP['-'] + F.mx(b, y.n, y.d), F.sub(F.v(a, x.n, x.d), F.v(b, y.n, y.d)))}</div>`)), true));
  hints.push('통분 → 자연수끼리, 분수끼리 빼기 → 약분할 수 있으면 약분해요. 자연수 부분이 0이면 진분수로 써요.');

  // 4번: 문장제
  const [x4, y4] = two(ok), [a4, b4] = ws();
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">유기견들을 산책시키며 지후는 ${a4} ${ft(x4)} km, 소윤이는 ${b4} ${ft(y4)} km를 걸었습니다. 지후는 소윤이보다 몇 km 더 걸었나요?</div>` +
    `<div class="eq">${F.ans(F.sub(F.v(a4, x4.n, x4.d), F.v(b4, y4.n, y4.d)))} km</div>`, true));
  hints.push('더 많이 걸은 거리에서 적게 걸은 거리를 빼요.');

  // 5번: 바르게 계산한 것 고르기 (함정: 분모끼리도 뺌, 통분하지 않고 분자만 뺌)
  const [x5, y5] = two((x, y) => ok(x, y) && x.n > y.n && x.d > y.d), [a5, b5] = ws();
  const d5 = F.mixedOf(F.sub(F.v(a5, x5.n, x5.d), F.v(b5, y5.n, y5.d)));
  const mt = (w, n, d) => (w ? w + ' ' : '') + n + '/' + d;
  const pre = `${a5} ${ft(x5)} − ${b5} ${ft(y5)} = `, R5 = pre + (d5.n ? mt(d5.w, d5.n, d5.d) : String(d5.w));
  const W5 = Array.from(new Set([pre + mt(a5 - b5, x5.n - y5.n, x5.d - y5.d), pre + mt(a5 - b5, x5.n - y5.n, x5.d)])).filter(t => t !== R5);
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` + F.one(R5, W5), true));
  hints.push('통분한 다음 분수 부분을 빼요. 분모끼리 빼거나, 통분하지 않고 분자만 빼면 안 돼요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
