<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(자연수) × (소수) — 1보다 큰 소수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(자연수) × (소수)를 계산해요 — 1보다 큰 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 5 × 2.5는 5의 2배와 5의 0.5배를 더한 것이에요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 5 × 2.5 = 5 × 2 + 5 × 0.5 = 10 + 2.5 = <b>12.5</b> &nbsp;(1보다 큰 수를 곱하면 곱은 5보다 커요)</div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 6 × 3.7 = 6 × <sup>37</sup>⁄<sub>10</sub> = <sup>222</sup>⁄<sub>10</sub> = 22.2</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 6 × 37 = 222 → 곱하는 수가 <sup>1</sup>⁄<sub>10</sub>배이니 곱도 <sup>1</sup>⁄<sub>10</sub>배 → 22.2</div>
  <div class="rule-line"><span class="rule-tag t4">순서</span> 곱하는 두 수의 순서를 바꾸어도 곱은 같아요. 2 × 1.8 = 1.8 × 2</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5244 — (자연수) × (소수), 1보다 큰 소수 (교과서 5-2-4 94~95쪽, 수학 익힘 60~61쪽)
const f = M.fmt;
const STORY = [
  (n, x) => ({ unit: 'mL', text: `한 스푼에 식초가 ${n} mL씩 담기는 스푼이 있습니다. 이 스푼으로 ${f(x, 1)}스푼만큼 식초를 넣으면 넣은 식초는 몇 mL인가요?` }),
  (n, x) => ({ unit: 'kg', text: `철근 1 m의 무게는 ${n} kg입니다. 같은 철근 ${f(x, 1)} m의 무게는 몇 kg인가요?` }),
  (n, x) => ({ unit: 'L', text: `1분에 물이 ${n} L씩 나오는 수도가 있습니다. ${f(x, 1)}분 동안 받은 물은 몇 L인가요?` })
];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (n × a.b)
  let n1, x1; do { n1 = M.rand(2, 9); x1 = M.rand(11, 49); } while (x1 % 10 === 0 || (n1 * x1) % 10 === 0);
  const s1 = M.pick(STORY)(n1, x1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(n1 * x1, 1, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', n1 * 10, 1)} × ${M.pairbox('s', x1, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(n1 * x1, 1)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(x1, 1)}${M.josa(f(x1, 1), '을', '를')} 가까운 자연수로 생각하고 ${n1}${M.josa(n1, '과', '와')} 곱하면 대략의 크기를 알 수 있어요.<br>${f(x1, 1)}${M.josa(f(x1, 1), '은', '는')} 1보다 크니 답은 ${n1}보다 커요.`);

  // 2번: 수직선 — n의 a배 + n의 0.b배
  let n2, x2; do { n2 = M.rand(2, 9); x2 = M.rand(11, 29); } while (x2 % 10 === 0 || (n2 * x2) % 10 === 0);
  const A2 = Math.floor(x2 / 10), B2 = x2 % 10;
  cards.push(M.card(1, `<div class="q-text">그림을 보고 ${n2} × ${f(x2, 1)}${M.josa(f(x2, 1), '을', '를')} 계산해 보세요.</div>` + D.mulLine(n2, x2) +
    M.line(`<div class="eq" style="font-size:18px">${n2}의 ${A2}배는 <span class="tail">${M.box(n2 * A2)}이고,</span></div>`,
      `<div class="eq" style="font-size:18px">${n2}의 ${f(B2, 1)}배는 <span class="tail">${M.dbox(n2 * B2, 1)}입니다.</span></div>`) +
    `<div class="eq">${n2} × ${f(x2, 1)} = ${M.box(n2 * A2)} + ${M.dbox(n2 * B2, 1)} = ${M.dbox(n2 * x2, 1)}</div>`, true));
  hints.push(`${f(x2, 1)} = ${A2} + ${f(B2, 1)}처럼 나누어 생각해요.<br>${n2}의 ${f(B2, 1)}배는 ${n2}의 ${M.frac(B2, 10, true)}배예요.`);

  // 3번: 분수의 곱셈 / 자연수의 곱셈으로 (n × a.b)
  let n3, x3; do { n3 = M.rand(2, 9); x3 = M.rand(11, 59); } while (x3 % 10 === 0 || (n3 * x3) % 10 === 0);
  cards.push(M.card(2, `<div class="q-text">${n3} × ${f(x3, 1)}${M.josa(f(x3, 1), '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${n3} × ${f(x3, 1)} = ${n3} × ${M.frac(M.box(x3), 10)} = ${M.frac(M.box(n3) + ' × ' + M.box(x3), 10)} = ${M.frac(M.box(n3 * x3), 10)} = ${M.dbox(n3 * x3, 1)}</div>`,
      D.arrows({ A: n3, pa: 0, B: x3, pb: 1, pick: true })), true));
  hints.push(`① ${f(x3, 1)} = ${M.frac(x3, 10, true)}이에요. 자연수와 분자를 곱하고 분모는 그대로 두어요.<br>② ${f(x3, 1)}${M.josa(f(x3, 1), '은', '는')} ${x3}의 ${M.frac(1, 10, true)}배이므로 곱도 ${M.frac(1, 10, true)}배가 돼요.`);

  // 4번: 계산하기 (가로셈 n × a.b, 세로셈 n × a.bc)
  let n4, x4; do { n4 = M.rand(3, 9); x4 = M.rand(11, 89); } while (x4 % 10 === 0 || (n4 * x4) % 10 === 0);
  let m4, y4; do { m4 = M.rand(2, 9); y4 = M.rand(101, 899); } while (y4 % 10 === 0 || (m4 * y4) % 10 === 0);
  cards.push(M.card(3, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${n4} × ${f(x4, 1)} = ${M.dbox(n4 * x4, 1)}</div>`, D.vmul(m4, 0, y4, 2)), true));
  hints.push(`자연수의 곱셈을 한 다음, 곱하는 소수의 소수점 아래 자릿수만큼 소수점을 찍어요.<br>세로셈은 ${f(y4, 2)}${M.josa(f(y4, 2), '이', '가')} 소수 <b>두 자리</b> 수이니 곱도 소수 두 자리 수예요.`);

  // 5번: 곱하는 순서를 바꾸어도 곱은 같아요 (n × a.b 와 a.b × n)
  let n5, x5; do { n5 = M.rand(2, 9); x5 = M.rand(11, 49); } while (x5 % 10 === 0 || (n5 * x5) % 10 === 0);
  cards.push(M.card(4, `<div class="q-text">두 곱셈을 계산하고, 계산 결과를 비교해 보세요.</div>` +
    `<div class="oxp"><div class="sign">${n5} × ${f(x5, 1)}</div><div class="sign">${f(x5, 1)} × ${n5}</div></div>` +
    M.line(`<div class="eq qbox">${n5} × ${f(x5, 1)} = ${M.dbox(n5 * x5, 1)}</div>`, `<div class="eq qbox">${f(x5, 1)} × ${n5} = ${M.dbox(n5 * x5, 1)}</div>`) +
    `<div class="eq" style="font-size:18px">${n5} × ${f(x5, 1)}${M.josa(f(x5, 1), '과', '와')} ${f(x5, 1)} × ${n5}의 계산 결과는 ${M.choices('same', [['same', '같습니다'], ['diff', '다릅니다']])}</div>`, true));
  hints.push(`${n5} × ${f(x5, 1)}${M.josa(f(x5, 1), '은', '는')} ${n5}의 ${f(x5, 1)}배, ${f(x5, 1)} × ${n5}${M.josa(n5, '은', '는')} ${f(x5, 1)}${M.josa(f(x5, 1), '을', '를')} ${n5}번 더한 것이에요.<br>두 곱셈을 모두 계산한 다음 결과를 비교해 보세요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
