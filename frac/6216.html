<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) → 6학년 분수 도우미(m6f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m6f-common.js?v=20261107-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(분수) ÷ (분수) — 가분수·대분수의 나눗셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(분수) ÷ (분수) — 가분수·대분수의 나눗셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 두 가지 방법, 대분수는 먼저 가분수로!</div>
  <div class="rule-line"><span class="rule-tag">방법 1</span> 통분하여 계산하기: 2<sup>1</sup>⁄<sub>2</sub> ÷ <sup>2</sup>⁄<sub>5</sub> = <sup>5</sup>⁄<sub>2</sub> ÷ <sup>2</sup>⁄<sub>5</sub> = <sup>25</sup>⁄<sub>10</sub> ÷ <sup>4</sup>⁄<sub>10</sub> = 25 ÷ 4 = <b>6<sup>1</sup>⁄<sub>4</sub></b></div>
  <div class="rule-line"><span class="rule-tag t2">방법 2</span> 분수의 곱셈으로 계산하기: 2<sup>1</sup>⁄<sub>2</sub> ÷ <sup>2</sup>⁄<sub>5</sub> = <sup>5</sup>⁄<sub>2</sub> × <sup>5</sup>⁄<sub>2</sub> = <sup>25</sup>⁄<sub>4</sub> = <b>6<sup>1</sup>⁄<sub>4</sub></b></div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 대분수인 채로 곱하면 분수 부분에만 곱하게 돼요. 꼭 가분수로 바꾸어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 6216 — (분수) ÷ (분수)를 구해 볼까요 (가분수·대분수 포함) (교과서 6-2-1 22~23쪽, 수학 익힘 20~21쪽, 성취기준 [6수01-11])
// 진단 포인트: 대분수를 가분수로 바꾸지 않고 곱함(1 1/6 ÷ 2/5 = 1 1/6 × 5/2 = 1 5/12, 교과서 23쪽 민규의 계산)
const R = M.rand;
M.inlineQuestion = true;
const { EQ, DV, X, J } = G;
const sf = G.sf, ft = F.ft;
// 가분수 (분모 lo~hi, 기약, 자연수 아님)
const improper = (lo, hi) => F.gen(() => { const d = R(lo, hi); return { n: R(d + 1, 3 * d), d: d }; }, x => G.coprime(x.n, x.d));
const mixed = (lo, hi) => ({ w: R(1, 4), x: G.proper(lo, hi) });
const V = m => F.v(m.w, m.x.n, m.x.d);
const MX = m => F.mx(m.w, m.x.n, m.x.d);
const mt = m => m.w + ' ' + ft(m.x);
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 두 가지 방법 (가분수 ÷ 진분수)
  const [x1, y1] = F.gen(() => [improper(2, 7), G.proper(2, 9)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= 36 && x.n * F.lcm(x.d, y.d) / x.d <= 99);
  const L1 = F.lcm(x1.d, y1.d), A1 = x1.n * L1 / x1.d, C1 = y1.n * L1 / y1.d;
  cards.push(M.card(0, `<div class="q-text">${sf(x1.n, x1.d)} ÷ ${sf(y1.n, y1.d)}${M.josa(y1.n, '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    G.methods('방법 ① 통분하여 계산하기',
      `<div class="eq">${F.fr(x1.n, x1.d)}${DV}${F.fr(y1.n, y1.d)}${EQ}${F.fn(A1, L1)}${DV}${F.fn(C1, L1)}</div>` +
      `<div class="eq">${EQ}${M.box(A1)}${DV}${M.box(C1)}${EQ}${F.ans(F.simp(A1, C1))}</div>`,
      '방법 ② 분수의 곱셈으로 계산하기',
      `<div class="eq">${F.fr(x1.n, x1.d)}${DV}${F.fr(y1.n, y1.d)}${EQ}${F.fr(x1.n, x1.d)}${X}${F.ff(y1.d, y1.n)}</div>` +
      `<div class="eq">${EQ}${F.ans(G.div(x1, y1))}</div>`), true));
  hints.push('방법 ①: 두 분모의 최소공배수로 통분한 다음 분자끼리 나누어요.<br>방법 ②: 나누는 분수의 분자와 분모를 바꾸어 곱해요. 두 방법의 답은 같아야 해요.');

  // 2번: 대분수 ÷ 분수 — 가분수로 바꾸어
  const [m2, y2] = F.gen(() => [mixed(2, 6), G.proper(2, 9)], ([m, y]) => y.n >= 2 && V(m).n <= 30 && !F.eq(V(m), y));
  const p2 = V(m2).n;
  cards.push(M.card(1, `<div class="q-text">대분수를 가분수로 바꾸어 계산해 보세요.</div>` +
    `<div class="eq">${MX(m2)}${DV}${F.fr(y2.n, y2.d)}${EQ}${F.fn(p2, m2.x.d)}${DV}${F.fr(y2.n, y2.d)}${EQ}${F.fn(p2, m2.x.d)}${X}${F.ff(y2.d, y2.n)}${EQ}${F.ans(G.div(V(m2), y2))}</div>`, true));
  hints.push('가분수의 분자 = 자연수 × 분모 + 분자예요. 가분수로 바꾼 다음 나누는 분수의 분자와 분모를 바꾸어 곱해요.');

  // 3번: 계산 (가분수 ÷ 진분수, 대분수 ÷ 진분수)
  const [x3, y3] = F.gen(() => [improper(3, 11), G.proper(3, 9)], ([x, y]) => x.n <= 30);
  const [m3, z3] = F.gen(() => [mixed(2, 6), G.proper(2, 8)], ([m, y]) => V(m).n <= 30);
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="qbox">${F.calc(F.fr(x3.n, x3.d) + DV + F.fr(y3.n, y3.d), G.div(x3, y3))}</div>`,
      `<div class="qbox">${F.calc(MX(m3) + DV + F.fr(z3.n, z3.d), G.div(V(m3), z3))}</div>`), true));
  hints.push('대분수는 먼저 가분수로 바꾸어요. 그다음 통분하거나 곱셈으로 바꾸어 계산해요.');

  // 4번: 잘못 계산한 이유 + 옳은 계산 (대분수를 가분수로 바꾸지 않음)
  const [m4, y4] = F.gen(() => [mixed(3, 9), G.proper(2, 7)], ([m, y]) => y.n >= 2 && m.x.n * y.d < m.x.d * y.n && V(m).n <= 40);
  const bad4 = F.simp(m4.x.n * y4.d, m4.x.d * y4.n);
  cards.push(M.card(3, `<div class="q-text">잘못 계산한 이유를 고르고, 옳게 계산해 보세요.</div>` +
    `<div class="wrong-calc">${MX(m4)}${DV}${F.fr(y4.n, y4.d)}${EQ}${MX(m4)}${X}${F.fr(y4.d, y4.n)}${EQ}${F.mx(m4.w, bad4.n, bad4.d)}</div>` +
    `<div class="sub-q">이유</div>` +
    G.why('대분수를 가분수로 바꾸지 않고 분수 부분에만 곱했어요.',
      ['나누는 분수의 분자와 분모를 바꾸면 안 돼요.', '분모가 다르니 먼저 통분해야만 해요.']) +
    `<div class="sub-q">옳은 계산</div>` +
    `<div class="eq">${MX(m4)}${DV}${F.fr(y4.n, y4.d)}${EQ}${F.ans(G.div(V(m4), y4))}</div>`, true));
  hints.push(`${mt(m4)}${M.josa(m4.x.n, '은', '는')} ${m4.w} + ${G.ye(ft(m4.x))}. 자연수 부분 ${m4.w}에도 곱해야 하므로 먼저 가분수로 바꾸어요.`);

  // 5번: 문장제
  const T5 = M.pick(['walk', 'juice']);
  let text5, unit5, val5, hint5;
  if (T5 === 'walk') {
    const [x, y] = F.gen(() => [improper(2, 6), G.proper(2, 7)], ([x, y]) => y.n >= 2 && x.n <= 20);
    text5 = `지우는 ${ft(x)} km를 산책하는 데 ${ft(y)}시간이 걸렸습니다. 같은 빠르기로 산책한다면 1시간 동안 산책할 수 있는 거리는 몇 km인가요?`;
    unit5 = 'km'; val5 = G.div(x, y);
    hint5 = '1시간 동안 갈 수 있는 거리 = (간 거리) ÷ (걸린 시간)이에요.';
  } else {
    const [x, k] = F.gen(() => [G.proper(2, 9), R(2, 7)], ([x, k]) => x.n * k > x.d);
    const tot = F.simp(x.n * k, x.d);
    text5 = `감귤주스 ${F.st(tot)} L를 한 컵에 ${ft(x)} L씩 담으려고 합니다. 몇 개의 컵에 담을 수 있나요?`;
    unit5 = '개'; val5 = G.nat(k);
    hint5 = '전체 양을 한 컵에 담는 양으로 나누어요. 대분수는 가분수로 바꾸어 계산해요.';
  }
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` + G.word(text5) +
    `<div class="eq">${F.ans(val5)} ${unit5}</div>`, true));
  hints.push(hint5);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
