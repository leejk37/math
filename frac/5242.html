<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 분수 빈칸(m5f) → 소수의 곱셈 도우미(m524) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-1"></script>
<script src="m5f-common.js?v=20261106-3"></script>
<script src="m524-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>(소수) × (자연수) — 1보다 큰 소수</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">(소수) × (자연수)를 계산해요 — 1보다 큰 소수</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 1과 0.1이 각각 몇 개인지 세어 보아요!</div>
  <div class="rule-line"><span class="rule-tag">원리</span> 1.6 × 2 → 1이 2개(2), 0.1이 12개(1.2) → 2 + 1.2 = <b>3.2</b></div>
  <div class="rule-line"><span class="rule-tag t2">분수</span> 2.1 × 3 = <sup>21</sup>⁄<sub>10</sub> × 3 = <sup>63</sup>⁄<sub>10</sub> = 6.3</div>
  <div class="rule-line"><span class="rule-tag t3">자연수</span> 21 × 3 = 63 → 곱해지는 수가 <sup>1</sup>⁄<sub>10</sub>배이니 곱도 <sup>1</sup>⁄<sub>10</sub>배 → 6.3</div>
  <div class="rule-line"><span class="rule-tag t4">소수점</span> 곱해지는 수의 소수점 아래 자릿수만큼 곱에도 소수점을 찍어요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5242 — (소수) × (자연수), 1보다 큰 소수 (교과서 5-2-4 90~91쪽, 수학 익힘 56~57쪽)
const f = M.fmt;
const STORY1 = [
  (x, n) => ({ unit: 'kg', text: `유준이는 우유갑을 한 묶음에 ${f(x, 1)} kg씩 ${n}묶음 모아 분리배출하러 갔습니다. 모은 우유갑의 무게는 모두 몇 kg인가요?` }),
  (x, n) => ({ unit: 'L', text: `물병 한 개에 물이 ${f(x, 1)} L씩 들어 있습니다. 물병 ${n}개에 들어 있는 물은 모두 몇 L인가요?` }),
  (x, n) => ({ unit: 'km', text: `하루에 ${f(x, 1)} km씩 ${n}일 동안 걸었습니다. 걸은 거리는 모두 몇 km인가요?` })
];
const STORY5 = [
  (x, n) => ({ unit: 'cm', text: `민재의 한 걸음은 ${f(x, 1)} cm입니다. 민재가 ${n}걸음을 걸었을 때 걸은 거리는 모두 몇 cm인가요?` }),
  (x, n) => ({ unit: 'cm', text: `색 테이프 한 장의 길이는 ${f(x, 1)} cm입니다. 겹치지 않게 ${n}장을 이어 붙이면 전체 길이는 몇 cm인가요?` }),
  (x, n) => ({ unit: 'g', text: `귤 한 개의 무게는 ${f(x, 1)} g입니다. 무게가 같은 귤 ${n}개의 무게는 모두 몇 g인가요?` })
];

M.inlineQuestion = true; // 문제 지시문을 '문제 N' 바로 옆에
function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 문장제 — 어림하고 식·답 쓰기 (a.b × n)
  let x1, n1; do { x1 = M.rand(11, 49); n1 = M.rand(2, 6); } while (x1 % 10 === 0 || (x1 * n1) % 10 === 0);
  const s1 = M.pick(STORY1)(x1, n1);
  cards.push(M.card(0, `<div class="q-text">${s1.text}</div>` +
    `<div class="eq" style="font-size:18px">어림하기: ${D.est(x1 * n1, 1, s1.unit)}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('s', x1, 1)} × ${M.pairbox('s', n1 * 10, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(x1 * n1, 1)} ${s1.unit}</span></div>`), true));
  hints.push(`${f(x1, 1)}${M.josa(f(x1, 1), '은', '는')} 가장 가까운 자연수로 생각하고 ${n1}배 하면 대략의 크기를 알 수 있어요.<br>계산한 답과 어림한 값을 꼭 비교해요.`);

  // 2번: 그림 — 1과 0.1의 개수 (a.b × n)
  let x2, n2; do { x2 = M.rand(11, 29); n2 = M.rand(2, 3); } while (x2 % 10 === 0 || (x2 % 10) * n2 < 10 || (x2 * n2) % 10 === 0);
  const A2 = Math.floor(x2 / 10), B2 = x2 % 10;
  cards.push(M.card(1, `<div class="q-text">그림을 보고 ${f(x2, 1)} × ${n2}${M.josa(n2, '을', '를')} 계산해 보세요.</div>` + D.unitBars(x2, n2) +
    M.line(`<div class="eq" style="font-size:18px">1이 <span class="tail">${M.box(A2 * n2)}개이므로</span> <span class="tail">${M.box(A2 * n2)},</span></div>`,
      `<div class="eq" style="font-size:18px">0.1이 <span class="tail">${M.box(B2 * n2)}개이므로</span> <span class="tail">${M.dbox(B2 * n2, 1)}입니다.</span></div>`) +
    `<div class="eq">${f(x2, 1)} × ${n2} = ${M.box(A2 * n2)} + ${M.dbox(B2 * n2, 1)} = ${M.dbox(x2 * n2, 1)}</div>`, true));
  hints.push(`막대 하나에 분홍 부분은 1이 ${A2}개, 0.1이 ${B2}개예요. 막대가 ${n2}개이니 각각 ${n2}배 해요.<br>0.1이 10개면 1이에요. 0.1의 개수를 소수로 바꾸어 1의 개수와 더해요.`);

  // 3번: 분수의 곱셈 / 자연수의 곱셈으로 (a.b × n)
  let x3, n3; do { x3 = M.rand(11, 59); n3 = M.rand(2, 9); } while (x3 % 10 === 0 || (x3 * n3) % 10 === 0);
  cards.push(M.card(2, `<div class="q-text">${f(x3, 1)} × ${n3}${M.josa(n3, '을', '를')} 두 가지 방법으로 계산해 보세요.</div>` +
    D.methods(`<div class="eq">${f(x3, 1)} × ${n3} = ${M.frac(M.box(x3), 10)} × ${n3} = ${M.frac(M.box(x3) + ' × ' + M.box(n3), 10)} = ${M.frac(M.box(x3 * n3), 10)} = ${M.dbox(x3 * n3, 1)}</div>`,
      D.arrows({ A: x3, pa: 1, B: n3, pb: 0, pick: true })), true));
  hints.push(`① ${f(x3, 1)} = ${M.frac(x3, 10, true)}이에요. 분자끼리 곱한 다음 다시 소수로 바꾸어요.<br>② ${f(x3, 1)}${M.josa(f(x3, 1), '은', '는')} ${x3}의 ${M.frac(1, 10, true)}배이므로, ${x3} × ${n3}의 곱을 ${M.frac(1, 10, true)}배 해요.`);

  // 4번: 계산하기 (가로셈 a.b × n, 세로셈 a.bc × n)
  let x4, n4; do { x4 = M.rand(11, 79); n4 = M.rand(3, 9); } while (x4 % 10 === 0 || (x4 * n4) % 10 === 0);
  let y4, m4; do { y4 = M.rand(101, 899); m4 = M.rand(2, 9); } while (y4 % 10 === 0 || (y4 * m4) % 10 === 0);
  cards.push(M.card(3, `<div class="q-text">계산해 보세요.</div>` +
    M.line(`<div class="eq qbox">${f(x4, 1)} × ${n4} = ${M.dbox(x4 * n4, 1)}</div>`, D.vmul(y4, 2, m4, 0)), true));
  hints.push(`${x4} × ${n4}${M.josa(n4, '을', '를')} 먼저 계산한 다음, 소수 <b>한 자리</b> 수가 되도록 소수점을 찍어요.<br>세로셈은 ${y4} × ${m4}${M.josa(m4, '을', '를')} 계산한 다음 소수 <b>두 자리</b> 수가 되도록 소수점을 찍어요.`);

  // 5번: 문장제 (ab.c × n)
  let x5, n5; do { x5 = M.rand(300, 699); n5 = M.rand(4, 9); } while (x5 % 10 === 0 || (x5 * n5) % 10 === 0);
  const s5 = M.pick(STORY5)(x5, n5);
  cards.push(M.card(4, `<div class="q-text">${s5.text}</div>` +
    M.line(`<div class="eq" style="font-size:19px">식: ${M.pairbox('t', x5, 1)} × ${M.pairbox('t', n5 * 10, 1)}</div>`,
      `<div class="eq" style="font-size:19px">답: <span class="tail">${M.dbox(x5 * n5, 1)} ${s5.unit}</span></div>`), true));
  hints.push(`같은 양이 ${n5}번 있으니 곱셈식으로 나타내요.<br>${x5} × ${n5}${M.josa(n5, '을', '를')} 구한 다음 소수 한 자리 수로 나타내요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
