<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-4"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>진분수의 뺄셈</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">진분수의 뺄셈</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 분모가 다른 분수의 뺄셈: 통분한 후 분자끼리 빼요</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 5/6 − 1/2 = 5/6 − 3/6 = 2/6 = <b>1/3</b></div>
  <div class="rule-line"><span class="rule-tag t2">통분</span> 두 분모의 곱이나 최소공배수를 공통분모로 해요. 결과는 기약분수로 나타내요.</div>
  <div class="rule-line"><span class="rule-tag t3">주의</span> 5/6 − 1/2 ≠ 4/4 (분자끼리, 분모끼리 빼면 안 돼요)</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5154 — 진분수의 뺄셈 (교과서 5-1-5 102~103쪽, 수학익힘 62~63쪽, 성취기준 [6수01-08])
// 진단 포인트: 통분하지 않고 분자끼리·분모끼리 뺌, 약분하지 않음
const R = M.rand;
M.inlineQuestion = true;
// 진분수 두 개: 분모가 다르고, 최소공배수가 lim 이하
function two(test, lim) {
  return F.gen(() => [F.proper(2, 12), F.proper(2, 12)], ([x, y]) => x.d !== y.d && F.lcm(x.d, y.d) <= (lim || 36) && (!test || test(x, y)));
}
const L = (x, y) => F.lcm(x.d, y.d);
const ft = x => x.n + '/' + x.d;
function generate() {
  M.reset();
  const cards = [], hints = [];
  const big = (x, y) => x.n * y.d > y.n * x.d;
  // 1번: 최소공배수로
  const [x1, y1] = two(big);
  cards.push(M.card(0, `<div class="q-text">두 분모의 최소공배수를 공통분모로 하여 계산해 보세요.</div>` + F.stepsPP(x1, y1, '-', L(x1, y1)), true));
  hints.push('통분한 다음, 분모는 그대로 두고 분자끼리 빼요.');

  // 2번: 두 분모의 곱으로
  const [x2, y2] = two((x, y) => big(x, y) && F.gcd(x.d, y.d) > 1 && x.d * y.d <= 72, 72);
  cards.push(M.card(1, `<div class="q-text">두 분모의 곱을 공통분모로 하여 계산하고, 기약분수로 나타내 보세요.</div>` + F.stepsPP(x2, y2, '-', x2.d * y2.d), true));
  hints.push(`공통분모는 ${x2.d} × ${y2.d}이에요. 계산한 다음 약분해요.`);

  // 3번: 계산 (2문제)
  const C3 = [two(big), two(big)];
  cards.push(M.card(2, `<div class="q-text">계산해 보세요.</div>` +
    M.line(...C3.map(([x, y]) => `<div class="qbox">${F.calc(F.fr(x.n, x.d) + F.OP['-'] + F.fr(y.n, y.d), F.sub(x, y))}</div>`)), true));
  hints.push('통분 → 분자끼리 빼기 → 약분할 수 있으면 약분해요.');

  // 4번: 문장제
  const [x4, y4] = two(big);
  cards.push(M.card(3, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
    `<div class="word">케이크를 만드는 데 우유를 다연이는 ${ft(x4)} L, 시우는 ${ft(y4)} L 사용했습니다. 다연이는 시우보다 우유를 몇 L 더 많이 사용했나요?</div>` +
    `<div class="eq">${F.ans(F.sub(x4, y4))} L</div>`, true));
  hints.push('더 많이 사용한 양에서 적게 사용한 양을 빼요.');

  // 5번: 바르게 계산한 것 고르기
  const [x5, y5] = two((x, y) => big(x, y) && x.n > y.n && x.d > y.d), d5 = F.sub(x5, y5), L5 = L(x5, y5), raw5 = x5.n * L5 / x5.d - y5.n * L5 / y5.d;
  const w5 = [`${ft(x5)} − ${ft(y5)} = ${x5.n - y5.n}/${x5.d - y5.d}`];
  if (raw5 !== d5.n || L5 !== d5.d) w5.push(`${ft(x5)} − ${ft(y5)} = ${raw5}/${L5 + 1}`); else w5.push(`${ft(x5)} − ${ft(y5)} = ${raw5 + 1}/${L5}`);
  cards.push(M.card(4, `<div class="q-text">바르게 계산한 것을 골라 보세요.</div>` + F.one(`${ft(x5)} − ${ft(y5)} = ${ft(d5)}`, w5), true));
  hints.push('통분한 다음에는 분모는 그대로 두고 분자끼리만 빼요.');
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
