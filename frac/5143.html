<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미 → 공통 화면(m423) → 5학년 분수 도우미(m5f) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="frac-kit.js"></script>
<script src="m423-common.js?v=20261109-3"></script>
<script src="m5f-common.js?v=20261106-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>분수를 간단하게 나타내기 (약분)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">분수를 간단하게 나타내기 (약분)</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 약분: 분모와 분자를 1이 아닌 공약수로 나누어 간단하게</div>
  <div class="rule-line"><span class="rule-tag">약분</span> 8/16 = 4/8 = 2/4 = <b>1/2</b> (2, 4, 8로 나눔)</div>
  <div class="rule-line"><span class="rule-tag t2">기약분수</span> 1/2처럼 분모와 분자의 공약수가 1뿐인 분수</div>
  <div class="rule-line"><span class="rule-tag t3">한 번에</span> 분모와 분자를 <b>최대공약수</b>로 나누면 한 번에 기약분수가 돼요.</div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5143 — 분수를 간단하게 나타내기 (약분) (교과서 5-1-4 76~77쪽, 수학익힘 46~47쪽, 성취기준 [6수01-06])
// 진단 포인트: 한 번만 약분하고 멈춤, 공약수가 아닌 수로 나눔, 기약분수를 알아보지 못함
const R = M.rand;
M.inlineQuestion = true;
// 분모·분자의 최대공약수가 g(4~12)인 분수 (분모 60 이하)
function red(lo, hi) {
  return F.gen(() => { const a = F.proper(2, 9), g = R(lo, hi); return { n: a.n * g, d: a.d * g, g, a }; }, x => x.d <= 60);
}
function generate() {
  M.reset();
  const cards = [], hints = [];
  // 1번: 공약수 고르기 + 기약분수
  const x1 = red(4, 12);
  const pad1 = Array.from({ length: 12 }, (_, i) => i + 1);
  cards.push(M.card(0, `<div class="q-text">${F.fr(x1.n, x1.d)}의 분모와 분자의 공약수를 모두 고르고, 기약분수로 나타내 보세요.</div>` +
    F.nums(pad1, F.divisors(x1.g)) + `<div class="eq">${F.fr(x1.n, x1.d)} = ${F.ans(x1.a)}</div>`, true));
  hints.push(`${x1.n}과(와) ${x1.d}을(를) 모두 나누어떨어지게 하는 수를 찾아요. 그중 가장 큰 수로 나누면 기약분수예요.`);

  // 2번: 공약수로 각각 약분
  const x2 = F.gen(() => red(4, 12), x => F.divisors(x.g).length >= 3);
  const ks = F.divisors(x2.g).filter(k => k > 1).slice(0, 3);
  cards.push(M.card(1, `<div class="q-text">${F.fr(x2.n, x2.d)}을(를) 약분하려고 합니다. 빈칸에 알맞은 수를 써넣으세요.</div>` +
    M.line(...ks.map(k => `<div class="qbox"><div class="eq">÷ ${k} → ${F.ff(x2.n / k, x2.d / k)}</div></div>`)), true));
  hints.push('분모와 분자를 각각 같은 수로 나누어요.');

  // 3번: 기약분수로 나타내기 (3개)
  const X3 = [red(2, 6), red(4, 9), red(6, 12)];
  cards.push(M.card(2, `<div class="q-text">기약분수로 나타내 보세요.</div>` +
    M.line(...X3.map(x => `<div class="qbox"><div class="eq">${F.fr(x.n, x.d)} = ${F.ans(x.a)}</div></div>`)), true));
  hints.push('분모와 분자를 최대공약수로 나누어요. 더 나눌 수 있는지 꼭 확인해요.');

  // 4번: 기약분수 모두 고르기
  const pool = F.gen(() => { const l = []; while (l.length < 6) { const d = R(4, 20), n = R(1, d - 1); if (!l.some(v => v[0] === n && v[1] === d)) l.push([n, d]); } return l; },
    l => { const c = l.filter(([n, d]) => F.gcd(n, d) === 1).length; return c >= 2 && c <= 4; });
  cards.push(M.card(3, `<div class="q-text">기약분수를 모두 골라 보세요.</div>` +
    F.multi(pool.map(([n, d]) => [n + '_' + d, n + '/' + d]), pool.filter(([n, d]) => F.gcd(n, d) === 1).map(([n, d]) => n + '_' + d)), true));
  hints.push('분모와 분자를 함께 나눌 수 있는 수(1 말고)가 없으면 기약분수예요.');

  // 5번: 문장제
  const x5 = F.gen(() => { const t = M.pick([10, 12, 15, 16, 18, 20, 24, 25]), s = R(2, t - 1); return { t, s }; }, ({ t, s }) => F.gcd(t, s) > 1);
  cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 기약분수로 써 보세요.</div>` +
    `<div class="word">서윤이가 농구공을 ${x5.t}번 던져서 ${x5.s}번 넣었습니다. 넣은 횟수는 던진 횟수의 얼마인가요?</div>` +
    `<div class="eq">${F.ans(F.simp(x5.s, x5.t))}</div>`, true));
  hints.push(`넣은 횟수 ÷ 던진 횟수를 분수로 쓰면 ${x5.s}/${x5.t}이에요. 이것을 약분해요.`);
  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
