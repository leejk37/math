<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진단분석보고서</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --line: #e3e7ef; --ink: #1d2433; --sub: #667085; --muted: #98a2b3;
    --accent: #2e6be6; --accent-soft: #eaf1ff;
    /* 성취 수준: 도달·노력·보충 (색만으로 구분하지 않고 항상 글자를 함께 씀) */
    --reach: #0ca30c; --effort: #fab219; --support: #d03b3b; --none: #d5dae3;
    --reach-soft: #e3f6e3; --effort-soft: #fff4d6; --support-soft: #fbe5e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; line-height: 1.5; }
  .hidden { display: none !important; }

  header.bar { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 20px; }
  header.bar h1 { font-size: 20px; margin: 0; white-space: nowrap; }
  header.bar h1 a { color: var(--sub); font-size: 13px; font-weight: 500; margin-left: 8px; text-decoration: none; }
  .who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); }
  select, input[type=date], button { font: inherit; font-size: 15px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }

  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }
  .notice { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; text-align: center;
    color: var(--sub); line-height: 1.8; }
  .notice b { color: var(--ink); }

  /* 범위 고르기 */
  .picker { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
  .row > label.k { font-weight: 700; font-size: 14px; color: var(--sub); min-width: 44px; }
  .units { display: flex; flex-direction: column; gap: 10px; }
  .unit { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .unit-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .unit-h small { color: var(--sub); font-weight: 500; }
  .lvls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .lv { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px 4px 8px; font-size: 13px; cursor: pointer; background: #fff; }
  .lv input { margin: 0; }
  .lv small { color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--sub); }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; flex-wrap: wrap; }

  /* 보고서 */
  .report { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 30px; }
  .cover { border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px; }
  .cover .school { color: var(--sub); font-size: 14px; }
  .cover h2 { margin: 4px 0 6px; font-size: 26px; letter-spacing: -0.5px; }
  .cover .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--sub); }
  .flow { display: flex; gap: 6px; margin: 14px 0 6px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .flow span { padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .flow i { color: var(--muted); font-style: normal; align-self: center; }

  section.part { margin-top: 30px; }
  section.part > h3 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
  section.part > h3 .no { color: var(--accent); }
  section.part > p.lead { margin: 0 0 14px; color: var(--sub); font-size: 14px; }
  h4 { font-size: 16px; margin: 22px 0 8px; }
  h4 small { color: var(--sub); font-weight: 500; font-size: 13px; margin-left: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 13px; color: var(--sub); }
  .tile .v { font-size: 28px; font-weight: 800; line-height: 1.2; }
  .tile .v small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 2px; }
  .tile .d { font-size: 12px; color: var(--sub); }

  .summary-text { background: #f8fafc; border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0;
    padding: 12px 16px; margin-top: 14px; font-size: 15px; }
  .summary-text p { margin: 4px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { background: #f8fafc; color: var(--sub); font-weight: 600; font-size: 13px; white-space: nowrap; }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.c, th.c { text-align: center; }
  .lvname b { white-space: nowrap; }
  .lvname small { display: block; color: var(--sub); font-size: 12px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }

  /* 막대 */
  .meter { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .meter .track { flex: 1; height: 10px; border-radius: 5px; background: #eef1f6; position: relative; overflow: hidden; }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 5px 5px 0; background: var(--accent); }
  .meter .first { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
  .meter span { font-weight: 700; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; font-weight: 700; }
  .delta.up { color: #006300; } .delta.down { color: var(--support); } .delta.same { color: var(--muted); }

  .stack { display: flex; height: 22px; gap: 2px; border-radius: 4px; overflow: hidden; min-width: 200px; }
  .stack div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; min-width: 0; }
  .stack .reach { background: var(--reach); } .stack .effort { background: var(--effort); color: #0b0b0b; }
  .stack .support { background: var(--support); } .stack .none { background: var(--none); color: var(--sub); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--sub); margin: 0 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .badge.reach { background: var(--reach-soft); color: #006300; }
  .badge.effort { background: var(--effort-soft); color: #7a5300; }
  .badge.support { background: var(--support-soft); color: #9b1c1c; }
  .badge.none { background: #eef1f6; color: var(--sub); }
  .badge.reteach { background: var(--support); color: #fff; }
  .badge.group { background: var(--support-soft); color: #9b1c1c; }
  .badge.check { background: var(--effort-soft); color: #7a5300; }
  .badge.next { background: var(--reach-soft); color: #006300; }

  /* 문항 정답률 격자 */
  .qgrid td.q { text-align: center; font-weight: 700; font-size: 13px; min-width: 46px; position: relative; }
  .qgrid td.q.reach { background: var(--reach-soft); color: #006300; }
  .qgrid td.q.effort { background: var(--effort-soft); color: #7a5300; }
  .qgrid td.q.support { background: var(--support-soft); color: #9b1c1c; }
  .qgrid td.q.na { color: var(--muted); font-weight: 400; }
  .qgrid td.q sup { font-size: 10px; color: var(--accent); margin-left: 1px; }
  /* 학생×단계 표: 칸 = 그 단계 평균 + 시도 횟수 */
  .matrix th small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .matrix td.q { font-size: 15px; min-width: 54px; }
  .matrix td.q .tries { display: block; font-size: 11px; font-weight: 400; opacity: .8; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card .t { font-weight: 700; }
  .card .s { font-size: 13px; color: var(--sub); margin: 2px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 13px; background: #fff; white-space: nowrap; }
  .chip.support { border-color: #f1b5b5; background: var(--support-soft); }
  .chip.effort { border-color: #f3d58a; background: var(--effort-soft); }
  ul.plain { margin: 6px 0 0; padding-left: 20px; }
  ul.plain li { margin: 3px 0; }
  .muted { color: var(--sub); }
  .note { font-size: 12px; color: var(--sub); margin-top: 8px; }

  /* 학생 개인 쪽 */
  .student-page { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .student-page h5 { margin: 0 0 4px; font-size: 18px; }
  .student-page .s { color: var(--sub); font-size: 13px; margin-bottom: 8px; }
  .student-page .advice { background: #f8fafc; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 10px; }
  .wrong { font-size: 12px; color: #9b1c1c; }

  /* ---------- 청량 테마: 하늘색·민트, 넉넉한 여백, 부드러운 그림자 ---------- */
  :root {
    --bg: #eef8fd; --line: #d9ecf6; --ink: #12324a; --sub: #5b7489; --muted: #93a9ba;
    --accent: #0b8fd8; --accent-2: #14b8a6; --accent-soft: #e3f4fd; --mint-soft: #e6f8f5;
    --shadow: 0 10px 30px rgba(11, 110, 160, .08), 0 2px 6px rgba(11, 110, 160, .05);
  }
  body { background: linear-gradient(180deg, #dff3fc 0, #eef9fb 260px, #f6fbfd 100%) fixed; }
  header.bar { background: rgba(255, 255, 255, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(11, 143, 216, .14); padding: 14px 24px; }
  header.bar h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: -.3px; color: var(--ink); }
  header.bar h1 .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, #38bdf8, #2dd4bf); box-shadow: 0 4px 12px rgba(20, 184, 166, .3); }
  header.bar h1 a { color: var(--accent); font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); margin-left: 4px; }
  header.bar h1 a:hover { background: #d3edfb; }
  .who { color: var(--sub); }

  select, input[type=date], button { border-color: #cfe5f2; border-radius: 10px; padding: 8px 12px; transition: border-color .15s, box-shadow .15s, background .15s; }
  select:focus, input[type=date]:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 143, 216, .18); }
  select:hover, input[type=date]:hover { border-color: #a9d6ef; }
  button:hover:not(:disabled) { background: #f3faff; border-color: #a9d6ef; }
  button.primary { background: linear-gradient(135deg, #0ea5e9, #14b8a6); border: none; color: #fff; padding: 9px 18px;
    box-shadow: 0 6px 16px rgba(14, 165, 233, .28); }
  button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #0b95d6, #0fa596); }

  main { max-width: 1080px; padding: 24px 20px 70px; }
  .notice { border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 36px 28px; }

  .picker { border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 18px; box-shadow: var(--shadow); }
  .row { gap: 10px 16px; margin-bottom: 16px; }
  .row > label.k { color: var(--accent); font-size: 13px; letter-spacing: .5px; min-width: 40px; }
  .unit { background: linear-gradient(180deg, #f7fcff, #fbfefe); border-color: var(--line); border-radius: 14px; padding: 10px 14px 12px; }
  .unit-h { color: var(--ink); }
  .unit-h small { color: var(--muted); }
  .lvls { gap: 7px; margin-top: 10px; }
  .lv { border-color: #d7e9f3; color: var(--sub); padding: 5px 12px 5px 9px; transition: background .15s, border-color .15s, color .15s; }
  .lv:hover { border-color: #9fd8ee; }
  .lv:has(input:checked) { background: var(--mint-soft); border-color: #7fdccd; color: #0b6b62; font-weight: 600; }
  .lv:has(input:checked) small { color: #3f9c92; font-weight: 400; }
  .lv input, .unit-h input, .opts input { accent-color: var(--accent-2); width: 15px; height: 15px; }
  .actions { gap: 10px; margin-top: 6px; padding-top: 14px; border-top: 1px dashed #d4e9f4; }

  .report { border: 1px solid var(--line); border-radius: 20px; padding: 0 34px 30px; box-shadow: var(--shadow); overflow: hidden; }
  .cover { margin: 0 -34px 8px; padding: 26px 34px 18px; border-bottom: none;
    background: linear-gradient(120deg, #e0f4fe 0%, #e4faf6 100%); position: relative; }
  .cover::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #38bdf8, #2dd4bf); }
  .cover .school { color: #2f7aa6; font-weight: 600; }
  .cover h2 { color: var(--ink); }
  .flow span { background: #fff; color: var(--accent); border: 1px solid #c6e6f6; }
  section.part > h3 .no { display: inline-grid; place-items: center; min-width: 32px; height: 32px; border-radius: 10px; font-size: 16px;
    color: #fff; background: linear-gradient(135deg, #38bdf8, #2dd4bf); }
  section.part > h3 { align-items: center; }
  h4 { color: var(--ink); }

  .tiles { gap: 12px; }
  .tile { border: none; border-radius: 16px; padding: 14px 16px; background: linear-gradient(160deg, #f0f9ff, #effbf8); }
  .tile .k { color: #3c7fa6; font-weight: 600; }
  .tile .v { color: var(--ink); }
  .summary-text { background: var(--mint-soft); border-left-color: var(--accent-2); border-radius: 0 14px 14px 0; }

  .tablewrap { border-color: var(--line); border-radius: 14px; }
  th { background: #f1f9fe; color: #2f6f96; }
  th, td { border-bottom-color: #e6f2f9; }
  tbody tr:hover td { background: #f8fcff; }
  .meter .track { background: #e4f1f8; }
  .meter .fill { background: linear-gradient(90deg, #38bdf8, #14b8a6); }
  .qgrid td.q sup { color: var(--accent); }
  .card { border-color: var(--line); border-radius: 16px; background: #fbfeff; }
  .chip { border-color: #d7e9f3; border-radius: 999px; padding: 2px 10px; }
  .student-page { border-color: var(--line); border-radius: 16px; }
  .student-page .advice { background: var(--mint-soft); border-radius: 10px; }

  @media (max-width: 640px) {
    .report { padding: 0 16px 20px; }
    .cover { margin: 0 -16px 8px; padding: 20px 16px 16px; }
    header.bar { padding: 12px 16px; }
  }

  @media (max-width: 640px) {
    .report { padding: 18px 14px; }
    .cover h2 { font-size: 21px; }
  }
  /* 유창성 보고서: 학생별 소견 카드 */
  .scard { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; break-inside: avoid; }
  .scard .hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 8px; }
  .scard .hd b { font-size: 16px; }
  .scard .lab { font-weight: 700; }
  .scard ul { margin: 6px 0 10px; padding-left: 18px; font-size: 14px; }
  .scard ul li { margin: 3px 0; }
  .gapline { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; font-size: 13px; }
  .gapline span { border-radius: 999px; padding: 2px 10px; }
  .gap-above { background: var(--reach-soft); color: #0a6b0a; } .gap-near { background: #eef1f6; color: var(--sub); }
  .gap-below { background: var(--effort-soft); color: #8a5a00; } .gap-far { background: var(--support-soft); color: var(--support); font-weight: 700; }
  table.rx { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--accent-soft); border-radius: 8px; }
  table.rx th { width: 92px; text-align: left; color: var(--accent); padding: 5px 10px; font-weight: 700; vertical-align: top; }
  table.rx td { padding: 5px 10px; }
  .rxnote { margin-top: 6px; font-size: 13px; color: var(--support); }
  .grp { border-left: 4px solid var(--accent); }
  @media print {
    @page { size: A4; margin: 14mm 12mm; }
    body { background: #fff; font-size: 12px; }
    header.bar, .picker, .no-print { display: none !important; }
    main { padding: 0; max-width: none; }
    .report { border: none; padding: 0; box-shadow: none; overflow: visible; }
    .cover { margin: 0 0 8px; padding: 14px 16px 12px; }
    tbody tr:hover td { background: none; }
    section.part { break-inside: auto; }
    .tile, .card, tr, .student-page { break-inside: avoid; }
    .page-break { break-before: page; }
    .tablewrap { overflow: visible; border: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1><span class="logo">📋</span>진단분석보고서 <a href="./">← 진단시스템</a></h1>
  <div class="who">
    <span id="who"></span>
    <button id="loginBtn" class="primary hidden">선생님 로그인</button>
    <button id="logoutBtn" class="hidden">로그아웃</button>
  </div>
</header>

<main>
  <div id="msg" class="notice">불러오는 중입니다…</div>

  <div id="picker" class="picker hidden">
    <div class="row">
      <label class="k" for="cls">학급</label>
      <select id="cls"></select>
      <label class="k" for="op">영역</label>
      <select id="op"></select>
    </div>
    <div class="row" style="align-items:flex-start">
      <label class="k">범위</label>
      <div style="flex:1; min-width:260px">
        <div class="opts" style="margin-bottom:8px">
          <label><input type="checkbox" id="allLv" checked> 기록이 있는 모든 단계</label>
          <span class="muted" id="lvCount"></span>
        </div>
        <div id="units" class="units"></div>
      </div>
    </div>
    <div class="row">
      <label class="k">기간</label>
      <input type="date" id="from"> ~ <input type="date" id="to">
      <span class="muted" style="font-size:13px">비워 두면 전체 기간</span>
    </div>
    <div class="row opts">
      <label><input type="checkbox" id="showNames" checked> 이름 보기 (끄면 번호만)</label>
      <label><input type="checkbox" id="perStudent"> 학생 개인 쪽 포함 (인쇄용)</label>
    </div>
    <div class="actions">
      <button id="printBtn" disabled>🖨 인쇄 · PDF 저장</button>
      <button id="makeBtn" class="primary">보고서 만들기</button>
    </div>
  </div>

  <div id="report" class="report hidden"></div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('report_' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('report_' + k, v); } catch (e) {} }
};
function msg(html) { $('msg').innerHTML = html; $('msg').classList.remove('hidden'); }

let auth = null, am = null, scope = null, levelsByOp = [], lastData = null;

/* ---------- 로그인 ---------- */
async function boot() {
  const cfg = window.APP_CONFIG && window.APP_CONFIG.FIREBASE;
  if (!cfg || !cfg.apiKey) { msg('<b>config.js의 FIREBASE 설정이 비어 있습니다.</b><br>실시간 현황판과 같은 Firebase 설정이 필요합니다.'); return; }
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [appm, authm] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]);
  am = authm;
  auth = am.getAuth(appm.initializeApp(cfg));
  am.onAuthStateChanged(auth, (u) => {
    const user = (u && !u.isAnonymous) ? u : null;
    $('who').textContent = user ? user.email : '';
    $('loginBtn').classList.toggle('hidden', !!user);
    $('logoutBtn').classList.toggle('hidden', !user);
    $('picker').classList.add('hidden'); $('report').classList.add('hidden');
    if (user) loadScope();
    else msg('<b>선생님 계정으로 로그인해 주세요.</b><br>교사학급 시트에 등록된 선생님만, 맡은 학급의 보고서를 볼 수 있습니다.');
  });
  $('loginBtn').onclick = () => {
    const p = new am.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    am.signInWithPopup(auth, p).catch((e) => msg('<b>로그인하지 못했습니다.</b><br>' + esc(e.message)));
  };
  $('logoutBtn').onclick = () => am.signOut(auth);
}

async function token() {
  const u = auth && auth.currentUser;
  if (!u || u.isAnonymous) throw new Error('로그인이 필요합니다.');
  return { idToken: await u.getIdToken() };
}

async function call(action, ...args) {
  const res = await window.callApi(action, [await token(), ...args]);
  if (res && res.status === 'error') throw new Error(res.message);
  return res;
}

/* ---------- 학급·영역·단계 ---------- */
// 첫 화면(index.html) 영역 탭과 같은 이름·순서. 탭을 고치면 여기도 함께 고쳐 주세요.
const AREAS = ['덧셈', '뺄셈', '곱셈', '나눗셈', '혼합계산', '수의 범위·어림',
  '3학년 분수·소수', '4학년 분수·소수', '5학년 분수', '5학년 소수', '6학년 분수', '6학년 소수'];
// 유창성 훈련: 구구단·100칸 계산 — 단계 체크 없이 기간만 골라 보고서를 만듦 (서버 보고서유창성.gs의 getFluencyReport)
const FLU = ['구구단', '100칸 계산'];
const isFlu = () => FLU.includes($('op').value);
async function loadScope() {
  msg('선생님 권한을 확인하는 중입니다…');
  try { scope = await call('getReportScope'); }
  catch (e) { msg('<b>' + esc(e.message) + '</b>'); return; }
  if (!scope.classes.length) { msg('<b>볼 수 있는 학급이 없습니다.</b><br>학생명부 시트에 학급이 있는지, 교사학급 시트의 학년·반이 맞는지 확인해 주세요.'); return; }
  $('cls').innerHTML = scope.classes.map((c) =>
    `<option value="${esc(c.grade + '|' + c.classNum)}">${esc(c.grade)}학년 ${esc(c.classNum)} (${c.count}명)</option>`).join('');
  const saved = store.get('cls', '');
  if ([...$('cls').options].some((o) => o.value === saved)) $('cls').value = saved;
  $('msg').classList.add('hidden');
  $('picker').classList.remove('hidden');
  await loadLevels();
}

async function loadLevels() {
  const [g, c] = $('cls').value.split('|');
  store.set('cls', $('cls').value);
  $('op').innerHTML = '<option>불러오는 중…</option>'; $('units').innerHTML = '';
  try { levelsByOp = (await call('getReportLevels', g, c)).ops || []; }
  catch (e) { $('op').innerHTML = ''; $('units').innerHTML = '<span class="muted">' + esc(e.message) + '</span>'; return; }
  // 영역 목록은 첫 화면(index.html) 탭과 같은 이름·순서로 보여 줌. 기록이 없는 영역도 목록에 둠
  const opt = (name, o) => `<option value="${esc(name)}">${esc(name)} (${o ? o.levels.length + '단계' : '기록 없음'})</option>`;
  const find = (name) => levelsByOp.find((o) => o.operation === name);
  const old = levelsByOp.filter((o) => !AREAS.includes(o.operation));   // 예전 이름으로 저장된 기록
  $('op').innerHTML = AREAS.map((a) => opt(a, find(a))).join('') +
    `<optgroup label="유창성 훈련">${FLU.map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('')}</optgroup>` +
    (old.length ? `<optgroup label="예전 영역 이름 (기록만 남아 있음)">${old.map((o) => opt(o.operation, o)).join('')}</optgroup>` : '');
  const savedOp = store.get('op', '');
  const firstWith = AREAS.find((a) => find(a)) || (old[0] && old[0].operation) || AREAS[0];
  $('op').value = [...$('op').options].some((o) => o.value === savedOp) ? savedOp : firstWith;
  renderUnits();
}

function unitLabel(u) {
  if (!u) return '교육과정 코드 없음';
  const [g, s, n] = u.split('-');
  return `${g}학년 ${s}학기 ${n}단원`;
}

function renderUnits() {
  store.set('op', $('op').value);
  $('allLv').parentNode.parentNode.classList.toggle('hidden', isFlu());
  if (isFlu()) {
    $('units').innerHTML = `<span class="muted">${$('op').value === '구구단'
      ? '구구단은 단계(2~9단 20·40·72문항 등)를 저절로 나누어 모두 봅니다. 기간만 골라 주세요.'
      : '100칸 계산은 1~12단계(곱셈·나눗셈·덧셈·뺄셈 × 25·50·100칸)를 모두 봅니다. 기간만 골라 주세요.'}</span>`;
    return;
  }
  const op = levelsByOp.find((o) => o.operation === $('op').value);
  if (!op) { $('units').innerHTML = '<span class="muted">이 학급은 이 영역의 진단 기록이 아직 없습니다.</span>'; syncAll(); return; }
  const units = [];
  op.levels.forEach((l) => {
    let u = units.find((x) => x.unit === l.unit);
    if (!u) units.push(u = { unit: l.unit, levels: [] });
    u.levels.push(l);
  });
  $('units').innerHTML = units.map((u, i) => `
    <div class="unit">
      <label class="unit-h"><input type="checkbox" data-unit="${i}" checked> ${esc(unitLabel(u.unit))}
        <small>${u.levels.map((l) => l.no).join('·')}단계</small></label>
      <div class="lvls">${u.levels.map((l) => `
        <label class="lv" title="${esc(l.level)}"><input type="checkbox" data-u="${i}" value="${esc(l.level)}" checked>
          ${l.no}단계 <small>${esc(l.code)} · ${l.students}명</small></label>`).join('')}</div>
    </div>`).join('');
  $('units').querySelectorAll('[data-unit]').forEach((cb) => {
    cb.onchange = () => { $('units').querySelectorAll(`[data-u="${cb.dataset.unit}"]`).forEach((x) => { x.checked = cb.checked; }); syncAll(); };
  });
  $('units').querySelectorAll('[data-u]').forEach((cb) => {
    cb.onchange = () => {
      const sib = [...$('units').querySelectorAll(`[data-u="${cb.dataset.u}"]`)];
      $('units').querySelector(`[data-unit="${cb.dataset.u}"]`).checked = sib.some((x) => x.checked);
      syncAll();
    };
  });
  syncAll();
}

function picked() { return [...$('units').querySelectorAll('[data-u]')].filter((x) => x.checked).map((x) => x.value); }
function syncAll() {
  const all = [...$('units').querySelectorAll('[data-u]')];
  $('allLv').checked = all.length > 0 && all.every((x) => x.checked);
  $('lvCount').textContent = `${picked().length} / ${all.length}단계 선택`;
}
$('allLv').onchange = () => { $('units').querySelectorAll('input').forEach((x) => { x.checked = $('allLv').checked; }); syncAll(); };
$('cls').onchange = loadLevels;
$('op').onchange = renderUnits;

/* ---------- 보고서 만들기 ---------- */
$('makeBtn').onclick = async () => {
  if (isFlu()) return makeFlu();
  const levels = picked();
  if (!$('op').value) { alert('영역을 골라 주세요.'); return; }
  if (!levels.length) { alert('단계를 하나 이상 골라 주세요.'); return; }
  const [grade, classNum] = $('cls').value.split('|');
  $('makeBtn').disabled = true; $('makeBtn').textContent = '만드는 중…';
  try {
    lastData = await call('getReportData', { grade, classNum, operation: $('op').value, levels, from: $('from').value, to: $('to').value });
    render();
    $('printBtn').disabled = false;
    $('report').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    $('report').classList.remove('hidden');
    $('report').innerHTML = '<div class="notice"><b>보고서를 만들지 못했습니다.</b><br>' + esc(e.message) + '</div>';
  } finally {
    $('makeBtn').disabled = false; $('makeBtn').textContent = '보고서 만들기';
  }
};
$('printBtn').onclick = () => window.print();
$('showNames').checked = store.get('names', '1') === '1';
$('showNames').onchange = () => { store.set('names', $('showNames').checked ? '1' : '0'); if (lastData) (lastData.kind ? renderFlu() : render()); };
$('perStudent').onchange = () => { if (lastData) (lastData.kind ? renderFlu() : render()); };

/* ---------- 그리기 ---------- */
const BAND = { reach: '도달', effort: '노력 중', support: '보충 필요' };
function who(d, num) {
  const s = d.students.find((x) => x.num === num);
  return $('showNames').checked && s && s.name ? `${num}번 ${s.name}` : `${num}번`;
}
function chips(d, nums, cls) { return nums.length ? `<div class="chips">${nums.map((n) => `<span class="chip ${cls || ''}">${esc(who(d, n))}</span>`).join('')}</div>` : '<span class="muted">없음</span>'; }
function lvShort(L) { return `${L.no}단계${L.code ? ' (' + L.code + ')' : ''}`; }
function lvDesc(level) { const i = String(level).indexOf(':'); return i === -1 ? '' : String(level).slice(i + 1).trim(); }
function bandOf(score, sc) { return score == null ? 'none' : score >= sc.reach ? 'reach' : score < sc.support ? 'support' : 'effort'; }
function delta(a, b) {
  if (a == null || b == null) return '';
  const d = b - a;
  return d > 0 ? `<span class="delta up">▲${d}</span>` : d < 0 ? `<span class="delta down">▼${-d}</span>` : '<span class="delta same">±0</span>';
}
// 막대 = 이 단계의 평균, 세로선 = 이 단계의 첫 시도 평균 (언제나 한 단계 안에서만)
function meter(first, value) {
  if (value == null) return '<span class="muted">—</span>';
  return `<div class="meter" title="이 단계 평균 ${value}점 · 첫 시도 평균 ${first}점">
    <div class="track"><div class="fill" style="width:${value}%"></div>${first != null ? `<div class="first" style="left:calc(${first}% - 1px)"></div>` : ''}</div>
    <span>${value}</span></div>`;
}
const BASIS_TEXT = (sc) => sc.basis === '최근' ? '마지막 시도 점수' : '그 단계 모든 시도의 평균';
// 서버가 예전 보고서.gs이면(단계 평균 없음) 섞인 평균을 보여 주지 않도록 막음
function needsNewServer(d) { return !d.levels.every((L) => 'avg' in L); }
function fmtSec(s) { if (s == null) return '—'; const m = Math.floor(s / 60); return m ? `${m}분 ${s % 60}초` : `${s}초`; }
function fmtRange(d) {
  const s = d.scope;
  const a = s.from || s.firstDay, b = s.to || s.lastDay;
  return a || b ? `${a || '처음'} ~ ${b || '오늘'}` : '전체 기간';
}

function render() {
  const d = lastData, sc = d.scope, sm = d.summary;
  const tested = d.levels.filter((L) => L.tested);
  const unitSet = [...new Set(d.levels.map((L) => L.unit))].map(unitLabel);
  const nos = d.levels.map((L) => L.no);
  const r = $('report');
  r.classList.remove('hidden');

  if (!tested.length) {
    r.innerHTML = `<div class="notice"><b>선택한 범위에 진단 기록이 없습니다.</b><br>${esc(sc.grade)}학년 ${esc(sc.classNum)} · ${esc(sc.operation)} · ${esc(fmtRange(d))}</div>`;
    return;
  }
  if (needsNewServer(d)) {
    r.innerHTML = `<div class="notice"><b>서버(Apps Script)의 보고서.gs가 아직 예전 버전입니다.</b><br>예전 버전은 여러 단계를 합친 평균을 내므로 보고서를 만들지 않았습니다.<br>보고서.gs를 새 파일로 바꾸고 새 버전으로 배포한 뒤 다시 만들어 주세요.</div>`;
    return;
  }

  /* 한 줄 요약 문장 (규칙으로 만듦) — 평균은 언제나 단계별로만 말함 */
  const weak = d.weak.filter((w) => w.avg < sc.reach);
  const lines = [];
  lines.push(`재적 ${sm.enrolled}명 중 <b>${sm.testedStudents}명</b>이 ${d.levels.length}개 단계를 진단했습니다. 점수는 단계마다 따로 계산하며, 도달 판정은 <b>${BASIS_TEXT(sc)}</b>으로 합니다.`);
  if (sm.notReached) lines.push(`학생×단계 ${sm.pairs}건 중 <b>${sm.notReached}건</b>이 아직 도달하지 못했습니다. 누가 어느 단계에서 막혔는지는 Ⅳ 학생×단계 표에서 확인합니다.`);
  else lines.push('진단한 모든 학생이 진단한 모든 단계에 도달했습니다.');
  if (weak.length) lines.push(`학급 단계 평균이 가장 낮은 단계는 <b>${weak.map((w) => `${w.no}단계(평균 ${w.avg}점)`).join(', ')}</b>입니다.`);
  else lines.push('모든 단계의 학급 단계 평균이 도달 기준 이상입니다.');
  const reteach = d.levels.filter((L) => L.action.kind === 'reteach');
  if (reteach.length) lines.push(`<b>${reteach.map((L) => L.no + '단계').join(', ')}</b>는 도달 학생이 절반이 안 되어 학급 전체 재지도가 필요합니다.`);

  r.innerHTML = `
  <div class="cover">
    <div class="school">${esc(d.meta.schoolName)} ${esc(d.meta.schoolYear)}학년도 · 초등수학 연산영역 진단시스템</div>
    <h2>${esc(sc.grade)}학년 ${esc(sc.classNum)} · ${esc(sc.operation)} 진단분석보고서</h2>
    <div class="meta">
      <span>범위: ${esc(unitSet.join(', '))} · ${nos.length ? Math.min(...nos) + '~' + Math.max(...nos) + '단계 중 ' + nos.length + '개' : ''}</span>
      <span>기간: ${esc(fmtRange(d))}</span>
      <span>작성: ${esc(d.meta.made)} · ${esc(d.meta.email)}</span>
    </div>
    <div class="flow"><span>Ⅰ 진단</span><i>→</i><span>Ⅱ 분석</span><i>→</i><span>Ⅲ 처방</span><i>→</i><span>Ⅳ 학생별</span></div>
  </div>

  <section class="part">
    <h3><span class="no">Ⅰ</span> 진단 — 어디까지 왔나</h3>
    <p class="lead">도달 ${sc.reach}점 이상 · 노력 중 ${sc.support}~${sc.reach - 1}점 · 보충 필요 ${sc.support}점 미만. 학생마다 <b>단계별로 따로</b> ${BASIS_TEXT(sc)}으로 판단합니다. 여러 단계를 합친 평균은 내지 않습니다.</p>
    <div class="tiles">
      <div class="tile"><div class="k">응시 학생</div><div class="v">${sm.testedStudents}<small>/ ${sm.enrolled}명</small></div><div class="d">진단 ${sm.attempts}회 · ${d.levels.length}개 단계</div></div>
      <div class="tile"><div class="k">미도달 (학생×단계)</div><div class="v">${sm.notReached}<small>/ ${sm.pairs}건</small></div><div class="d">노력 중 + 보충 필요</div></div>
      <div class="tile"><div class="k">학급 전체 재지도</div><div class="v">${sm.reteachLevels}<small>개 단계</small></div><div class="d">도달 학생이 절반 미만인 단계</div></div>
      <div class="tile"><div class="k">도움 요청</div><div class="v">${sm.helpTotal}<small>회</small></div><div class="d">🤔 모르겠어요 + 🙋 확인해 주세요</div></div>
    </div>
    <div class="summary-text">${lines.map((l) => `<p>${l}</p>`).join('')}</div>

    <h4>단계별 결과 <small>막대 = 이 단계 학급 평균(학생별 단계 평균의 평균), 세로선 = 이 단계 첫 시도 평균</small></h4>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th class="n">응시</th><th>단계 평균</th><th class="n">첫 시도 → 마지막</th><th class="n">도달률</th><th class="n">평균 시간</th><th class="n">평균 시도</th></tr></thead>
      <tbody>${d.levels.map((L) => `<tr>
        <td class="lvname"><b>${esc(lvShort(L))}</b><small>${esc(lvDesc(L.level))}</small></td>
        <td class="n">${L.tested}/${L.enrolled}</td>
        <td>${meter(L.firstAvg, L.avg)}</td>
        <td class="n">${L.firstAvg} → ${L.latestAvg} ${delta(L.firstAvg, L.latestAvg)}</td>
        <td class="n"><span class="badge ${bandOf(L.reachRate, { reach: 80, support: 50 })}">${L.reachRate}%</span></td>
        <td class="n">${fmtSec(L.avgSec)}</td>
        <td class="n">${L.avgTries}회</td></tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="part">
    <h3><span class="no">Ⅱ</span> 분석 — 어디서 막히나</h3>
    <p class="lead">단계별 성취 수준의 분포와, 문항마다 학생들이 맞힌 비율을 봅니다.</p>

    <h4>단계별 성취 분포</h4>
    <div class="legend"><span><i style="background:var(--reach)"></i>도달</span><span><i style="background:var(--effort)"></i>노력 중</span><span><i style="background:var(--support)"></i>보충 필요</span><span><i style="background:var(--none)"></i>미응시</span></div>
    <div class="tablewrap"><table>
      <tbody>${d.levels.map((L) => {
        const segs = [['reach', L.dist.reach], ['effort', L.dist.effort], ['support', L.dist.support], ['none', L.notTested]];
        const tot = L.enrolled || L.tested || 1;
        // 마우스를 올리면: 노력 중·보충 필요는 학생과 그 단계 평균, 미응시는 학생 (도달은 인원만)
        const tip = (kind, nums) => {
          const head = `${kind === 'none' ? '미응시' : BAND[kind]} ${nums.length}명 (${Math.round(nums.length * 100 / tot)}%)`;
          if (kind === 'reach') return head;
          return [head + ':', ...nums.map((n) => {
            if (kind === 'none') return who(d, n);
            const s = d.students.find((x) => x.num === n);
            const l = s && s.levels.find((x) => x.level === L.level);
            return `${who(d, n)}${l ? ` — 평균 ${l.avg}점 (${l.scores.join('·')})` : ''}`;
          })].join('\n');
        };
        return `<tr><td class="lvname" style="width:32%"><b>${esc(lvShort(L))}</b><small>${esc(lvDesc(L.level))}</small></td>
          <td><div class="stack">${segs.filter((s) => s[1].length).map((s) => `<div class="${s[0]}" style="flex:${s[1].length}" title="${esc(tip(s[0], s[1])).replace(/\n/g, '&#10;')}">${s[1].length}</div>`).join('')}</div></td></tr>`;
      }).join('')}</tbody>
    </table></div>

    <h4>문항별 정답률 <small>최근 결과 기준 · <sup>●</sup>숫자 = 그 문항의 도움 요청 수</small></h4>
    ${(() => {
      const nQ = Math.max(0, ...d.levels.map((L) => L.items.length));
      if (!nQ) return '<p class="muted">문항별 기록이 없습니다.</p>';
      return `<div class="tablewrap"><table class="qgrid"><thead><tr><th>단계</th>${Array.from({ length: nQ }, (_, i) => `<th class="c">${i + 1}번</th>`).join('')}</tr></thead>

          return `<td class="q ${bandOf(it.rate, sc)}" title="${L.no}단계 ${it.q}번: ${it.n}명 중 ${Math.round(it.rate * it.n / 100)}명 정답${it.help ? ', 도움 요청 ' + it.help + '회' : ''}">${it.rate}%${it.help ? `<sup>●${it.help}</sup>` : ''}</td>`;
        }).join('')}</tr>`).join('')}</tbody></table></div>`;
    })()}

    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="t">오답이 몰린 문항</div><div class="s">정답률 60% 미만, 3명 이상 응시한 문항</div>
        ${d.hotItems.length ? `<ul class="plain">${d.hotItems.map((h) => `<li><b>${h.no}단계 ${h.q}번</b> — 정답률 ${h.rate}% (${h.n}명)${h.help ? ` · 도움 요청 ${h.help}회` : ''}</li>`).join('')}</ul>` : '<span class="muted">해당 문항이 없습니다.</span>'}
      </div>
      <div class="card"><div class="t">도움 요청이 많은 단계</div><div class="s">학생이 문제 옆 버튼을 누른 횟수</div>
        ${(() => { const h = d.levels.filter((L) => L.help.total).sort((a, b) => b.help.total - a.help.total).slice(0, 5);
          return h.length ? `<ul class="plain">${h.map((L) => `<li><b>${L.no}단계</b> — ${L.help.total}회 (모르겠어요 ${L.help.unknown} · 확인해 주세요 ${L.help.check})</li>`).join('')}</ul>` : '<span class="muted">도움 요청이 없습니다.</span>'; })()}
      </div>
    </div>
  </section>

  <section class="part">
    <h3><span class="no">Ⅲ</span> 처방 — 무엇을 할까</h3>
    <p class="lead">도달 학생이 절반 미만이면 학급 전체 재지도, 보충 필요 학생이 있으면 소그룹, 노력 중 학생만 있으면 개별 확인으로 판단합니다.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th>지도 방안</th><th>대상 학생</th></tr></thead>
      <tbody>${d.levels.slice().sort((a, b) => (a.avg ?? 999) - (b.avg ?? 999) || a.no - b.no).map((L) => {
        let target;
        if (L.action.kind === 'reteach') target = '<span class="muted">학급 전체</span>' + (L.dist.support.length ? `<div style="margin-top:4px">특히 ${chips(d, L.dist.support, 'support')}</div>` : '');
        else if (L.action.kind === 'group') target = chips(d, L.dist.support, 'support') + (L.dist.effort.length ? `<div style="margin-top:4px">${chips(d, L.dist.effort, 'effort')}</div>` : '');
        else if (L.action.kind === 'check') target = chips(d, L.dist.effort, 'effort');
        else target = '<span class="muted">—</span>';
        const weakQ = L.items.filter((it) => it.n >= 3 && it.rate != null && it.rate < 60).map((it) => it.q + '번');
        return `<tr><td class="lvname"><b>${esc(lvShort(L))}</b><small>${esc(lvDesc(L.level))}</small></td>
          <td><span class="badge ${L.action.kind}">${esc(L.action.text)}</span>${weakQ.length ? `<div class="note">다시 설명할 문항: ${weakQ.join(', ')}</div>` : ''}</td>
          <td>${target}</td></tr>`;
      }).join('')}</tbody>
    </table></div>

    ${d.groups.length ? `<h4>보충 지도 묶음 <small>같은 단계에서 ${sc.support}점 미만인 학생</small></h4>
    <div class="cards">${d.groups.map((g) => { const L = d.levels.find((x) => x.level === g.level);
      return `<div class="card"><div class="t">${g.no}단계 보충 (${g.nums.length}명)</div><div class="s">${esc(lvDesc(g.level))}</div>${chips(d, g.nums, 'support')}</div>`; }).join('')}</div>` : ''}

    ${(() => { const nt = d.students.filter((s) => s.inRoster && !s.tested);
      return nt.length ? `<h4>진단하지 않은 학생 <small>선택한 범위에 기록이 하나도 없음</small></h4>${chips(d, nt.map((s) => s.num))}` : ''; })()}
  </section>

  <section class="part">
    <h3><span class="no">Ⅳ</span> 학생×단계 진단표</h3>
    <p class="lead">칸마다 그 학생의 <b>그 단계 평균</b>(모든 시도의 평균)과 시도 횟수입니다. 색은 ${esc(BASIS_TEXT(sc))}으로 판정한 도달·노력 중·보충 필요입니다. 빨간 칸이 그 학생이 넘지 못한 차시입니다.</p>
    <div class="legend"><span><i style="background:var(--reach)"></i>도달</span><span><i style="background:var(--effort)"></i>노력 중</span><span><i style="background:var(--support)"></i>보충 필요</span><span>— 미응시</span></div>
    <div class="tablewrap"><table class="qgrid matrix">
      <thead><tr><th>학생</th>${d.levels.map((L) => `<th class="c" title="${esc(L.level)}">${L.no}단계${L.code ? `<small>${esc(L.code)}</small>` : ''}</th>`).join('')}<th>지도 방안</th></tr></thead>
      <tbody>${d.students.map((s) => `<tr>
        <td style="white-space:nowrap"><b>${esc(who(d, s.num))}</b></td>
        ${d.levels.map((L) => {
          const l = s.levels.find((x) => x.level === L.level);
          if (!l) return '<td class="q na">—</td>';
          return `<td class="q ${l.band}" title="${L.no}단계 · 시도 점수 ${l.scores.join(', ')} · 평균 ${l.avg}점 · ${BAND[l.band]}">${l.avg}<span class="tries">${l.tries}회</span></td>`;
        }).join('')}
        <td style="font-size:13px; min-width:220px">${esc(s.advice)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${$('perStudent').checked ? studentPages(d) : ''}
  </section>
  <p class="note">이 보고서는 연산진단시스템의 평가데이터(종합평가결과·도움요청 시트)로 자동 작성되었습니다. 지도 방안은 점수 기준에 따른 제안이므로 학생 관찰과 함께 판단해 주세요.</p>`;
}

function studentPages(d) {
  const sc = d.scope;
  return d.students.filter((s) => s.tested).map((s, i) => `
    <div class="student-page ${i === 0 ? 'page-break' : ''}">
      <h5>${esc(who(d, s.num))}</h5>
      <div class="s">${esc(sc.grade)}학년 ${esc(sc.classNum)} · ${esc(sc.operation)} · 진단 ${s.tested}개 단계 · 도달 ${s.reach}개 단계 · 판정: ${esc(BASIS_TEXT(sc))}</div>
      <div class="tablewrap"><table>
        <thead><tr><th>단계</th><th>시도 점수 (순서대로)</th><th class="n">단계 평균</th><th class="n">시도</th><th>수준</th><th>마지막에 틀린 문항</th></tr></thead>
        <tbody>${s.levels.map((l) => `<tr>
          <td class="lvname"><b>${l.no}단계${l.code ? ' (' + esc(l.code) + ')' : ''}</b><small>${esc(lvDesc(l.level))}</small></td>
          <td style="white-space:nowrap">${l.scores.join(' → ')} ${delta(l.first, l.latest)}</td><td class="n"><b>${l.avg}</b></td><td class="n">${l.tries}회</td>
          <td><span class="badge ${l.band}">${BAND[l.band]}</span></td>
          <td class="wrong">${l.wrong.length ? l.wrong.join(', ') + '번' : '<span class="muted">없음</span>'}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="advice">💡 ${esc(s.advice)}</div>
    </div>`).join('');
}

/* ---------- 유창성 훈련 보고서 (구구단 · 100칸 계산) ---------- */
async function makeFlu() {
  const [grade, classNum] = $('cls').value.split('|');
  $('makeBtn').disabled = true; $('makeBtn').textContent = '만드는 중…';
  try {
    lastData = await call('getFluencyReport', { grade, classNum, kind: $('op').value, from: $('from').value, to: $('to').value });
    renderFlu();
    $('printBtn').disabled = false;
    $('report').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    $('report').classList.remove('hidden');
    const m = /알 수 없는 요청|아직 설치되지/.test(e.message) ? '서버에 유창성 보고서 파일(보고서유창성.gs)이 아직 설치되지 않았습니다.' : e.message;
    $('report').innerHTML = '<div class="notice"><b>보고서를 만들지 못했습니다.</b><br>' + esc(m) + '</div>';
  } finally {
    $('makeBtn').disabled = false; $('makeBtn').textContent = '보고서 만들기';
  }
}
const STATUS = { master: '마스터', pass: '통과', practice: '연습 중' };
const STCLS = { master: 'reach', pass: 'effort', practice: 'support' };
function fmtS(v, unit) { return v == null ? '—' : v + (unit || '초'); }
function fluRange(d) { const sc = d.scope; return (sc.from || sc.to) ? `${sc.from || '처음'} ~ ${sc.to || '오늘'}` : (sc.firstDay ? `전체 기간 (${sc.firstDay} ~ ${sc.lastDay})` : '전체 기간'); }
function fluCover(d, title, parts) {
  const sc = d.scope;
  return `<div class="cover">
    <div class="school">${esc(d.meta.schoolName)} ${esc(d.meta.schoolYear)}학년도 · 초등수학 연산영역 진단시스템 · 유창성 훈련</div>
    <h2>${esc(sc.grade)}학년 ${esc(sc.classNum)} · ${esc(title)} 분석보고서</h2>
    <div class="meta"><span>기간: ${esc(fluRange(d))}</span><span>작성: ${esc(d.meta.made)} · ${esc(d.meta.email)}</span></div>
    <div class="flow">${parts.map((p, i) => `<span>${p}</span>${i < parts.length - 1 ? '<i>→</i>' : ''}`).join('')}</div>
  </div>`;
}
function stageRow(x, unit) {
  const gain = x.timeGain == null ? '<span class="muted">—</span>' : (x.timeGain > 0 ? `<b style="color:var(--reach)">${x.timeGain}${unit} 빨라짐</b>` : `${-x.timeGain}${unit} 느려짐`) + ` <small class="muted">(${x.gainN}명)</small>`;
  return `<td class="n">${x.tested}/${x.enrolled}</td>
    <td class="n">${x.firstScore ?? '—'} → ${x.latestScore ?? '—'}점</td>
    <td class="n">${fmtS(x.firstTime, unit)} → ${fmtS(x.latestTime, unit)}</td>
    <td class="n">${gain}</td>
    <td class="n"><span class="badge reach">${x.master.length}</span> / <span class="badge effort">${x.pass.length}</span> / <span class="badge support">${x.practice.length}</span></td>
    <td class="n">${x.tries}회</td>`;
}
function renderFlu() {
  const d = lastData, r = $('report');
  r.classList.remove('hidden');
  if (!d.summary.tested) {
    r.innerHTML = `<div class="notice"><b>선택한 기간에 ${esc(d.kind)} 기록이 없습니다.</b><br>${esc(d.scope.grade)}학년 ${esc(d.scope.classNum)} · ${esc(fluRange(d))}</div>`;
    return;
  }
  r.innerHTML = d.kind === '구구단' ? fluGuguHtml(d) : fluHundredHtml(d);
}

function fluGuguHtml(d) {
  const sc = d.scope, sm = d.summary;
  const map = {}; d.facts.forEach((f) => { map[f.a + 'x' + f.b] = f; });
  const cls = (f) => f.wrongRate >= 30 ? 'support' : f.wrongRate >= 10 ? 'effort' : 'reach';
  const lines = [`재적 ${sm.enrolled}명 중 <b>${sm.tested}명</b>이 구구단을 연습했습니다. 통과 기준은 <b>정답률 ${sc.pass.score}% 이상 + ${sc.pass.sec}초 안 정답 ${sc.pass.fast}% 이상</b>, 마스터는 서로 다른 ${sc.masterDays}일 통과입니다.`];
  if (d.hot.length) lines.push(`학급에서 가장 많이 틀린 문항은 <b>${d.hot.slice(0, 3).map((f) => `${f.a}×${f.b}(오답률 ${f.wrongRate}%)`).join(', ')}</b>입니다.`);

  return fluCover(d, '구구단', ['Ⅰ 진단', 'Ⅱ 분석', 'Ⅲ 지도 그룹', 'Ⅳ 학생별 처방']) + `

    <div class="tiles">
      <div class="tile"><div class="k">연습한 학생</div><div class="v">${sm.tested}<small>/ ${sm.enrolled}명</small></div><div class="d">단계 기록 ${sm.attempts}회</div></div>
      <div class="tile"><div class="k">문항 기록</div><div class="v">${sm.itemRows}<small>문항</small></div><div class="d">'구구단문항' 탭 (11/13부터)</div></div>
      <div class="tile"><div class="k">다시 외우기</div><div class="v">${sm.relearn}<small>명</small></div><div class="d">틀린 답이 굳었거나 모르는 문항</div></div>
      <div class="tile"><div class="k">빠르기 연습</div><div class="v">${sm.speed}<small>명</small></div><div class="d">정확하지만 ${sc.pass.sec}초를 넘김</div></div>
    </div>
    <div class="summary-text">${lines.map((l) => `<p>${l}</p>`).join('')}</div>
    <h4>단계별 결과 <small>시간 = 정답 반응시간 중앙값 · 빨라짐 = 첫 기록 → 가장 빠른 기록(2번 이상 푼 학생)</small></h4>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th class="n">연습</th><th class="n">점수 첫→최근</th><th class="n">반응시간 첫→최근</th><th class="n">빨라진 정도</th><th class="n">마스터/통과/연습 중</th><th class="n">기록</th></tr></thead>
      <tbody>${d.stages.map((x) => `<tr><td class="lvname"><b>${esc(x.stage)}</b></td>${stageRow(x, '초')}</tr>`).join('')}</tbody>

  </section>

  <section class="part">

    ${d.facts.length ? `<div class="tablewrap"><table class="qgrid matrix"><thead><tr><th>×</th>${[1,2,3,4,5,6,7,8,9].map((b) => `<th class="c">${b}</th>`).join('')}</tr></thead>
      <tbody>${[2,3,4,5,6,7,8,9].map((a) => `<tr><td class="lvname"><b>${a}단</b></td>${[1,2,3,4,5,6,7,8,9].map((b) => {

      }).join('')}</tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">이 기간에 문항별 기록이 없습니다. 문항별 기록은 \'구구단문항\' 탭이 생긴 2026-11-13부터 쌓입니다.</p>'}
    <div class="cards" style="margin-top:14px">

        ${d.hot.length ? `<ul class="plain">${d.hot.map((f) => `<li><b>${f.a}×${f.b}=${f.ans}</b> — 오답률 ${f.wrongRate}% (${f.students}명)${f.topWrong.length ? ` · 자주 한 답 ${f.topWrong.map((t) => `<b>${t.v}</b>${t.type ? ' (' + esc(t.type) + ')' : ''}`).join(', ')}` : ''}</li>`).join('')}</ul>` : '<span class="muted">해당 문항이 없습니다.</span>'}</div>
      <div class="card"><div class="t">느린 문항</div><div class="s">정답일 때 평균 반응시간이 긴 순서</div>
        ${d.slow.length ? `<ul class="plain">${d.slow.map((f) => `<li><b>${f.a}×${f.b}</b> — 평균 ${f.avgRt}초 (${f.n}회)</li>`).join('')}</ul>` : '<span class="muted">기록이 부족합니다.</span>'}</div>
    </div>

    ${groupCards(d)}
  </section>

    <h3><span class="no">Ⅳ</span> 학생별 진단 소견과 처방</h3>
    <p class="lead">학생마다 <b>어떠한지(유형) → 근거 → 무엇을, 하루 몇 번, 며칠 동안, 언제 다시 확인할지</b>를 적었습니다.</p>
    ${d.rules ? studentCards(d) + rulesTable(d) : '<div class="notice"><b>서버의 보고서유창성.gs가 예전 버전입니다.</b><br>새 파일로 바꾸고 새 버전으로 배포하면 학생별 소견과 처방이 나옵니다.</div>'}
  </section>
  <p class="note">이 보고서는 '구구단'·'구구단문항' 시트로 자동 작성되었습니다. 음성 인식 오류로 오답 처리된 문항이 있을 수 있으니 학생 관찰과 함께 판단해 주세요.</p>`;
}

function fluHundredHtml(d) {
  const sc = d.scope, sm = d.summary;
  const short = (s) => s.replace(/^\d+단계: /, '');
  const lines = [`재적 ${sm.enrolled}명 중 <b>${sm.tested}명</b>이 100칸 계산을 연습했습니다 (모두 ${sm.attempts}회). 마스터는 한 단계를 서로 다른 ${sc.masterDays}일에 통과한 것입니다.`];
  if (!sc.hasRule) lines.push('<b>서버에서 단계별 통과 기준을 읽지 못해</b> 통과·마스터를 판정하지 않았습니다.');
  const weak = d.stages.filter((x) => x.tested && x.practice.length > x.tested / 2);
  if (weak.length) lines.push(`연습 중인 학생이 절반이 넘는 단계: <b>${weak.map((x) => x.no + '단계').join(', ')}</b>`);
  return fluCover(d, '100칸 계산', ['Ⅰ 진단', 'Ⅱ 분석', 'Ⅲ 지도 그룹', 'Ⅳ 학생별 처방']) + `
  <section class="part">
    <h3><span class="no">Ⅰ</span> 진단 — 어디까지 왔나</h3>
    <p class="lead">12단계를 <b>단계마다 따로</b> 봅니다. 점수·시간은 학생마다 첫 기록과 최근 기록을 하나씩 정해 평균합니다.</p>
    <div class="tiles">
      <div class="tile"><div class="k">연습한 학생</div><div class="v">${sm.tested}<small>/ ${sm.enrolled}명</small></div><div class="d">모두 ${sm.attempts}회</div></div>
      <div class="tile"><div class="k">연습한 단계</div><div class="v">${d.stages.filter((x) => x.tested).length}<small>/ 12단계</small></div><div class="d">한 명이라도 푼 단계</div></div>
    </div>
    <div class="summary-text">${lines.map((l) => `<p>${l}</p>`).join('')}</div>
    <h4>단계별 결과 <small>빨라짐 = 첫 기록 → 가장 빠른 기록(2번 이상 푼 학생, 통과 점수 이상만)</small></h4>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th class="n">연습</th><th class="n">점수 첫→최근</th><th class="n">시간 첫→최근</th><th class="n">빨라진 정도</th><th class="n">마스터/통과/연습 중</th><th class="n">기록</th></tr></thead>
      <tbody>${d.stages.map((x) => `<tr><td class="lvname"><b>${x.no}단계</b><small>${esc(short(x.stage))}${x.rule ? ` · 기준 ${x.rule.minScore}점·${x.rule.maxSec}초` : ''}</small></td>${x.tested ? stageRow(x, '초') : '<td class="n">0/' + x.enrolled + '</td><td colspan="5" class="muted">기록 없음</td>'}</tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="part">
    <h3><span class="no">Ⅱ</span> 분석 — 어디서 막히나</h3>
    <p class="lead">단계마다 여러 학생이 틀린 셈입니다. 괄호 안은 가장 많이 쓴 오답(?는 비워 둠)입니다.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>단계</th><th>자주 틀린 셈</th></tr></thead>
      <tbody>${d.stages.filter((x) => x.tested).map((x) => `<tr><td class="lvname"><b>${x.no}단계</b><small>${esc(short(x.stage))}</small></td>
        <td style="font-size:13px">${x.hotWrong.length ? x.hotWrong.map((w) => `<b>${esc(w.expr)}</b>${w.top ? ' (' + esc(w.top) + ')' : ''} ${w.students}명`).join(' · ') : '<span class="muted">없음</span>'}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="part">
    <h3><span class="no">Ⅲ</span> 처방 — 지도 그룹과 학생×단계</h3>
    ${groupCards(d)}
    <p class="lead">칸마다 그 학생의 <b>최고 점수와 가장 빠른 시간</b>입니다. 초록 마스터 · 노랑 통과 · 빨강 연습 중 · — 미응시. 다음 단계는 연습 중인 단계부터, 없으면 아직 안 한 첫 단계입니다.</p>
    <div class="legend"><span><i style="background:var(--reach)"></i>마스터</span><span><i style="background:var(--effort)"></i>통과</span><span><i style="background:var(--support)"></i>연습 중</span><span>— 미응시</span></div>
    <div class="tablewrap"><table class="qgrid matrix">
      <thead><tr><th>학생</th>${d.stages.map((x) => `<th class="c" title="${esc(x.stage)}">${x.no}<small>${esc(short(x.stage).replace('칸', ''))}</small></th>`).join('')}<th>다음 할 일</th></tr></thead>
      <tbody>${d.students.map((s) => `<tr><td style="white-space:nowrap"><b>${esc(who(d, s.num))}</b></td>
        ${s.cells.map((c) => c ? `<td class="q ${STCLS[c.status]}" title="${esc(c.stage)} · ${c.tries}회 · 최고 ${c.bestScore}점 · 가장 빠른 ${fmtS(c.bestSec)} · ${STATUS[c.status]}">${c.bestScore}<span class="tries">${c.bestSec == null ? c.latestSec + '초' : c.bestSec + '초'}</span></td>` : '<td class="q na">—</td>').join('')}
        <td style="font-size:13px; min-width:200px">${esc(s.advice)}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>
  <section class="part page-break">
    <h3><span class="no">Ⅳ</span> 학생별 진단 소견과 처방</h3>
    <p class="lead">학생마다 <b>어떠한지(유형) → 근거 → 어느 단계를, 하루 몇 번, 며칠 동안, 언제 다시 확인할지</b>를 적었습니다.</p>
    ${d.rules ? studentCards(d) + rulesTable(d) : '<div class="notice"><b>서버의 보고서유창성.gs가 예전 버전입니다.</b><br>새 파일로 바꾸고 새 버전으로 배포하면 학생별 소견과 처방이 나옵니다.</div>'}
  </section>
  <p class="note">이 보고서는 '100칸계산' 시트로 자동 작성되었습니다.</p>`;
}

/* ---------- 학생별 소견·처방 (유창성) ---------- */
const TYPE_CLS = { unlearned: 'support', stuck: 'support', fixed: 'support', accuracy: 'effort', partial: 'effort', slow: 'effort', speed: 'effort', next: 'reach', auto: 'reach', done: 'reach', none: 'none' };
const TREND_TXT = { up: '향상 중', flat: '정체', down: '하락', keep: '유지', early: '' };
const GAP_TXT = { above: '평균보다 좋음', near: '평균 근처', below: '조금 아래', far: '많이 떨어짐' };
function gapChips(p) {
  const g = p.gap; if (!g) return '';
  const items = [['정답률', g.acc, '%'], ['반응시간', g.med, '초'], ['점수', g.score, '점'], ['시간', g.sec, '초']].filter((x) => x[1]);
  if (!items.length) return '';
  return `<div class="gapline"><span class="muted" style="padding-left:0">반 평균과의 거리${g.stage ? ' (' + esc(g.stage.replace(/^\d+단계: /, '')) + ')' : ''}:</span>${items.map(([k, x, u]) =>
    `<span class="gap-${x.band}" title="반 평균 ${x.avg}${u}, 표준편차 ${x.sd}${u}">${k} ${x.value}${u} · ${x.total}명 중 ${x.rank}번째 · ${GAP_TXT[x.band]}</span>`).join('')}</div>`;
}
function rxTable(rx) {
  return `<table class="rx"><tbody>
    <tr><th>무엇을</th><td>${esc(rx.what)}</td></tr>
    <tr><th>얼마나 자주</th><td>${esc(rx.freq)}</td></tr>
    <tr><th>기간</th><td>${esc(rx.period)}</td></tr>
    <tr><th>다시 확인</th><td>${esc(rx.check)}</td></tr>
    <tr><th>목표</th><td>${esc(rx.goal)}</td></tr></tbody></table>
    ${(rx.notes || []).map((n) => `<div class="rxnote">⚠ ${esc(n)}</div>`).join('')}`;
}
function studentCards(d) {
  return d.students.map((s) => {
    const p = s.profile; if (!p) return '';
    const findings = p.findings.filter((f) => !/^반 평균과의 거리/.test(f));
    return `<div class="scard">
      <div class="hd"><b>${esc(who(d, s.num))}</b><span class="badge ${TYPE_CLS[p.type] || 'none'} lab">${esc(p.label)}</span>${TREND_TXT[p.trend] ? `<span class="muted">${TREND_TXT[p.trend]}</span>` : ''}</div>
      ${gapChips(p)}
      <ul>${findings.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
      ${rxTable(p.rx)}
    </div>`;
  }).join('');
}
function groupCards(d) {
  if (!d.groups || !d.groups.length) return '';
  return `<div class="cards">${d.groups.map((g) => `<div class="card grp">
    <div class="t"><span class="badge ${TYPE_CLS[g.type] || 'none'}">${esc(g.label)}</span> ${g.nums.length}명</div>
    ${chips(d, g.nums, TYPE_CLS[g.type] === 'reach' ? '' : TYPE_CLS[g.type])}
    ${g.far.length ? `<div class="s" style="margin-top:6px;color:var(--support)">반 평균에서 많이 떨어진 학생: ${g.far.map((n) => esc(who(d, n))).join(', ')} — 먼저 살펴보기</div>` : ''}
    ${g.type !== 'none' ? `<div class="s" style="margin-top:6px">공통 처방: ${esc(g.rx.what)} · ${esc(g.rx.freq)} · ${esc(g.rx.period)}</div>` : '<div class="s" style="margin-top:6px">진단부터 실시</div>'}
  </div>`).join('')}</div>`;
}
function rulesTable(d) {
  const R = d.rules || {};
  const rows = d.kind === '구구단' ? [
    ['미습득', `정답률 ${R.unlearned}% 미만`],
    ['잘못 외움', `같은 문항을 빠르게(3초 안) 틀린 응시가 ${R.wrongFixRepeat}번 이상`],
    ['부분 습득', `정답률 ${R.unlearned}~${R.accurate - 1}%`],
    ['정확하지만 느림', `정답률 ${R.accurate}% 이상, 맞힌 문항 중 3초 안이 ${R.fastShare}% 미만`],
    ['자동화', `정답률 ${R.accurate}% 이상, 3초 안 ${R.fastShare}% 이상`],
    ['약한 단 / 느린 단', `단별 오답률 ${R.weakDanWrong}% 이상 / 정답 반응시간이 자기 중앙값의 ${R.weakDanSlow}배 이상(3초 이상)`],
    ['향상 · 하락 · 정체', `가장 많이 푼 단계의 첫→최근: 점수 ±${R.trendScore}점 또는 반응시간 ±${R.trendMed}초 / ${R.trendTries}번 이상 풀었는데 변화 없음`],
    ['반 평균과의 거리', '학생마다 한 값(문항 기록 20개 이상이면 그 전체, 아니면 최근 기록)을 반 학생들과 비교. 표준편차의 0.5배 안 = 평균 근처, 1배 넘게 나쁨 = 많이 떨어짐'],
    ['판정 근거 자료', `문항 기록이 ${R.guguMinItems}개 이상이면 '구구단문항' 탭, 아니면 '구구단' 탭 요약`]
  ] : [
    ['통과 · 마스터', '백칸.gs의 단계별 기준(점수·시간) 통과 / 서로 다른 3일 통과'],
    ['정확도 먼저', `지금 단계 최근 점수가 통과 점수(${R.h100Score}점 등) 미만`],
    ['정체', `같은 단계를 ${R.trendTries}번 이상 풀었는데 점수가 ${R.trendScore}점 넘게 오르지 않고 시간도 ${R.trendSecPct}% 넘게 줄지 않음 → 한 단계 낮추거나 구구단 먼저`],
    ['정확하지만 시간 초과', '점수는 통과, 시간이 기준을 넘음 → 같은 단계 기록경신'],
    ['구구단이 원인', '지금 단계에서 틀린 셈이 같은 단(곱셈의 두 수, 나눗셈의 나누는 수·몫)에 2번 이상 몰림'],
    ['반 평균과의 거리', '지금 연습하는 단계에서 학생마다 최근 기록 하나씩 비교. 표준편차의 0.5배 안 = 평균 근처, 1배 넘게 나쁨 = 많이 떨어짐']
  ];
  return `<h4>판정 기준표 <small>보고서의 모든 판정은 아래 규칙으로 자동으로 했습니다</small></h4>
    <div class="tablewrap"><table><tbody>${rows.map((r) => `<tr><td style="white-space:nowrap"><b>${esc(r[0])}</b></td><td style="font-size:13px">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
}

boot().catch((e) => msg('<b>화면을 준비하지 못했습니다.</b><br>' + esc(e.message)));
</script>
</body>
</html>
