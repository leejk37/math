<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 현황판</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --line: #e3e7ef; --ink: #1d2433; --sub: #667085;
    --none: #eef1f6; --none-ink: #98a2b3;
    --s100: #12b76a; --s80: #6ce9a6; --s60: #fdb022; --s40: #f97066; --s20: #d92d20;
    --accent: #2e6be6; --o: #12b76a; --x: #f04438;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 20px; }
  header h1 { font-size: 20px; margin: 0; white-space: nowrap; }
  header h1 small { font-weight: 500; color: var(--sub); font-size: 14px; margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  select, input[type=date], button { font: inherit; font-size: 15px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.toggle { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--sub); cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c0c6d2; display: inline-block; }
  .dot.on { background: var(--s100); box-shadow: 0 0 0 4px rgba(18,183,106,.18); }
  .dot.err { background: var(--x); }
  #who { font-size: 13px; color: var(--sub); }

  main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
  .notice { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; text-align: center;
    color: var(--sub); line-height: 1.7; }
  .notice b { color: var(--ink); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .k { font-size: 13px; color: var(--sub); }
  .stat .v { font-size: 26px; font-weight: 700; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 8px solid var(--none);
    border-radius: 12px; padding: 10px 12px; cursor: pointer; min-height: 118px; transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card.none { background: var(--none); color: var(--none-ink); cursor: default; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .card .num { font-size: 15px; font-weight: 700; }
  .card .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .score { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
  .card .lv { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 4px; }
  .marks { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .m { width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; }
  /* 100칸 계산 순위 (같은 계산끼리, 100점 기록 중 가장 빠른 시간 순) */
  .card .score { display: flex; align-items: center; gap: 10px; }
  /* 순위는 점수보다 크게, 점수 앞에 */
  .rank { font-size: 34px; font-weight: 900; white-space: nowrap; padding: 0 10px; border-radius: 14px; background: #e0e7ff; color: #3730a3; line-height: 1.25; order: -1; }
  .rank small { font-size: .5em; font-weight: 800; margin-left: 1px; }
  .card .lv.h100 { color: var(--ink); font-weight: 800; font-size: 15px; }
  /* 전체화면: 카드 가로 5 × 세로 4 (줄 높이는 화면 높이에 맞춰 스크립트가 정함) */
  /* 전체화면: 카드만 보이게 (도움 요청은 카드의 노란 테두리·태그로 보임) */
  body.fs header, body.fs #msg, body.fs .helpbox, body.fs .summary, body.fs .pastbar,
  body.fs #board > :not(#grid) { display: none !important; }
  body.fs main { padding: 8px; max-width: none; }
  #fsExit { display: none; }
  body.fs #fsExit { display: block; position: fixed; right: 10px; bottom: 10px; z-index: 20; opacity: .25; font-size: 13px; }
  body.fs #fsExit:hover { opacity: 1; }
  body.fs .card > * { flex-shrink: 0; }
  body.fs .grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
  body.fs .card { min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 12px 16px; }
  body.fs .card .num, body.fs .card .name { font-size: 24px; }
  body.fs .card .lv { font-size: 17px; margin-top: 2px; }
  body.fs .card .lv.h100 { font-size: 22px; }
  body.fs .card .score { font-size: 44px; margin-top: auto; line-height: 1.05; }
  body.fs .rank { font-size: 60px; line-height: 1.1; }
  body.fs .card .marks { margin-top: 4px; }
  body.fs .card .who-wrong { font-size: 15px; }
  body.fs .card .meta { font-size: 16px; margin-top: auto; }
  .rank.r1 { background: #fde68a; color: #854d0e; } .rank.r2 { background: #e5e7eb; color: #374151; } .rank.r3 { background: #fed7aa; color: #9a3412; }
  .rankline { font-size: 13px; padding: 6px 0 4px; border-top: 1px dashed var(--line); }
  .m.O { background: var(--o); } .m.X { background: var(--x); } .m.S { background: #d99a12; }
  /* 구구단: 표시 아래에 문항별 걸린 시간 */
  .mt { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
  .mt small { font-size: 10px; color: var(--sub); line-height: 1; }
  .gu-key { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .gu-key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 2px 0 6px; vertical-align: -1px; font-style: normal; }
  .card.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px rgba(46,107,230,.55); } 100% { box-shadow: 0 0 0 0 rgba(46,107,230,0); } }

  h2 { font-size: 17px; margin: 26px 0 10px; }
  h2 small { font-weight: 500; color: var(--sub); font-size: 13px; margin-left: 6px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .item .t { font-weight: 700; font-size: 15px; }
  .item .s { font-size: 12px; color: var(--sub); margin: 2px 0 8px; }
  .qrow { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 4px 0;
    border-top: 1px dashed var(--line); font-size: 14px; }
  .qrow .q { font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar > span:last-child { white-space: nowrap; }
  .bar .fill { height: 10px; border-radius: 5px; background: var(--x); min-width: 2px; }
  .bar .fill.zero { background: var(--o); }
  .who-wrong { font-size: 12px; color: var(--sub); margin-top: 2px; }

  table.feed { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; font-size: 14px; }
  .feed th, .feed td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .feed th { background: #f8fafc; color: var(--sub); font-weight: 600; font-size: 13px; }

  .dim { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .dim.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 18px 20px; width: min(640px, 100%); max-height: 85vh; overflow: auto; }
  .modal h3 { margin: 0 0 10px; }
  .foot { margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .foot button { font-size: 13px; color: var(--sub); }
  .hidden { display: none !important; }

  /* 날짜 이동 */
  .daynav { display: flex; gap: 4px; align-items: center; }
  .daynav button { padding: 7px 10px; }
  .daynav button:disabled { opacity: .4; cursor: default; }
  .pastbar { background: #eef4ff; border: 1px solid #b9cdf6; color: #1e3a8a; border-radius: 10px; padding: 8px 14px;
    margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .pastbar button { font-size: 14px; padding: 4px 10px; }

  /* 정렬되는 표 머리 */
  .feed th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
  .feed th.sort:hover { color: var(--ink); }
  .feed th.sort.on { color: var(--accent); }
  .feed th.sort .arw { font-size: 11px; margin-left: 3px; }
  .feedtools { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .feedtools button { font-size: 13px; color: var(--sub); }
  h2 .tools { float: right; display: flex; gap: 4px; }
  h2 .tools button { font-size: 13px; padding: 4px 10px; font-weight: 500; }
  h2 .tools button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opsec { margin-bottom: 14px; }
  .opsec h3 { font-size: 15px; margin: 6px 0 8px; color: var(--ink); }
  .opsec h3 small { color: var(--sub); font-weight: 500; margin-left: 6px; }

  /* 도움 요청 */
  .helpbox { background: #fff8ec; border: 2px solid #f5c26b; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
  .helpbox.quiet { background: var(--panel); border: 1px solid var(--line); }
  .helpbox .hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .helpbox .hd b { font-size: 17px; }
  .helpbox .hd .cnt { font-size: 15px; color: var(--sub); }
  .helpbox .hd .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--sub); }
  .hrow { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 12px; align-items: center; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
  .hrow .hn { font-size: 20px; font-weight: 800; }
  .hrow .what { font-size: 15px; } .hrow .what small { color: var(--sub); }
  .hrow .wait { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--sub); white-space: nowrap; }
  .hrow .wait.long { color: var(--x); font-weight: 700; }
  .hrow button { background: var(--s100); border-color: var(--s100); color: #fff; font-weight: 700; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .tag.unknown { background: #fff4e5; color: #92400e; border: 1px solid #f59e0b; }
  .tag.check { background: #e8f0fe; color: #1e3a8a; border: 1px solid #3b6fd8; }
  .card .hb { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .card.asking { box-shadow: 0 0 0 3px #f5c26b; }

  @media (max-width: 600px) {
    header { padding: 10px 12px; } main { padding: 12px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .items { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>실시간 현황판<small id="schoolName"></small></h1>
  <div class="controls">
    <select id="grade" aria-label="학년"></select>
    <select id="classNum" aria-label="반"></select>
    <span class="daynav">
      <button id="prevDay" title="기록이 있는 이전 날로">◀</button>
      <input type="date" id="day" aria-label="날짜">
      <button id="nextDay" title="기록이 있는 다음 날로">▶</button>
      <button id="todayBtn" title="오늘로">오늘</button>
    </span>
    <label class="toggle"><input type="checkbox" id="showNames" checked> 이름 보기</label>
    <span class="dot" id="conn" title="연결 상태"></span>
    <span id="who"></span>
    <button id="fsBtn" title="큰 화면용: 학생 카드를 가로 5 × 세로 4로 크게 보여 줍니다">⛶ 전체화면</button>
    <button id="loginBtn" class="primary">선생님 로그인</button>
    <button id="logoutBtn" class="hidden">로그아웃</button>
  </div>
</header>

<main>
  <div id="msg" class="notice">불러오는 중…</div>

  <section id="board" class="hidden">
    <div class="pastbar hidden" id="pastBar"><span id="pastText"></span><button id="pastToday">오늘 현황으로 돌아가기</button></div>
    <div class="helpbox quiet" id="helpBox">
      <div class="hd"><b>🙋 도움 요청</b><span class="cnt" id="helpCount">없음</span>
        <span class="right"><span id="helpDone"></span><label class="toggle"><input type="checkbox" id="helpSound" checked> 알림음</label></span></div>
      <div id="helpList"></div>
    </div>
    <div class="summary">
      <div class="stat"><div class="k">제출한 학생</div><div class="v" id="stSubmitted">-</div></div>
      <div class="stat"><div class="k" id="stAttemptsK">오늘 제출 횟수</div><div class="v" id="stAttempts">-</div></div>
      <div class="stat"><div class="k">최근 점수 평균</div><div class="v" id="stAvg">-</div></div>
      <div class="stat"><div class="k">마지막 제출</div><div class="v" id="stLast">-</div></div>
    </div>

    <div class="grid" id="grid"></div>

    <h2>단계별 문항 오답<small>학생마다 그 단계의 가장 최근 제출만 셉니다</small>
      <span class="tools"><button data-iorder="step">단계순</button><button data-iorder="recent">최근순</button></span></h2>
    <div class="items" id="items"></div>

    <h2>최근 제출<small id="feedHint">제목 칸을 누르면 그 기준으로 정렬합니다</small></h2>
    <table class="feed"><thead><tr id="feedHead">
      <th class="sort" data-key="at">시각</th><th class="sort" data-key="num">번호</th><th class="sort" data-key="name">이름</th>
      <th class="sort" data-key="lv">영역·단계</th><th class="sort" data-key="score">점수</th><th class="sort" data-key="wrong">문항</th>
      <th class="sort" data-key="sec">걸린 시간</th></tr></thead>
      <tbody id="feed"></tbody></table>
    <div class="feedtools"><button id="feedMore"></button></div>

    <div class="foot">
      <button id="cleanBtn" title="오늘을 뺀 지난 날짜의 현황판 기록을 지웁니다. 시트 기록은 지워지지 않습니다.">지난 날짜 현황판 기록 지우기</button>
    </div>
  </section>
</main>

<button id="fsExit" title="전체화면 끄기 (Esc)">✕ 전체화면 끄기</button>
<div class="dim" id="dim"><div class="modal" id="modal"></div></div>

<script type="module">
const VER = '10.12.2';
const base = `https://www.gstatic.com/firebasejs/${VER}/`;
const cfg = (window.APP_CONFIG && window.APP_CONFIG.FIREBASE) || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get(k, d) { try { return localStorage.getItem('live_' + k) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('live_' + k, v); } catch (e) {} } };

let roster = {};          // { 학년: { 반: { 번호: 이름 } } }
let db, dbm, auth, authm, user = null;
let unsub = null;
let unsubHelp = null;
let helpData = {};        // { 번호: { pushId: 도움요청 } }
let helpSeen = null;      // 알림음용: 이미 본 요청 id
let data = {};            // { 번호: { pushId: 기록 } }
let seenCount = {};       // 깜빡임 표시용: 번호별 지난번 기록 수
let firstLoad = true;
let sortKey = store.get('sortKey', 'at');                 // 최근 제출 정렬 기준
let sortDir = Number(store.get('sortDir', '-1')) || -1;   // 1 오름차순, -1 내림차순
let feedAll = false;                                     // 최근 제출: 20개만 / 모두
let itemOrder = store.get('iorder', 'step');             // 단계별 문항 오답: step(단계순) / recent(최근순)

function msg(html) { $('msg').innerHTML = html; $('msg').classList.remove('hidden'); $('board').classList.add('hidden'); }
function showBoard() { $('msg').classList.add('hidden'); $('board').classList.remove('hidden'); }
function setConn(state) { $('conn').className = 'dot' + (state === 'on' ? ' on' : state === 'err' ? ' err' : ''); }

/* ---------- 시작 ---------- */
init();

async function init() {
  if (!cfg.apiKey || !cfg.databaseURL) {
    msg('<b>Firebase 설정이 비어 있습니다.</b><br>config.js의 FIREBASE 항목을 채운 뒤 다시 열어 주세요.<br>(설치 안내서 3단계)');
    return;
  }
  $('day').value = window.liveToday();
  callApi('getPublicConfig').then((c) => { if (c && c.schoolName) $('schoolName').textContent = c.schoolName; }).catch(() => {});

  try {
    roster = (await callApi('getStudentList')) || {};
  } catch (e) {
    roster = {};
  }
  fillGrades();

  const [appm, am, dm] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')
  ]);
  authm = am; dbm = dm;
  const app = appm.initializeApp(cfg);
  auth = am.getAuth(app);
  db = dm.getDatabase(app);

  dm.onValue(dm.ref(db, '.info/connected'), (s) => setConn(s.val() ? 'on' : ''));

  am.onAuthStateChanged(auth, (u) => {
    user = (u && !u.isAnonymous) ? u : null;
    $('who').textContent = user ? user.email : '';
    $('loginBtn').classList.toggle('hidden', !!user);
    $('logoutBtn').classList.toggle('hidden', !user);
    if (user) subscribe();
    else { stop(); msg('<b>선생님 계정으로 로그인해 주세요.</b><br>등록된 선생님 계정만 현황판을 볼 수 있습니다.'); }
  });

  $('loginBtn').onclick = () => {
    const p = new am.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    am.signInWithPopup(auth, p).catch((e) => msg('<b>로그인하지 못했습니다.</b><br>' + esc(e.message)));
  };
  $('logoutBtn').onclick = () => am.signOut(auth);
  $('grade').onchange = () => { store.set('grade', $('grade').value); fillClasses(); subscribe(); };
  $('classNum').onchange = () => { store.set('class', $('classNum').value); subscribe(); };
  $('day').onchange = () => { updateDayUi(); subscribe(); };
  $('prevDay').onclick = () => jumpDay(-1);
  $('nextDay').onclick = () => jumpDay(1);
  $('todayBtn').onclick = $('pastToday').onclick = () => { $('day').value = window.liveToday(); updateDayUi(); subscribe(); };
  document.querySelectorAll('#feedHead th.sort').forEach((th) => { th.onclick = () => setSort(th.dataset.key); });
  $('feedMore').onclick = () => { feedAll = !feedAll; render(); };
  document.querySelectorAll('[data-iorder]').forEach((b) => { b.onclick = () => { itemOrder = b.dataset.iorder; store.set('iorder', itemOrder); render(); }; });
  updateDayUi();
  $('showNames').checked = store.get('names', '1') === '1';
  $('showNames').onchange = () => { store.set('names', $('showNames').checked ? '1' : '0'); render(); };
  $('cleanBtn').onclick = cleanOld;
  $('dim').onclick = (e) => { if (e.target.id === 'dim') $('dim').classList.remove('show'); };
  setInterval(render, 30000); // '몇 분 전' 표시 갱신
}

/* ---------- 학년·반 목록 ---------- */
function fillGrades() {
  const gs = Object.keys(roster).sort((a, b) => a - b);
  $('grade').innerHTML = gs.length ? gs.map((g) => `<option value="${esc(g)}">${esc(g)}학년</option>`).join('')
                                   : '<option value="">학년</option>';
  const saved = store.get('grade', '');
  if (gs.includes(saved)) $('grade').value = saved;
  fillClasses();
}
function fillClasses() {
  const cs = Object.keys(roster[$('grade').value] || {}).sort();
  $('classNum').innerHTML = cs.length ? cs.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')
                                      : '<option value="">반</option>';
  const saved = store.get('class', '');
  if (cs.includes(saved)) $('classNum').value = saved;
}

/* ---------- Firebase 구독 ---------- */
function stop() {
  if (unsub) { unsub(); unsub = null; }
  if (unsubHelp) { unsubHelp(); unsubHelp = null; }
}
function subscribe() {
  stop();
  if (!user) return;
  const g = $('grade').value, c = $('classNum').value, day = $('day').value;
  if (!g || !c || !day) { msg('학년과 반을 선택해 주세요. (학생명부에 학생이 있어야 목록이 나옵니다)'); return; }
  data = {}; seenCount = {}; firstLoad = true; helpData = {}; helpSeen = null;
  msg('현황을 불러오는 중…');
  const cls = `${window.liveKey(g)}_${window.liveKey(c)}`;
  const path = `live/${day}/${cls}`;
  unsubHelp = dbm.onValue(dbm.ref(db, `help/${day}/${cls}`), (snap) => {
    helpData = snap.val() || {};
    if (helpSeen === null) helpSeen = new Set(Object.keys(helpData).flatMap(helpsOf).map((h) => h.id)); // 처음 불러온 요청은 알림음 없음
    render();
  }, () => { /* 권한 오류는 아래 live 구독에서 안내 */ });
  unsub = dbm.onValue(dbm.ref(db, path), (snap) => {
    data = snap.val() || {};
    showBoard(); render(); firstLoad = false;
  }, (err) => {
    setConn('err');
    if (String(err && err.message).includes('permission')) {
      msg(`<b>${esc(user.email)}</b> 계정은 현황판을 볼 권한이 없습니다.<br>Firebase 콘솔의 teachers 목록에 이 계정을 등록해 주세요. (설치 안내서 6단계)`);
    } else {
      msg('<b>현황을 불러오지 못했습니다.</b><br>' + esc(err && err.message));
    }
  });
}

/* ---------- 화면 그리기 ---------- */
function attemptsOf(num) {
  return Object.entries(data[num] || {}).map(([id, r]) => ({ id, ...r }))
    .filter((r) => typeof r.at === 'number').sort((a, b) => a.at - b.at);
}
// 단계 이름의 짧은 표시. 100칸 계산은 단계 번호 대신 '연산 칸수'로 보여 줌 ("10단계: 뺄셈 25칸 · …" → "뺄셈 25칸")
function shortLevel(lv) {
  const s = String(lv || ''), h = s.match(/^\d+단계:\s*(\S+ \d+칸)/);
  return h ? h[1] : s.split(':')[0].trim();
}
function colorOf(score) {
  if (score == null) return 'var(--none)';
  if (score >= 100) return 'var(--s100)';
  if (score >= 80) return 'var(--s80)';
  if (score >= 60) return 'var(--s60)';
  if (score >= 40) return 'var(--s40)';
  return 'var(--s20)';
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  return new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
function clock(ts) { return new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function mmss(sec) { sec = Number(sec) || 0; return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
// 구구단 기록은 단계 이름 끝에 '×곱하는수 걸린초'가 붙어 옴 (예: "7단: 3초 안 6/9 · 중앙값 1.4초 · ×1 1.2 ×2 0.8 …")
function guTimes(r) {
  if (!r || r.op !== '구구단') return null;
  const lv = String(r.level || ''), thr = Number((lv.match(/(\d+)초 안/) || [])[1]) || 3, list = [];
  lv.replace(/×(\d) (\d+(?:\.\d)?)/g, (_, b, t) => { list.push({ b: Number(b), t: Number(t) }); return ''; });
  return list.length ? { thr, list } : null;
}
// r을 넘기면 구구단은 곱하는 수와 걸린 시간을 함께 보여 줌 (기준 시간을 넘긴 정답은 주황)
function marks(str, r) {
  if (r && r.op === '100칸 계산') {  // 칸이 많아 O·X 대신 "정답 칸/전체 · 틀린 셈"을 글로 보여 줌
    const p = String(r.level || '').split(' · ');
    return `<span class="who-wrong" style="margin:0"><b>${esc(p[1] || '')}</b>${p.length > 2 ? ' · ' + esc(p.slice(2).join(' · ')) : ''}</span>`;
  }
  const g = guTimes(r), s = String(str || '');
  if (!g) return s.split('').map((m, i) => `<span class="m ${m}" title="Q${i + 1}">${i + 1}</span>`).join('');
  return s.split('').map((m, i) => {
    const x = g.list[i]; if (!x) return `<span class="m ${m}">${i + 1}</span>`;
    const c = m === 'O' && x.t > g.thr ? 'S' : m;
    return `<span class="mt" title="×${x.b} · ${x.t}초"><span class="m ${c}">${x.b}</span><small>${x.t.toFixed(1)}</small></span>`;
  }).join('');
}
function guKey(r) { const g = guTimes(r); return g ? `<div class="gu-key">숫자 아래는 걸린 초<i style="background:var(--o)"></i>${g.thr}초 안<i style="background:#d99a12"></i>느림<i style="background:var(--x)"></i>틀림</div>` : ''; }

function render() {
  if ($('board').classList.contains('hidden')) return;
  const names = (roster[$('grade').value] || {})[$('classNum').value] || {};
  const showNames = $('showNames').checked;
  const nums = Array.from(new Set([...Object.keys(names), ...Object.keys(data), ...Object.keys(helpData)])).sort((a, b) => Number(a) - Number(b));
  const nameOf = (n) => showNames ? (names[n] || '') : '';

  let submitted = 0, attempts = 0, sum = 0, last = 0;
  const all = [];
  const ranks = hundredRanks(nums);
  const html = nums.map((n) => {
    const list = attemptsOf(n);
    attempts += list.length;
    list.forEach((r) => all.push({ num: n, ...r }));
    const changed = !firstLoad && list.length > (seenCount[n] || 0);
    seenCount[n] = list.length;
    const asks = pendingOf(n);
    const hb = asks.length ? `<div class="hb">${asks.map((h) => `<span class="tag ${h.type}">${HELP[h.type].icon} 문제${h.q}</span>`).join('')}</div>` : '';
    if (!list.length) {
      return `<div class="card none${asks.length ? ' asking' : ''}"><div class="top"><span class="num">${esc(n)}번</span><span class="name">${esc(nameOf(n))}</span></div>
              <div class="lv" style="margin-top:14px">아직 제출 없음</div>${hb}</div>`;
    }
    const r = list[list.length - 1];
    submitted++; sum += r.score; last = Math.max(last, r.at);
    return `<div class="card${changed ? ' flash' : ''}${asks.length ? ' asking' : ''}" data-num="${esc(n)}" style="border-left-color:${colorOf(r.score)}">
      <div class="top"><span class="num">${esc(n)}번</span><span class="name">${esc(nameOf(n))}</span></div>
      ${r.op === '100칸 계산'
        ? `<div class="lv h100" title="${esc(r.op + ' ' + r.level)}">${esc(shortLevel(r.level))}</div>`
        : `<div class="lv" title="${esc(r.op + ' ' + r.level)}">${esc(r.op)} · ${esc(shortLevel(r.level))}</div>`}
      <div class="score" style="color:${colorOf(r.score)}">${r.score}${rankBadge(ranks, r, n)}</div>
      <div class="marks">${marks(r.results, r)}</div>
      <div class="meta"><span>${list.length}회째</span><span title="걸린 시간">⏱ ${mmss(r.sec)}</span><span>${ago(r.at)}</span></div>${hb}</div>`;
  }).join('');
  $('grid').innerHTML = html || '<div class="notice">이 반의 학생명부가 비어 있습니다.</div>';
  renderHelp(nameOf);
  $('grid').querySelectorAll('.card[data-num]').forEach((el) => { el.onclick = () => openStudent(el.dataset.num, nameOf(el.dataset.num)); });

  $('stSubmitted').textContent = `${submitted} / ${nums.length}`;
  $('stAttempts').textContent = attempts;
  $('stAvg').textContent = submitted ? Math.round(sum / submitted) : '-';
  $('stLast').textContent = last ? ago(last) : '-';

  fitFs();
  renderItems(nums, nameOf);
  sortFeed(all, nameOf);
  const shown = feedAll ? all : all.slice(0, 20);
  $('feedMore').classList.toggle('hidden', all.length <= 20);
  $('feedMore').textContent = feedAll ? '20개만 보기' : `모두 보기 (${all.length}개)`;
  document.querySelectorAll('#feedHead th.sort').forEach((th) => {
    const on = th.dataset.key === sortKey;
    th.classList.toggle('on', on);
    th.innerHTML = th.textContent.replace(/[▲▼]/g, '') + (on ? `<span class="arw">${sortDir > 0 ? '▲' : '▼'}</span>` : '');
  });
  $('feed').innerHTML = shown.map((r) => `<tr><td>${clock(r.at)}</td><td>${esc(r.num)}</td><td>${esc(nameOf(r.num))}</td>
      <td>${esc(r.op)} · ${esc(shortLevel(r.level))}</td><td><b>${r.score}</b></td><td><div class="marks" style="margin:0">${marks(r.results, r)}</div></td><td>${mmss(r.sec)}</td></tr>`).join('')
    || '<tr><td colspan="7" style="color:var(--sub)">아직 제출이 없습니다.</td></tr>';
}

/* 단계별 문항 오답: 학생마다 그 단계의 가장 최근 기록만 */
// 100칸 계산 순위: 계산(예: 뺄셈 25칸)마다 학생별 가장 최근 기록만 봄
//  - 점수가 높은 순, 점수가 같으면 걸린 시간이 빠른 순 (점수·시간이 모두 같으면 같은 순위)
function hundredRanks(nums) {
  const latest = {}; // 계산 -> { 번호: 가장 최근 기록 }
  nums.forEach((n) => attemptsOf(n).forEach((r) => {   // attemptsOf는 시간 순이라 마지막 기록이 남음
    if (r.op !== '100칸 계산') return;
    const k = shortLevel(r.level);
    (latest[k] || (latest[k] = {}))[n] = r;
  }));
  const out = {};
  Object.entries(latest).forEach(([k, m]) => {
    const list = Object.entries(m).map(([n, r]) => ({ n, score: Number(r.score) || 0, sec: Number(r.sec) || 0 }))
      .sort((x, y) => y.score - x.score || x.sec - y.sec || x.n - y.n);
    list.forEach((x, i) => { const p = list[i - 1]; x.rank = (p && p.score === x.score && p.sec === x.sec) ? p.rank : i + 1; });
    out[k] = { list, by: {} };
    list.forEach((x) => { out[k].by[x.n] = x.rank; });
  });
  return out;
}
function rankBadge(ranks, r, n) {
  if (!r || r.op !== '100칸 계산') return '';
  const k = ranks[shortLevel(r.level)], rk = k && k.by[n];
  return rk ? `<span class="rank${rk <= 3 ? ' r' + rk : ''}" title="${esc(shortLevel(r.level))} 순위: 점수 높은 순, 같은 점수면 빠른 순">${rk}<small>위</small></span>` : '';
}

function renderItems(nums, nameOf) {
  const ranks = hundredRanks(nums);
  const groups = {}; // key -> { op, level, latest: {num: rec} }
  nums.forEach((n) => attemptsOf(n).forEach((r) => {
    const key = r.op + '|' + shortLevel(r.level);
    const g = groups[key] || (groups[key] = { op: r.op, level: r.level, latest: {}, lastAt: 0 });
    g.latest[n] = r; g.lastAt = Math.max(g.lastAt, r.at);
  }));
  document.querySelectorAll('[data-iorder]').forEach((b) => b.classList.toggle('on', b.dataset.iorder === itemOrder));
  const card = (g) => {
    const recs = Object.entries(g.latest);
    const rows = [];
    if (g.op === '구구단') {
      // 학생마다 나온 문항이 다를 수 있어(20·40문항 검사) 위치가 아니라 곱하는 수로 묶음
      for (let b = 1; b <= 9; b++) {
        const got = recs.map(([n, r]) => { const t = guTimes(r), i = t ? t.list.findIndex((x) => x.b === b) : -1;
          return i < 0 ? null : { n, mark: String(r.results || '')[i], t: t.list[i].t, thr: t.thr }; }).filter(Boolean);
        if (!got.length) continue;
        const wrong = got.filter((x) => x.mark === 'X').map((x) => x.n).sort((a, b2) => a - b2);
        const slow = got.filter((x) => x.mark === 'O' && x.t > x.thr).map((x) => x.n).sort((a, b2) => a - b2);
        const avgT = (got.reduce((s, x) => s + x.t, 0) / got.length).toFixed(1);
        const w = Math.round((wrong.length / got.length) * 100);
        const who = (arr) => arr.map((n) => esc(n) + '번' + (nameOf(n) ? ' ' + esc(nameOf(n)) : '')).join(', ');
        rows.push(`<div class="qrow"><span class="q">×${b}</span><div>
          <div class="bar"><span class="fill${wrong.length ? '' : ' zero'}" style="width:${wrong.length ? Math.round(w * 0.7) : 2}%"></span>
            <span>${wrong.length ? `<b>${wrong.length}명</b> 오답` : '모두 정답'} · 평균 ${avgT}초</span></div>
          ${wrong.length ? `<div class="who-wrong">틀림: ${who(wrong)}</div>` : ''}${slow.length ? `<div class="who-wrong">느림: ${who(slow)}</div>` : ''}
        </div></div>`);
      }
    }
    if (g.op === '100칸 계산') {
      // 100칸은 문항별 O·X 대신 학생마다 정답 칸 수·걸린 시간·틀린 셈을 한 줄씩 보여 줌
      const rk = ranks[shortLevel(g.level)];
      if (rk) rows.push(`<div class="rankline">🏆 <b>순위</b> <small>(점수 높은 순, 같은 점수면 빠른 순)</small> · ${rk.list.map((x) => `${x.rank}위 ${esc(x.n)}번${nameOf(x.n) ? ' ' + esc(nameOf(x.n)) : ''}${x.score === 100 ? '' : ' ' + x.score + '점'} ${mmss(x.sec)}`).join(' · ')}</div>`);
      recs.sort((a, b) => a[0] - b[0]).forEach(([n, r]) => {
        const parts = String(r.level || '').split(' · ');
        const wrongTxt = parts.slice(2).join(' · ');
        rows.push(`<div class="qrow"><span class="q">${esc(n)}번</span><div>
          <div><b>${esc(parts[1] || '')}</b> · ${r.score}점 · ⏱ ${mmss(r.sec)}${nameOf(n) ? ' · ' + esc(nameOf(n)) : ''}</div>
          ${wrongTxt ? `<div class="who-wrong">${esc(wrongTxt)}</div>` : ''}
        </div></div>`);
      });
    }
    const qn = (g.op === '구구단' || g.op === '100칸 계산') ? 0 : Math.max(...recs.map(([, r]) => String(r.results || '').length), 0);
    for (let q = 0; q < qn; q++) {
      const wrong = recs.filter(([, r]) => String(r.results || '')[q] === 'X').map(([n]) => n).sort((a, b) => a - b);
      const w = Math.round((wrong.length / recs.length) * 100);
      rows.push(`<div class="qrow"><span class="q">Q${q + 1}</span><div>
        <div class="bar"><span class="fill${wrong.length ? '' : ' zero'}" style="width:${wrong.length ? Math.round(w * 0.7) : 2}%"></span>
          <span>${wrong.length ? `<b>${wrong.length}명</b> 오답` : '모두 정답'}</span></div>
        ${wrong.length ? `<div class="who-wrong">${wrong.map((n) => esc(n) + '번' + (nameOf(n) ? ' ' + esc(nameOf(n)) : '')).join(', ')}</div>` : ''}
      </div></div>`);
    }
    const avg = Math.round(recs.reduce((s, [, r]) => s + r.score, 0) / recs.length);
    return `<div class="item"><div class="t">${esc(g.op)} · ${esc(shortLevel(g.level))}</div>
      <div class="s">${g.op === '구구단' ? '' : esc(g.op === '100칸 계산' ? String(g.level).split(' · ')[0] : g.level) + '<br>'}${recs.length}명 · 평균 ${avg}점</div>${rows.join('')}</div>`;
  };
  const list = Object.values(groups);
  if (!list.length) { $('items').style.display = ''; $('items').innerHTML = '<div class="notice">아직 제출이 없습니다.</div>'; return; }
  if (itemOrder === 'recent') {
    $('items').style.display = '';
    $('items').innerHTML = list.sort((a, b) => b.lastAt - a.lastAt).map(card).join('');
    return;
  }
  // 단계순: 영역별로 묶고(최근에 제출이 있던 영역이 위), 영역 안에서는 1단계, 2단계… 순서
  const ops = {};
  list.forEach((g) => { (ops[g.op] || (ops[g.op] = [])).push(g); });
  const opList = Object.entries(ops).map(([op, gs]) => ({ op, gs, lastAt: Math.max(...gs.map((g) => g.lastAt)) }))
    .sort((a, b) => b.lastAt - a.lastAt);
  $('items').style.display = 'block';
  $('items').innerHTML = opList.map(({ op, gs }) => `<div class="opsec"><h3>${esc(op)}<small>${gs.length}개 단계</small></h3>
    <div class="items">${gs.sort((a, b) => levelCmp(a.level, b.level)).map(card).join('')}</div></div>`).join('');
}

/* 단계 비교: '2단계'가 '10단계'보다 앞에 오도록 숫자로 비교 */
// 단계 순서는 단계 이름 앞의 번호로 (100칸 계산도 1~12단계 순: 곱셈→나눗셈→덧셈→뺄셈, 25→50→100칸)
function levelCmp(a, b) { return String(a).localeCompare(String(b), 'ko', { numeric: true }); }

/* ---------- 최근 제출 정렬 ---------- */
function setSort(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = (key === 'at' || key === 'score' || key === 'wrong' || key === 'sec') ? -1 : 1; }
  store.set('sortKey', sortKey); store.set('sortDir', String(sortDir));
  render();
}
function sortFeed(all, nameOf) {
  const wrongOf = (r) => (String(r.results || '').match(/X/g) || []).length;
  const val = {
    at: (r) => r.at,
    num: (r) => Number(r.num) || 0,
    name: (r) => nameOf(r.num) || '',
    score: (r) => Number(r.score) || 0,
    wrong: (r) => wrongOf(r),
    sec: (r) => Number(r.sec) || 0
  }[sortKey];
  all.sort((a, b) => {
    let c;
    if (sortKey === 'lv') c = String(a.op).localeCompare(String(b.op), 'ko') || levelCmp(a.level, b.level);
    else if (sortKey === 'name') c = val(a).localeCompare(val(b), 'ko') || (Number(a.num) - Number(b.num));
    else c = val(a) - val(b);
    return (c * sortDir) || (b.at - a.at);   // 같으면 최근 것이 위
  });
}

/* ---------- 날짜 이동 ---------- */
function weekday(day) { return '일월화수목금토'[new Date(day + 'T00:00:00').getDay()]; }
function updateDayUi() {
  const day = $('day').value, today = window.liveToday();
  const past = day && day !== today;
  $('todayBtn').disabled = !past;
  $('nextDay').disabled = !day || day >= today;
  $('pastBar').classList.toggle('hidden', !past);
  $('stAttemptsK').textContent = past ? '그날 제출 횟수' : '오늘 제출 횟수';
  $('day').max = today;
  if (past) $('pastText').innerHTML = `📅 <b>${esc(day)} (${weekday(day)})</b> 지난 날짜의 기록을 보고 있습니다.`;
}
/* 이 반의 기록이 있는 이전(-1)·다음(+1) 날짜로 이동. 다른 반만 기록이 있는 날은 건너뜀 */
async function jumpDay(dir) {
  if (!user) return;
  const cls = `${window.liveKey($('grade').value)}_${window.liveKey($('classNum').value)}`;
  const today = window.liveToday();
  const btn = dir < 0 ? $('prevDay') : $('nextDay');
  btn.disabled = true;
  try {
    let cur = $('day').value || today;
    for (let i = 0; i < 60; i++) {   // 최대 60일치까지 찾아봄
      const q = dir < 0
        ? dbm.query(dbm.ref(db, 'live'), dbm.orderByKey(), dbm.endBefore(cur), dbm.limitToLast(1))
        : dbm.query(dbm.ref(db, 'live'), dbm.orderByKey(), dbm.startAfter(cur), dbm.limitToFirst(1));
      const v = (await dbm.get(q)).val();
      const d = v && Object.keys(v)[0];
      if (!d || d > today) {
        if (dir > 0) { $('day').value = today; updateDayUi(); subscribe(); }
        else alert('이 반의 이전 기록이 더 없습니다.\n(\'지난 날짜 현황판 기록 지우기\'로 지운 날은 현황판에서 볼 수 없습니다. 평가데이터 시트에는 남아 있습니다.)');
        return;
      }
      if (v[d] && v[d][cls]) { $('day').value = d; updateDayUi(); subscribe(); return; }
      cur = d;
    }
    alert('가까운 날짜에서 이 반의 기록을 찾지 못했습니다. 날짜 칸에서 직접 골라 주세요.');
  } catch (e) {
    alert('날짜를 찾지 못했습니다: ' + e.message);
  } finally { updateDayUi(); if (dir < 0) btn.disabled = false; }
}

function openStudent(num, name) {
  const list = attemptsOf(num).slice().reverse();
  $('modal').innerHTML = `<h3>${esc(num)}번 ${esc(name)} <small style="color:var(--sub);font-weight:500">${esc($('day').value)} · ${list.length}회</small></h3>
    <table class="feed"><thead><tr><th>시각</th><th>영역·단계</th><th>점수</th><th>문항</th><th>걸린 시간</th></tr></thead><tbody>
    ${list.map((r) => `<tr><td>${clock(r.at)}</td><td title="${esc(r.level)}">${esc(r.op)} · ${esc(shortLevel(r.level))}</td><td><b>${r.score}</b></td>
      <td><div class="marks" style="margin:0">${marks(r.results, r)}</div>${guKey(r)}</td><td>${mmss(r.sec)}</td></tr>`).join('')}
    </tbody></table><div class="foot"><button onclick="document.getElementById('dim').classList.remove('show')">닫기</button></div>`;
  $('dim').classList.add('show');
}

/* ---------- 도움 요청 ---------- */
const HELP = { unknown: { icon: '🤔', label: '모르겠어요' }, check: { icon: '🙋', label: '확인해 주세요' } };
function helpsOf(num) {
  return Object.entries(helpData[num] || {}).map(([id, h]) => ({ id, num, ...h }))
    .filter((h) => HELP[h.type] && typeof h.at === 'number');
}
function pendingOf(num) { return helpsOf(num).filter((h) => !h.done).sort((a, b) => a.at - b.at); }
function waitText(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  return Math.floor(s / 60) + '분 ' + String(s % 60).padStart(2, '0') + '초';
}
let audioCtx = null;
document.addEventListener('click', () => { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }, { once: true });
function ding() {
  if (!$('helpSound').checked || !audioCtx) return;
  try {
    [0, 0.18].forEach((t, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i ? 1046 : 784; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
      o.start(t0); o.stop(t0 + 0.26);
    });
  } catch (e) {}
}
function renderHelp(nameOf) {
  nameOf = nameOf || ((n) => ($('showNames').checked ? (((roster[$('grade').value] || {})[$('classNum').value] || {})[n] || '') : ''));
  const all = Object.keys(helpData).flatMap(helpsOf);
  const pending = all.filter((h) => !h.done).sort((a, b) => a.at - b.at);
  const doneCount = all.length - pending.length;

  // 새 요청이면 알림음 (처음 불러올 때는 울리지 않음)
  if (helpSeen) {
    if (pending.some((h) => !helpSeen.has(h.id))) ding();
    pending.forEach((h) => helpSeen.add(h.id));
  }

  $('helpBox').classList.toggle('quiet', !pending.length);
  $('helpCount').textContent = pending.length ? `${pending.length}명 기다리는 중` : '없음';
  $('helpDone').textContent = doneCount ? `오늘 해결 ${doneCount}건` : '';
  $('helpList').innerHTML = pending.map((h) => `<div class="hrow">
      <span class="hn">${esc(h.num)}번</span>
      <span class="what"><span class="tag ${h.type}">${HELP[h.type].icon} ${HELP[h.type].label}</span>${esc(nameOf(h.num))}
        <small>· ${esc(h.op)} · ${esc(shortLevel(h.level))} · <b>문제 ${h.q}</b></small></span>
      <span class="wait${Date.now() - h.at > 120000 ? ' long' : ''}" data-at="${h.at}">${waitText(h.at)}</span>
      <button data-num="${esc(h.num)}" data-id="${esc(h.id)}">해결</button></div>`).join('');
  $('helpList').querySelectorAll('button[data-id]').forEach((b) => { b.onclick = () => resolveHelp(b.dataset.num, b.dataset.id, b); });
}
function resolveHelp(num, id, btn) {
  const cls = `${window.liveKey($('grade').value)}_${window.liveKey($('classNum').value)}`;
  btn.disabled = true;
  dbm.update(dbm.ref(db, `help/${$('day').value}/${cls}/${num}/${id}`), { done: true, doneAt: dbm.serverTimestamp() })
    .then(() => {
      // 평가데이터 '도움요청' 시트의 그 줄에 해결·처리일시·대기시간 기록 (실패해도 현황판은 그대로)
      callApi('markHelpRequest', [{ id, status: 'done' }]).catch((e) => console.warn('도움요청 해결 기록 실패:', e && e.message));
    })
    .catch((e) => { btn.disabled = false; alert('처리하지 못했습니다: ' + e.message); });
}
setInterval(() => {  // 기다린 시간 갱신
  document.querySelectorAll('#helpList .wait[data-at]').forEach((el) => {
    const at = Number(el.dataset.at); el.textContent = waitText(at); el.classList.toggle('long', Date.now() - at > 120000);
  });
}, 1000);

/* 지난 날짜 기록 지우기 (오늘 것은 남김). 시트 기록과는 무관 */
async function cleanOld() {
  if (!user) return;
  const today = window.liveToday();
  try {
    const [snap, snapH] = await Promise.all(['live', 'help'].map((k) => dbm.get(dbm.query(dbm.ref(db, k), dbm.orderByKey(), dbm.endBefore(today)))));
    const days = Array.from(new Set([...Object.keys(snap.val() || {}), ...Object.keys(snapH.val() || {})])).sort();
    if (!days.length) { alert('지울 지난 기록이 없습니다.'); return; }
    if (!confirm(`현황판의 지난 기록 ${days.length}일치(${days[0]} ~ ${days[days.length - 1]})를 지웁니다.\n평가데이터 시트의 기록은 그대로 남습니다. 계속할까요?`)) return;
    const updates = {}; days.forEach((d) => { updates[d] = null; });
    await Promise.all([dbm.update(dbm.ref(db, 'live'), updates), dbm.update(dbm.ref(db, 'help'), updates)]);
    alert('지웠습니다.');
  } catch (e) { alert('지우지 못했습니다: ' + e.message); }
}

/* ---------- 전체화면: 카드 가로 5 × 세로 4 ---------- */
function fitFs() {
  const g = $('grid');
  if (!document.body.classList.contains('fs')) { g.style.gridAutoRows = ''; return; }
  const top = g.getBoundingClientRect().top + window.scrollY;   // 전체화면에서는 카드 위에 아무것도 없어 main 여백만큼
  const h = Math.max(120, Math.floor((window.innerHeight - top - 8 - 3 * 10) / 4));
  g.style.gridAutoRows = h + 'px';
}
$('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {
    document.body.classList.toggle('fs'); window.scrollTo(0, 0); fitFs();   // 전체화면을 막는 환경이면 화면 배치만 바꿈
  });
  else { document.body.classList.toggle('fs'); window.scrollTo(0, 0); fitFs(); }
});
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  document.body.classList.toggle('fs', on);
  $('fsBtn').textContent = on ? '⛶ 전체화면 끄기' : '⛶ 전체화면';
  window.scrollTo(0, 0);
  setTimeout(fitFs, 50);
});
window.addEventListener('resize', fitFs);
$('fsExit').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else { document.body.classList.remove('fs'); fitFs(); }
});
</script>
