<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 수의 범위와 어림 도우미(m521) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261105-1"></script>
<script src="m521-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>반올림</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">반올림</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 반올림: 구하려는 자리 바로 아래 숫자를 봐요</div>
  <div class="rule-line"><span class="rule-tag">0~4</span> 버려요 → 517<b>2</b>를 반올림하여 십의 자리까지 → <b>5170</b></div>
  <div class="rule-line"><span class="rule-tag t2">5~9</span> 올려요 → 51<b>7</b>2를 반올림하여 백의 자리까지 → <b>5200</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> '바로 아래 자리' 숫자 하나만 봐요. 3<b>4</b>56을 천의 자리까지 → 4를 보고 버림 → <b>3000</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5216 — 반올림 (교과서 5-2-1 22~23쪽, 수학익힘 20~21쪽, 성취기준 [6수01-03])
// 진단 포인트: 바로 아래 자리가 아닌 다른 자리 숫자를 보고 판단(3456 → 4000), 5를 버림, 수직선에서 가까운 쪽 판단,
//              반올림한 값이 같은 수의 범위(T−5 이상 T+5 미만) 이해
const R = M.rand;
M.inlineQuestion = true;

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 수직선에서 어느 쪽에 더 가까운지 + 반올림하여 십의 자리까지
  const lo1 = R(101, 899) * 10, d1 = M.pick([1, 2, 3, 4, 6, 7, 8, 9]), x1 = lo1 + d1;
  cards.push(M.card(0, `<div class="q-text">축제에 방문한 사람 수는 ${x1}명입니다. ${x1}${M.josa(x1, '은', '는')} ${lo1}${M.josa(lo1, '과', '와')} ${lo1 + 10} 중 어느 쪽에 더 가깝나요?</div>` +
    M.lineSvg({ start: lo1, ticks: 10, major: 10, mid: 5, unit: 1, p: 0, trim: true, suffix: '(명)', arrows: [{ at: d1 }] }) +
    M.line(`<div class="qbox">${M.choices(d1 < 5 ? lo1 : lo1 + 10, [[lo1, lo1], [lo1 + 10, lo1 + 10]])}</div>`,
      `<div class="qbox"><div class="eq">반올림하여 십의 자리까지 → 약 ${M.box(N.round(x1, 10))} <span class="tail">명</span></div></div>`), true));
  hints.push(`${x1}의 일의 자리 숫자는 ${d1}이에요. 수직선에서 가운데(5)보다 ${d1 < 5 ? '왼쪽' : '오른쪽'}에 있어요. 0~4이면 버리고, 5~9이면 올려요.`);

  // 2번: 네 자리 수를 반올림하여 십·백·천의 자리까지 (바로 아래 숫자만 보는지 확인 — 4가 섞이도록)
  const x2 = N.gen(() => R(1, 9) * 1000 + R(0, 9) * 100 + R(0, 9) * 10 + R(1, 9),
    v => { const h = Math.floor(v / 100) % 10, t = Math.floor(v / 10) % 10; return (h === 4 && t >= 5) || (t === 4 && v % 10 >= 5) || h === 5; });
  cards.push(M.card(1, `<div class="q-text">${x2}${M.josa(x2, '을', '를')} 반올림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">십의 자리까지 ${M.box(N.round(x2, 10))}</div></div>`,
      `<div class="qbox"><div class="eq">백의 자리까지 ${M.box(N.round(x2, 100))}</div></div>`,
      `<div class="qbox"><div class="eq">천의 자리까지 ${M.box(N.round(x2, 1000))}</div></div>`), true));
  hints.push('십의 자리까지는 일의 자리, 백의 자리까지는 십의 자리, 천의 자리까지는 백의 자리 숫자 하나만 보고 정해요.');

  // 3번: 소수 세 자리 수를 반올림하여 소수 첫째·둘째 자리까지 (한쪽은 올리고 한쪽은 버리도록)
  const up1 = R(0, 1) === 1, ip = R(1, 9), a = R(1, 8), b = up1 ? R(5, 8) : R(0, 4), c = up1 ? R(0, 4) : R(5, 9);
  const s3 = `${ip}.${a}${b}${c}`, v3 = ip * 1000 + a * 100 + b * 10 + c;
  cards.push(M.card(2, `<div class="q-text">${s3}${M.josa(c, '을', '를')} 반올림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">소수 첫째 자리까지 ${M.dbox(N.round(v3, 100) / 100, 1, true)}</div></div>`,
      `<div class="qbox"><div class="eq">소수 둘째 자리까지 ${M.dbox(N.round(v3, 10) / 10, 2, true)}</div></div>`), true));
  hints.push(`소수 첫째 자리까지는 소수 둘째 자리 숫자(${b})를, 소수 둘째 자리까지는 소수 셋째 자리 숫자(${c})를 보고 정해요.`);

  // 4번: 반올림하여 십의 자리까지 나타내면 T가 되는 수 모두 고르기 (경곗값 T−5, T+5 포함)
  const T = R(12, 98) * 10;
  const opts4 = N.gen(() => N.distinct(6, () => M.pick([T - 5, T + 5, T + 4, T - 6, T, T - R(1, 4), T + R(1, 3), T + R(6, 9), T - R(7, 9)])),
    arr => arr.indexOf(T - 5) !== -1 && arr.indexOf(T + 5) !== -1 && arr.filter(v => N.round(v, 10) === T).length >= 2);
  cards.push(M.card(3, `<div class="q-text">반올림하여 십의 자리까지 나타내었을 때 ${T}${M.josa(T, '이', '가')} 되는 수를 모두 골라 보세요.</div>` +
    N.nums(opts4, v => N.round(v, 10) === T), true));
  hints.push(`보기의 수를 하나씩 반올림해 보세요. 일의 자리 숫자가 5이면 올려요. 그래서 ${T - 5}${M.josa(T - 5, '은', '는')} ${T}${M.josa(T, '이', '가')} 되고, ${T + 5}${M.josa(T + 5, '은', '는')} ${T + 10}${M.josa(T + 10, '이', '가')} 돼요.`);

  // 5번: 관광지별 방문객 수를 반올림하여 천의 자리까지 (백의 자리 숫자 5와 4가 꼭 들어가도록)
  const hs = M.shuffle([5, 4, R(0, 3), R(6, 9)]);
  const vis = hs.map(h => R(1, 8) * 1000 + h * 100 + R(0, 9) * 10 + R(0, 9));
  const places = ['가', '나', '다', '라'];
  cards.push(M.card(4, `<div class="q-text">9월 한 달 동안의 관광지별 방문객 수입니다. 방문객 수를 반올림하여 천의 자리까지 나타내어 보세요.</div>` +
    N.table(['관광지'].concat(places), [['방문객 수(명)'].concat(vis), ['반올림한 방문객 수(명)'].concat(vis.map(v => M.box(N.round(v, 1000))))], '관광지별 방문객 수'), true));
  hints.push('천의 자리까지 나타내니까 백의 자리 숫자를 봐요. 0~4이면 버리고, 5~9이면 올려요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
