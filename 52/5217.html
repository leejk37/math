<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 수의 범위와 어림 도우미(m521) -->
<script src="../config.js"></script>
<script src="../api.js"></script>

<script src="../frac/m423-common.js?v=20261109-4"></script>
<script src="m521-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>올림, 버림, 반올림을 활용하여 문제 해결하기</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">올림, 버림, 반올림을 활용하여 문제 해결하기</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 상황에 맞는 어림 방법을 골라요</div>
  <div class="rule-line"><span class="rule-tag">올림</span> 모자라면 안 될 때 — 귤 174개를 10개씩 모두 담으려면 최소 <b>18상자</b></div>
  <div class="rule-line"><span class="rule-tag t2">버림</span> 다 채운 것만 셀 때 — 비누 242개를 10개씩 담아 팔면 최대 <b>24상자</b></div>
  <div class="rule-line"><span class="rule-tag t3">반올림</span> 가까운 쪽으로 '약 얼마'라고 할 때 — 방문객 3569명은 약 <b>4000명</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5217 — 올림, 버림, 반올림을 활용하여 문제 해결하기 (교과서 5-2-1 24~25쪽, 수학익힘 22~23쪽, 성취기준 [6수01-03])
// 진단 포인트: 상황에 맞지 않는 어림 방법 선택(최소 → 버림, 최대 → 올림), 어림한 값을 답의 단위(상자·번)로 바꾸지 못함,
//              어림값과 수의 범위의 관계(어림하여 T가 되는 수의 범위)
const R = M.rand;
M.inlineQuestion = true;

// 상황 만들기: { text, method, ans, unit, hint }
function upCase() {
  return M.pick([
    () => { const n = R(12, 49) * 10 + R(1, 9); return { text: `귤 따기 체험에서 딴 귤 ${n}개를 한 상자에 10개씩 모두 담으려고 합니다. 상자는 최소 몇 상자 필요한가요?`, ans: N.up(n, 10) / 10, unit: '상자', hint: `남는 귤도 담아야 하니 ${n}${M.josa(n, '을', '를')} 올림하여 십의 자리까지 나타내 보세요.` }; },
    () => { const n = R(10, 29) * 10 + R(1, 9); return { text: `학생 ${n}명이 한 번에 10명씩 탈 수 있는 케이블카를 모두 타려고 합니다. 케이블카는 최소 몇 번 운행해야 하나요?`, ans: N.up(n, 10) / 10, unit: '번', hint: `남은 학생도 타야 하니 ${n}${M.josa(n, '을', '를')} 올림하여 십의 자리까지 나타내 보세요.` }; },
    () => { const c = R(11, 89) * 1000 + R(1, 9) * 100; return { text: `${c}원짜리 운동화를 1000원짜리 지폐로만 사려고 합니다. 1000원짜리 지폐는 최소 몇 장 내야 하나요?`, ans: N.up(c, 1000) / 1000, unit: '장', hint: `모자라면 살 수 없으니 ${c}${M.josa(c, '을', '를')} 올림하여 천의 자리까지 나타내 보세요.` }; }
  ])();
}
function downCase() {
  return M.pick([
    () => { const n = R(12, 49) * 10 + R(1, 9); return { text: `천연 비누 ${n}개를 한 상자에 10개씩 담아 판매하려고 합니다. 비누를 최대 몇 상자까지 판매할 수 있나요?`, ans: N.down(n, 10) / 10, unit: '상자', hint: `10개가 안 되는 비누는 한 상자가 되지 않아요. ${n}${M.josa(n, '을', '를')} 버림하여 십의 자리까지 나타내 보세요.` }; },
    () => { const c = R(11, 89) * 1000 + R(1, 9) * 100 + R(1, 9) * 10; return { text: `동전 ${c}원을 1000원짜리 지폐로 바꾸려고 합니다. 1000원짜리 지폐로 최대 몇 장까지 바꿀 수 있나요?`, ans: N.down(c, 1000) / 1000, unit: '장', hint: `1000원이 안 되는 동전은 바꿀 수 없어요. ${c}${M.josa(c, '을', '를')} 버림하여 천의 자리까지 나타내 보세요.` }; },
    () => { const L = R(3, 9) * 100 + R(1, 9) * 10 + R(1, 9); return { text: `끈 ${L} cm를 100 cm씩 잘라 줄넘기를 만들려고 합니다. 줄넘기를 최대 몇 개 만들 수 있나요?`, ans: N.down(L, 100) / 100, unit: '개', hint: `100 cm가 안 되는 끈으로는 만들 수 없어요. ${L}${M.josa(L, '을', '를')} 버림하여 백의 자리까지 나타내 보세요.` }; }
  ])();
}
function roundCase() {
  return M.pick([
    () => { const v = N.gen(() => R(1, 8) * 1000 + M.pick([4, 5, R(0, 9)]) * 100 + R(0, 9) * 10 + R(0, 9), x => x % 1000 !== 500 && x % 1000 !== 0); return { text: `9월 한 달 동안 박물관 방문객은 ${v}명입니다. ${N.down(v, 1000)}명과 ${N.down(v, 1000) + 1000}명 중 더 가까운 쪽으로 어림하면 약 몇 명인가요?`, ans: N.round(v, 1000), unit: '명', hint: `더 가까운 쪽을 찾는 것은 반올림이에요. 백의 자리 숫자를 보고 천의 자리까지 나타내 보세요.` }; },
    () => { const g = R(11, 39) * 10 + M.pick([4, 6, 1, 2, 3, 7, 8, 9]); return { text: `고구마 한 개의 무게는 ${g} g입니다. 몇십 g 중 가장 가까운 무게로 어림하면 약 몇 g인가요?`, ans: N.round(g, 10), unit: 'g', hint: `가장 가까운 몇십을 찾는 것은 반올림이에요. 일의 자리 숫자를 보고 십의 자리까지 나타내 보세요.` }; }
  ])();
}

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1~3번: 올림·버림·반올림 상황을 하나씩, 순서를 섞어서 — 어림 방법 고르기 + 답
  const cs = M.shuffle([['올림', upCase()], ['버림', downCase()], ['반올림', roundCase()]]);
  cs.forEach(([method, c], i) => {
    cards.push(M.card(i, `<div class="q-text">어떤 방법으로 어림해야 하는지 고르고, 답을 구해 보세요.</div>` + N.word(c.text) +
      M.line(`<div class="qbox">${N.method(method)}</div>`, `<div class="qbox"><div class="eq">${M.box(c.ans)} <span class="tail">${c.unit}</span></div></div>`), true));
    hints.push(c.hint);
  });

  // 4번: 떡볶이 재료 — 모두 사는 데 드는 금액, 1000원짜리 지폐로만 낼 때 최소 몇 장
  const items = [['떡', R(18, 29) * 100], ['어묵', R(25, 39) * 100 + 80], ['치즈', R(10, 15) * 100 + 40], ['고추장', R(50, 69) * 100]];
  const sum = items.reduce((s, it) => s + it[1], 0);
  cards.push(M.card(3, `<div class="q-text">떡볶이 재료를 모두 사려고 합니다. 필요한 금액을 구하고, 1000원짜리 지폐로만 낸다면 최소 몇 장 내야 하는지 구해 보세요.</div>` +
    N.table(['재료'].concat(items.map(it => it[0])), [['가격(원)'].concat(items.map(it => it[1]))]) +
    `<div class="eq">모두 ${M.box(sum)} 원 &nbsp; <span class="tail">1000원짜리 지폐 최소 ${M.box(N.up(sum, 1000) / 1000)} 장</span></div>`, true));
  hints.push('먼저 네 가지 재료값을 모두 더해요. 그 금액을 올림하여 천의 자리까지 나타내면 낼 지폐의 수를 알 수 있어요.');

  // 5번: 어림하여 T가 된 자연수의 범위 (올림·버림·반올림 중 하나)
  const m5 = M.pick(N.METHODS), T = R(3, 19) * 10;
  const lo5 = m5 === '올림' ? T - 9 : (m5 === '버림' ? T : T - 5), hi5 = m5 === '올림' ? T : (m5 === '버림' ? T + 9 : T + 4);
  cards.push(M.card(4, `<div class="q-text">어떤 자연수를 ${m5}하여 십의 자리까지 나타내었더니 ${T}${M.josa(T, '이', '가')} 되었습니다. 어떤 자연수가 될 수 있는 수의 범위를 써 보세요.</div>` +
    `<div class="eq">${M.box(lo5)} 이상 ${M.box(hi5)} <span class="tail">이하인 자연수</span></div>`, true));
  hints.push(m5 === '올림' ? `올림하여 ${T}${M.josa(T, '이', '가')} 되려면 ${T - 10}보다 크고 ${T}보다 작거나 같아야 해요. (${T} 자신도 들어가요)` :
    m5 === '버림' ? `버림하여 ${T}${M.josa(T, '이', '가')} 되려면 십의 자리까지가 ${T}인 수예요. ${T}부터 시작해요.` :
    `반올림하여 ${T}${M.josa(T, '이', '가')} 되려면 일의 자리에서 올려서 오는 수(${T - 5}~${T - 1})와 버려서 오는 수(${T}~)를 모두 생각해요.`);

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
