<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 수의 범위와 어림 도우미(m521) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261105-1"></script>
<script src="m521-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>올림</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">올림</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 올림: 구하려는 자리 아래 수를 올려서 나타내요</div>
  <div class="rule-line"><span class="rule-tag">십</span> 15<b>4</b> → 아래 수 4를 10으로 → <b>160</b></div>
  <div class="rule-line"><span class="rule-tag t2">백</span> 1<b>54</b> → 아래 수 54를 100으로 → <b>200</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 아래 수가 모두 0이면 그대로예요. 1600을 올림하여 백의 자리까지 → <b>1600</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5214 — 올림 (교과서 5-2-1 18~19쪽, 수학익힘 16~17쪽, 성취기준 [6수01-03])
// 진단 포인트: 반올림처럼 아래 숫자가 5 이상일 때만 올림, 구하려는 자리 숫자만 1 키우고 아래 자리를 그대로 둠,
//              아래 수가 모두 0인데도 올림, 소수에서 자리 혼동
const R = M.rand;
M.inlineQuestion = true;

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 세 자리 수를 올림하여 십의 자리, 백의 자리까지 (일의 자리 숫자는 1~4가 자주 나오도록 — 반올림과 구별)
  const x1 = N.gen(() => R(1, 8) * 100 + R(0, 8) * 10 + M.pick([1, 2, 3, 4, R(1, 9)]), v => v % 100 >= 11);
  cards.push(M.card(0, `<div class="q-text">${x1}${M.josa(x1, '을', '를')} 올림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">십의 자리까지 ${M.box(N.up(x1, 10))}</div></div>`,
      `<div class="qbox"><div class="eq">백의 자리까지 ${M.box(N.up(x1, 100))}</div></div>`), true));
  hints.push(`십의 자리까지: 일의 자리 숫자를 10으로 생각해요. 백의 자리까지: 십의 자리와 일의 자리 수를 100으로 생각해요. 아래 수가 작아도 올려요.`);

  // 2번: 다섯 자리 수(몇만 몇천 몇백)를 올림하여 천의 자리, 만의 자리까지
  const x2 = R(1, 8) * 10000 + R(0, 8) * 1000 + R(1, 9) * 100;
  cards.push(M.card(1, `<div class="q-text">${x2}${M.josa(x2, '을', '를')} 올림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">천의 자리까지 ${M.box(N.up(x2, 1000))}</div></div>`,
      `<div class="qbox"><div class="eq">만의 자리까지 ${M.box(N.up(x2, 10000))}</div></div>`), true));
  hints.push('구하려는 자리 아래에 있는 숫자를 모두 0으로 바꾸고, 구하려는 자리 숫자를 1 크게 해요. (아래 수가 모두 0이면 그대로)');

  // 3번: 소수 세 자리 수를 올림하여 소수 첫째·둘째 자리까지
  const ip = R(1, 9), d1 = R(1, 8), d2 = R(1, 8), d3 = R(1, 9);
  const s3 = `${ip}.${d1}${d2}${d3}`;
  cards.push(M.card(2, `<div class="q-text">${s3}${M.josa(d3, '을', '를')} 올림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">소수 첫째 자리까지 ${M.dbox(ip * 10 + d1 + 1, 1, true)}</div></div>`,
      `<div class="qbox"><div class="eq">소수 둘째 자리까지 ${M.dbox(ip * 100 + d1 * 10 + d2 + 1, 2, true)}</div></div>`), true));
  hints.push(`소수 첫째 자리까지: ${s3}에서 소수 첫째 자리 아래 수(0.0${d2}${d3})를 0.1로 생각해요. 소수 둘째 자리까지: 소수 셋째 자리 수를 0.01로 생각해요.`);

  // 4번: 올림하여 백의 자리까지 나타내면 T가 되는 수 모두 고르기 (T 자체, T−100 포함)
  const T = R(11, 79) * 100;
  const opts4 = N.gen(() => N.distinct(6, () => M.pick([T, T - 100, T - R(1, 99), T - R(1, 99), T + R(1, 60), T - 100 - R(1, 60), T - 100 + R(1, 99)])),
    a => a.indexOf(T) !== -1 && a.indexOf(T - 100) !== -1 && a.filter(v => N.up(v, 100) === T).length >= 2);
  cards.push(M.card(3, `<div class="q-text">올림하여 백의 자리까지 나타내었을 때 ${T}${M.josa(T, '이', '가')} 되는 수를 모두 골라 보세요.</div>` +
    N.nums(opts4, v => N.up(v, 100) === T), true));
  hints.push(`보기의 수를 하나씩 올림하여 백의 자리까지 나타내 보세요. ${T}${M.josa(T, '은', '는')} 아래 수가 모두 0이라 올림해도 ${T}이에요.`);

  // 5번: 실생활 — 최소 몇이 필요한지 (올림)
  if (R(0, 1)) {
    const p5 = R(1, 4) * 100 + R(1, 9) * 10 + R(1, 9), u5 = M.pick([10, 100]);
    cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
      N.word(`사진 ${p5}장을 ${u5}장씩 들어가는 앨범에 모두 정리하려고 합니다. 사진이 최소 몇 장이라고 생각하고 앨범을 사야 하나요? 앨범은 최소 몇 권 필요한가요?`) +
      `<div class="eq">사진 ${M.box(N.up(p5, u5))} 장 &nbsp; <span class="tail">앨범 ${M.box(N.up(p5, u5) / u5)} 권</span></div>`, true));
    hints.push(`남는 사진도 모두 넣어야 하니까 ${p5}${M.josa(p5, '을', '를')} 올림하여 ${N.PLACE[u5]}까지 나타내요. 앨범 한 권에 ${u5}장씩이에요.`);
  } else {
    const c5 = R(1, 8) * 10000 + R(0, 9) * 1000 + R(1, 9) * 100, u5 = M.pick([1000, 10000]);
    cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
      N.word(`${c5}원인 기념품을 ${u5}원짜리 지폐로만 사려고 합니다. 최소 얼마가 필요한가요?`) +
      `<div class="eq">${M.box(N.up(c5, u5))} <span class="tail">원</span></div>`, true));
    hints.push(`${u5}원짜리 지폐로 ${c5}원을 모두 내야 하니 모자라면 안 돼요. ${c5}${M.josa(c5, '을', '를')} 올림하여 ${N.PLACE[u5]}까지 나타내요.`);
  }

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
