<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 수의 범위와 어림 도우미(m521) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261109-1"></script>
<script src="m521-common.js?v=20261106-1"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>버림</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">버림</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 버림: 구하려는 자리 아래 수를 버려서(0으로) 나타내요</div>
  <div class="rule-line"><span class="rule-tag">십</span> 4<b>5</b> → 아래 수 5를 0으로 → <b>40</b></div>
  <div class="rule-line"><span class="rule-tag t2">백</span> 3<b>72</b> → 아래 수 72를 0으로 → <b>300</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 아래 숫자가 커도(8, 9) 올리지 않아요. 898을 버림하여 백의 자리까지 → <b>800</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5215 — 버림 (교과서 5-2-1 20~21쪽, 수학익힘 18~19쪽, 성취기준 [6수01-03])
// 진단 포인트: 아래 숫자가 5 이상이면 올려 버림(반올림과 혼동), 구하려는 자리 숫자까지 지움, 소수에서 자리 혼동
const R = M.rand;
M.inlineQuestion = true;

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 세 자리 수를 버림하여 십의 자리, 백의 자리까지 (아래 숫자가 5~9인 경우가 자주 나오도록 — 반올림과 구별)
  const x1 = R(1, 9) * 100 + R(5, 9) * 10 + M.pick([5, 6, 7, 8, 9, R(1, 9)]);
  cards.push(M.card(0, `<div class="q-text">${x1}${M.josa(x1, '을', '를')} 버림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">십의 자리까지 ${M.box(N.down(x1, 10))}</div></div>`,
      `<div class="qbox"><div class="eq">백의 자리까지 ${M.box(N.down(x1, 100))}</div></div>`), true));
  hints.push('구하려는 자리 아래 수를 모두 0으로 바꿔요. 아래 숫자가 커도 올리지 않아요.');

  // 2번: 다섯 자리 수를 버림하여 천의 자리, 만의 자리까지 (동전 26540원과 같은 꼴)
  const x2 = R(1, 9) * 10000 + R(5, 9) * 1000 + R(1, 9) * 100 + R(1, 9) * 10;
  cards.push(M.card(1, `<div class="q-text">${x2}${M.josa(x2, '을', '를')} 버림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">천의 자리까지 ${M.box(N.down(x2, 1000))}</div></div>`,
      `<div class="qbox"><div class="eq">만의 자리까지 ${M.box(N.down(x2, 10000))}</div></div>`), true));
  hints.push('천의 자리까지: 백의 자리부터 아래를 모두 0으로. 만의 자리까지: 천의 자리부터 아래를 모두 0으로 바꿔요.');

  // 3번: 소수 세 자리 수를 버림하여 소수 첫째·둘째 자리까지 (아래 숫자가 커서 반올림하면 달라지도록)
  const ip = R(1, 9), d1 = R(1, 8), d2 = R(5, 9), d3 = R(5, 9);
  const s3 = `${ip}.${d1}${d2}${d3}`;
  cards.push(M.card(2, `<div class="q-text">${s3}${M.josa(d3, '을', '를')} 버림하여 나타내어 보세요.</div>` +
    M.line(`<div class="qbox"><div class="eq">소수 첫째 자리까지 ${M.dbox(ip * 10 + d1, 1, true)}</div></div>`,
      `<div class="qbox"><div class="eq">소수 둘째 자리까지 ${M.dbox(ip * 100 + d1 * 10 + d2, 2, true)}</div></div>`), true));
  hints.push(`소수 첫째 자리까지: 소수 첫째 자리 아래 숫자를 버려요. 소수 둘째 자리까지: 소수 셋째 자리 숫자를 버려요.`);

  // 4번: 버림하여 백의 자리까지 나타내면 T가 되는 수 모두 고르기 (T 자체, T+100, T−1 포함)
  const T = R(3, 9) * 100;
  const opts4 = N.gen(() => N.distinct(6, () => M.pick([T, T + 100, T - 1, T + R(1, 99), T + R(50, 99), T - R(2, 60), T + 100 + R(1, 50)])),
    a => a.indexOf(T + 100) !== -1 && a.filter(v => N.down(v, 100) === T).length >= 2 && a.some(v => N.down(v, 100) !== T));
  cards.push(M.card(3, `<div class="q-text">버림하여 백의 자리까지 나타내었을 때 ${T}${M.josa(T, '이', '가')} 되는 수를 모두 골라 보세요.</div>` +
    N.nums(opts4, v => N.down(v, 100) === T), true));
  hints.push(`보기의 수를 하나씩 버림하여 백의 자리까지 나타내 보세요. 백의 자리 숫자가 ${T / 100}인 세 자리 수는 모두 ${T}${M.josa(T, '이', '가')} 돼요.`);

  // 5번: 실생활 — 최대 얼마(몇 개)까지인지 (버림)
  if (R(0, 1)) {
    const c5 = R(1, 9) * 10000 + R(1, 9) * 1000 + R(1, 9) * 100 + R(1, 9) * 10, u5 = M.pick([1000, 10000]);
    cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
      N.word(`저금통에 모은 동전 ${c5}원을 ${u5}원짜리 지폐로 바꾸려고 합니다. 최대 얼마까지 바꿀 수 있나요?`) +
      `<div class="eq">${M.box(N.down(c5, u5))} <span class="tail">원</span></div>`, true));
    hints.push(`${u5}원이 안 되는 나머지 동전은 지폐로 바꿀 수 없어요. ${c5}${M.josa(c5, '을', '를')} 버림하여 ${N.PLACE[u5]}까지 나타내요.`);
  } else {
    const L5 = R(3, 9) * 100 + R(1, 9) * 10 + R(1, 9);
    cards.push(M.card(4, `<div class="q-text">문제를 읽고 답을 구해 보세요.</div>` +
      N.word(`리본 ${L5} cm를 100 cm씩 잘라 선물을 포장하려고 합니다. 선물을 최대 몇 개까지 포장할 수 있나요?`) +
      `<div class="eq">${M.box(N.down(L5, 100) / 100)} <span class="tail">개</span></div>`, true));
    hints.push(`100 cm가 안 되는 남은 리본으로는 포장할 수 없어요. ${L5}${M.josa(L5, '을', '를')} 버림하여 백의 자리까지 나타내 보세요.`);
  }

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
