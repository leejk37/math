<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 혼합 계산 도우미(m511) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261104-1550"></script>
<script src="m511-common.js?v=20261105-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>덧셈, 뺄셈, 곱셈이 섞여 있는 식</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">덧셈, 뺄셈, 곱셈이 섞여 있는 식을 계산해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 곱셈을 먼저 계산해요!</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 9 + 3 × 4 − 7 = 9 + 12 − 7 = 21 − 7 = <b>14</b> &nbsp;(곱셈 → 앞에서부터)</div>
  <div class="rule-line"><span class="rule-tag t2">( )</span> ( )가 있으면 ( ) 안이 가장 먼저예요. 34 − 2 × (4 + 6) = 34 − 2 × 10 = <b>14</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 앞에서부터 하면 안 돼요. 9 + 3 × 4 ≠ 12 × 4 &nbsp;·&nbsp; 9 + 3 × 4 = <b>21</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5113 — 덧셈, 뺄셈, 곱셈이 섞여 있는 식 (교과서 5-1-1 16~17쪽, 수학익힘 14~15쪽, 성취기준 [6수01-01])
// 진단 포인트: 곱셈을 먼저 하지 않고 앞에서부터 계산하는 오류, ( )를 무시하는 오류. 곱셈은 곱셈구구 범위
const R = M.rand;
M.inlineQuestion = true;
const differs = (tk, s) => M5.leftToRight(tk) !== s.value;                 // 앞에서부터 하면 답이 달라짐
const parenMatters = (tk, s) => { const n = M5.solve(M5.noParen(tk)); return !n || n.value !== s.value; }; // ( )를 지우면 답이 달라짐

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 같은 수, ( ) 없는 식과 있는 식에서 가장 먼저 계산하는 기호
  const p1 = M5.gen(() => [R(5, 20), '+', R(2, 9), '×', R(2, 9), '−', R(2, 15)], differs, 300);
  const p1b = ['(', p1[0], '+', p1[2], ')', '×', p1[4], '−', p1[6]];
  cards.push(M.card(0, `<div class="q-text">가장 먼저 계산해야 하는 기호를 눌러 보세요.</div>` +
    M.line(`<div class="qbox">${M5.pickFirst(p1)}</div>`, `<div class="qbox">${M5.pickFirst(p1b)}</div>`), true));
  hints.push('곱셈이 덧셈·뺄셈보다 먼저예요. 하지만 ( )가 있으면 ( ) 안이 가장 먼저예요.');

  // 2번: ( ) 없는 식 — 곱셈이 가운데나 뒤에 있음
  const forms2 = [
    () => [R(10, 60), '+', R(2, 9), '×', R(2, 9), '−', R(2, 20)],
    () => [R(30, 70), '−', R(2, 9), '×', R(2, 9), '+', R(2, 20)],
    () => [R(10, 60), '+', R(10, 40), '−', R(2, 9), '×', R(2, 9)]];
  const t2 = M5.gen(M.pick(forms2), differs, 300);
  cards.push(M.card(1, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t2), true));
  hints.push('곱셈 부분에 밑줄을 긋고 가장 먼저 계산해요. 그다음 덧셈과 뺄셈은 앞에서부터 차례대로 해요.');

  // 3번: ( )가 있는 식
  const forms3 = [
    () => [R(40, 90), '−', R(2, 6), '×', '(', R(2, 6), '+', R(2, 6), ')'],
    () => ['(', R(5, 30), '+', R(2, 9), ')', '×', R(2, 6), '−', R(2, 20)],
    () => [R(2, 9), '×', '(', R(10, 20), '−', R(2, 9), ')', '+', R(2, 20)]];
  const t3 = M5.gen(M.pick(forms3), parenMatters, 300);
  cards.push(M.card(2, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t3), true));
  hints.push('( ) 안을 가장 먼저 계산해요. 그다음 곱셈, 마지막으로 덧셈·뺄셈을 해요.');

  // 4번: 두 식 비교 (교과서 활동 3: 34 − 2 × 4 + 6 과 34 − 2 × (4 + 6))
  let A, B;
  if (R(0, 2)) {
    A = M5.gen(() => [R(40, 90), '−', R(2, 6), '×', R(2, 6), '+', R(2, 9)], (tk) => !!M5.solve([tk[0], '−', tk[2], '×', '(', tk[4], '+', tk[6], ')']), 300);
    B = [A[0], '−', A[2], '×', '(', A[4], '+', A[6], ')'];
  } else {
    A = M5.gen(() => [R(10, 50), '+', R(2, 9), '×', R(2, 9), '−', R(2, 20)], null, 300);
    B = [A[0], '+', '(', A[2], '×', A[4], ')', '−', A[6]];
  }
  if (R(0, 1)) { const t = A; A = B; B = t; }
  cards.push(M.card(3, `<div class="q-text">두 식을 각각 계산하고, 계산 결과의 크기를 비교해 &gt;, =, &lt; 를 골라 보세요.</div>` + M5.compare(A, B), true));
  hints.push('두 식이 어떻게 다른지 먼저 살펴보세요. ( )가 계산 순서를 바꾸는지, 원래 순서와 같은지 생각해요.');

  // 5번: 문장을 하나의 식으로 (교과서 생각 깨우기·활동 4)
  let w, ch;
  do {
    if (R(0, 1)) {
      const a = R(5, 12), n = R(2, 4), k = R(3, 6), d = R(3, a + n * k - 2);
      w = { text: `학교 안내 자료에 넣을 사진을 찍으려고 합니다. 급식실에서는 사진을 ${a}장 찍어야 합니다. 특별실은 모두 ${n}곳인데, 특별실 한 곳에서 사진을 ${k}장씩 찍어야 합니다. 지금까지 ${d}장을 찍었습니다. 앞으로 몇 장을 더 찍어야 하나요?`,
        right: [a, '+', n, '×', k, '−', d], wrongs: [['(', a, '+', n, ')', '×', k, '−', d], [a, '+', n, '×', '(', k, '−', d, ')'], [a, '×', n, '+', k, '−', d]], unit: '장' };
    } else {
      const g = R(5, 9), bo = (g + R(1, 4) - 5) % 5 + 5, per = R(2, 3), total = (g + bo) * per + R(10, 40);
      w = { text: `학급 문고에 책이 ${total}권 있었습니다. 여학생 ${g}명과 남학생 ${bo}명이 책을 빌려 갔습니다. 한 명이 ${per}권씩 빌려 갔습니다. 학급 문고에 남아 있는 책은 몇 권인가요?`,
        right: [total, '−', '(', g, '+', bo, ')', '×', per], wrongs: [[total, '−', g, '+', bo, '×', per], [total, '−', g, '×', per, '+', bo], ['(', total, '−', g, '+', bo, ')', '×', per]], unit: '권' };
    }
    ch = M5.exprChoices(w.right, w.wrongs);
  } while (!ch);
  cards.push(M.card(4, `<div class="q-text">문제를 하나의 식으로 나타낸 것을 고르고, 답을 구해 보세요.</div>` +
    `<div class="word">${w.text}</div>` + M.line(ch,
      `<div class="eq">답 <span class="tail">${M.box(M5.solve(w.right).value)} ${w.unit}</span></div>`), true));
  hints.push('여러 번 같은 수만큼 있는 부분은 곱셈으로 나타내요. 곱하기 전에 먼저 더해야 하는 부분은 ( )로 묶어요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
