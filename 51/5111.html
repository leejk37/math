<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 혼합 계산 도우미(m511) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261109-3"></script>
<script src="m511-common.js?v=20261105-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>덧셈과 뺄셈이 섞여 있는 식</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">덧셈과 뺄셈이 섞여 있는 식을 계산해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 덧셈과 뺄셈만 있으면 앞에서부터 차례대로!</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 14 − 2 + 10 = 12 + 10 = <b>22</b> &nbsp;(앞의 14 − 2부터)</div>
  <div class="rule-line"><span class="rule-tag t2">( )</span> ( )가 있으면 ( ) 안을 먼저 계산해요. 35 − (12 + 14) = 35 − 26 = <b>9</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 42 − 17 + 8에서 17 + 8을 먼저 하면 안 돼요. 42 − 17 + 8 = 25 + 8 = <b>33</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5111 — 덧셈과 뺄셈이 섞여 있는 식 (교과서 5-1-1 12~13쪽, 수학익힘 10~11쪽, 성취기준 [6수01-01])
// 진단 포인트: 'a − b + c'에서 뒤의 덧셈(b + c)을 먼저 계산하는 오류 → 그 값은 항상 정답보다 2c 작음
const R = M.rand;
M.inlineQuestion = true;

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 같은 세 수, ( ) 있는 식과 없는 식에서 가장 먼저 계산하는 기호 누르기
  const p1 = M5.gen(() => { const a = R(15, 40), b = R(5, 15), c = R(2, 9); return [a, '−', b, '+', c]; },
    tk => tk[0] - tk[2] - tk[4] >= 1);
  const p1b = [p1[0], '−', '(', p1[2], '+', p1[4], ')'];
  cards.push(M.card(0, `<div class="q-text">가장 먼저 계산해야 하는 기호를 눌러 보세요.</div>` +
    M.line(`<div class="qbox">${M5.pickFirst(p1)}</div>`, `<div class="qbox">${M5.pickFirst(p1b)}</div>`), true));
  hints.push('( )가 없으면 앞에서부터 차례대로 계산해요. ( )가 있으면 ( ) 안이 가장 먼저예요.');

  // 2번: 계산 순서를 나타내고 계산 (a − b + c, 두 자리 수, 받아내림 1회 이상)
  const t2 = M5.gen(() => [R(40, 95), '−', R(12, 39), '+', R(11, 39)],
    tk => tk[0] % 10 < tk[2] % 10 && tk[0] - tk[2] - tk[4] >= 0);
  cards.push(M.card(1, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t2), true));
  hints.push(`앞의 ${t2[0]} − ${t2[2]}부터 계산하고, 그 값에 ${t2[4]}${M.josa(t2[4], '을', '를')} 더해요.<br>${t2[2]} + ${t2[4]}${M.josa(t2[4], '을', '를')} 먼저 하면 답이 달라져요.`);

  // 3번: ( )가 있는 식 a − (b + c)
  const t3 = M5.gen(() => [R(50, 99), '−', '(', R(12, 39), '+', R(11, 29), ')'], tk => tk[0] - tk[3] - tk[5] >= 5);
  cards.push(M.card(2, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t3), true));
  hints.push('( ) 안의 덧셈을 가장 먼저 해요. 그다음 앞의 수에서 그 값을 빼요.');

  // 4번: 두 식의 계산 결과 비교 (>, =, < 가 고루 나오도록 세 가지 꼴 중 하나)
  const kind = R(0, 2);
  let A, B;
  if (kind === 0) { // a − b + c  ○  a − (b + c)   → 앞이 더 큼
    A = M5.gen(() => [R(40, 90), '−', R(11, 30), '+', R(5, 19)], tk => tk[0] - tk[2] - tk[4] >= 1);
    B = [A[0], '−', '(', A[2], '+', A[4], ')'];
  } else if (kind === 1) { // a + b − c  ○  a + (b − c)  → 같음
    A = M5.gen(() => [R(20, 60), '+', R(20, 40), '−', R(5, 19)], tk => tk[2] > tk[4]);
    B = [A[0], '+', '(', A[2], '−', A[4], ')'];
  } else { // a − b − c  ○  a − (b − c)  → 뒤가 더 큼
    A = M5.gen(() => [R(50, 90), '−', R(15, 30), '−', R(5, 14)], tk => tk[0] - tk[2] - tk[4] >= 1);
    B = [A[0], '−', '(', A[2], '−', A[4], ')'];
  }
  if (R(0, 1)) { const t = A; A = B; B = t; }
  cards.push(M.card(3, `<div class="q-text">두 식을 각각 계산하고, 계산 결과의 크기를 비교해 ○ 안에 &gt;, =, &lt; 를 골라 보세요.</div>` + M5.compare(A, B), true));
  hints.push('두 식은 수가 같아도 계산 순서가 다르면 결과가 달라질 수 있어요. 각 식을 순서대로 계산한 다음 비교해요.');

  // 5번: 문장을 하나의 식으로 나타내고 답 구하기 (교과서 생각 깨우기·활동 4)
  let w, ch;
  do {
    if (R(0, 1)) {
      const a = R(28, 45), b = R(5, 12), c = R(5, 12);
      const right = [a, '−', '(', b, '+', c, ')'];
      w = { text: `미술관 1층에 작품 ${a}개가 있었습니다. 그중 ${b}개를 2층으로, ${c}개를 3층으로 옮겼습니다. 1층에 남아 있는 작품은 몇 개인가요?`,
        right, wrongs: [[a, '−', b, '+', c], [a, '+', b, '−', c], [a, '+', '(', b, '−', c, ')']], unit: '개' };
    } else {
      const a = R(11, 16), b = R(1, 4), c = R(9, 14);
      const right = [a, '−', b, '+', c];
      w = { text: `우리 반 여학생은 ${a}명이고, 그중 ${b}명이 결석했습니다. 남학생 ${c}명은 모두 출석했습니다. 출석한 학생은 모두 몇 명인가요?`,
        right, wrongs: [[a, '−', '(', b, '+', c, ')'], [a, '+', b, '−', c], [a, '+', b, '+', c]], unit: '명' };
    }
    ch = M5.exprChoices(w.right, w.wrongs);
  } while (!ch);
  cards.push(M.card(4, `<div class="q-text">문제를 하나의 식으로 나타낸 것을 고르고, 답을 구해 보세요.</div>` +
    `<div class="word">${w.text}</div>` + M.line(ch,
      `<div class="eq">답 <span class="tail">${M.box(M5.solve(w.right).value)} ${w.unit}</span></div>`), true));
  hints.push('먼저 계산해야 하는 부분을 생각해 보세요. 한꺼번에 옮긴 개수처럼 먼저 구할 부분이 있으면 ( )로 묶어요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
// 진단시스템 연결 (frac-kit.js): 진단 모드에서는 '새로운 문제'가 숨겨지고, 정답 확인 버튼이 '제출 및 채점하기'로 바뀜
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
