<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 진단시스템 연결: 서버 주소 → 서버 호출 → 분수 공통 도우미(frac 폴더) → 공통 화면(frac/m423-common.js) → 혼합 계산 도우미(m511) -->
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../frac/frac-kit.js"></script>
<script src="../frac/m423-common.js?v=20261104-1550"></script>
<script src="m511-common.js?v=20261105-2"></script>
<!-- 🤔 도움: 진단 모드에서 문제마다 선생님 호출 버튼(교사 현황판 live.html 알림 + 평가데이터 '도움요청' 탭 기록) -->
<script src="../help.js"></script>
<title>덧셈, 뺄셈, 나눗셈이 섞여 있는 식</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="header-text">덧셈, 뺄셈, 나눗셈이 섞여 있는 식을 계산해요</div>
<div class="sub-text"><div class="rule-box">
  <div class="rule-title">🔎 나눗셈을 먼저 계산해요!</div>
  <div class="rule-line"><span class="rule-tag">순서</span> 8 + 30 ÷ 2 − 6 = 8 + 15 − 6 = 23 − 6 = <b>17</b> &nbsp;(나눗셈 → 앞에서부터)</div>
  <div class="rule-line"><span class="rule-tag t2">( )</span> ( )가 있으면 ( ) 안이 가장 먼저예요. (44 − 32) ÷ 4 + 7 = 12 ÷ 4 + 7 = <b>10</b></div>
  <div class="rule-line"><span class="rule-tag t4">주의</span> 앞에서부터 하면 안 돼요. 44 − 32 ÷ 4 + 7 = 44 − 8 + 7 = <b>43</b></div>
</div></div>

<div class="quiz-container" id="quiz"></div>

<div class="btn-group">
  <button class="action-btn reset-btn" onclick="generate()">새로운 문제 🎲</button>
  <button id="checkBtn" class="action-btn check-btn">정답 확인하기 ✔️</button>
</div>

<script>
// 5114 — 덧셈, 뺄셈, 나눗셈이 섞여 있는 식 (교과서 5-1-1 18~19쪽, 수학익힘 16~17쪽, 성취기준 [6수01-01])
// 진단 포인트: 나눗셈을 먼저 하지 않고 앞에서부터 계산하는 오류(대개 나누어떨어지지 않아 막힘), ( )를 무시하는 오류
const R = M.rand;
M.inlineQuestion = true;
const differs = (tk, s) => M5.leftToRight(tk) !== s.value;
const parenMatters = (tk, s) => { const n = M5.solve(M5.noParen(tk)); return !n || n.value !== s.value; };

function generate() {
  M.reset();
  const cards = [], hints = [];

  // 1번: 같은 수, ( ) 없는 식과 있는 식 (a − b ÷ c + d, (a − b) ÷ c + d 모두 나누어떨어지게)
  const c1 = R(2, 6), b1 = c1 * R(2, 8), a1 = b1 + c1 * R(2, 6), d1 = R(2, 9);
  cards.push(M.card(0, `<div class="q-text">가장 먼저 계산해야 하는 기호를 눌러 보세요.</div>` +
    M.line(`<div class="qbox">${M5.pickFirst([a1, '−', b1, '÷', c1, '+', d1])}</div>`,
      `<div class="qbox">${M5.pickFirst(['(', a1, '−', b1, ')', '÷', c1, '+', d1])}</div>`), true));
  hints.push('나눗셈이 덧셈·뺄셈보다 먼저예요. 하지만 ( )가 있으면 ( ) 안이 가장 먼저예요.');

  // 2번: ( ) 없는 식 — 나눗셈이 가운데나 뒤에 있음
  const dv = () => { const c = R(2, 9); return [c * R(2, 9), c]; };
  const forms2 = [
    () => { const [b, c] = dv(); return [R(10, 50), '+', b, '÷', c, '−', R(2, 15)]; },
    () => { const [b, c] = dv(); return [R(20, 60), '−', b, '÷', c, '+', R(2, 15)]; },
    () => { const [c, d] = dv(); return [R(10, 50), '+', R(10, 30), '−', c, '÷', d]; }];
  const t2 = M5.gen(M.pick(forms2), differs);
  cards.push(M.card(1, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t2), true));
  hints.push('나눗셈 부분에 밑줄을 긋고 가장 먼저 계산해요. 그다음 덧셈과 뺄셈은 앞에서부터 차례대로 해요.');

  // 3번: ( )가 있는 식
  const forms3 = [
    () => { const c = R(2, 9), q = R(2, 9), b = R(10, 40); return ['(', b + c * q, '−', b, ')', '÷', c, '+', R(2, 15)]; },
    () => { const d = R(2, 10), e = R(2, 6); return [R(5, 40), '+', e * R(2, 9), '÷', '(', d + e, '−', d, ')']; },
    () => { const c = R(2, 9), a = R(10, 40); return ['(', a, '+', c * R(3, 9) - a % c, ')', '÷', c, '−', R(1, 3)]; }]; // a + b가 c로 나누어떨어지게
  const t3 = M5.gen(M.pick(forms3), parenMatters);
  cards.push(M.card(2, `<div class="q-text">계산 순서를 나타내고, 계산해 보세요.</div>` + M5.orderNote + M5.order(t3), true));
  hints.push('( ) 안을 가장 먼저 계산해요. 그다음 나눗셈, 마지막으로 덧셈·뺄셈을 해요.');

  // 4번: 두 식 비교 (교과서 활동 3: 44 − 32 ÷ 4 + 7 과 (44 − 32) ÷ 4 + 7)
  let A, B;
  if (R(0, 2)) {
    const c = R(2, 6), b = c * R(3, 9), a = b + c * R(2, 6);
    A = [a, '−', b, '÷', c, '+', R(2, 9)];
    B = ['(', a, '−', b, ')', '÷', c, '+', A[6]];
  } else {
    const [b, c] = dv();
    A = [R(10, 40), '+', b, '÷', c, '−', R(2, 9)];
    B = [A[0], '+', '(', b, '÷', c, ')', '−', A[6]];
  }
  if (R(0, 1)) { const t = A; A = B; B = t; }
  cards.push(M.card(3, `<div class="q-text">두 식을 각각 계산하고, 계산 결과의 크기를 비교해 &gt;, =, &lt; 를 골라 보세요.</div>` + M5.compare(A, B), true));
  hints.push('두 식이 어떻게 다른지 먼저 살펴보세요. ( )가 계산 순서를 바꾸는지, 원래 순서와 같은지 생각해요.');

  // 5번: 문장을 하나의 식으로 (교과서 생각 깨우기·창의)
  let w, ch;
  do {
    if (R(0, 1)) {
      const a = R(5, 12), b = 2 * R(8, 20), c = R(3, a + b / 2 - 2);
      w = { text: `운동장 대여함에 줄넘기가 ${a}개 있었습니다. 새 줄넘기 ${b}개를 운동장 대여함과 체육관 대여함에 똑같이 나누어 넣었습니다. 그다음 학생들이 운동장 대여함에서 줄넘기 ${c}개를 빌려 갔습니다. 운동장 대여함에 남아 있는 줄넘기는 몇 개인가요?`,
        right: [a, '+', b, '÷', 2, '−', c], wrongs: [['(', a, '+', b, ')', '÷', 2, '−', c], [a, '+', b, '−', c, '÷', 2], [a, '−', c, '+', b]], unit: '개' };
    } else {
      const n = R(3, 6), total = n * R(6, 12), b = R(4, 12), a = total - b;
      w = { text: `색종이 ${a}장이 있었습니다. 색종이 ${b}장을 더 받았습니다. 이 색종이를 ${n}명이 똑같이 나누어 가졌습니다. 한 명이 가진 색종이는 몇 장인가요?`,
        right: ['(', a, '+', b, ')', '÷', n], wrongs: [[a, '+', b, '÷', n], [a, '÷', n, '+', b], [a, '+', b, '×', n]], unit: '장' };
    }
    ch = M5.exprChoices(w.right, w.wrongs);
  } while (!ch);
  cards.push(M.card(4, `<div class="q-text">문제를 하나의 식으로 나타낸 것을 고르고, 답을 구해 보세요.</div>` +
    `<div class="word">${w.text}</div>` + M.line(ch,
      `<div class="eq">답 <span class="tail">${M.box(M5.solve(w.right).value)} ${w.unit}</span></div>`), true));
  hints.push('똑같이 나누는 부분은 나눗셈으로 나타내요. 나누기 전에 먼저 더해야 하는 부분은 ( )로 묶어요.');

  M.render(cards, hints);
}
document.addEventListener('DOMContentLoaded', generate);
</script>
<script>
FracKit.init({ check: '#checkBtn', newBtn: '.reset-btn', grade: M.grade });
</script>
</body>
</html>
